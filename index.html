<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>img{max-width:100%}[hidden]{display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1ea7d8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="رياحين"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><title>رياحين</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen app, RTL. Fixed top bar + bottom tab bar, scrolling main. Lessons read as a book page; tools (recording) as instrument panels. */
:root{
  --bg:#fffbea; --surface:#ffffff; --surface2:#fff4cc; --line:#f3e3a8;
  --fg:#2a2f3a; --muted:#6c7484; --accent:#1ea7d8; --accent-deep:#0e7fa8; --accent-fg:#ffffff; --accent-soft:#dbf3fb;
  --gold:#f5b800; --gold-soft:#fff1b8;
  --good:#22a06b; --warn:#e59a00; --bad:#e2506a; --good-soft:#dcf5e8; --warn-soft:#fff2cc; --bad-soft:#fde0e7;
  --pink:#f26b9b; --sky:#1ea7d8; --lilac:#b48ce0; --mint:#39c4a9; --peach:#ffb347;
  --hdr1:#1ea7d8; --hdr2:#4cc1e6; --hdr3:#f78fb3;
  --quran:"Amiri Quran","Amiri","Scheherazade New","Noto Naskh Arabic",serif;
  --display:"Amiri","Noto Naskh Arabic",serif;
  --ui:"Tajawal","Noto Sans Arabic",system-ui,sans-serif;
  --radius:18px; --shadow:0 1px 2px rgba(120,90,20,.05),0 8px 24px rgba(120,90,20,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171a22; --surface:#1f2430; --surface2:#2a3040; --line:#3a4256;
  --fg:#f3f4f8; --muted:#a3abbd; --accent:#5cc8ee; --accent-deep:#8ddcf6; --accent-fg:#0f1a22; --accent-soft:#1d3d4c;
  --gold:#ffd04d; --gold-soft:#4a3d12;
  --good:#5fd09a; --warn:#f0bb4f; --bad:#f58aa5; --good-soft:#163a2b; --warn-soft:#423416; --bad-soft:#4a2330;
  --pink:#f79ab9; --sky:#7fd3f3; --lilac:#c8aef2; --mint:#8fe0c7; --peach:#ffc67a;
  --hdr1:#0e5f7f; --hdr2:#1a7fa6; --hdr3:#a9507a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#171a22; --surface:#1f2430; --surface2:#2a3040; --line:#3a4256;
  --fg:#f3f4f8; --muted:#a3abbd; --accent:#5cc8ee; --accent-deep:#8ddcf6; --accent-fg:#0f1a22; --accent-soft:#1d3d4c;
  --gold:#ffd04d; --gold-soft:#4a3d12;
  --good:#5fd09a; --warn:#f0bb4f; --bad:#f58aa5; --good-soft:#163a2b; --warn-soft:#423416; --bad-soft:#4a2330;
  --pink:#f79ab9; --sky:#7fd3f3; --lilac:#c8aef2; --mint:#8fe0c7; --peach:#ffc67a;
  --hdr1:#0e5f7f; --hdr2:#1a7fa6; --hdr3:#a9507a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.6;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr1)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.7rem}h2{font-size:1.4rem}h3{font-size:1.15rem}
p{margin:0}
.app{height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><path d='M24 4l5 9 10-2-2 10 9 5-9 5 2 10-10-2-5 9-5-9-10 2 2-10-9-5 9-5-2-10 10 2z' fill='none' stroke='rgba(255,255,255,.35)' stroke-width='1.2'/></svg>"),linear-gradient(120deg,var(--hdr1),var(--hdr3));color:#fff;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.top .brand{font-family:var(--display);font-size:1.35rem;font-weight:700;letter-spacing:.5px}
.top .sub{font-size:.8rem;opacity:.85}
.top .spacer{flex:1}
.top .who{font-size:.85rem;background:rgba(255,255,255,.18);color:#fff;padding:4px 10px;border-radius:999px;white-space:nowrap}
main{flex:1;overflow:auto;padding-block:18px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:9;background:var(--surface);box-shadow:0 -4px 16px rgba(60,40,90,.06);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tabs button{flex:1;background:none;border:0;padding:9px 2px 11px;color:var(--muted);font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-top:3px solid transparent}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent-deep);border-top-color:var(--accent)}
.tabs button{font-size:.74rem}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card.soft{background:var(--surface2);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.btn{display:inline-flex;box-shadow:0 2px 0 rgba(0,0,0,.06);align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:42px;text-decoration:none}
.btn.sec{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#4a3418}
.btn.danger{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;width:100%}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted);flex:1;min-width:140px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent-deep)}.pill.gold{background:var(--gold-soft);color:var(--gold)}
.quran{font-family:var(--quran);font-size:1.9rem;line-height:2.3;text-align:center;padding:14px 10px;background:var(--surface2);border-radius:14px;border:1px dashed var(--line)}
.quran .w{padding:0 2px;border-radius:6px;transition:background .2s}
.quran .w.miss{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.quran .w.ok{color:var(--accent-deep)}
.quran .w.warn{background:var(--warn-soft)}
.quran .extra{color:var(--bad);font-size:1.1rem;font-family:var(--ui)}
.ayah-num{font-family:var(--ui);font-size:.85rem;color:var(--gold);margin-inline:6px}
.lesson-body{font-size:1.07rem;line-height:2;max-width:68ch}
.lesson-body p+p{margin-top:.6em}
ul.clean{margin:0;padding-inline-start:1.2em}
ul.clean li{margin-block:4px}
.ex{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
.ex .word{font-family:var(--quran);font-size:1.5rem;color:var(--accent)}
.level-head{display:flex;gap:14px;align-items:center}
.level-head .n{font-family:var(--display);font-size:2.2rem;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-deep));border-radius:14px;padding:4px 8px;line-height:1;min-width:44px;text-align:center}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px}
.lock{opacity:.55}
.lesson-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:right;width:100%}
.lesson-item:hover{border-color:var(--accent)}
.lesson-item .t{flex:1;min-width:0}
.lesson-item .t b{display:block}
.lesson-item .mark{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--surface2);color:var(--muted);flex:none}
.lesson-item .mark.done{background:var(--mint);color:#1d3b32}
.rec{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px}
.recbtn{width:88px;height:88px;border-radius:50%;border:5px solid var(--accent-soft);background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.recbtn svg{width:34px;height:34px;fill:currentColor}
.recbtn.on{background:var(--bad);border-color:var(--bad-soft);animation:pulse 1.2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.recbtn.on{animation:none}}
.meter{width:100%;max-width:360px;height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;width:0;background:var(--gold);transition:width .08s}
.timer{font-variant-numeric:tabular-nums;font-size:1.1rem;color:var(--muted)}
canvas.wave{width:100%;height:70px;background:var(--surface2);border-radius:10px;border:1px solid var(--line);display:block}
.score{display:flex;align-items:center;gap:16px}
.score .big{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.score .big.good{color:var(--good)}.score .big.warn{color:var(--warn)}.score .big.bad{color:var(--bad)}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:10px;border-right:4px solid var(--line);background:var(--surface2)}
.note.bad{border-right-color:var(--bad);background:var(--bad-soft)}.note.warn{border-right-color:var(--warn);background:var(--warn-soft)}.note.good{border-right-color:var(--good);background:var(--good-soft)}.note.info{border-right-color:var(--accent);background:var(--accent-soft)}
.note b{white-space:nowrap}
.q{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.q .opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.q .opt{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface2);text-align:right;width:100%}
.q .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.q .opt.right{border-color:var(--good);background:var(--good-soft)}
.q .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.q .why{margin-top:8px;font-size:.9rem;color:var(--muted)}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.letters button{font-family:var(--quran);font-size:2rem;padding:6px 0 2px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;line-height:1.4}
.letters button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.letters button.has{box-shadow:inset 0 -4px 0 var(--gold)}
.bigletter{font-family:var(--quran);font-size:5rem;line-height:1.2;text-align:center;color:var(--accent)}
.table{width:100%;border-collapse:collapse;font-size:.92rem}
.table th,.table td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right;vertical-align:top}
.table th{color:var(--muted);font-weight:700;font-size:.8rem}
.scroller{overflow-x:auto}
.toast{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:20;font-weight:700;box-shadow:var(--shadow);max-width:92vw;text-align:center}
.cert{border:3px double var(--gold);padding:28px;text-align:center;background:var(--surface);border-radius:8px}
.cert h2{color:var(--gold);font-size:2rem}
.cert .name{font-family:var(--display);font-size:1.8rem;margin-block:10px}
details summary{cursor:pointer;font-weight:700}
.tag{font-size:.75rem;color:var(--gold);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
audio{width:100%;max-width:420px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
@media (max-width:520px){.quran{font-size:1.6rem}.top .sub{display:none}}
.hero{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--gold-soft));border-radius:var(--radius);padding:16px;border:1px solid var(--line)}
.hero svg{width:150px;height:auto;max-width:100%}
.art{width:64px;height:64px;flex:none}
.art svg{width:100%;height:100%}
.cardart{display:flex;gap:12px;align-items:center}
.cardart .art{width:54px;height:54px}
.lvcolor-1{--lc:var(--sky)}.lvcolor-2{--lc:var(--accent)}.lvcolor-3{--lc:var(--lilac)}.lvcolor-4{--lc:var(--gold)}
.card.lv{border-right:4px solid var(--lc)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface2);border-radius:12px;padding:10px}
.player .ctl{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;cursor:pointer;font-size:1.1rem}
.player .ctl.sec{background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.player select,.player input[type=range]{width:auto}
.player label{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.player .now{font-size:.85rem;color:var(--accent);font-weight:700;min-width:80px}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero svg{width:120px;margin:0 auto}}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
.quick button .art{width:40px;height:40px}
.quick button:hover{border-color:var(--accent)}
.quick button .cnt{font-size:.72rem;color:var(--muted);font-weight:400}
.todo{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.todo .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.todo.done .dot{background:var(--good)}
@media (max-width:420px){.quick{grid-template-columns:repeat(3,1fr)}.quick button{font-size:.8rem;padding:10px 4px}}

/* المساعد الذكي */
.fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));left:16px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:0;box-shadow:0 8px 22px rgba(0,0,0,.22);display:grid;place-items:center;cursor:pointer;z-index:40}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chat{display:flex;flex-direction:column;gap:10px;min-height:40vh;max-height:58vh;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.user{align-self:flex-start;flex-direction:row-reverse}
.msg .av{width:30px;height:30px;flex:none}
.msg .bb{padding:9px 12px;border-radius:14px;background:var(--surface2);line-height:1.7;font-size:.97rem}
.msg.user .bb{background:var(--accent);color:#fff;border-bottom-left-radius:4px}
.msg.assistant .bb{border-bottom-right-radius:4px}
.msg .bb p{margin:0 0 6px}.msg .bb p:last-child{margin:0}.msg .bb ul{margin:4px 18px 6px 0;padding:0}.msg .bb b.h{display:block;margin:6px 0 2px;color:var(--accent)}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.85rem;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chatbar{display:flex;gap:8px;align-items:flex-end}
.chatbar textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--ink);max-height:120px}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* تصميم محسّن: بلاطات، حلقات تقدم، شارات، ألعاب، لوحة الأستاذة */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin:10px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;box-shadow:var(--shadow)}
.tile b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1.1;color:var(--accent-deep)}
.tile span{font-size:.75rem;color:var(--muted)}
.tile.good b{color:var(--good)}.tile.warn b{color:var(--warn)}.tile.bad b{color:var(--bad)}.tile.gold b{color:var(--gold)}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:66px;height:66px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:.95rem;color:var(--accent)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:.82rem}
.badge .ic{font-size:1.2rem}.badge.off{opacity:.4;filter:grayscale(1)}
.lvbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.lvbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.game-card{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:right}
.game-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.game-ico{font-size:2.2rem;width:56px;height:56px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;flex:none}
.game-box{text-align:center}
.game-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gstat b{display:block;font-family:var(--display);font-size:1.6rem;color:var(--accent);line-height:1}.gstat span{font-size:.72rem;color:var(--muted)}
.gtimer{position:relative;width:64px;height:64px}.gtimer svg{width:64px;height:64px;transform:rotate(-90deg)}.gtimer circle{fill:none;stroke-width:3.5}.gtimer .bg{stroke:var(--surface2)}.gtimer .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.gtimer b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.1rem}
.game-q{min-height:120px;display:grid;place-items:center}
.game-word{font-family:var(--quran);font-size:2.4rem;line-height:1.6;color:var(--ink)}.game-word.small-q{font-family:inherit;font-size:1.2rem;font-weight:700}
.game-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.opt-btn{font-size:1rem;padding:12px 8px}.opt-btn.ok{background:var(--good);color:#fff;border-color:var(--good)}.opt-btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.game-fb{min-height:28px;margin-top:8px;font-weight:700}.game-fb .good{color:var(--good)}.game-fb .bad{color:var(--bad)}
.game-end .big{font-family:var(--display);font-size:3.4rem;line-height:1}.game-end .big.good{color:var(--good)}.game-end .big.warn{color:var(--warn)}.game-end .big.bad{color:var(--bad)}
.btn.lg{font-size:1.1rem;padding:14px 28px}
.stu{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:right;width:100%}
.stu:hover{border-color:var(--accent)}
.stu .av{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.stu .t{flex:1;min-width:0}.stu .t b{display:block}.stu .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;color:var(--ink)}.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.attgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.attgrid div{aspect-ratio:1;border-radius:6px;background:var(--surface2);display:grid;place-items:center;font-size:.65rem;color:var(--muted)}.attgrid .d{background:var(--good);color:#fff}.attgrid .e{background:var(--warn-soft)}
@media (max-width:600px){.hero svg{width:84px}.hero{grid-template-columns:1fr auto}}

/* الشهادة */
.cert2{background:linear-gradient(135deg,#fbf8f0,#eef5f2);padding:14px;border-radius:12px;color:#2b3a36}
.cert2-frame{border:4px double #c9a24d;padding:22px 18px;text-align:center;border-radius:6px;position:relative}
.cert2-brand{font-family:var(--display);font-size:2rem;color:#1f7a6d;font-weight:700}.cert2-sub{font-size:.8rem;color:#6b7a76}
.cert2-title{font-family:var(--display);font-size:1.9rem;color:#c9a24d;margin-top:14px}.cert2-lv{font-family:var(--display);font-size:1.35rem;color:#1f7a6d;font-weight:700}
.cert2-p{margin:10px 0;font-size:.95rem}.cert2-name{font-family:var(--display);font-size:2.1rem;color:#1f7a6d;font-weight:700;margin:6px 0}
.cert2-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.cert2-foot>div{flex:1;min-width:120px;text-align:center}
.cert2-sign img{height:70px;max-width:220px;object-fit:contain;display:block;margin:0 auto 4px}.cert2-sigline{width:160px;border-bottom:2px solid #9aa8a3;margin:0 auto 40px}
.stamp{width:110px;height:110px;border:4px double #b23a3a;border-radius:50%;color:#b23a3a;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);margin:0 auto;opacity:.88;line-height:1.2}
.stamp span{font-family:var(--display);font-weight:800;font-size:1.2rem}.stamp small{font-size:.62rem;max-width:90px}.stamp em{font-style:normal;font-size:.65rem;font-weight:700;border-top:1px solid #b23a3a;margin-top:3px;padding-top:2px}
.cert2-serial{position:absolute;bottom:6px;left:12px;font-size:.65rem;color:#9aa8a3;direction:ltr}
@media print{ body.printing-cert *{visibility:hidden} body.printing-cert #certCard,body.printing-cert #certCard *{visibility:visible} body.printing-cert #certCard{position:fixed;inset:0;margin:0;border-radius:0} }

input,select,textarea{border-radius:12px!important}

const LESSONS=[{"id": "L1_01", "title": "فضل التلاوة وآدابها وأركان القراءة الصحيحة", "bookPages": "من الكتاب ص15-23", "summary": "تلاوة القرآن الكريم من أجلّ العبادات وأعظم القربات إلى الله سبحانه، فقد أمر الله بها في قوله: ﴿فَاقْرَءُوا مَا تَيَسَّرَ مِنَ الْقُرْآنِ﴾، وقال النبي ﷺ: «اقرءوا القرآن فإنه يأتي يوم القيامة شفيعًا لأصحابه»، وقال: «خيركم من تعلم القرآن وعلمه»، وقال: «من قرأ حرفًا من كتاب الله فله حسنة والحسنة بعشر أمثالها». ولأن الله لا يقبل عملًا إلا إذا كان خالصًا صوابًا، كان على قارئ القرآن أن يُعدّ للقراءة ما تحتاجه من آداب، ومنها: أن يستقبل القبلة ما أمكنه، وأن يستاك تطهيرًا وتعظيمًا للقرآن، وأن يكون طاهرًا من الحدثين، نظيف الثوب والبدن، وأن يستعيذ في أول التلاوة، وأن يقرأ في خشوع وتدبر، وأن يكون قلبه حاضرًا فيتأثر بما يقرأ.\nويشترط لصحة القراءة ثلاثة أركان: موافقة القراءة لوجه من أوجه اللغة العربية والنحو ولو ضعيفًا، وموافقتها للرسم العثماني ولو احتمالًا (مثل ﴿مَلِكِ يَوْمِ الدِّينِ﴾ قُرئت بالألف وبدونها لأن رسم المصحف يحتملهما)، وصحة السند وتواتره، أي أن ينقلها جماعة عن جماعة تحيل العادة تواطؤهم على الكذب من أول السند إلى منتهاه. وعلم التجويد له عشرة مبادئ: فالتجويد لغةً التحسين، واصطلاحًا إخراج كل حرف من مخرجه مع إعطائه حقه (صفاته اللازمة كالجهر والشدة) ومستحقه (صفاته العارضة كالإظهار والإدغام والتفخيم والترقيق).\nوموضوعه كلمات القرآن الكريم، وثمرته صون اللسان عن اللحن حال الأداء، وهو من أشرف العلوم لتعلقه بكلام الله تعالى. وحكمه: التجويد العلمي (معرفة القواعد) فرض كفاية، والتجويد العملي (تلاوة القرآن مجودًا كما نزل) فرض عين على كل من قرأ القرآن ولو آية واحدة، قال تعالى: ﴿وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا﴾، وقال علي رضي الله عنه: الترتيل هو تجويد الحروف ومعرفة الوقوف.", "rules": ["آداب التلاوة: استقبال القبلة ما أمكن، السواك، الطهارة من الحدثين، نظافة الثوب والبدن، الاستعاذة في أول التلاوة، القراءة في خشوع وتدبر، حضور القلب.", "أركان القراءة الصحيحة ثلاثة: موافقة وجه من أوجه اللغة العربية، وموافقة الرسم العثماني ولو احتمالًا، وصحة السند وتواتره.", "التجويد لغة: التحسين، واصطلاحًا: إخراج كل حرف من مخرجه مع إعطائه حقه ومستحقه.", "حق الحرف: صفاته اللازمة التي لا تنفك عنه (كالجهر والشدة)، ومستحق الحرف: صفاته العارضة (كالإظهار والإدغام والتفخيم والترقيق).", "التجويد العلمي فرض كفاية، والتجويد العملي فرض عين على كل من قرأ القرآن ولو آية واحدة.", "القراءة: ما نُسب لإمام من الأئمة العشرة، والرواية: ما نُسب للراوي عن الإمام (كحفص عن عاصم)، والطريق: ما نُسب للآخذ عن الراوي."], "examples": [{"word": "مَلِكِ يَوْمِ الدِّينِ", "note": "قُرئت ﴿مَلِكِ﴾ و﴿مَالِكِ﴾ لأن رسم المصحف يحتمل القراءتين، فهذا ركن موافقة الرسم العثماني."}, {"word": "إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ", "note": "أنكر ابن مسعود رضي الله عنه على من قرأها مرسلة بدون مد وقال: ما هكذا أقرأنيها النبي ﷺ، فهذا دليل على وجوب التجويد العملي."}, {"word": "وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا", "note": "الترتيل هو تجويد الحروف ومعرفة الوقوف كما قال علي رضي الله عنه."}], "commonErrors": ["البدء بالتلاوة دون استعاذة أو دون حضور قلب وتدبر.", "الظن بأن التجويد العملي مستحب فقط، والصواب أنه فرض عين على كل قارئ.", "الخلط بين القراءة والرواية: فحفص راوٍ عن الإمام عاصم، وليس قارئًا من العشرة."], "practice": ["فَاقْرَءُوا مَا تَيَسَّرَ مِنَ الْقُرْآنِ", "وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا", "إِنَّمَا الصَّدَقَاتُ لِلْفُقَرَاءِ وَالْمَسَاكِينِ", "مَلِكِ يَوْمِ الدِّينِ", "الْحَمْدُ لِلَّهِ الَّذِي أَنزَلَ عَلَىٰ عَبْدِهِ الْكِتَابَ"], "quiz": [{"q": "ما حكم التجويد العملي (تلاوة القرآن مجوَّدًا)؟", "options": ["فرض عين على كل من قرأ القرآن ولو آية", "فرض كفاية", "سنة مستحبة", "مباح"], "answer": 0, "why": "التجويد العملي فرض عين على كل من قرأ القرآن ولو آية واحدة، أما التجويد العلمي (معرفة القواعد) فهو فرض كفاية."}, {"q": "ما المقصود بـ«حق الحرف» في تعريف التجويد؟", "options": ["صفاته العارضة كالإظهار والإدغام", "صفاته اللازمة التي لا تنفك عنه كالجهر والشدة", "مخرجه فقط", "حركته"], "answer": 1, "why": "حق الحرف هو صفاته اللازمة التي لا تنفك عنه مثل الجهر والشدة، أما الصفات العارضة فهي مستحق الحرف."}, {"q": "كم عدد أركان القراءة الصحيحة؟", "options": ["ركنان", "ثلاثة أركان", "أربعة أركان", "خمسة أركان"], "answer": 1, "why": "أركان القراءة ثلاثة: موافقة وجه من أوجه اللغة العربية، وموافقة الرسم العثماني ولو احتمالًا، وصحة السند."}, {"q": "أيّ مما يلي ليس من آداب التلاوة المذكورة في الكتاب؟", "options": ["استقبال القبلة ما أمكن", "الطهارة من الحدثين", "رفع الصوت دائمًا بالقراءة", "القراءة في خشوع وتدبر"], "answer": 2, "why": "آداب التلاوة في الكتاب: استقبال القبلة، السواك، الطهارة، نظافة الثوب والبدن، الاستعاذة، الخشوع والتدبر، حضور القلب؛ ولم يُذكر رفع الصوت."}, {"q": "«حفص عن عاصم» يُسمى:", "options": ["قراءة", "رواية", "طريقًا", "وجهًا"], "answer": 1, "why": "ما نُسب للراوي عن الإمام يسمى رواية، فحفص راوٍ عن الإمام عاصم."}, {"q": "ما ثمرة علم التجويد؟", "options": ["حفظ القرآن", "صون اللسان عن اللحن حال الأداء", "معرفة التفسير", "تحسين الصوت"], "answer": 1, "why": "ثمرة علم التجويد هي صون اللسان عن اللحن حال الأداء."}], "level": 1}, {"id": "L1_02", "title": "اللحن الجلي والخفي ومراتب القراءة", "bookPages": "من الكتاب ص24-26", "summary": "اللحن هو الخطأ والميل عن الصواب في القرآن الكريم، وهو قسمان. الأول: اللحن الجلي (الظاهر)، وهو خطأ يطرأ على الألفاظ فيخل بالقراءة سواء أخلّ بالمعنى أم لم يخل، نحو: إبدال حرف بحرف كمن يقرأ «قانتين» بالطاء، أو «الضالين» بالظاء، أو تغيير الحركة، أو زيادة حرف أو نقصان حرف مثل إشباع الحركة حتى يتولد حرف مد، أو إسقاط المد الطبيعي. وسمي جليًا لأنه يسهل على علماء القراءة وغيرهم معرفته. وحكمه: يحرم بالإجماع إن تعمده القارئ، ويأثم من أهمل تعلمه مع قدرته على ذلك، لأن ما لا يتم الواجب إلا به فهو واجب.\nالثاني: اللحن الخفي (المستتر)، وهو خطأ يطرأ على الألفاظ فيخل بعرف القراء دون المعنى، نحو: ترك الإدغام، تكرير الراء، عدم إتمام الحركات. وسمي خفيًا لأنه لا يعلمه ولا يكتشفه إلا علماء القراءة وأهل الأداء. وحكمه: يأثم القارئ إن أهمله مع قدرته على الإتيان به، وقد لا يأثم إن أتى به ناقصًا مثل إنقاص زمن المد أو عدم التمييز بين مراتب الغنن. أما مراتب القراءة فثلاث: التحقيق وهو قراءة القرآن باطمئنان وبطء بدون زيادة ولا نقص مع إعطاء الحروف حقها ومستحقها، والحدر وهو الإسراع بالقراءة مع مراعاة الأحكام بدقة، والتدوير وهو قراءة القرآن بمرتبة متوسطة بين التحقيق والحدر.\nأما الترتيل فهو صفة مصاحبة للمراتب الثلاثة السابقة، فهو  من الفعل «بسمل» إذا قال: بسم الله الرحمن الرحيم. وحكمها: واجبة في أول كل سورة بالإجماع ما عدا سورة براءة فلا بسملة في أولها، وفي وسط السورة القارئ مخيّر بين الإتيان بها أو عدمه. تنبيه: إذا كانت الآية تبدأ بلفظ الجلالة أو ضمير يعود عليه أو بذكر الرسول ﷺ فيستحب أن يأتي بها، وإذا كانت تبدأ بذكر الشيطان أو ضمير يعود عليه فيستحب ألا يبسمل.\nولم يبسمل القارئ في أول براءة لقولين: أنها نزلت بالسيف والحصر ونبذ العهد والبسملة رحمة، أو أن الأنفال وبراءة سورة واحدة. أوجه الاستعاذة والبسملة عند البدء بأول السورة أربعة: قطع الجميع، ووصل الجميع، ووصل البسملة بالسورة، ووصل الاستعاذة بالبسملة. أما بين السورتين فثلاثة أوجه جائزة: قطع الجميع، ووصل الجميع، وقطع الأول عن الثاني ووصل الثاني بالثالث، ووجه ممتنع هو وصل الأول بالثاني وقطع الثالث لأنه جعل البسملة لآخر السورة.\nوبين الأنفال وبراءة ثلاثة أوجه: الوقف، والسكت، والوصل مع القلب.", "rules": ["الاستعاذة مستحبة عند بدء القراءة على مذهب الجمهور، وصيغتها المختارة: أعوذ بالله من الشيطان الرجيم.", "يُسرّ بالاستعاذة في القراءة السرية، وفي الدور لغير المبتدئ، وعند القراءة خاليًا، وفي الصلاة مطلقًا؛ ويُجهر بها في القراءة الجهرية وللمبتدئ في الدور.", "تعاد الاستعاذة إذا قطع القراءة عارض أجنبي كالكلام العادي، ولا تعاد إذا كان العارض سعالًا أو عطاسًا أو كلامًا يتعلق بالقرآن كالتفسير.", "البسملة واجبة في أول كل سورة إلا سورة براءة، والقارئ مخيّر فيها في وسط السورة.", "أوجه البدء بأول السورة أربعة: قطع الجميع، وصل الجميع، وصل البسملة بالسورة، وصل الاستعاذة بالبسملة.", "بين السورتين ثلاثة أوجه جائزة ووجه ممتنع: وصل البسملة بآخر السورة الأولى ثم الوقف عليها.", "بين الأنفال وبراءة: الوقف أو السكت أو الوصل (مع القلب)، بشرط أن تكون السورة السابقة لبراءة في ترتيب المصحف."], "examples": [{"word": "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", "note": "الصيغة المختارة للاستعاذة لنزول القرآن بها."}, {"word": "فَإِذَا قَرَأْتَ الْقُرْآنَ فَاسْتَعِذْ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", "note": "دليل الاستعاذة، وصرف الجمهور الأمر فيها إلى الاستحباب."}, {"word": "إِنَّهُ مِن سُلَيْمَانَ وَإِنَّهُ بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ", "note": "لا السورة من أولها"], "answer": 0, "why": "إذا كان العارض أجنبيًا كالتشاغل بالكلام العادي أو رد السلام فعليه إعادة الاستعاذة."}, {"q": "إذا بدأ القارئ من وسط السورة بآية تبدأ بذكر الشيطان فيستحب:", "options": ["أن يبسمل", "ألا يبسمل", "أن يجهر بالبسملة", "أن يكرر الاستعاذة مرتين"], "answer": 1, "why": "إذا كانت الآية تبدأ بذكر الشيطان أو ضمير يعود عليه فيستحب ألا يبسمل القارئ."}], "level": 1}, {"id": "L1_04", "title": "الحركات وإتمامها", "bookPages": "من الكتاب ص37-38 و43", "summary": "الحركات الأصلية ثلاث: الفتحة والضمة والكسرة، وهي التي قبل الذي أميلا (أي قبل الحركة الممالة في المنظومة). وهناك حركات فرعية: الحركة الممالة مثل «بشرى» و«النار» عند من أمال، والحركة المشمة مثل «قيل» و«غيض» عند من أشم؛ وهي ثلاث وأتت فرعية، وكسرة كضمة كقيلا. والحرف المتحرك يحدث بالتباعد بين طرفي عضو النطق (ويسمى بالقلع): فالمتحرك بالفتح يحدث مع فتح الفكين، والمتحرك بالضم مع ضم الشفتين، والمتحرك بالكسر مع انخفاض الفك السفلي.\nمن الأخطاء الشائعة عند قراءة القرآن: عدم ضم الشفتين عند النطق بالحرف المضموم، أو عدم انخفاض الفك السفلي عند النطق بالحرف المكسور، أو عدم فتح الفكين عند النطق بالحرف المفتوح، مما يؤدي إلى عدم إتمام حركة الحرف. لذلك يجب الانتباه إلى ما يأتي: فتح ما بين الفكين عند النطق بالحرف المفتوح كما ينطق الألف، وضم الشفتين عند النطق بالحرف المضموم كما ينطق الواو وضم الحرف من مخرجه، وخفض الفك السفلي عند النطق بالحرف المكسور وكسر الحرف في مخرجه.\nويتم ذلك بلطف وعدم مبالغة حتى لا يتولد حروف مد. أمثلة: «عَلَيْهِمْ» من الخطأ نطق كسرة الهاء بين الكسرة والفتحة، و«بِهِ» عند الوقف عليها من الخطأ نطق كسرة الباء بين الكسرة والفتحة، و«كُفُوًا» من الخطأ الشائع عدم إشباع ضمة الفاء فتخرج كأنها ساكنة، وعند قولنا «كَتَبَ» لا بد من فتح ما بين الشفتين في كل حرف مفتوح ومساواة زمن النطق بالكاف والتاء والباء لأن الحركة تساوي بين أزمنة الحروف. قال العلامة الطيبي: وكل مضموم فلن يتما إلا بضم الشفتين ضما، وذو انخفاض بانخفاض للفم، ويتم المفتوح بالفتح افهم، إذ الحروف إن تكن محركة يشركها مخرج أصل الحركة.", "rules": ["الحركات الأصلية ثلاث: الفتحة والضمة والكسرة، والفرعية: الحركة الممالة والحركة المشمة.", "المتحرك بالفتح يحدث بالتباعد مع فتح الفكين، والمتحرك بالضم مع ضم الشفتين، والمتحرك بالكسر مع انخفاض الفك السفلي.", "الفتحة تؤخذ من الألف، والضمة من الواو، والكسرة من الياء؛ فالحرف المتحرك يشركه مخرج أصل الحركة.", "إتمام الحركات يكون بلطف وبدون مبالغة حتى لا تتولد حروف مد.", "الحركة تساوي بين أزمنة الحروف، فزمن الحرف المفتوح يساوي زمن المضموم والمكسور.", "لا تُمال الفتحة نحو الكسرة، ولا تُنطق الكسرة بين الكسرة والفتحة، ولا تُهمل الضمة حتى تصير كالسكون."], "examples": [{"word": "عَلَيْهِمْ", "note": "من الخطأ نطق كسرة الهاء بين الكسرة والفتحة؛ يجب خفض الفك السفلي لإتمام الكسرة."}, {"word": "بِهِ", "note": "عند الوقف عليها من الخطأ نطق كسرة الباء بين الكسرة والفتحة."}, {"word": "كُفُوًا", "note": "من الخطأ الشائع عدم إشباع ضمة الفاء فتخرج كأنها ساكنة؛ يجب ضم الشفتين."}, {"word": "كَتَبَ", "note": "لا بد من فتح الفكين في كل حرف مفتوح ومساواة زمن النطق بالكاف والتاء والباء."}], "commonErrors": ["عدم ضم الشفتين عند الحرف المضموم فتخرج الضمة ناقصة كأنها سكون.", "عدم خفض الفك السفلي عند الحرف المكسور فتخرج الكسرة مائلة إلى الفتحة.", "عدم فتح الفكين عند الحرف المفتوح فتخرج الفتحة ممالة.", "المبالغة في إتمام الحركة حتى يتولد منها حرف مد (فتحة تصير ألفًا، أو ضمة تصير واوًا).", "تفاوت زمن الحروف المتحركة في الكلمة الواحدة."], "practice": ["عَلَيْهِمْ", "كُفُوًا أَحَدٌ", "كَتَبَ رَبُّكُمْ", "نُودِيَ", "بِهِ ۝ يَعْمَلُونَ", "قُلْ هُوَ اللَّهُ أَحَدٌ"], "quiz": [{"q": "عند النطق بالحرف المضموم يجب:", "options": ["فتح الفكين", "ضم الشفتين", "خفض الفك السفلي", "فتح الشفتين"], "answer": 1, "why": "يتم المضموم بضم الشفتين كما ينطق الواو، قال الطيبي: وكل مضموم فلن يتما إلا بضم الشفتين ضما."}, {"q": "الخطأ في نطق ﴿عَلَيْهِمْ﴾ المذكور في الكتاب هو:", "options": ["إشباع ضمة الهاء", "نطق كسرة الهاء بين الكسرة والفتحة", "قلقلة الميم", "مد الياء"], "answer": 1, "why": "من الخطأ نطق كسرة الهاء بين الكسرة والفتحة، والصواب خفض الفك السفلي لإتمام الكسرة."}, {"q": "الحرف المتحرك بالكسر يحدث بالتباعد مع:", "options": ["ضم الشفتين", "فتح الفكين", "انخفاض الفك السفلي", "ارتفاع اللسان"], "answer": 2, "why": "المتحرك بالكسر يحدث بالتباعد بين طرفي عضو النطق مع انخفاض الفك السفلي."}, {"q": "ماذا يحدث عند المبالغة في إتمام الحركات؟", "options": ["يتولد حرف مد", "يتحسن الصوت", "تقصر الحركة", "لا يحدث شيء"], "answer": 0, "why": "يتم إتمام الحركات بلطف وعدم مبالغة حتى لا يتولد حروف مد، وتوليد حرف مد زيادة حرف وهو لحن جلي."}, {"q": "أي مما يلي من الحركات الفرعية؟", "options": ["الفتحة", "الضمة", "الكسرة", "الحركة الممالة"], "answer": 3, "why": "الحركات الأصلية: الفتحة والضمة والكسرة، والفرعية: الحركة الممالة والحركة المشمة."}, {"q": "في كلمة ﴿كَتَبَ﴾ يجب:", "options": ["إطالة زمن الباء", "مساواة زمن النطق بالكاف والتاء والباء مع فتح الفكين", "ضم الشفتين", "إمالة الفتحات"], "answer": 1, "why": "لا بد من فتح الفكين في كل حرف مفتوح ومساواة زمن النطق لأن الحركة تساوي بين أزمنة الحروف."}], "level": 1}, {"id": "L1_05", "title": "أنواع الحروف وآلية حدوثها", "bookPages": "من الكتاب ص35-37 و41-43", "summary": "يتألف القرآن من سور، والسور من آيات، والآيات من كلمات، وكل كلمة من أحرف، فأصغر وحدة في القرآن هي الحرف؛ لذلك وجه العلماء عنايتهم بدراسته. والصوت في الطبيعة هو تخلخل وتموج في طبقات الهواء تدركه الأذن البشرية، والحرف: صوت يعتمد على مقطع محقق أو مقدر. تحدث الأصوات في الطبيعة بتصادم جسمين، أو تباعد جسمين بينهما قوة ترابط، أو اهتزاز الأجسام، أو احتكاكها؛ وتحدث في جهاز النطق البشري بنفس الكيفية: التصادم والتباعد والاهتزاز. وتنقسم الحروف إلى متحركة وساكنة.\nالحروف الساكنة ثلاثة أقسام: (1) حروف المد الثلاثة وحرفا اللين: تحدث باهتزاز الحبال الصوتية نتيجة ملاقاتها لهواء الزفير الخارج من الرئتين مع فتح الفكين مع الألف، وضم الشفتين مع الواو، وانخفاض الفك السفلي وارتفاع وسط اللسان قليلًا مع الياء. (2) حروف «قطب جد» الساكنة: تحدث بالتباعد بين طرفي عضو النطق دون أن يصاحبه فتح الفكين أو ضم الشفتين أو انخفاض الفك السفلي. (3) باقي الحروف الساكنة: تحدث بالتصادم بين طرفي عضو النطق (ويسمى بالقرع).\nأما الحروف المتحركة فتحدث بالتباعد بين طرفي عضو النطق (ويسمى بالقلع) مع فتح الفكين للفتح، وضم الشفتين للضم، وانخفاض الفك السفلي للكسر. ويُعرف كل حرف بثلاثة أشياء: اسمه ورسمه ونطقه، فحرف الحاء اسمه «حاء» ورسمه «ح» ونطقه «اح». والحروف الأبجدية هي المكتوبة وعددها 28 مجموعة في: أبجد هوز حطي كلمن سعفص قرشت ثخذ ضظغ. والحروف الهجائية هي المنطوقة وعددها 29 بزيادة «لا» وهي الألف المدية، ووُضع قبلها لام لأن الألف المدية عبارة عن إشباع لفتحة ما قبلها.\nوالحروف من حيث الأصلي والفرعي: حروف أصلية هي الهجائية، وحروف فرعية تتردد بين مخرجين أو حرفين أو صفتين، مثل: الهمزة المسهلة (بين الهمزة والحرف المجانس لحركتها، كـ«ءاعجمي»)، والألف الممالة (بين الألف والياء في ﴿مَجْرَاهَا﴾)، والصاد المشمة زايًا، والألف المفخمة، واللام المفخمة في لفظ الجلالة، والنون والميم المخفاتان، والياء المشمة بالواو.", "rules": ["الحرف: صوت يعتمد على مقطع محقق أو مقدر، وهو أصغر وحدة في القرآن.", "تحدث الأصوات في جهاز النطق بالتصادم والتباعد والاهتزاز.", "حروف المد واللين تحدث باهتزاز الحبال الصوتية مع فتح الفكين (الألف) أو ضم الشفتين (الواو) أو انخفاض الفك السفلي (الياء).", "حروف قطب جد الساكنة تحدث بالتباعد دون فتح الفكين أو ضم الشفتين أو خفض الفك، وباقي السواكن تحدث بالتصادم (القرع).", "الحروف المتحركة تحدث بالتباعد (القلع) ويصاحبه مخرج الحركة.", "الحروف الأبجدية 28 حرفًا مكتوبًا، والحروف الهجائية 29 حرفًا منطوقًا بزيادة الألف المدية (لا).", "الحروف الأصلية هي الهجائية، والفرعية ما يتردد بين مخرجين أو حرفين أو صفتين، وكلاهما أتى في المصحف."], "examples": [{"word": "قَالَ", "note": "الألف المدية تحدث باهتزاز الحبال الصوتية مع فتح الفكين."}, {"word": "يَقْطَعُونَ", "note": "القاف الساكنة من حروف قطب جد تحدث بالتباعد دون فتح الفكين (قلقلة)."}, {"word": "أَنْعَمْتَ", "note": "النون والميم الساكنتان هنا من باقي السواكن التي تحدث بالتصادم (القرع)."}, {"word": "مَجْرَاهَا", "note": "الألف الممالة في سورة هود حرف فرعي يتردد بين الألف والياء، وليس لحفص غيرها."}, {"word": "ءَأَعْجَمِيٌّ", "note": "الهمزة الثانية مسهلة بين الهمزة والألف، وهي همزة القطع الوحيدة المسهلة عند حفص."}], "commonErrors": ["فتح الفكين أو ضم الشفتين عند نطق حروف قطب جد الساكنة فتتولد حركة.", "الخلط بين عدد الحروف الأبجدية (28) والهجائية (29).", "ظن أن «لا» حرف واحد في كلمة «الإنسان»، والصواب أن ما في الإنسان حرفان: اللام والهمزة.", "نطق النون والميم المخفاتين كأنهما مظهرتان أو مدغمتان."], "practice": ["قَالُوا", "يَقْطَعُونَ", "أَنْعَمْتَ عَلَيْهِمْ", "مَجْرَاهَا", "ءَأَعْجَمِيٌّ وَعَرَبِيٌّ", "الصِّرَاطَ"], "quiz": [{"q": "كيف تحدث حروف المد الثلاثة؟", "options": ["بالتصادم بين طرفي عضو النطق", "باهتزاز الحبال الصوتية نتيجة ملاقاتها لهواء الزفير", "بالاحتكاك", "بانحباس النفس"], "answer": 1, "why": "حروف المد واللين تحدث باهتزاز الحبال الصوتية نتيجة ملاقاتها لهواء الزفير الخارج من الرئتين."}, {"q": "باقي الحروف الساكنة (غير المد واللين وقطب جد) تحدث بـ:", "options": ["التباعد (القلع)", "التصادم (القرع)", "الاهتزاز", "الإمالة"], "answer": 1, "why": "باقي الحروف الساكنة تحدث بالتصادم بين طرفي عضو النطق ويسمى بالقرع."}, {"q": "كم عدد الحروف الهجائية؟", "options": ["28", "29", "30", "27"], "answer": 1, "why": "الحروف الهجائية هي المنطوقة وعددها 29 حرفًا بزيادة «لا» وهي الألف المدية على الحروف الأبجدية الـ28."}, {"q": "ما الحرف الفرعي في ﴿مَجْرَاهَا﴾ عند حفص؟", "options": ["الصاد المشمة", "الألف الممالة", "الهمزة المسهلة", "اللام المفخمة"], "answer": 1, "why": "الألف الممالة تتردد بين الألف والياء، وهي في ﴿مَجْرَاهَا﴾ في سورة هود وليس لحفص غيرها."}, {"q": "حروف قطب جد الساكنة تحدث بالتباعد:", "options": ["مع فتح الفكين", "مع ضم الشفتين", "دون فتح الفكين أو ضم الشفتين أو انخفاض الفك", "مع انخفاض الفك السفلي"], "answer": 2, "why": "تحدث بالتباعد بين طرفي عضو النطق دون أن يصاحبه فتح الفكين أو ضم الشفتين أو انخفاض الفك السفلي، ويفصل في باب القلقلة."}, {"q": "لماذا وُضعت لام قبل الألف في «لا» من الحروف الهجائية؟", "options": ["لأن اللام أقوى الحروف", "لأن الألف المدية إشباع لفتحة ما قبلها فلا تنطق إلا بعد حرف مفتوح", "لتسهيل الكتابة", "لأن اللام أول حرف"], "answer": 1, "why": "الألف المدية عبارة عن إشباع لفتحة ما قبلها، فوضع قبلها لام حتى نتمكن من نطقها."}], "level": 1}, {"id": "L1_06", "title": "مقدمة المخارج والصفات", "bookPages": "من الكتاب ص47-52", "summary": "المخرج لغةً: محل الخروج، واصطلاحًا: محل خروج الحرف وتميزه عن غيره. والصفة لغةً: ما قام بالشيء من المعاني حسيًا (كاللون) أو معنويًا (كالخلق)، واصطلاحًا: الكيفية التي يلفظ بها الحرف عند خروجه من مخرجه والتي تميزه عن غيره. الفائدة من دراسة المخارج: أنها الموازين التي تعرف بها مقادير الحروف فتميزها عن غيرها. والفائدة من دراسة الصفات: التمييز بين الحروف المشتركة في المخرج (فالطاء والتاء من مخرج واحد والصفات تميز بينهما)، وتحسين لفظ الحروف المختلفة في المخرج، ومعرفة الحروف القوية والضعيفة حتى نعلم ما يجوز فيه الإدغام وما لا يجوز؛ فالطاء أقوى من التاء فأُدغمت في ﴿بَسَطتَ﴾ إدغامًا ناقصًا حتى لا تذهب ميزة الإطباق.\nأنواع المخارج: مخرج محقق يعتمد على جزء معين من أجزاء الفم كالحلق واللسان والشفتين، ومخرج مقدر لا يعتمد على جزء معين (مخرج الحروف المدية). أنواع الصفات: صفات أصلية لا تنفك عن الحرف بأي حال، وصفات عرضية تعرض للحرف أحيانًا وتنفك عنه في حال آخر. طريقة تحديد مخرج الحرف ذي المخرج المحقق: نسكن الحرف أو نشدده، وندخل عليه همزة وصل، ونحركها بأي حركة، وننطق الحرف فحيث ينقطع الصوت يكون المخرج نحو (أقْ). وللحروف المدية: ندخل على الألف حرفًا مفتوحًا وعلى الواو حرفًا مضمومًا وعلى الياء حرفًا مكسورًا نحو (قا، قو، قي) وحيث ينتهي الهواء ينقطع الصوت فنجد المخرج مقدرًا.\nتنقسم المخارج إلى مخارج عامة ومخارج خاصة. المخرج العام يشتمل على مخرج خاص واحد أو أكثر، وعددها خمسة على مذهب ابن الجزري: الجوف، الحلق، اللسان، الشفتان، الخيشوم (كعربات القطار الخمس). والمخرج الخاص يشتمل على مخرج واحد يخرج منه حرف أو حرفان أو ثلاثة، وعددها 17: الجوف مخرج واحد (حروف المد الثلاثة)، الحلق 3 مخارج (6 أحرف)، اللسان 10 مخارج (18 حرفًا)، الشفتان مخرجان (4 أحرف)، الخيشوم مخرج واحد (صفة الغنة). وقد اختلف العلماء: ابن الجزري على مذهب الخليل 17 مخرجًا، والشاطبي على مذهب سيبويه 16 بحذف الجوف، والفراء 14 بحذف الجوف وجعل اللام والنون والراء في مخرج واحد؛ والمشهور ما عليه ابن الجزري.\nورتب العلماء المخارج بنفس كيفية خروج الهواء ابتداءً مما يلي الصدر حتى يصل إلى مقدمة الفم.", "rules": ["المخرج: محل خروج الحرف وتميزه عن غيره، والصفة: الكيفية التي يلفظ بها الحرف عند خروجه من مخرجه.", "المخرج المحقق يعتمد على جزء معين من الفم، والمخرج المقدر لا يعتمد على جزء معين وهو مخرج حروف المد.", "لمعرفة مخرج الحرف: سكّنه أو شدّده وأدخل عليه همزة وصل متحركة وانطق، فحيث ينقطع الصوت يكون المخرج (أقْ).", "المخارج العامة خمسة: الجوف، الحلق، اللسان، الشفتان، الخيشوم.", "المخارج الخاصة 17 على المشهور الذي عليه ابن الجزري: الجوف 1، الحلق 3، اللسان 10، الشفتان 2، الخيشوم 1.", "الصفات الأصلية لا تنفك عن الحرف، والصفات العرضية تعرض له أحيانًا وتنفك عنه.", "من فوائد الصفات: التمييز بين الحروف المشتركة في المخرج، ومعرفة القوي من الضعيف لمعرفة ما يجوز إدغامه."], "examples": [{"word": "بَسَطتَ", "note": "الطاء أقوى من التاء فأُدغمت إدغامًا ناقصًا حتى لا تذهب ميزة الإطباق."}, {"word": "وَدَّت طَّائِفَةٌ", "note": "التاء أضعف من الطاء فأُدغمت فيها إدغامًا كاملًا."}, {"word": "نَخْلُقكُّم", "note": "القاف أقوى من الكاف ومع ذلك أُدغمت فيها إدغامًا كاملًا على وجه الرواية."}, {"word": "أقْ", "note": "طريقة استخراج مخرج القاف: نسكنها وندخل عليها همزة وصل فحيث ينقطع الصوت يكون المخرج."}], "commonErrors": ["الخلط بين المخرج العام والمخرج الخاص؛ فالحلق مخرج عام يحوي ثلاثة مخارج خاصة.", "ظن أن الخيشوم يخرج منه حرف، والصواب أنه يخرج منه صفة الغنة فقط.", "محاولة تحديد مخرج حرف المد بنفس طريقة الحروف المحققة، والصواب إدخال حرف قبله بحركة مجانسة (قا، قو، قي)."], "practice": ["أقْ ، أكْ ، أجْ", "قَا ، قُو ، قِي", "بَسَطتَ", "وَدَّت طَّائِفَةٌ", "أَلَمْ نَخْلُقكُّم"], "quiz": [{"q": "ما هو المخرج المقدر؟", "options": ["مخرج الحلق", "مخرج لا يعتمد على جزء معين من أجزاء الفم وهو مخرج الحروف المدية", "مخرج اللسان", "مخرج الشفتين"], "answer": 1, "why": "المخرج المقدر هو الذي لا يعتمد على أي جزء من أجزاء الفم وهو مخرج الحروف المدية."}, {"q": "كم عدد المخارج الخاصة على مذهب ابن الجزري؟", "options": ["14", "16", "17", "5"], "answer": 2, "why": "على مذهب ابن الجزري (مذهب الخليل) المخارج 5 عامة يخرج منها 17 مخرجًا خاصًا، وهو المشهور."}, {"q": "ما الذي يخرج من الخيشوم؟", "options": ["النون", "الميم", "صفة الغنة", "حروف المد"], "answer": 2, "why": "الخيشوم مخرج واحد خاص يخرج منه صفة الغنة وليس حرفًا."}, {"q": "لماذا أُدغمت الطاء في التاء إدغامًا ناقصًا في ﴿بَسَطتَ﴾؟", "options": ["لأن الطاء أضعف من التاء", "لأن الطاء أقوى من التاء فلا تذهب ميزة الإطباق", "لأنهما من مخرجين مختلفين", "لأن التاء مطبقة"], "answer": 1, "why": "الطاء أقوى من التاء فأصبح الإدغام ناقصًا حتى لا تذهب ميزة القوة التي تميزت بها الطاء وهي الإطباق."}, {"q": "كم عدد المخارج الخاصة في اللسان؟", "options": ["3", "10", "2", "1"], "answer": 1, "why": "اللسان مخرج عام يخرج منه 10 مخارج خاصة تخرج منها 18 حرفًا."}, {"q": "طريقة معرفة مخرج الحرف ذي المخرج المحقق هي:", "options": ["نطقه متحركًا بالفتح", "تسكينه وإدخال همزة وصل عليه ونطقه حتى ينقطع الصوت", "مده", "إدغامه في حرف آخر"], "answer": 1, "why": "نسكن الحرف أو نشدده وندخل عليه همزة وصل ونحركها وننطق الحرف فحيث ينقطع الصوت يكون المخرج نحو (أقْ)."}], "level": 1}, {"id": "L1_07", "title": "الصفات التي لها ضد", "bookPages": "من الكتاب ص55-65", "summary": "تنقسم الصفات إلى أصلية (لازمة) وعرضية، والأصلية منها صفات لها ضد وصفات ليس لها ضد. الصفات التي لها ضد خمسة أزواج: (1) الهمس وضده الجهر: الهمس لغةً الخفاء، واصطلاحًا جريان النفس عند النطق بالحرف لضعفه الناتج عن ضعف الاعتماد على مخرجه، وهو صفة ضعيفة، وحروفه مجموعة في «فحثه شخص سكت»، وكيفيته: يتباعد الوتران الصوتيان فيمر الهواء بسهولة. والجهر لغةً الظهور والإعلان، واصطلاحًا انحباس جريان النفس عند النطق بالحرف لقوته، صفة قوية، وحروفه باقي الحروف.\n(2) الشدة والتوسط وضدهما الرخاوة: الشدة انحباس جريان الصوت عند النطق بالحرف لكمال قوة الاعتماد على مخرجه، صفة قوية، حروفها «أجد قط بكت»، ويقصر زمن الحرف. والتوسط جريان الصوت جريانًا بينيًا لاعتدال الاعتماد على المخرج، صفة متوسطة، حروفه «لن عمر». والرخاوة جريان الصوت عند النطق بالحرف لضعف الاعتماد على مخرجه، صفة ضعيفة، حروفها باقي الحروف، ويزيد زمن الحرف. تنبيه: ليس معنى الجهر انعدام النفس تمامًا ولكن يكون قليلًا، وليس معنى الشدة انعدام الصوت تمامًا ولكن يكون قليلًا.\nوالثمرة العملية: زمن الحرف الرخو الساكن أطول من المتوسط، والمتوسط أطول من الشديد (س > ر > ب)، أما الحروف المتحركة فالحركة تساوي بين أزمنتها. (3) الاستعلاء وضده الاستفال: الاستعلاء اتجاه ضغط الحرف عند النطق به إلى الحنك الأعلى، صفة قوية، حروفه «خص ضغط قظ»، ومراتبه: ط، ض، ص، ظ، ق، غ، خ. والاستفال اتجاه ضغط الحرف إلى قاع الفم، صفة ضعيفة، حروفه باقي الحروف. قاعدة: كل مستعلٍ مفخم ولا عكس، وكل مرقق مستفل وليس كل مستفل مرققًا.\n(4) الإطباق وضده الانفتاح: الإطباق التصاق طائفة من اللسان بما يحاذيها من الحنك الأعلى وانحصار الصوت بينهما، صفة قوية، حروفه ص، ض، ط، ظ، ومراتبه: الطاء ثم الضاد ثم الصاد ثم الظاء. والانفتاح انفتاح ما بين اللسان والحنك الأعلى فلا ينحصر الصوت، صفة ضعيفة. والإطباق أبلغ وأخص والاستعلاء أعم، فحروف الإطباق خُصّت بتفخيم أقوى، وكل مطبق مستعلٍ وليس كل مستعلٍ مطبقًا. (5) الذلاقة وضدها الإصمات: الذلاقة خفة الحرف وسرعة خروجه لاعتماده على ذلق اللسان أو ذلق الشفة، حروفها «فر من لب»، والإصمات ثقل الحرف لخروجه بعيدًا عن ذلق اللسان والشفة، وحروفه الباقي؛ وهاتان الصفتان لا علاقة لهما بالتجويد وليس لهما أثر صوتي، بل هما من مباحث الصرف والمعاجم.", "rules": ["الهمس: جريان النفس لضعف الاعتماد على المخرج، حروفه «فحثه شخص سكت»، والجهر ضده: انحباس النفس لقوة الحرف، حروفه الباقي.", "الشدة: انحباس الصوت، حروفها «أجد قط بكت»؛ التوسط: جريان بيني، حروفه «لن عمر»؛ الرخاوة: جريان الصوت، حروفها الباقي.", "زمن الساكن الرخو أطول من المتوسط، والمتوسط أطول من الشديد؛ أما المتحركات فالحركة تساوي بين أزمنتها.", "الاستعلاء: اتجاه ضغط الحرف إلى الحنك الأعلى، حروفه «خص ضغط قظ»، والاستفال ضده وحروفه الباقي.", "الإطباق: التصاق طائفة من اللسان بالحنك الأعلى وانحصار الصوت، حروفه ص ض ط ظ، والانفتاح ضده.", "كل مستعلٍ مفخم ولا عكس، وكل مطبق مستعلٍ وليس كل مستعلٍ مطبقًا، والإطباق أخص وأبلغ من الاستعلاء.", "الذلاقة حروفها «فر من لب» والإصمات الباقي، ولا أثر صوتي لهما في التجويد.", "الطاء أقوى حروف الجهر والشدة والاستعلاء والإطباق."], "examples": [{"word": "السَّمَاءَ", "note": "السين الساكنة المدغمة تأخذ زمن الحرف الرخو الساكن (جريان الصوت والنفس)."}, {"word": "الطَّامَّةُ", "note": "الطاء الساكنة تأخذ زمن الحرف الشديد الساكن فينحبس الصوت والنفس."}, {"word": "الرَّحْمَٰنِ", "note": "الراء الساكنة تأخذ زمن الحرف المتوسط الساكن."}, {"word": "يَخْشَى", "note": "الخاء مستعلية رخوة مهموسة: جريان الصوت والنفس مع ضغط الحرف إلى الحنك الأعلى."}, {"word": "الصِّرَاطَ", "note": "الصاد والطاء من حروف الإطباق فتفخيمهما أقوى من بقية المستعلية."}], "commonErrors": ["عدم إجراء الصوت في الح  ["لهما أثر صوتي كبير في التجويد", "لا علاقة لهما بالتجويد وهما من مباحث الصرف والمعاجم", "تحددان زمن الحرف", "تحددان تفخيم الحرف"], "answer": 1, "why": "الذلاقة والإصمات لا علاقة لهما بالتجويد وليس لهما أثر صوتي، بل هما من مباحث الصرف والمعاجم، وذُكرتا لتتم صفات الحروف."}], "level": 1}, {"id": "L1_08", "title": "الصفات التي لا ضد لها", "bookPages": "من الكتاب ص66-72", "summary": "الصفات التي ليس لها ضد ثماني صفات. (1) الصفير: لغةً حدة الصوت، واصطلاحًا صوت زائد يخرج من بين الثنايا وطرف اللسان عند النطق بالحرف ويشبه صوت الطائر، صفة قوية، حروفه ص، ز، س، ومراتبها: صاد ثم زاي ثم سين. (2) الانحراف: لغةً الميل، واصطلاحًا ميل صوت الحرف لعدم كمال جريانه بسبب اعتراض اللسان طريقه، صفة قوية، حروفه ل، ر؛ ينحرف صوت اللام إلى جانبي طرف اللسان، أما الراء فينحرف صوتها من جانبي الطرف إلى وسطه وذلك بتقعر اللسان.\n(3) التكرير: لغةً الإعادة، واصطلاحًا ارتعاد طرف اللسان عند النطق بالحرف، صفة قوية، حرفه الراء؛ وهذه الصفة ملازمة للراء فيجب التحرز منها وعدم المبالغة فيها ولكن لا تعدم بالكلية، بل يرتعد اللسان مرة واحدة في المخفف ومرتين في المشدد. وطريقة إخفاء التكرير الصحيحة: إلصاق طرف اللسان باللثة بخفة مع تقعير اللسان وترك فرجة بسيطة جدًا لمرور الصوت حتى لا ينحصر ويحدث التكرار. (4) التفشي: لغةً الانتشار، واصطلاحًا انتشار الريح أو صوت الشين داخل الفم حتى يصطدم بالصفحة الداخلية للأسنان العليا، صفة قوية، حرفه الشين، فيقال إن صوت الشين تفشى في الفم حتى اتصل بمخرج الظاء.\nودرجاته: المشددة نحو «الشيطان»، ثم الساكنة نحو «اشترى»، ثم المتحركة نحو «يغشى». (5) اللين: لغةً السهولة، واصطلاحًا إخراج الحرف من مخرجه بسهولة وعدم الكلفة على اللسان، صفة ضعيفة، حروفه الواو والياء الساكنتان المفتوح ما قبلهما نحو «خوف» و«بيت». (6) الخفاء: لغةً الاستتار، واصطلاحًا خفاء صوت الحرف عند النطق به، صفة ضعيفة، حروفه الهاء وحروف المد الثلاثة (هاوي)؛ وسبب خفاء الهاء اجتماع صفات الضعف فيها وبُعد المخرج، وعلاجه بمد الصلة إذا كانت ضميرًا؛ وسبب خفاء حروف المد أن المخرج مقدر مع سعته، وعلاجه المحافظة على زمن حرف المد ألا يقل عن حركتين حتى لا يفسد المعنى (فسقى لها لا فسق لها)، وبيانه بإطالة زمنه إذا جاء بعده همز.\n(7) الاستطالة: لغةً الامتداد، واصطلاحًا اندفاع اللسان للأمام عند النطق بالحرف نتيجة ضغط الصوت عليه عند اصطدامه بالمخرج، حرفه الضاد، وسميت مستطيلة لأنها تستطيل في مخرجها حتى تتصل بمخرج اللام. والفرق أن الحرف المستطيل يجري الصوت في مخرجه المحقق بقدر طوله بدون أن يتجاوزه، أما الممدود فيجري الصوت في ذاته وينتهي بانقطاع الهواء لأن المخرج مقدر. (8) الغنة: لغةً صوت يخرج من الخيشوم لا عمل للسان فيه، واصطلاحًا صوت أغن مركب في جسم النون والميم مطلقًا، ومخرجها الخيشوم.\nوالنون نصفان: نصف لساني شديد ونصف خيشومي رخو، والميم نصف شفوي شديد ونصف خيشومي رخو، لذا وُضعتا مع حروف التوسط. ومراتب الغنة أربع: أكمل ما تكون في النون والميم المشددتين والمدغمتين (إنَّ، عمَّ، من ولي، من نذير)، ثم كاملة في المخفاتين (الأنثى، ترميهم بحجارة، من بعد)، ثم ناقصة في الساكنتين المظهرتين (أنعمت، العالمين)، ثم أنقص ما تكون في المتحركتين (المؤمنين، نصير). ومقدار الغنة يُضبط بالمشافهة ويختلف زمنها حسب مرتبتها، وتؤدَّى سلسة بدون تمطيط أو تطنين، وتتبع الغنة ما بعدها تفخيمًا وترقيقًا.", "rules": ["الصفير: صوت زائد يشبه صوت الطائر، حروفه ص ز س، ومراتبه: الصاد ثم الزاي ثم السين.", "الانحراف: ميل صوت الحرف، حروفه اللام والراء؛ اللام ينحرف صوتها إلى جانبي طرف اللسان، والراء من الجانبين إلى الوسط.", "التكرير: ارتعاد طرف اللسان، حرفه الراء، ويجب التحرز من المبالغة فيه: مرة واحدة في المخفف ومرتين في المشدد.", "التفشي: انتشار صوت الشين في الفم حتى يتصل بمخرج الظاء؛ درجاته: المشددة ثم الساكنة ثم المتحركة.", "اللين: خروج الحرف بسهولة، حروفه الواو والياء الساكنتان المفتوح ما قبلهما.", "الخفاء: حروفه الهاء وحروف المد الثلاثة (هاوي)؛ علاج خفاء الهاء بمد الصلة، وعلاج خفاء المد بالمحافظة على زمنه.", "الاستطالة: اندفاع اللسان للأمام، حرفها الضاد، وتستطيل في مخرجها حتى تتصل بمخرج اللام.", "الغنة: صوت أغن مركب في جسم النون والميم، مخرجها الخيشوم، ومراتبها: أكمل ما تكون (المشدد والمدغم)، كاملة (المخفى)، ناقصة (الساكن المظهر)، أنقص ما تكون (المتحرك).", "تتبع الغنة ما بعدها تفخيمًا وترقيقًا، وتؤدى سلسة بدون تمطيط أو تطنين."], "examples": [{"word": "الشَّيْطَانِ", "note": "الشين المشددة أعلى درجات التفشي."}, {"word": "الرَّحْمَٰنِ", "note": وعة في:", "options": ["هاوي", "قطب جد", "لن عمر", "فر من لب"], "answer": 0, "why": "حروف الخفاء: الهاء وحروف المد الثلاثة، مجموعة في «هاوي»."}, {"q": "ما حرف الاستطالة؟", "options": ["الظاء", "الضاد", "الشين", "اللام"], "answer": 1, "why": "الاستطالة اندفاع اللسان للأمام عند النطق بالحرف، وحرفها الضاد التي تستطيل في مخرجها حتى تتصل بمخرج اللام."}, {"q": "في أي حالة تكون الغنة «أكمل ما تكون»؟", "options": ["النون والميم المتحركتين", "النون والميم الساكنتين المظهرتين", "النون والميم المشددتين والمدغمتين", "النون والميم المخفاتين"], "answer": 2, "why": "مراتب الغنة: أكمل ما تكون في المشدد والمدغم، ثم كاملة في المخفى، ثم ناقصة في الساكن المظهر، ثم أنقص ما تكون في المتحرك."}, {"q": "لماذا وُضعت النون والميم مع حروف التوسط؟", "options": ["لأنهما مهموستان", "لأن كلًا منهما نصف شديد ونصف خيشومي رخو", "لأنهما من حروف المد", "لأنهما مستعليتان"], "answer": 1, "why": "النون نصف لساني شديد ونصف خيشومي رخو، والميم نصف شفوي شديد ونصف خيشومي رخو، فوضعهما العلماء مع حروف التوسط."}], "level": 1}, {"id": "L1_09", "title": "القلقلة ومراتبها", "bookPages": "من الكتاب ص73-78", "summary": "بعض العلماء وضع القلقلة ضمن الصفات الأصلية، والبعض الآخر وضعها ضمن الصفات العرضية حيث إنها لا تكون في الحرف إلا في حالة السكون فقط. حروف «أجد قط بكت» حروف شديدة ينحبس الصوت عند النطق بها فيسبب انزعاجًا في جهاز النطق، وتنقسم إلى ثلاثة أقسام: الكاف والتاء (شديدة مهموسة)، والهمزة (شديدة مجهورة)، وقطب جد (شديدة مجهورة). وتخلص العرب من هذا الانزعاج بثلاث طرق: الهمس للكاف والتاء، فبعد انحباس الصوت يجري النفس مما يساعد على التخلص؛ والتغيير للهمزة بطرق متعددة: الإبدال (يؤمنون ← يومنون)، والحذف (يستهزءون ← يستهزون)، والنقل (من ءامن ← منَ امن)، والتسهيل (أأعجمي ← ءاعجمي) وهي همزة القطع الوحيدة المسهلة عند حفص؛ ولم تقلقل الهمزة لأنها إذا قلقلت خرجت مثل التقيؤ والسعلة، فأخرجها العرب بلطف ورفق.\nوالقلقلة لحروف «قطب جد». القلقلة لغةً: الاضطراب أو التحريك، واصطلاحًا: اضطراب المخرج عند النطق بالحرف الساكن حتى يُسمع له نبرة قوية. وسببها: اجتماع صفتي الشدة والجهر في هذه الحروف، فعندما تتجلى هاتان الصفتان في حالة السكون يحدث انزعاج في جهاز النطق فتخلص العرب منه بالقلقلة. وآلية حدوثها: التباعد بين طرفي عضو النطق بدون تباعد الفكين ولا ضم الشفتين ولا انخفاض الفك السفلي، فهي ليست بالساكنة المحضة ولا المتحركة المحضة. ومراحل النطق بها: حدوث عائق أمام تيار الهواء فينتج انحباس الصوت والنفس، ثم زيادة ضغط الهواء خلف العائق، ثم انفتاح العائق فجأة فيندفع الهواء محدثًا صوتًا قويًا، مع عدم المبالغة حتى لا يحدث تشديد.\nومراتب القلقلة: مرتبة كبرى في الساكن الموقوف عليه نحو «لم يلد»، ومرتبة صغرى في الساكن غير الموقوف عليه سواء في وسط الكلمة نحو «يقطعون» أو وسط الكلام نحو «لم يلدْ ولم يولد»؛ وذكر البعض ثلاث مراتب باعتبار الوقف على المشدد مرتبة أكبر. قال ابن الجزري: وبينن مقلقلًا إن سكنا، وإن يكن في الوقف كان أبينا. ولا تمال القلقلة إلى فتح أو ضم أو كسر، فلو أملناها للفتح في ﴿لَقَدْ خَلَقْنَا الْإِنسَانَ﴾ لفسد المعنى وصار «لقد خلقَنا الإنسان».\nوموانع القلقلة: الإدغام نحو «قد تبين»، والتقاء الساكنين نحو «ولقد اصطفيناه» إذ تحرك الدال بالكسر، والروم عند الوقف. تنبيهات: مراعاة عدم ظهور صوت الهمز في آخر القلقلة، ومراعاة التفخيم والترقيق نحو «رطب» وقفًا، ومراعاة فرق الزمن بين المقلقل المشدد مثل «وتب» والمخفف مثل «فسق»، وعدم توليد حرف آخر عند الوقف على المقلقل الذي قبله حرف مد (حميد لا حمييد).", "rules": ["القلقلة: اضطراب المخرج عند النطق بالحرف الساكن حتى يُسمع له نبرة قوية، وحروفها «قطب جد».", "سبب القلقلة: اجتماع صفتي الشدة والجهر في حروفها.", "لا تكون القلقلة إلا في حالة السكون، فهي ليست بالساكنة المحضة ولا بالمتحركة المحضة.", "تحدث القلقلة بالتباعد دون فتح الفكين أو ضم الشفتين أو خفض الفك السفلي، فلا تُمال إلى فتح ولا ضم ولا كسر.", "مراتب القلقلة: كبرى في الساكن الموقوف عليه، وصغرى في الساكن غير الموقوف عليه، وذكر بعضهم مرتبة أكبر في المشدد الموقوف عليه.", "موانع القلقلة: الإدغام، والتقاء الساكنين (إذ يتحرك الحرف)، والروم عند الوقف.", "لم تقلقل الهمزة مع شدتها وجهرها لأنها تخرج كالتقيؤ، فتخلص منها العرب بالإبدال والحذف والنقل والتسهيل.", "الكاف والتاء تخلصت العرب من شدتهما بالهمس."], "examples": [{"word": "لَمْ يَلِدْ", "note": "الدال الساكنة الموقوف عليها: قلقلة كبرى."}, {"word": "يَقْطَعُونَ", "note": "القاف الساكنة وسط الكلمة: قلقلة صغرى."}, {"word": "الْحَقُّ", "note": "وقفًا: القاف الأولى ممتنعة القلقلة بسبب الإدغام، والقاف الثانية ساكنة تُقلقل بالتباعد مع عدم ضم الشفتين؛ وصلًا لا قلقلة لأن القاف الثانية مضمومة."}, {"word": "قَد تَّبَيَّنَ", "note": "امتنعت القلقلة في الدال بسبب الإدغام."}, {"word": "وَلَقَدِ اصْطَفَيْنَاهُ", "note": "تحركت الدال بالكسر خشية التقاء الساكنين فامتنعت القلقلة."}, {"word": "لَقَدْ خَلَقْنَا الْإِنسَانَ", "note": "إمالة القلقلة للفتح تفسد المعنى فتصبح «خلقَنا»."}, {"word": "ءَأَعْجَمِيٌّ", "note": "الهمزة الثانية مسهلة بين الهمزة والألف، طريقة من طرق تخلص العرب من شدة الهمزة."}], "commonErrors": ["إمالة القلقلة إلى الفتح أو الكسر أو الضم فتتولد حركة ويفسد المعنى.", "ظهور صوت همز في آخر القلقلة.", "المبالغة في القلقلة حتى يحدث تشديد.", "ترقيق المقلقل المفخم أو تفخيم المرقق، نحو «رطب» وقفًا.", "عدم التفريق في الزمن بين المقلقل المشدد مثل «وتب» والمخفف مثل «فسق».", "توليد حرف مد عند الوقف على المقلقل الذي قبله حرف مد: «حميد» تصبح «حمييد» و«مجيد» تصبح «مجييد».", "قلقلة الحرف المتحرك أو المدغم أو المروم."], "practice": ["لَمْ يَلِدْ وَلَمْ يُولَدْ", "يَقْطَعُونَ ، يَدْخُلُونَ ، أَبْصَارِهِمْ", "الْحَقُّ ، وَتَبَّ", "رُطَبًا ، فَسَقَ", "حَمِيدٌ ، مَجِيدٌ", "لَقَدْ خَلَقْنَا الْإِنسَانَ فِي كَبَدٍ"], "quiz": [{"q": "حروف القلقلة مجموعة في:", "options": ["أجد قط بكت", "قطب جد", "فحثه شخص سكت", "لن عمر"], "answer": 1, "why": "حروف القلقلة خمسة مجموعة في «قطب جد»، وهي حروف شديدة مجهورة."}, {"q": "ما سبب القلقلة في حروفها؟", "options": ["اجتماع الهمس والرخاوة", "اجتماع الشدة والجهر", "اجتماع الاستعلاء والإطباق", "الصفير"], "answer": 1, "why": "سبب القلقلة اجتماع صفتي الشدة والجهر، فعند السكون يحدث انزعاج في جهاز النطق فتخلص العرب منه بالقلقلة."}, {"q": "القلقلة في ﴿لَمْ يَلِدْ﴾ عند الوقف عليها:", "options": ["صغرى", "كبرى", "ممتنعة", "متوسطة"], "answer": 1, "why": "المرتبة الكبرى في الساكن الموقوف عليه نحو الوقف على الدال من «لم يلد»."}, {"q": "لماذا امتنعت القلقلة في ﴿قَد تَّبَيَّنَ﴾؟", "options": ["بسبب الروم", "بسبب التقاء الساكنين", "بسبب الإدغام", "لأن الدال متحركة"], "answer": 2, "why": "الدال أُدغمت في التاء، والإدغام من موانع القلقلة."}, {"q": "هل تُمال القلقلة إلى فتح أو ضم أو كسر؟", "options": ["تمال إلى حركة الحرف الذي قبلها", "تمال إلى الفتح مطلقًا", "لا تمال إلى أي حركة", "تمال إلى الكسر"], "answer": 2, "why": "لا تمال القلقلة إلى أي حركة بل تحدث بالتباعد دون فتح الفكين أو ضم الشفتين أو انخفاض الفك، ولو أُميلت للفتح في «لقد خلقنا الإنسان» لفسد المعنى."}, {"q": "كيف تخلصت العرب من شدة الكاف والتاء؟", "options": ["بالقلقلة", "بالهمس", "بالتسهيل", "بالإبدال"], "answer": 1, "why": "الكاف والتاء تتصفان بالهمس، فبعد انحباس الصوت يجري النفس مما يساعد على التخلص من الانزعاج."}, {"q": "في ﴿ءَأَعْجَمِيٌّ﴾ الهمزة الثانية:", "options": ["محذوفة", "مبدلة ألفًا", "مسهلة بين الهمزة والألف", "منقولة حركتها"], "answer": 2, "why": "التسهيل هو تسهيل الهمزة بين الهمزة والألف، وهذه هي همزة القطع الوحيدة المسهلة عند حفص."}], "level": 1}, {"id": "L1_10", "title": "كيفية استخراج صفات كل حرف وتقسيم الحروف من حيث القوة والضعف", "bookPages": "من الكتاب ص79-80", "summary": "لاستخراج صفات أي حرف نسير على خطوتين: (1) نبدأ بالصفات التي لها ضد، فنجد أن كل حرف له خمس صفات منها، إذ يأخذ من كل زوج صفة واحدة: إما الهمس أو الجهر، وإما الشدة أو التوسط أو الرخاوة، وإما الاستعلاء أو الاستفال، وإما الإطباق أو الانفتاح، وإما الذلاقة أو الإصمات. (2) ننتقل إلى الصفات التي ليس لها ضد ونبحث هل الحرف من حروفها، وهي للبعض وليست للكل. وبذلك نجد أن كل حرف له عدد من الصفات لا ينقص عن خمس ولا يزيد عن ست صفات، إلا الراء فلها سبع صفات (الجهر، التوسط، الاستفال، الانفتاح، الذلاقة، الانحراف، التكرير).\nوتنقسم الصفات من حيث القوة والضعف: الصفات القوية: الجهر، الشدة، الاستعلاء، الإطباق، الغنة، الصفير، التفشي، الانحراف، التكرير، الاستطالة، القلقلة. والصفات المتوسطة: التوسط، الإصمات، الذلاقة. والصفات الضعيفة: الهمس، الرخاوة، الاستفال، الانفتاح، اللين، الخفاء. ووُضعت القلقلة مع الصفات القوية رغم اتباع المذهب القائل بأنها صفة عرضية، لأنها تلازم الحرف حال سكونه والصفة تتجلى في السكون. وتنقسم الحروف من حيث قوة وضعف الصفات إلى خمس درجات: الأقوى: كل صفاتها قوية، وهو حرف الطاء.\nالقوية: صفات القوة فيها أكثر من صفات الضعف: ض، ظ، ص، ق، ر، ج، د، ب. المتوسطة: صفات القوة تساوت مع صفات الضعف: ء، غ، ل، م، ن. الضعيفة: صفات الضعف فيها أكثر من صفات القوة: ت، خ، ذ، ز، س، ش، ك، ع، و، ي (غير المديتين). الأضعف: جميع صفاتها ضعيفة: ف، ح، ث، هـ؛ أو جميع صفاتها ضعيفة إلا واحدة مع وجود مخرج مقدر وذلك في حروف المد. وبهذا تنتهي الرحلة الأولى مع صفات الحروف قبل الانتقال إلى مخارجها.", "rules": ["لاستخراج صفات الحرف: خذ من كل زوج من الأضداد صفة واحدة (خمس صفات)، ثم ابحث في الصفات التي لا ضد لها.", "كل حرف له من الصفات خمس أو ست، إلا الراء فلها سبع صفات.", "الصفات القوية: الجهر، الشدة، الاستعلاء، الإطباق، الغنة، الصفير، التفشي، الانحراف، التكرير، الاستطالة، القلقلة.", "الصفات المتوسطة: التوسط، الإصمات، الذلاقة. والضعيفة: الهمس، الرخاوة، الاستفال، الانفتاح، اللين، الخفاء.", "الطاء هي الحرف الأقوى لأن كل صفاتها قوية.", "الحروف الأضعف: ف، ح، ث، هـ (كل صفاتها ضعيفة)، وحروف المد (كل صفاتها ضعيفة إلا واحدة مع مخرج مقدر)."], "examples": [{"word": "ط (الطَّامَّةُ)", "note": "الطاء: جهر، شدة، استعلاء، إطباق، إصمات، قلقلة؛ كل صفاتها قوية فهي الحرف الأقوى."}, {"word": "ر (الرَّحْمَٰنِ)", "note": "الراء الحرف الوحيد الذي له سبع صفات: جهر، توسط، استفال، انفتاح، ذلاقة، انحراف، تكرير."}, {"word": "ف (فَحَثَّهُ)", "note": "الفاء: همس، رخاوة، استفال، انفتاح، ذلاقة؛ من الحروف الأضعف."}, {"word": "ض (الضَّالِّينَ)", "note": "الضاد: جهر، رخاوة، استعلاء، إطباق، إصمات، استطالة؛ صفات القوة فيها أكثر فهي من الحروف القوية."}], "commonErrors": ["إعطاء الحرف صفتين متضادتين (كأن يقال: الباء مهموسة ومجهورة).", "نسيان الصفات التي لا ضد لها عند استخراج صفات الحرف (مثل نسيان الصفير للصاد أو القلقلة للقاف).", "ظن أن كل الحروف المستعلية في درجة قوة واحدة، والصواب أن الطاء هي الأقوى ثم تتدرج."], "practice": ["الطَّامَّةُ", "الرَّحْمَٰنِ", "فَحَثَّهُ", "الضَّالِّينَ", "قُلْ ، كُلْ"], "quiz": [{"q": "كم صفة يأخذ الحرف من الصفات التي لها ضد؟", "options": ["ثلاث", "أربع", "خمس", "ست"], "answer": 2, "why": "كل حرف يأخذ من كل زوج من الأضداد صفة واحدة فيكون له خمس صفات من الصفات التي لها ضد."}, {"q": "ما الحرف الذي له سبع صفات؟", "options": ["الطاء", "الراء", "الضاد", "النون"], "answer": 1, "why": "كل حرف له من خمس إلى ست صفات إلا الراء فلها سبع صفات لأنها تنفرد بالانحراف والتكرير معًا."}, {"q": "ما الحرف الأقوى الذي كل صفاته قوية؟", "options": ["القاف", "الضاد", "الطاء", "الصاد"], "answer": 2, "why": "الطاء جميع صفاتها قوية: جهر، شدة، استعلاء، إطباق، إصمات، قلقلة؛ فهي الحرف الأقوى."}, {"q": "أي الصفات التالية من الصفات الضعيفة؟", "options": ["الصفير", "التفشي", "اللين", "الغنة"], "answer": 2, "why": "الصفات الضعيفة: الهمس، الرخاوة، الاستفال، الانفتاح، اللين، الخفاء."}, {"q": "لماذا وُضعت القلقلة مع الصفات القوية رغم عدّها صفة عرضية؟", "options": ["لأنها مهموسة", "لأنها تلازم الحرف حال سكونه والصفة تتجلى في السكون", "لأن حروفها قليلة", "لأنها تحدث في المتحرك"], "answer": 1, "why": "وُضعت القلقلة مع الصفات القوية لأنها تلازم الحرف حال سكونه والصفة تتجلى في السكون."}, {"q": "الحروف ف، ح، ث، هـ تُعد:", "options": ["قوية", "متوسطة", "ضعيفة", "أضعف الحروف"], "answer": 3, "why": "هذه الحروف جميع صفاتها ضعيفة فهي في درجة الأضعف، ومعها حروف المد لوجود مخرج مقدر."}], "level": 1}, {"id": "L1_11", "title": "المخرج العام الأول: الجوف", "bookPages": "من الكتاب ص85-87", "summary": "الجوف في اللغة هو الخلاء، وفي الاصطلاح هو الخلاء الواقع داخل الحلق والفم. وهو مخرج عام واحد يخرج منه مخرج خاص واحد، تخرج منه حروف المد الثلاثة: الألف الساكنة المفتوح ما قبلها، والواو الساكنة المضموم ما قبلها، والياء الساكنة المكسور ما قبلها. وصفات هذه الحروف: الجهر، الرخاوة، الانفتاح، الاستفال، الإصمات، الخفاء. ومع اتحاد هذه الحروف في المخرج والصفات فإنها تتميز عن بعضها بكيفية خروج الهواء: فالألف المدية تخرج بالتصاعد (يتصاعد الهواء إلى أعلى عند فتح الفكين) فتخرج امتدادًا لفتحة خالصة بدون إمالة، والواو المدية تخرج بالاعتراض حيث يعترضها ضم الشفتين وهو مخرج الواو غير المدية، والياء المدية تخرج بالتسفل (أي انخفاض الفك السفلي) مع انضغاط وسط اللسان إلى أعلى حيث يساندها مخرج الياء غير المدية.\nويعتبر الجوف مخرجًا عامًا لأن جميع الحروف تمر منه، ومخرجًا خاصًا لأنه مخرج حروف المد. ولحروف المد ستة ألقاب: جوفية (لخروجها من الجوف)، هوائية (لأنها تنتهي بانتهاء الهواء وليس لها حيز معين)، مدية (لامتداد الصوت في يسر ولين)، مقدرة (لأن مخرجها مقدر فتخرج من حيز كبير وتنتهي عنده فقبلت الزيادة والنقص)، حروف علة (لتأوه المريض بها)، حروف خفاء (لأنها تختفي في اللفظ لاتساع مخرجها). ومن الملاحظات المهمة أن المخرج يتسع في الألف أكثر من الواو والياء، وأن الألف تخرج أحيانًا مائلة إلى الياء وتسمى إمالة، وليس لحفص إمالة كبرى إلا في كلمة واحدة هي (مَجْرَاهَا) في سورة هود.\nكما أن الألف المدية لا توصف بتفخيم ولا ترقيق لأنها امتداد وإشباع لحركة ما قبلها فهي تتبعه، بينما الواو والياء المديتان مرققتان دائمًا.", "rules": ["الجوف مخرج عام واحد فيه مخرج خاص واحد لحروف المد الثلاثة (ا، و، ي) بشرط سكونها ومجانسة حركة ما قبلها لها.", "صفات حروف المد: الجهر، الرخاوة، الانفتاح، الاستفال، الإصمات، الخفاء.", "الألف المدية تخرج بالتصاعد، والواو المدية بالاعتراض (ضم الشفتين)، والياء المدية بالتسفل مع انضغاط وسط اللسان إلى أعلى.", "الجوف مخرج عام لأن جميع الحروف تمر منه، ومخرج خاص لأنه مخرج حروف المد.", "ألقاب حروف المد: جوفية، هوائية، مدية، مقدرة، حروف علة، حروف خفاء.", "الألف المدية لا توصف بتفخيم ولا ترقيق بل تتبع ما قبلها، أما الواو والياء المديتان فمرققتان دائمًا.", "ليس لحفص إمالة كبرى إلا في كلمة (مَجْرَاهَا) في سورة هود."], "examples": [{"word": "قَالَ", "note": "ألف مدية ساكنة مفتوح ما قبلها، تخرج بالتصاعد وتتبع القاف المفخمة فتفخم تبعًا"}, {"word": "يَقُولُ", "note": "واو مدية ساكنة مضموم ما قبلها، تخرج بالاعتراض مع ضم الشفتين وهي مرققة"}, {"word": "قِيلَ", "note": "ياء مدية ساكنة مكسور ما قبلها، تخرج بالتسفل وهي مرققة"}, {"word": "السَّمَاءُ", "note": "ألف مدية بعدها همزة، يُحذر من تفخيمها"}, {"word": "مَجْرَاهَا", "note": "الموضع الوحيد لحفص في الإمالة الكبرى (سورة هود)"}], "commonErrors": ["عدم موازنة المدود (التفاوت في مقدار المد بين المواضع المتماثلة).", "إسقاط المد الطبيعي.", "تفخيم الألف إذا أتى بعدها همزة (السماء) أو حرف مفخم (القهار).", "تقليل الألف المدية؛ ولذلك يجب خروجها بالتصاعد مع خفض اللسان.", "عدم تسفل الياء مما ينتج عنه تفخيمها.", "ضغط زائد على الشفتين مما يؤدي إلى خروج صوت الواو مكتومًا.", "توجيه الصوت للخيشوم مما ينتج عنه مصاحبة الغنة لحروف المد."], "practice": ["قَالَ", "كَانَ", "يَقُولُونَ", "نُوحِيهَا", "قِيلَ", "فِيهَا", "السَّمَاءِ", "الْقَهَّارُ", "مَجْرَاهَا"], "quiz": [{"q": "ما تعريف الجوف اصطلاحًا؟", "options": ["الخلاء الواقع داخل الحلق والفم", "أقصى الحلق مما يلي الصدر", "ما بين الشفتين", "وسط اللسان مع الحنك الأعلى"], "answer": 0, "why": "الجوف لغة: الخلاء، واصطلاحًا: الخلاء الواقع داخل الحلق والفم."}, {"q": "كيف تخرج الواو المدية؟", "options": ["بالتصاعد", "بالاعتراض", "بالتسفل", "بالتكرير"], "answer": 1, "why": "الواو المدية تخرج بالاعتراض حيث يعترضها ضم الشفتين، أما الألف فبالتصاعد والياء بالتسفل."}, {"q": "لماذا يعتبر الجوف مخرجًا عامًا؟", "options": ["لأنه أكبر المخارج", "لأن جميع الحروف تمر منه", "لأنه يحتوي على عشرة مخارج", "لأنه مخرج الغنة"], "answer": 1, "why": "يعتبر الجوف مخرجًا عامًا لأن جميع الحروف تمر منه، ومخرجًا خاصًا لأنه مخرج حروف المد."}, {"q": "لماذا سميت حروف المد بالحروف الهوائية؟", "options": ["لأنها تخرج من الأنف", "لأن مخرجها مقدر", "لأنها تنتهي بانتهاء الهواء المصاحب للصوت وليس لها حيز معين", "لتأوه المريض بها"], "answer": 2, "why": "هوائية: لأنها تنتهي بانتهاء الهواء المصاحب للصوت أي ليس لها حيز معين تنتهي إليه."}, {"q": "ما حكم الألف المدية من حيث التفخيم والترقيق؟", "options": ["مفخمة دائمًا", "مرققة دائمًا", "تتبع ما قبلها تفخيمًا وترقيقًا", "مفخمة إذا جاء بعدها حرف استعلاء"], "answer": 2, "why": "الألف المدية عبارة عن امتداد وإشباع لحركة ما قبلها فقط ولا يساندها عمل عضو لذلك تتأثر بما قبلها تفخيمًا وترقيقًا."}, {"q": "في أي كلمة وردت الإمالة الكبرى عند حفص؟", "options": ["مَجْرَاهَا", "السَّمَاءُ", "الْقَهَّارُ", "مُوسَى"], "answer": 0, "why": "ليس لحفص إمالة صغرى مطلقًا وله إمالة كبرى في كلمة واحدة هي (مجراها) في سورة هود."}], "level": 1}, {"id": "L1_12", "title": "المخرج العام الثاني: الحلق (أقصى، وسط، أدنى)", "bookPages": "من الكتاب ص88-96", "summary": "الحلق هو المخرج العام الثاني ويحتوي على ثلاثة مخارج خاصة لستة أحرف: أقصى الحلق (أبعده مما يلي الصدر) وتخرج منه الهمزة والهاء، ووسط الحلق وتخرج منه العين والحاء، وأدنى الحلق (أقربه مما يلي الفم) وتخرج منه الغين والخاء. ولقب هذه الحروف: حروف حلقية لخروجها من الحلق. وتنبيه مهم: الهمزة والهاء تخرجان من أقصى الحلق ولكن فعليًا تكون الهمزة أقرب إلى الصدر من الهاء بنقطة ارتكاز مختلفة، ولكن لصغر المسافة بينهما وُضعتا في مخرج واحد، وكذلك يقال عن العين مع الحاء والغين مع الخاء.\nوتتميز حروف كل مخرج بصفاتها: فالهمزة والهاء اشتركتا في المخرج والاستفال والانفتاح، وانفردت الهمزة بالجهر والشدة، والهاء بالهمس والرخاوة والخفاء؛ فلولا الهمس والرخاوة اللذان في الهاء مع شدة خفائها لكانت همزة، ومن أجل ذلك أبدلت العرب من الهمزة هاء (أرقت الماء: هرقت). والعين والحاء اشتركتا في المخرج والاستفال والانفتاح، وانفردت الحاء بالهمس والرخاوة والعين بالجهر والتوسط، فلولا الجهر وبعض الشدة في العين لكانت حاء. والغين والخاء اشتركتا في المخرج والرخاوة والاستعلاء والانفتاح، وانفردت الغين بالجهر والخاء بالهمس.\nومن القواعد العامة أن حروف الحلق لا يدغم منها شيء إلا للتماثل فقط، وأن جميع الحروف المهموسة إذا جاورت المجهورة يجب بيانها حتى لا تتغير الصفة. ومن المسائل الخاصة: اختلف القراء في (مالِيَهْ هَلَكَ) بين الإظهار والإدغام، ولحفص وجهان: الإظهار مع السكت والإدغام بدون سكت. والعين الساكنة إذا أدغمت بالمتحركة أدغمت بدون كلفة نحو (ما لم تستطع عليه). ومواضع تسهيل همزة القطع الثانية عند حفص: (ءاعجمي) وجوبًا، و(ءالذكرين، ءالله، ءالآن) بوجهين: إبدال همزة الوصل ألفًا مدية تمد ست حركات لزومًا، أو تسهيلها بين الهمزة والألف بدون مد.", "rules": ["الحلق مخرج عام فيه ثلاثة مخارج خاصة: أقصى الحلق (ء، هـ)، وسط الحلق (ع، ح)، أدنى الحلق (غ، خ).", "لقب هذه الحروف: الحروف الحلقية.", "الهمزة: جهر، شدة، استفال، انفتاح، إصمات. الهاء: همس، رخاوة، استفال، انفتاح، إصمات، خفاء.", "العين: جهر، توسط، استفال، انفتاح، إصمات. الحاء: همس، رخاوة، استفال، انفتاح، إصمات.", "الغين: جهر، رخاوة، استعلاء، انفتاح، إصمات. الخاء: همس، رخاوة، استعلاء، انفتاح، إصمات.", "حروف الحلق لا يدغم منها شيء إلا للتماثل فقط.", "جميع الحروف المهموسة إذا جاورت المجهورة يجب بيانها حتى لا تتغير الصفة.", "الهمزة الساكنة يجب تحقيق مخرجها بلطف دون تعسف (المؤمنون)، والحذر من تسهيلها أو غين (تخشى)، أو إعطاء الخاء صفة الشدة.", "تحول الغين الساكنة إلى خاء عند مجاورة حرف مهموس (فاغسلوا، يغشى)."], "practice": ["الْمُؤْمِنُونَ", "ءَأَنتُمْ", "أَرَاكُمْ", "وُجُوهُهُمْ", "يَسْتَهْزِئُ", "عَهْدًا", "الْمُعْتَدِينَ", "مَعَهُمْ", "الْعَالَمِينَ", "فَاصْفَحْ عَنْهُمْ", "فَسَبِّحْهُ", "أَحَطتُ", "أَفْرِغْ عَلَيْنَا", "تَزِغْ", "فَاغْسِلُوا", "تَخْشَى", "اخْتَلَطَ", "الْأَخُ"], "quiz": [{"q": "ما حروف وسط الحلق؟", "options": ["الهمزة والهاء", "العين والحاء", "الغين والخاء", "القاف والكاف"], "answer": 1, "why": "أقصى الحلق: الهمز والهاء، وسط الحلق: العين والحاء، أدنى الحلق: الغين والخاء."}, {"q": "ما الصفة التي انفردت بها الهاء عن الهمزة؟", "options": ["الجهر", "الشدة", "الخفاء", "الاستعلاء"], "answer": 2, "why": "انفردت الهمزة بالجهر والشدة، والهاء بالهمس والرخاوة والخفاء."}, {"q": "ما حكم الإدغام في حروف الحلق؟", "options": ["تدغم في كل ما بعدها", "لا يدغم منها شيء إلا للتماثل فقط", "تدغم مع الحروف الحلقية فقط", "لا تدغم أبدًا"], "answer": 1, "why": "من التنبيهات العامة: حروف الحلق لا يدغم منها شيء إلا للتماثل فقط."}, {"q": "في كلمة (المعتدين) ما الخطأ الشائع؟", "options": ["تفخيم العين", "تحول العين إلى حاء لأن التاء بعدها مهموسة", "قلقلة العين", "إخفاء العين"], "answer": 1, "why": "العين الساكنة إذا جاء بعدها حرف مهموس لا بد من بيان جهرها وتوسطها حتى لا تتحول إلى حاء."}, {"q": "ما الصفة المشتركة بين الغين والخاء التي تميزهما عن باقي حروف الحلق؟", "options": ["الاستعلاء", "الشدة", "الخفاء", "التوسط"], "answer": 0, "why": "الغين والخاء حرفا استعلاء بخلاف باقي حروف الحلق المستفلة."}, {"q": "ما وجها حفص في (ءالذكرين)؟", "options": ["تحقيق الهمزتين أو حذف إحداهما", "إبدال همزة الوصل ألفًا تمد ست حركات، أو تسهيلها بدون مد", "تسهيل الهمزة الأولى أو الثانية", "إدغامهما"], "answer": 1, "why": "في (ءالذكرين، ءالله، ءالآن) لحفص وجهان: إبدال همزة الوصل ألفًا مدية تمد ست حركات لزومًا، أو تسهيلها بين الهمزة والألف مع عدم المد مطلقًا."}], "level": 1}, {"id": "L1_13", "title": "أقصى اللسان: القاف والكاف (الحروف اللهوية)", "bookPages": "من الكتاب ص97-100", "summary": "اللسان هو المخرج العام الثالث، وهو عضو هام يبين الإسلام خطورته حيث تخرج منه معظم الحروف. وللسان أربعة مخارج إجمالية تنقسم إلى عشرة مخارج خاصة يخرج منها ثمانية عشر حرفًا: أقصى اللسان (مخرجان: ق، ك)، وسط اللسان (مخرج واحد: ج، ش، ي)، حافتا اللسان (مخرجان: ض، ل)، طرف اللسان (خمسة مخارج: ن / ر / ط د ت / ص ز س / ظ ذ ث). أقصى اللسان مخرج إجمالي لمخرجين خاصين: القاف تخرج من أقصى اللسان مع ما يحاذيه من الحنك الأعلى من المنطقة الرخوة، والكاف من أقصى اللسان مع ما يحاذيه من الحنك الأعلى من المنطقة القاسية والرخوة معًا.\nويسمى القاف والكاف حرفين لهويين نسبة إلى خروجهما من قرب اللهاة، وهي اللحمة المتدلية من آخر الفم في أقصى الحنك الأعلى. وقد جُعل أقصى اللسان مخرجين خاصين بينما أقصى الحلق مخرج واحد لأن أقصى اللسان فيه طول وبين موضعي القاف والكاف بعد نسبي، أما أقصى الحلق ففيه قصر وبين موضعي الهمزة والهاء قرب شديد. صفات القاف: الجهر، الشدة، الاستعلاء، الانفتاح، الإصمات، القلقلة إن سكنت، وهي حرف قوي. صفات الكاف: الهمس، الشدة، الاستفال، الانفتاح، الإصمات، وهي حرف ضعيف.\nفالقاف يعتنى بما فيها من جهر واستعلاء لئلا تمازج الكاف، والكاف يحترز عن جهرها وعن تأخر مخرجها أو إحداث استعلاء فيها لئلا تلتبس بالقاف. وفي كلمة (نَخْلُقكُّم) في سورة المرسلات اتفق القراء على الإدغام واختلفوا هل هو كامل أم ناقص، وحفص من الشاطبية قرأ بالإدغام الكامل فقط وهو الذي عليه رسم المصحف.", "rules": ["اللسان مخرج عام لأربعة مخارج إجمالية تنقسم إلى عشرة مخارج خاصة يخرج منها 18 حرفًا.", "القاف: أقصى اللسان مع ما يحاذيه من الحنك الأعلى من المنطقة الرخوة.", "الكاف: أقصى اللسان مع ما يحاذيه من الحنك الأعلى من المنطقة القاسية والرخوة معًا.", "لقب القاف والكاف: حرفان لهويان نسبة إلى اللهاة.", "صفات القاف: الجهر، الشدة، الاستعلاء، الانفتاح، الإصمات، القلقلة إن سكنت.", "صفات الكاف: الهمس، الشدة، الاستفال، الانفتاح، الإصمات.", "القاف الساكنة (سكونًا لازمًا أو عارضًا): بيان القلقلة والشدة والجهر وإلا اختلطت بالكاف.", "الكاف الساكنة: بيان الشدة ثم الهمس بدون تراخٍ في الزمن.", "إذا جاورت الكاف القاف وجب بيان كل منهما حتى لا تدغم (لك قصورا، خلق كل شيء).", "في (نخلقكم) قرأ حفص بالإدغام الكامل وهو الذي عليه رسم المصحف."], "examples": [ , "options": ["لأن القاف أقوى من الهمزة", "لأن أقصى اللسان فيه طول وبين القاف والكاف بعد نسبي، وأقصى الحلق فيه قصر", "لأن الكاف مهموسة", "لا فرق بينهما"], "answer": 1, "why": "أقصى اللسان فيه طول وبين موضعي القاف والكاف بعد نسبي، أما أقصى الحلق ففيه قصر وبين الهمزة والهاء قرب شديد."}, {"q": "ما الصفات التي انفردت بها القاف عن الكاف؟", "options": ["الهمس والاستفال", "الجهر والاستعلاء والقلقلة", "الشدة والإصمات", "الرخاوة والانفتاح"], "answer": 1, "why": "القاف: الجهر، الشدة، الاستعلاء، الانفتاح، الإصمات، القلقلة. الكاف: الهمس، الشدة، الاستفال، الانفتاح، الإصمات."}, {"q": "كيف قرأ حفص كلمة (نخلقكم)؟", "options": ["بالإظهار", "بالإدغام الناقص", "بالإدغام الكامل", "بالإخفاء"], "answer": 2, "why": "حفص من الشاطبية قرأ بالإدغام الكامل فقط وهو الذي عليه رسم المصحف."}, {"q": "ما الذي يجب مراعاته عند نطق الكاف الساكنة في (يكسبون)؟", "options": ["قلقلتها", "بيان الشدة ثم الهمس بدون تراخٍ في الزمن", "تفخيمها", "إدغامها في السين"], "answer": 1, "why": "الكاف الساكنة: بيان الشدة ثم الهمس بدون تراخٍ في الزمن."}], "level": 1}, {"id": "L1_14", "title": "وسط اللسان: الجيم والشين والياء (الحروف الشجرية)", "bookPages": "من الكتاب ص101-105", "summary": "وسط اللسان مخرج إجمالي لمخرج خاص واحد وهو: وسط اللسان مع ما يحاذيه من الحنك الأعلى، وتخرج منه ثلاثة أحرف: الجيم والشين والياء غير المدية. ولقبها: حروف شجرية نسبة لخروجها من شجر الفم، وشجر الفم هو ما انفتح من منطبق الفم. ملحوظة هامة: هذا المخرج هو مخرج الياء المتحركة واللينة، ولكن في حالة الياء اللينة يساندها مخرج الجوف لإعطاء مد اللين حال الوقف، أما حال الوصل فهي حرف لين يمد مدًا دون الطبيعي ويضبط بالمشافهة. صفات الجيم: الجهر، الشدة، الاستفال، الانفتاح، الإصمات، القلقلة إن سكنت، وهي حرف قوي.\nصفات الشين: الهمس، الرخاوة، الاستفال، الانفتاح، الإصمات، التفشي، وهي ضعيفة. صفات الياء غير المدية: الجهر، الرخاوة، الاستفال، الانفتاح، الإصمات، وإن كانت لينة يزاد عليها صفة اللين. اشتركت هذه الحروف مخرجًا وانفتاحًا واستفالًا، وانفردت الجيم بالشدة واشتركت مع الياء في الجهر، وانفردت الشين بالهمس والتفشي واشتركت مع الياء في الرخاوة. فالجيم يعتنى بجهرها وشدتها وإلا صارت شينًا، والشين يعتنى برخاوتها وهمسها وتفشيها وإلا صارت جيمًا.\nومن أهم ما يراعى: الجيم الساكنة تعطى صفاتها حتى لا تتحول إلى شين (اجتمعوا)، والجيم المشددة يجب بيانها وتكرير الجهر والشدة فيها لقوتها (حاجتم)، والشين المشددة يجب إشباع التفشي بدون أن يتحول إلى صفير (الشاكرين)، والياء المشددة المتطرفة الموقوف عليها يجب تشديدها بالنبر لأن المشدد يخفى عند الوقف عليه (الحي، بمصرخي)، والياء المتحركة التي بعدها ياء ساكنة محذوفة خطًا يجب إشباع حركتها بدون زيادة أو اختلاس (لا يستحيي، أن).", "rules": ["وسط اللسان مع ما يحاذيه من الحنك الأعلى: مخرج واحد لثلاثة أحرف: ج، ش، ي غير المدية.", "لقبها: حروف شجرية لخروجها من شجر الفم (ما انفتح من منطبق الفم).", "الجيم: جهر، شدة، استفال، انفتاح، إصمات، قلقلة إن سكنت. الشين: همس، رخاوة، استفال، انفتاح، إصمات، تفشي. الياء: جهر، رخاوة، استفال، انفتاح، إصمات (ولين إن كانت لينة).", "الجيم الساكنة تعطى صفاتها حتى لا تتحول إلى شين، والجيم المشددة يكرر فيها الجهر والشدة.", "الشين المشددة يشبع فيها التفشي بدون أن يتحول إلى صفير، والشين الساكنة يظهر تفشيها.", "الجيم والشين مرققتان دائمًا ويحذر من تفخيمهما بجوار الراء أو الألف أو حرف مفخم.", "الياء المشددة المتطرفة الموقوف عليها تشدد بالنبر لأن المشدد يخفى عند الوقف عليه.", "الياء اللينة يساندها الجوف لإعطاء مد اللين حال الوقف فقط."], "examples": [{"word": "اجْتَمَعُوا", "note": "جيم ساكنة: إعطاؤها صفاتها حتى لا تتحول إلى شين"}, {"word": "رِجْسًا", "note": "جيم ساكنة بعدها حرف مهموس (س): تحقيق الجهر والشدة والقلقلة حتى لا تختلط بالشين"}, {"word": "حَاجَجْتُمْ", "note": "جيم مشددة أو مكررة: بيانها وتكرير الجهر والشدة فيها"}, {"word": "فَاجْتَبَاهُ", "note": "جيم مجاورة للتاء: تعمد بيانها حتى لا تتحول إلى شين لما بين التاء والشين من همس"}, {"word": "الشَّاكِرِينَ", "note": "شين مشددة: إشباع التفشي بدون أن يتحول إلى صفير"}, {"word": "يَشْرِبُونَ", "note": "شين ساكنة: إظهارها وبيان تفشيها"}, {"word": "شَجَرَ بَيْنَهُمْ", "note": "شين بعدها جيم: بيان لفظها وتفشيها وهمسها حتى لا تختلط مع الجيم لاتحادهما في المخرج"}, {"word": "الرُّشْدُ", "note": "الوقف على الرشد: بيان التفشي حتى لا يسبق ا
