جوفُ مخرجَ الياء اللينة؟", "options": ["حال الوصل", "حال الوقف لإعطاء مد اللين", "دائمًا", "أبدًا"], "answer": 1, "why": "في حالة الياء اللينة يساندها مخرج الجوف لإعطاء مد اللين حال الوقف، أما حال الوصل فهي حرف لين يمد دون الطبيعي ويضبط بالمشافهة."}], "level": 1}, {"id": "L1_15", "title": "حافتا اللسان: الضاد واللام", "bookPages": "من الكتاب ص106-110", "summary": "حافتا اللسان مخرج إجمالي لمخرجين خاصين لحرفين هما الضاد واللام. ولفهم مخرجهما لا بد من معرفة تقسيم الأسنان: الثنايا 4، الرباعيات 4، الأنياب 4 (مجموع الأسنان 12)، والضواحك 4، الطواحن 12، النواجذ 4 (مجموع الأضراس 20)، فالمجموع 32. مخرج الضاد: ما بين حافتي اللسان مع ما يليها من الصفحة الداخلية للأضراس العليا يمينًا ويسارًا. صفاتها: الجهر، الرخاوة، الاستعلاء، الإطباق، الإصمات، الاستطالة، وهي حرف قوي ولقبها شجري لخروجها من الحافتين معًا.\nوتعتبر الضاد من أصعب الحروف وأشدها على اللسان ولا توجد في لغة غير العربية ولذلك تسمى لغة الضاد. وكيفية خروجها: الضاد الساكنة تخرج بالتصادم فتتقفل حافتا اللسان من أقصاها لأدناها على ما يليها من الصفحة الداخلية للأضراس العليا يمينًا ويسارًا انتقالًا تامًا وينضغط الهواء ولا يجد له مخرجًا فيندفع اللسان إلى الأمام ويستمر صوت الضاد حتى ينتهي هذا الاندفاع، واستمرار الصوت هو الرخاوة وتحرك اللسان هو الاستطالة، ولا يوجد في اللغة صوت يستمر بتحرك المخرج إلا الضاد.\nأما الضاد المتحركة فتخرج بالتباعد بين طرفي عضو النطق. ويتفاضل الناس في نطقها: فمنهم من يخرجها ممزوجة بالطاء (أهل مصر والمغرب)، ومنهم من يخرجها دالًا مفخمة، ومنهم من ينطقها ظاء خالصة وهذا لا يجوز لمخالفته للمعاني (الضالين لا الظالين)، ومنهم من يخرجها لامًا مطبقة. وسبب انحرافها إلى ظاء: الاعتماد على رأس اللسان بدلًا من حافتيه مع المبالغة في الاستطالة، وإلى دال: الاعتماد على طرف اللسان. مخرج اللام: ما بين أدنى حافتي اللسان إلى منتهى الطرف مع ما يحاذيها من لثة الضاحكين والنابين والرباعيتين والثنايا العليا.\nصفاتها: الجهر، التوسط، الاستفال، الانفتاح، الذلاقة، الانحراف، وهي حرف متوسط ولقبها ذلقي لخروجها من طرف اللسان. ومن الفروق اللطيفة أن لام التعريف تدغم في النون (الناس) لأن سكونها أصلي فتكون مهيأة للإدغام، بخلاف لام الفعل (أرسلنا) قة، الانحراف."}, {"q": "لماذا تدغم لام التعريف في النون (الناس) ولا تدغم لام الفعل (أرسلنا)؟", "options": ["لأن لام الفعل مفخمة", "لأن سكون لام التعريف أصلي وسكون لام الفعل عارض", "لأن لام التعريف ضعيفة", "لا فرق بينهما"], "answer": 1, "why": "لام التعريف سكونها أصلي فتكون مهيأة للإدغام، أما لام الفعل فسكونها عارض، كما أن لام التعريف زائدة وغيابها لا يؤثر على أصل الكلمة."}], "level": 1}, {"id": "L1_16", "title": "طرف اللسان: النون والراء (الحروف الذلقية)", "bookPages": "من الكتاب ص111-114", "summary": "طرف اللسان هو المخرج الإجمالي الرابع من اللسان ويتفرع إلى خمسة مخارج خاصة لأحد عشر حرفًا. وينقسم طرف اللسان إلى قسمين: طرف مستدير (الذلق) وتخرج منه الحروف الذلقية والنطعية واللثوية، وطرف مستدق وتخرج منه الحروف الأسلية. والمخارج الخمسة مرتبة حسب الترتيب الجزري: النون (المخرج الخاص الأول)، الراء (الثاني)، ط د ت (الثالث)، ص ز س (الرابع)، ظ ذ ث (الخامس). مخرج النون: طرف اللسان مع ما يحاذيه من لثة الثنايا العليا تحت مخرج اللام مع اشتراك الخيشوم لخروج الغنة.\nصفاتها: الجهر، التوسط، الاستفال، الانفتاح، الإذلاق، الغنة، وهي حرف متوسط ولقبها ذلقي. وفي قوله تعالى (مالك لا تأمنا) بسورة يوسف وجهان: الإشمام مع الإدغام، والاختلاس مع الإظهار. وتختلف حالات النون من حيث المخرج والغنة: الساكنة المظهرة والمتحركة غنتها ناقصة، والمشددة والمدغمة في نفسها غنتها أكمل ما تكون، والمدغمة في غيرها ينتقل مخرجها إلى مخرج الحرف المدغم فيه (بغنة مع م و ي، وبدون غنة مع ل ر)، والمخفاة ينتقل مخرجها إلى قرب مخرج الحرف المخفى عنده بغنة كاملة، والمقلبة ينتقل مخرجها إلى مخرج الميم مع ملاحظة إطباق الشفتين بدون كز بغنة كاملة.\nمخرج الراء: طرف اللسان قريب إلى ظهره أدخل من مخرج النون مع ما يحاذيه من لثة الثنايا العليا. صفاتها: الجهر، التوسط، الاستفال، الانفتاح، الذلاقة، التكرير، الانحراف، وهي حرف قوي. ومن أهم ما يراعى في الراء: الساكنة يجب إظهارها وعدم قلقلتها وإعطاؤها صفة التوسط، والمشددة تؤدى بيسر بدون تكرير، وعند التفخيم يحذر من ترقيقها خاصة إذا أتى بعدها حرف همس واستفال، وعند الترقيق يحذر من التفخيم عند الراء المشددة المرققة وضياع التشديد، وعند الوقف عليها يجب بيانها مع صفاتها لأنها حرف مستعص على اللسان.", رير", "تؤدى بيسر بدون تكرير", "قلقلتها", "ترقيقها دائمًا"], "answer": 1, "why": "الراء المشددة تؤدى بيسر بدون تكرير."}, {"q": "إلى أين ينتقل مخرج النون المقلبة؟", "options": ["إلى الخيشوم فقط", "إلى مخرج الميم مع ملاحظة إطباق الشفتين بدون كز", "إلى مخرج الباء", "لا ينتقل"], "answer": 1, "why": "النون المقلبة ينتقل مخرجها إلى مخرج الميم مع ملاحظة إطباق الشفتين بدون كز حتى تكون ميمًا مخفاة، بغنة كاملة."}], "level": 1}, {"id": "L1_17", "title": "الحروف النطعية: الطاء والدال والتاء", "bookPages": "من الكتاب ص115-118", "summary": "مخرج الحروف النطعية: من ظهر طرف اللسان مع أصول الثنايا العليا، وتخرج منه ثلاثة أحرف: الطاء والدال والتاء، ولقبها نطعية لخروجها من نطع غار الحنك الأعلى. صفات الطاء: الجهر، الشدة، الاستعلاء، الإطباق، الإصمات، القلقلة إن سكنت، وهي أقوى الحروف. صفات الدال: الجهر، الشدة، الاستفال، الانفتاح، الإصمات، القلقلة إن سكنت، وهي قوية. صفات التاء: الهمس، الشدة، الاستفال، الانفتاح، الإصمات، وهي ضعيفة. اشتركت هذه الحروف في المخرج وانفردت الطاء بالاستعلاء والإطباق والتفخيم، فلولا ذلك لكانت دالًا؛ ولولا الاستفال والانفتاح في التاء لكانت طاء؛ ولولا الجهر في الدال لكانت تاء ولولا الهمس في التاء لكانت دالًا، لذلك نجد كثيرًا من الناس يلفظ بالدال تاء في (مالك يوم الدين).\nفالطاء يعتنى ببيان إطباقها واستعلائها لئلا تلتبس بالدال، كما يحترز عن إحداث همس فيها لئلا تلتبس بالتاء. والدال يتحفظ بجهرها لئلا يشوبها لفظ التاء. والتاء يحترز عن إعمال أقصى اللسان معها لئلا تصير طاء ويتحرز من جهرها لئلا تصير دالًا. ومن التنبيهات: الطاء دائمًا وخاصة إذا بعدها ألف يعتنى بتفخيمها (الطامة، طالوت)، والطاء الساكنة التي بعدها تاء تدغم فيها إدغامًا ناقصًا حيث تبقى صفة الإطباق لقوة الطاء ولئلا تشتبه بالتاء (بسطت، فرطت، أحطت)، والدال الساكنة سكونًا لازمًا أو عارضًا لا بد من بيانها وقلقلتها وإلا عادت تاء، والتاء الساكنة التي بعدها ط أو د يجب إدغامها الكامل، والتاء المتحركة بعدها حرف مطبق يراعى عدم إخفائها مع ضرورة تحقيق شدتها لأن التاء ضعيفة والسكون يزيد من ضعفها فقد تتحول إلى حرف رخو مثل السين.\nوإدغام الحروف النطعية: تدغم التاء في الطاء إدغامًا كاملًا (لأن الضعيف يدغم في القوي) نحو (ودت طائفة)، وتدغم الطاء في التاء إدغامًا ناقصًا (أحطت)، وتدغم كل من الدال في مثلها والتاء في مثلها والدال في التاء بدون كلفة (ووعدتكم، قد تبين، فلما أثقلت دعوا).", "rules": ["مخرج الحروف النطعية: من ظهر طرف اللسان مع أصول الثنايا العليا (ط، د، ت).", "الطاء: جهر، شدة، استعلاء، إطباق، إصمات، قلقلة إن سكنت (أقوى الحروف). الدال: جهر، شدة، استفال، انفتاح، إصمات، قلقلة إن سكنت. التاء: همس، شدة، استفال، انفتاح، إصمات.", "الطاء تفخم دائمًا ويعتنى بإطباقها خاصة إذا بعدها ألف أو تكررت.", "الطاء الساكنة بعدها تاء: إدغام ناقص تبقى معه صفة الإطباق (بسطت، فرطت، أحطت).", "الدال الساكنة سكونًا لازمًا أو عارضًا: بيانها وقلقلتها وإلا عادت تاء.", "التاء الساكنة بعدها طاء أو دال: وجوب الإدغام الكامل مع مراعاة قوة الطاء (ودت طائفة، أثقلت دعوا).", "التاء المتكررة: وجوب الإظهار لا سيما إن تكررت ثلاث مرات (تتوفاهم).", "التاء الساكنة بعدها حرف من حروف المعجم: مراعاة عدم إخفائها مع تحقيق شدتها حتى لا تتحول إلى سين (فتنة).", "التاء المتحركة بعدها دال: بيانها حتى لا تصير دالًا لاشتراك المخرج مع قوة الدال (اعتدنا).", "إدغام الحروف النطعية: الضعيف يدغم في القوي إدغامًا كاملًا، والقوي في الضعيف إدغامًا ناقصًا."], "examples": [{"word": "الطَّامَّةُ", "note": "طاء بعدها ألف: الاعتناء بتفخيمها وإعطائها الإطباق"}, {"word": "شَطَطًا", "note": "طاء متكررة: الاعتناء بتفخيمها لصعوبة تكرر حرف مطبق مستعل"}, {"word": "بَسَطتَ", "note": "طاء ساكنة بعدها تاء: إدغام ناقص تبقى معه صفة الإطباق"}, {"word": "أَحَطتُ", "note": "إدغام الطاء في التاء إدغامًا ناقصًا للمحافظة على قوة الطاء"}, {"word": "اضْطُرَّ", "note": "طاء قبلها ضاد: التحفظ ببيان الطاء لأنها مبدلة عن التاء فيميل اللسان إلى الأصل"}, {"word": "اصْطَفَى", "note": "أصلها (اصتفى): بيان الطاء"}, {"word": "الْقِسْطَ", "note": "طاء ساكنة سكونًا عارضًا عند الوقف: بيان قلقلتها وإطباقها وجهرها"}, {"word": "مَن يَرْتَدَّ", "note": "دال ساكنة: بيانها وقلقلتها وإلا عادت تاء"}, {"word": "الْعَدْلَ", "note": "دال ساكنة: بيان شدتها وجهرها لئلا تخفى"}, {"word": "قَدْ نَرَى", "note": "دال ساكنة بعدها نون مجهورة: بيانها لاشتراكهما في الجهر"}, {"word": "مُزْدَجَرٌ", "note": "دا دها تاء تدغم فيها إدغامًا ناقصًا حيث تبقى صفة الإطباق لقوة الطاء."}, {"q": "ما حكم التاء الساكنة إذا جاء بعدها طاء نحو (ودت طائفة)؟", "options": ["الإظهار", "الإدغام الكامل", "الإدغام الناقص", "الإخفاء"], "answer": 1, "why": "تدغم التاء في الطاء إدغامًا كاملًا لأن الأصل في الإدغام أن الضعيف يدغم في القوي."}, {"q": "ما أقوى الحروف الهجائية؟", "options": ["الضاد", "الطاء", "القاف", "الصاد"], "answer": 1, "why": "الطاء: أقوى الحروف لجمعها الجهر والشدة والاستعلاء والإطباق والقلقلة."}, {"q": "لماذا يجب التحفظ ببيان الطاء في (اضطر)؟", "options": ["لأنها مبدلة عن التاء فيميل اللسان إلى الأصل", "لأنها ساكنة", "لأنها بعدها راء", "لأنها مفخمة"], "answer": 0, "why": "الطاء في (اضطر، اصطفى) مبدلة عن التاء فيميل اللسان إلى الأصل، فيجب التحفظ ببيانها."}], "level": 1}, {"id": "L1_18", "title": "الحروف الأسلية: الصاد والزاي والسين", "bookPages": "من الكتاب ص119-123", "summary": "مخرج الحروف الأسلية: ما بين طرف اللسان وبين الثنايا العليا والسفلى قريب إلى السفلى، أو: من منتهى طرف اللسان وفويق الثنايا السفلى، وتخرج منه ثلاثة أحرف: الصاد والزاي والسين. ولقبها أسلية لخروجها من أسلة اللسان (الطرف المستدق). وكيفية تطبيق المخرج: تخرج الحروف الأسلية بوضع رأس اللسان عند الصفحة الداخلية للثنايا السفلى، فيخرج الصوت من الرئتين ويصعد من الحنجرة ثم إلى الفم ثم يندفع إلى الخارج فيمر من فوق الثنايا السفلى ويصطدم بالصفحة الداخلية للثنايا العليا.\nصفات الصاد: الهمس، الرخاوة، الاستعلاء، الإطباق، الإصمات، الصفير، وهي حرف قوي. صفات الزاي: الجهر، الرخاوة، الاستفال، الانفتاح، الإصمات، الصفير، وهي ضعيفة. صفات السين: الهمس، الرخاوة، الاستفال، الانفتاح، الإصمات، الصفير، وهي ضعيفة. اشتركت هذه الحروف في المخرج والرخاوة والإصمات والصفير: فلولا الإطباق والاستعلاء في الصاد لصارت سينًا، ولولا الجهر في الزاي لصارت سينًا، ولولا الإطباق والاستعلاء والهمس في الصاد لصارت زايًا. فالصاد يتحفظ بإطباقها واستعلائها وإلا صارت سينًا، ويتحرز من إحداث جهر بها وإلا صارت زايًا مفخمة.\nوالزاي يتحفظ بجهرها لئلا تصير سينًا. والسين يتحرز من إعمال أقصى اللسان معها لئلا تصير صادًا كما يتحرز من جعلها مجهورة لئلا تصير زايًا، وينبغي بيان صفيرها لضعفها لأن صفير الصاد بُيّن بالإطباق وصفير الزاي بُيّن بالجهر. ومن التنبيهات: الصاد الساكنة بعدها دال (يصدر، أصدق) يحافظ على بيانها مع إطباقها حتى لا تختلط بالزاي لاتحادهما في المخرج، والصاد بعدها طاء (يصطرخون) يعتنى بإطباقها وإلا صارت زايًا، والصاد بعدها أو قبلها تاء (حرصتم) بيان إطباقها وإلا جعلت سينًا.\nوالزاي الساكنة بعدها مهموس أو مجهور (كنزتم، تزدري) بيان جهرها حتى لا تتحول إلى سين. والسين بعدها جيم (المسجد) يجب بيان همسها لأن أكثر خطأ هو أنها تقلب زايًا، والسين بعدها تاء (يستمعون) بيان همسها حتى لا تنقلب زايًا، والسين إذا جاورت حرف استعلاء أو راء (وسطا، القسطاس، أسرى) الاعتناء بترقيقها وإلا صارت صادًا.", "rules": ["مخرج الحروف الأسلية: ما بين طرف اللسان وبين الثنايا العليا والسفلى قريب إلى السفلى (ص، ز، س).", "الصاد: همس، رخاوة، استعلاء، إطباق، إصمات، صفير. الزاي: جهر، رخاوة، استفال، انفتاح، إصمات، صفير. السين: همس، رخاوة، استفال، انفتاح، إصمات، صفير.", "الصاد يتحفظ بإطباقها واستعلائها وإلا صارت سينًا، ويتحرز من جهرها وإلا صارت زايًا مفخمة.", "الزاي يتحفظ بجهرها لئلا تصير سينًا، خاصة إذا جاء بعدها تاء أو دال أو جيم.", "السين يتحرز من إعمال أقصى اللسان معها لئلا تصير صادًا، ومن جهرها لئلا تصير زايًا.", "السين بعدها جيم أو تاء: يجب بيان همسها حتى لا تنقلب زايًا.", "السين المجاورة لحرف استعلاء أو راء: الاعتناء بترقيقها وإلا صارت صادًا.", "السين في كلمة على وزن كلمة بالصاد (أسروا/أصروا): الاهتمام ببيانها أكد خوف التباس المعنى.", "الصاد الساكنة بعدها دال: بيانها مع إطباقها حتى لا تختلط بالزاي."], "examples": [{"word": "يَصْدُرُ", "note": "صاد ساكنة بعدها دال: المحافظة على بيانها مع إطباقها حتى لا تختلط بالزاي لاتحادهما في المخرج"}, {"word": "أَصْدَقُ", "note": "صاد ساكنة بعدها دال: صفات الزاي أقرب إلى الدال من الصاد فيحافظ على الصاد"}, {"word": "يَصْطَرِخُونَ", "note": "صاد بعدها طاء: الاعتناء بإطباقها وإلا صارت زايًا"}, {"word": "حَرَصْتُمْ", "note": "صاد بعدها تاء: بيان إطباقها وإلا جعلت سينًا لأن السين أقرب إلى التاء من الصاد"}, {"word": "كَنَزْتُمْ", "note": "زاي ساكنة بعدها تاء مهموسة: بيان جهرها حتى لا تتحول إلى سين"}, {"word": "تَزْدَرِي", "note": "ز  وهو من الأخطاء الشائعة، والظاء الساكنة التي بعدها تاء (أوعظت) يجب بيانها حتى لا تقترب من الإدغام وهي كلمة واحدة في القرآن، ويجب عدم خلط الظاء بالذال أو الضاد فيتغير المعنى (محظورا لا محذورا، الظالين لا الضالين).\nوالذال: بعدها حرف مفخم (ذرهم) الاعتناء بترقيقها حتى لا تصير ظاء، والذال الساكنة بعدها مثلها (إذ ذهب) وجب الإدغام، والذال الساكنة بعدها ظاء (إذ ظلموا، إذ ظلمتم) وجب الإدغام وهي في موضعين فقط، والذال بعدها نون أو تاء (فنبذناه، اتخذتم) يجب بيانها وإلا أدغمت فيها، والذال بعدها ألف (والذاريات) العناية بترقيقها حتى لا تصبح ظاء بدون مبالغة حتى لا تتحول إلى ثاء، والذال حيث وقعت (أعوذ) الاعتناء برخاوتها حتى لا تخرج دالًا وهذا خطأ شائع.\nوالثاء: إذا جاورت راء أو ألفًا أو حرفًا مستعليًا (ءاثرك، الثرى، ثالث، أثخنتموهم) الاعتناء بترقيقها، والمتكررة (ثالث ثلاثة) يجب بيانها خوفًا من الإخفاء، ويحذر من إبدالها تاءً أو سينًا وهذا لحن جلي (لابثين).", "rules": ["مخرج الحروف اللثوية: من ظهر طرف اللسان مع أطراف الثنايا العليا (ظ، ذ، ث).", "الظاء: جهر، رخاوة، استعلاء، إطباق، إصمات. الذال: جهر، رخاوة، استفال، انفتاح، إصمات. الثاء: همس، رخاوة، استفال، انفتاح، إصمات.", "لولا الاستعلاء والإطباق لكانت الظاء ذالًا والعكس صحيح.", "الخطأ في الوضع: إخراج جزء كبير من اللسان (تكلف)، أو وضع رأس اللسان قريبًا من اللثة (خطأ).", "الظاء المجاورة للضاد: بيان كل منهما بتحقيق المخرج جيدًا (أنقض ظهرك).", "الظاء الساكنة بعدها تاء (أوعظت): بيانها حتى لا تقترب من الإدغام، وهي كلمة واحدة في القرآن.", "الذال الساكنة بعدها مثلها أو ظاء: وجوب الإدغام (إذ ذهب، إذ ظلموا، إذ ظلمتم في موضعين فقط).", "الذال بعدها نون أو تاء: يجب بيانها وإلا أدغمت فيها (فنبذناه، اتخذتم).", "الذال حيث وقعت: الاعتناء برخاوتها حتى لا تخرج دالًا.", "الثاء: الاعتناء بترقيقها بجوار الراء والألف والمستعلي، وبيانها عند التكرار، والحذر من إبدالها تاء أو سينًا."], "examples": [{"word": "أَنقَضَ ظَهْرَكَ", "note": "ظاء مجاورة للضاد: بيان كل منهما بتحقيق المخرج جيدًا حتى لا يختلطان"}, {"word": "يَعَضُّ الظَّالِمُ", "note": "ضاد ثم ظاء: تحقيق مخرج كل منهما"}, {"word": "أَوَعَظتَ", "note": "ظاء ساكنة بعدها تاء: يجب بيانها حتى لا تقترب من الإ روج الغنة. ملحوظة: مخرج الواو هذا هو مخرج الواو المتحركة واللينة، ولكن في حالة الواو اللينة يساندها مخرج الجوف لإعطاء مد اللين حال الوقف، أما حال الوصل فهي حرف لين يمد دون الطبيعي ويضبط بالمشافهة.\nصفات الفاء: الهمس، الرخاوة، الاستفال، الانفتاح، الذلاقة، وهي من أضعف الحروف. صفات الواو غير المدية: الجهر، الرخاوة، الاستفال، الانفتاح، الإصمات، اللين إن كانت لينة، وهي ضعيفة. صفات الباء: الجهر، الشدة، الاستفال، الانفتاح، الذلاقة، القلقلة إن سكنت، وهي حرف قوي. صفات الميم: الجهر، التوسط، الاستفال، الانفتاح، الذلاقة، الغنة، وهي متوسطة. ملاحظات: الباء أخت الميم في المخرج فلولا الغنة التي في الميم مع جريان بعض الصوت لكانت باء، والميم أخت النون في الغنة التي تخرج من الخيشوم والجهر لذلك أبدلت العرب إحداهما من الأخرى (الندى والمدى).\nوإذا أتت ميم ساكنة وبعدها باء في كلمتين اختلف أهل الأداء بين الإظهار والإخفاء وذهب ابن الجزري إلى إخفائه (لكم به، يعتصم بالله). ومن أهم التنبيهات: الفاء المجاورة للواو والميم (تلقف ما، لا تخف ولا) يجب بيانها لتآلفها ولأنها ضعيفة مهموسة رخوة، والفاء بعدها ألف أو حرف استعلاء أو راء (فاكهين، فخرج، الغفار) مراعاة ترقيقها. والواو المضمومة أو المكسورة (تفاوت، لكل وجهة) وجب بيانها وبيان حركتها حتى لا يخالفها لفظ غيرها مثل الهمزة، والواو المضمومة وبعدها واو (ووري) البيان آكد لثقلها، والواو اللينة وبعدها متحركة (عصوا وقالوا) وجب الإدغام مع إظهار التشديد، والواو المشددة (لووا، أفوض) بيان التشديد بقوة بالنبر، والواو المتحركة وبعدها واو ساكنة محذوفة رسمًا (داود، فأووا) إشباع حركتها مع الإتيان بالواو الممكنة، والواو التي جاورت مفخمًا (والله، التقوى، ورزقكم) الحذر من تفخيمها.\nوالباء الساكنة (فارغب، لهب) بيان جهرها وشدتها مع القلقلة، والباء بعدها حرف خفي أو ضعيف (بهم، بالغ) الحذر من ذهاب شدتها عند الترقيق، والباء عند الفاء والميم (يغلب فسوف، يعذب من) إظهار شدتها وجهرها وقلقلتها والحذر من الإدغام. والميم الساكنة بعدها فاء أو واو (وهم فيها، هم وأزواجهم) التأكد من إظهارها ساكنة مع إعطائها التوسط مع الغنة الناقصة خشية الإخفاء، والميم المتحركة (مخمصة) الحذر من التفخيم لا سيما إن كان بعدها مفخم، والميم بعدها ألف (مالك) الحذر من التفخيم.", "rules": ["الشفتان مخرج عام لم الميم مع ملاحظة إطباق الشفتين بدون كز حتى تكون ميمًا مخفاة بغنة كاملة.\nوكذلك الميم: الساكنة المظهرة قبل الفاء والواو تعطى التوسط مع الغنة الناقصة، والمدغمة في مثلها غنتها أكمل ما تكون، والمتكررة يجب بيانها جميعًا وإن كان يوجد تشديد يراعى مرتبة الغنة. ومن الأخطاء المتعلقة بالخيشوم: توجيه الصوت إلى الخيشوم عند نطق حروف المد مما ينتج عنه مصاحبة الغنة لها، وتسرب الغنة إلى اللام الساكنة قبل النون (جعلنا)، وإعطاء الواو والياء غنة عند الإدغام الكامل بدونها. والتدريب العملي لاكتشاف الغنة: إمساك الأنف عند نطق النون أو الميم المشددة فإن انحبس الصوت فالغنة صحيحة الخروج من الخيشوم.", "rules": ["الخيشوم هو المخرج العام الخامس ويخرج منه صفة الغنة الملازمة للنون والميم.", "الغنة صفة لا حرف، ولا تخرج إلا مع النون والميم.", "النون والميم يشترك الخيشوم في إخراجهما مع مخرجهما الأصلي.", "الميم أخت النون في الغنة والجهر، ولذلك أبدلت العرب إحداهما من الأخرى (الندى والمدى).", "النون الساكنة المظهرة والمتحركة: غنة ناقصة.", "النون والميم المشددتان والمدغمتان في نفسهما: غنة أكمل ما تكون.", "النون المدغمة في غيرها: بغنة كاملة مع (م، و، ي)، وبدون غنة مع (ل، ر).", "النون المخفاة والمقلبة: غنة كاملة مع انتقال المخرج.", "الحذر من توجيه الصوت إلى الخيشوم في حروف المد أو غيرها من الحروف."], "examples": [{"word": "إِنَّ", "note": "نون مشددة: غنة أكمل ما تكون من الخيشوم"}, {"word": "ثُمَّ", "note": "ميم مشددة: غنة أكمل ما تكون"}, {"word": "مِن مَّاءٍ", "note": "نون ساكنة مدغمة في الميم بغنة كاملة، ينتقل مخرجها إلى الميم"}, {"word": "مِن رَّبِّهِمْ", "note": "نون مدغمة في الراء بدون غنة"}, {"word": "مِنكُمْ", "note": "نون مخفاة: ينتقل مخرجها إلى قرب مخرج الكاف بغنة كاملة"}, {"word": "أَنبِئْهُمْ", "note": "نون مقلبة ميمًا مخفاة بغنة كاملة مع إطباق الشفتين بدون كز"}, {"word": "مِنْ هَادٍ", "note": "نون ساكنة مظهرة: غنة ناقصة"}, {"word": "جَعَلْنَا", "note": "لام ساكنة قبل نون: تخليص اللام من الغنة"}], "commonErrors": ["توجيه الصوت للخيشوم في حروف المد فتصاحبها الغنة.", "تسرب الغنة إلى الحروف المجاورة للنون والميم مثل اللام الساكنة في (جعلنا).", "إنقاص الغنة في النون والميم المشددتين.", "إعطاء غنة عند نطع غار الحنك الأعلى.\nالأحرف الأسلية (ص، ز، س) لخروجها من أسلة اللسان أي الطرف المستدق. الأحرف اللثوية (ظ، ذ، ث) لخروجها بالقرب من اللثة. الأحرف الشفوية (ف، و، ب، م) لخروجها من الشفتين. وقد سبق ذكر لقب حروف المد عند شرح مخرج الجوف (جوفية، هوائية، مدية، مقدرة، حروف علة، حروف خفاء). ثم يعرض الكتاب صور مخارج الحروف بالرسوم التشريحية: المخرج العام الأول الجوف ومنه الألف والواو والياء المدية، والمخرج الثاني الحلق بثلاثة مخارج، والمخرج الثالث اللسان بأربعة مخارج إجمالية مع رسم يوضح تقسيم اللسان (أقصى، وسط، حافة، طرف، رأس) وعدد الأسنان 32 (الثنايا 4، الرباعيات 4، الأنياب 4، الضواحك 4، الطواحن 12، النواجذ 4).\nوتوضح الصور: القاف من أقصى اللسان مع المنطقة الرخوة، والكاف مع المنطقة القاسية والرخوة معًا، والجيم والشين والياء من وسط اللسان مع ما يحاذيه من الحنك الأعلى، والضاد من حافتي اللسان مع الأضراس العليا، واللام من أدنى الحافتين إلى منتهى الطرف مع لثة الضاحكين والنابين والرباعيتين والثنيتين العليا، والنون من طرف اللسان مع لثة الثنايا العليا، والراء من طرف اللسان قريبًا إلى ظهره (مع صورة للراء المرققة والمفخمة)، والنطعية من ظهر طرف اللسان مع أصول الثنايا العليا، والأسلية من بين طرف اللسان والثنايا، واللثوية من ظهر طرف اللسان مع أطراف الثنايا العليا، والشفوية: الواو بانضمام الشفتين والباء بانطباقهما والميم بانطباقهما مع اشتراك الخيشوم، والفاء من باطن الشفة السفلى مع رؤوس الثنايا العليا.\nوالمجموع: 5 مخارج عامة و17 مخرجًا خاصًا.", "rules": ["الأحرف الحلقية: ء، هـ، ع، ح، غ، خ (من الحلق).", "الأحرف اللهوية: ق، ك (بالقرب من اللهاة).", "الأحرف الشجرية: ج، ش، ي، ض (من شجر الفم).", "الأحرف الذلقية: ل، ن، ر (من ذلق اللسان أي طرفه).", "الأحرف النطعية: ط، د، ت (من نطع غار الحنك الأعلى).", "الأحرف الأسلية: ص، ز، س (من أسلة اللسان أي الطرف المستدق).", "الأحرف اللثوية: ظ، ذ، ث (بالقرب من اللثة).", "الأحرف الشفوية: ف، و، ب، م (من الشفتين).", "حروف المد: جوفية، هوائية، مدية، مقدرة، حروف علة، حروف خفاء.", "المخارج العامة خمسة: الجوف، الحلق، اللسان، الشفتان، الخيشوم. والمخارج الخاصة سبعة عشر."], "examples": [{"word": "الْحَاقَّةُ", "note": "الحاء حلقية (وسط الحلق) والقاف لهوية"}, {"word": "شَجَرَةٌ", "note": "الشين والجيم شجريتان (وسط اللسان) والراء ذلقية"}, {"word": "أَنقَضَ ظَهْرَكَ", "note": "الضاد شجرية من الحافتين، والظاء لثوية من ظهر طرف اللسان"}, {"word": "الطَّامَّةُ", "note": "الطاء نطعية والميم شفوية مع الخيشوم"}, {"word": "الصِّرَاطَ", "note": "الصاد أسلية والراء ذلقية والطاء نطعية"}, {"word": "ثَوَابٌ", "note": "الثاء لثوية، الواو والباء شفويتان، والألف جوفية"}], "commonErrors": ["الخلط بين الحروف اللثوية (ظ ذ ث: أطراف الثنايا) والنطعية (ط د ت: أصول الثنايا).", "عد الضاد من الحروف الذلقية وهي شجرية لخروجها من الحافتين.", "الخلط بين الحروف اللهوية والحلقية لتقاربهما في العمق.", "عد الواو والياء المديتين شفوية أو شجرية بينما هما جوفيتان."], "practice": ["الْحَاقَّةُ", "شَجَرَةٌ", "أَنقَضَ ظَهْرَكَ", "الطَّامَّةُ", "الصِّرَاطَ", "ثَوَابٌ", "قُلْ", "نَذِيرٌ", "فَمٌ"], "quiz": [{"q": "ما لقب الحروف (ط، د، ت)؟", "options": ["لثوية", "نطعية", "أسلية", "ذلقية"], "answer": 1, "why": "الأحرف النطعية: ط، د، ت لخروجها من نطع غار الحنك الأعلى."}, {"q": "لماذا سميت (ص، ز، س) أحرفًا أسلية؟", "options": ["لخروجها من اللثة", "لخروجها من أسلة اللسان أي الطرف المستدق", "لخروجها من الشفتين", "لأن فيها صفيرًا"], "answer": 1, "why": "الأحرف الأسلية لخروجها من أسلة اللسان (الطرف المستدق)."}, {"q": "ما الحروف الذلقية؟", "options": ["ق، ك", "ل، ن، ر", "ظ، ذ، ث", "ف، و، ب، م"], "answer": 1, "why": "الأحرف الذلقية: ل، ن، ر لخروجها من ذلق اللسان."}, {"q": "الضاد من الحروف:", "options": ["الذلقية", "النطعية", "الشجرية", "اللثوية"], "answer": 2, "why": "الأحرف الشجرية: ج، ش، ي، ض؛ والضاد تعتبر شجرية لخروجها من الحافتين معًا."}, {"q": "ما لقب الحروف (ظ، ذ، ث)؟", "options": ["لثوية", "نطعية", "أسلية", "حلقية"], "answer": 0, "why": "الأحرف اللثوية: ظ، ذ، ث لخروجها بالقرب من اللثة."}, {"q": "كم عدد المخارج العامة؟", "options": ["ثلاثة", "أربعة", "خمسة", "سبعة عشر"], "answer": 2, "why": "المخارج العامة خمسة: الجوف، الحلق، اللسان، الشفتان، الخيشوم، وتتفرع إلى سبعة عشر مخرجًا خاصًا."}], "level": 1}, {"id": "L1_23", "title": "التفخيم والترقيق: حروف الاستعلاء ومراتب التفخيم والألف ولام الجلالة", "bookPages": "من الكتاب ص143-150", "summary": "الحروف الهجائية (29 حرفًا) تنقسم من حيث كيفية ضغط الهواء في الفم عند النطق بها إلى قسمين: حروف استعلاء وهي حروف (خص ضغط قظ) يتجه ضغط الحرف عند النطق به إلى قبة غار الحنك الأعلى، وحروف استفال وهي باقي الحروف (22 حرفًا) يتجه ضغط الحرف عند النطق به إلى الحنك الأسفل. الاستعلاء لغة: العلو والارتفاع، واصطلاحًا: اتجاه ضغط الحرف عند النطق به إلى الحنك الأعلى، والمعتبر فيه ارتفاع أقصى اللسان إلى الحنك الأعلى في المنطقة الرخوة.\nوالاستفال لغة: الانخفاض، واصطلاحًا: اتجاه ضغط الحرف إلى الحنك الأسفل. آلية التفخيم: عند النطق بالحرف المستعلي يتجه ضغط الهواء إلى الحنك الأعلى فيصطدم بقبة الحنك وبما أنه مكور محدب يرتد الصوت بعد الاصطدام فينشأ سمن في الحرف ويربو، فالتفخيم لغة: التسمين، واصطلاحًا: سمن يعتري الحرف فيمتلئ الفم بصداه. وآلية الترقيق: يتجه ضغط الهواء إلى الأسفل فلا يمتلئ الفم بصدى الحرف فيطرأ على الحرف نحول، فالترقيق لغة: النحول، واصطلاحًا: نحول يعتري الحرف فلا يمتلئ الفم بصداه.\nفالاستعلاء حق الحرف والتفخيم مستحقه، والاستفال حق الحرف والترقيق مستحقه. قاعدة: كل مستعل مفخم وليس كل مستفل مرقق لأن هناك حروف استفال تفخم أحيانًا (الراء، لام الجلالة، الألف). تقسيم الحروف: حروف تفخم دائمًا (خص ضغط قظ)، حروف تفخم تارة وترقق تارة (الألف المدية، لام الجلالة، الراء)، حروف ترقق دائمًا (باقي الحروف). مراتب التفخيم: مذهبان؛ مذهب أهل مصر ثلاث مراتب: المفتوح (طبع) والساكن ما قبله مفتوح (يضرب)، المضموم (خذ) والساكن ما قبله مضموم (مختلفون)، المكسور (أخيه) والساكن ما قبله مكسور (سخريا)، فالساكن يتبع مرتبة ما قبله.\nومذهب أهل الشام خمس مراتب: المفتوح وبعده ألف (خالدين)، المفتوح وليس بعده ألف (صدق)، المضموم (ضربت)، الساكن بغض النظر عما قبله (يطبع)، المكسور (أخيه). التفخيم النسبي هو أدنى مرتبة من مراتب التفخيم لقول العلامة المتولي: فهي وإن تكن بأدنى منزلة * فخيمة قطعًا من المستفلة، فلا يقال إنها رقيقة. ويكون واضحًا في الحروف المستعلية المنفتحة (ق، خ، غ) فقط لأن قوة الاستعلاء تشد الحرف لأعلى وقوة الكسر تشده لأسفل فتتعادل القوتان، أما المطبقة (ص، ض، ط، ظ) فلا تتضح فيها النسبية لأن الاستعلاء والإطباق يشدان الحرف لأعلى.\nومواضعه: عند أهل الشام المرتبة الخامسة (ق، خ، غ المكسورة)، وعند أهل مصر المرتبة الثالثة (ق، خ، غ المكسورة، والغين والخاء الساكنة وما قبلها مكسور أو ياء ساكنة: سخريا، شيخ)، والقاف الساكنة وما قبلها مكسور لا تفخم تفخيمًا نسبيًا لوجود القلقلة (إقرأ). وترتيب حروف الاستعلاء من حيث قوة التفخيم: ط > ض > ص > ظ > ق > غ > خ. تنبيهان: الحذر من خروج الصوت خارج الفم عند النطق بالحرف المفخم مما يضعف تفخيمه فلا بد من أن يمتلئ الفم بصدى الحرف، ويجب مراعاة الفرق بين تفخيم المطبق والمنفتح (طباقا، غِل).\nالألف المدية تتبع ما قبلها: ما قبلها مفخم مثل (قال) تفخم، وما قبلها مرقق مثل (السماء) ترقق. لام اسم الجلالة: تفخم إذا كان قبلها فتح حقيقي (قال الله) أو فتح حكمي (ءالله، الله عند البدء بهمزة الوصل) أو ضم أصلي أو عارض (عبد الله، دعوا الله)، وترقق إذا كان قبلها كسر أصلي أو عارض في كلمة واحدة أو كلمتين (بالله، بسم الله، أحد الله، قل اللهم). والفتح الحكمي: عند البدء باسم الجلالة بهمزة الوصل، وفي لفظ (ءالله) بوجهي الإبدال والتسهيل.", "rules": ["حروف الاستعلاء: خص ضغط قظ (7 أحرف)، وحروف الاستفال: باقي الحروف (22 حرفًا).", "الاستعلاء: اتجاه ضغط الحرف إلى الحنك الأعلى، والمعتبر فيه ارتفاع أقصى اللسان. الاستفال: اتجاه ضغط الحرف إلى الحنك الأسفل.", "التفخيم: سمن يعتري الحرف فيمتلئ الفم بصداه. الترقيق: نحول يعتري الحرف فلا يمتلئ الفم بصداه.", "الاستعلاء حق الحرف والتفخيم مستحقه، والاستفال حق والترقيق مستحق.", "كل مستعل مفخم وليس كل مستفل مرقق (الراء، لام الجلالة، الألف تفخم أحيانًا).", "مراتب التفخيم عند أهل مصر ثلاث: المفتوح، المضموم، المكسور، والساكن يتبع ما قبله.", "مراتب التفخيم عند أهل الشام خمس: مفتوح بعده ألف، مفتوح بلا ألف، مضموم، ساكن، مكسور.", "التفخيم النسبي أدنى مراتب التفخيم ويتضح في (ق، خ، غ) المكسورة، وفي الغين والخاء الساكنة بعد كسر أو ياء ساكنة عند أهل مصر.", "القاف الساكنة وما قبلها مكسور لا تفخم تفخيمًا نسبيًا لوجود القلقلة.", "ترتيب حروف الاستعلاء قوة: ط > ض > ص > ظ > ق > غ > خ.", "الألف المدية تتبع ما قبلها تفخيمًا وترقيقًا.", "لام الجلالة تفخم بعد الفتح (حقيقي أو حكمي) والضم (أصلي أو عارض)، وترقق بعد الكسر (أصلي أو عارض، في كلمة أو كلمتين)."], "examples": [{"word": "طَبَعَ", "note": "طاء  قال بالترقيق اعتبر أنها ساكنة قبلها ساكن قبله مكسور ولم ينظر إلى حرف الاستعلاء. ورأي ابن الجزري: يفضل في (مصر) التفخيم وقفًا لأنها مفخمة وصلًا، ويفضل في (القطر) الترقيق لأنها مرققة وصلًا، وهذا رأي غير ملزم.\nو(يسر، نذر، أسر/فأسر): أصلها بالياء (يسري، نذري، أسري) وحذفت الياء للتخفيف أو للبناء، فمن فخم نظر إلى أنها ساكنة قبلها مفتوح (يسر، فأسر) أو مضموم (نذر)، ومن رقق نظر إلى الياء المحذوفة ولأنها في الوصل مرققة. ورأي الشيخ أيمن سويد: أن (أسر، فأسر، يسر، نذر) تقرأ بوجه واحد وقفًا تبعًا لحركة ما قبلها. تنبيه: كلمة (بالنذر) المعرفة بأل لا يوجد بها ياء محذوفة فالراء تفخم قولًا واحدًا في الوقف لأنها ساكنة وقبلها مضموم، وترقق وصلًا لأنها مكسورة.\n(ب) ما يجوز فيها الوجهان وصلًا: كلمة (فرق) في سورة الشعراء: من فخم نظر إلى أن الراء ساكنة بعدها حرف استعلاء مكسور وقوة الاستعلاء أكبر فتؤثر في الراء، ومن رقق نظر إلى أن قوة الاستعلاء تشد القاف إلى أعلى وقوة الكسر تشدها إلى أسفل فتتعادل القوتان فكأنها راء ساكنة قبلها مكسور، أما راء (فرق) في الوقف فمفخمة. وتنبيه مهم: كل ما ذكر عن حالات الراء الساكنة في حركة ما قبلها وما بعدها لا بد أن يكون في كلمة واحدة، فإذا كانت الراء الساكنة في آخر الكلمة الأولى وقبلها مكسور وحرف الاستعلاء في أول الكلمة الثانية فلا خلاف في ترقيقها، وأتى ذلك في ثلاثة مواضع: (أن أنذر قومك) نوح، (ولا تصعر خدك) لقمان، (فاصبر صبرا جميلا) المعارج.", "rules": ["تفخم الراء قولًا واحدًا: إذا كانت مفتوحة أو مضمومة، أو ساكنة قبلها فتح أو ضم، أو ساكنة قبلها ساكن قبله فتح أو ضم وقفًا.", "تفخم الراء الساكنة قبلها مكسور إذا بعدها حرف استعلاء غير مكسور في كلمة واحدة، وذلك في خمس كلمات: قرطاس، مرصادا، لبالمرصاد، إرصادا، فرقة.", "تفخم الراء الساكنة بعد همزة الوصل (ارتابوا) سواء كانت الهمزة ملفوظة أو مقدرة.", "ترقق الراء قولًا واحدًا: إذا كانت مكسورة، أو ساكنة قبلها كسر أصلي وليس بعدها حرف استعلاء في نفس الكلمة، أو ساكنة قبلها ساكن قبله كسر وقفًا، أو ساكنة قبلها ياء ساكنة (مدية أو لينية) وقفًا.", "ترقق الراء التي بعدها ألف ممالة: في (مجراها) فقط عند حفص.", "يجوز الوجهان وقفًا في: مصر، القطر، يسر، نذر، أسر/فأسر.", "رأي ابن الجزري: التفخيم في (مصر) والترقيق في (القطر) وقفًا تبعًا لح صلية أو زائدة. أما التنوين فهو نون ساكنة زائدة لغير توكيد تلحق بآخر الأسماء لفظًا ووصلًا وتفارقه خطًّا ووقفًا، وعلامته فتحتان أو ضمتان أو كسرتان. وللنون الساكنة والتنوين أربعة أحكام: الإظهار والإدغام والقلب والإخفاء، كما قال ابن الجزري: «وحكم تنوين ونون يلفى، إظهار ادغام وقلب إخفا». أول هذه الأحكام الإظهار الحلقي، ومعناه لغةً: البيان والوضوح، واصطلاحًا: إخراج الحرف المظهر من مخرجه من غير غنة كاملة.\nوحروفه ستة تخرج كلها من الحلق: الهمزة والهاء والعين والحاء والغين والخاء، جمعها الجمزوري في قوله: «همز فهاء ثم عين حاء، مهملتان ثم غين خاء»، وجمعها بعضهم في أوائل كلمات: (أخي هاك علمًا حازه غير خاسر). وسبب الإظهار بُعد مخرج النون (طرف اللسان) عن مخرج هذه الأحرف (الحلق). وكيفيته: النطق بالنون الساكنة نطقًا واضحًا من غير غنة ظاهرة ومن غير فصل أو سكت، مع إعطائها زمن التوسط ثم النطق بالحرف الذي يليها. وله ثلاث مراتب: عليا عند الهمزة والهاء، ووسطى عند العين والحاء، ودنيا عند الغين والخاء.\nويكون الإظهار الحلقي في كلمة أو كلمتين. وعلامته في المصحف وضع رأس خاء صغيرة بدون نقطة فوق النون، ووضع حركتي التنوين مركبتين فوق بعضهما مثل ﴿عَلِيمًا حَكِيمًا﴾.", "rules": ["حروف الإظهار الحلقي ستة: ء هـ ع ح غ خ، وكلها تخرج من الحلق.", "سبب الإظهار: بُعد مخرج النون عن مخرج حروف الحلق.", "ينطق بالنون الساكنة أو التنوين واضحًا من غير غنة ظاهرة ولا سكت ولا فصل.", "مراتبه: عليا عند الهمزة والهاء، وسطى عند العين والحاء، دنيا عند الغين والخاء.", "يقع في كلمة واحدة أو في كلمتين.", "علامته في المصحف: رأس خاء صغيرة فوق النون، وتركيب حركتي التنوين فوق بعضهما."], "examples": [{"word": "يَنْـَٔوْنَ", "note": "نون ساكنة بعدها همزة في كلمة واحدة: إظهار"}, {"word": "مَنْ ءَامَنَ", "note": "نون ساكنة بعدها همزة في كلمتين: إظهار"}, {"word": "مِنْ هَادٍ", "note": "نون ساكنة بعدها هاء: إظهار"}, {"word": "الْأَنْعَامَ", "note": "نون ساكنة بعدها عين في كلمة واحدة"}, {"word": "وَانْحَرْ", "note": "نون ساكنة بعدها حاء في كلمة واحدة"}, {"word": "فَسَيُنْغِضُونَ", "note": "نون ساكنة بعدها غين، وهي من موضعين في القرآن"}, {"word": "وَالْمُنْخَنِقَةُ", "note": "نون ساكنة بعدها خاء، وهي من موضعين في القرآن"}, {"word": " قع النون والميم المشددتان متوسطتين أو متطرفتين في الأسماء مثل (الجنّة – أمّتكم – عيهنّ)، وفي الأفعال مثل (دمّر – يمنّيهم – تعضلوهنّ)، وفي الحروف مثل (أنّ – ثمّ). والغنة صوت يخرج من الخيشوم مصاحب للنون والميم، ولها مراتب تبعًا لحال الحرف: فأعلى مراتبها في النون والميم المشددتين، ثم في المدغم (إدغام النون في ينمو والميم في الميم)، ثم في المخفى (الإخفاء الحقيقي والإخفاء الشفوي والقلب)، ثم في الساكن المظهر، ثم في المتحرك.\nوفي هذا الدرس يتدرب الطالب على إظهار الغنة كاملة عند النون أو الميم المشددة وصلًا ووقفًا، فالغنة في الحرف المشدد لازمة لا تسقط بالوقف؛ فمثلًا عند الوقف على (جانّ) تمد الألف ست حركات مدًّا لازمًا ثم تُظهر غنة النون المشددة كاملة. ويلاحظ أن الحرف المشدد عبارة عن حرفين ساكن أولهما، ولذا يحسب في أحكام المد اللازم الكلمي المثقل كما في (الحاقّة) و(الضالّين). والخطأ الشائع هو اختلاس الغنة وتقصير زمنها، أو المبالغة فيها حتى تصير مدًّا، أو عدم إكمال التشديد في النون والميم المشددتين.", "rules": ["الحرف المشدد أصله حرفان: ساكن ثم متحرك أدغم الأول في الثاني.", "النون والميم المشددتان تظهر فيهما الغنة بأعلى مراتبها.", "الغنة في المشدد ثابتة وصلًا ووقفًا.", "تقع النون والميم المشددتان في الأسماء والأفعال والحروف، متوسطة أو متطرفة.", "مراتب الغنة: المشدد، ثم المدغم، ثم المخفى، ثم الساكن المظهر، ثم المتحرك."], "examples": [{"word": "الْجَنَّةُ", "note": "نون مشددة في اسم: غنة كاملة"}, {"word": "أُمَّتُكُمْ", "note": "ميم مشددة في اسم"}, {"word": "عِهْنٌ", "note": "اسم ذُكر في الكتاب مع المشددات"}, {"word": "دَمَّرَ", "note": "ميم مشددة في فعل"}, {"word": "يُمَنِّيهِمْ", "note": "نون مشددة في فعل"}, {"word": "تَعْضُلُوهُنَّ", "note": "نون مشددة متطرفة في فعل"}, {"word": "أَنَّ", "note": "نون مشددة في حرف"}, {"word": "ثُمَّ", "note": "ميم مشددة في حرف"}, {"word": "جَانٌّ", "note": "عند الوقف: مد لازم ست حركات ثم غنة النون المشددة"}], "commonErrors": ["اختلاس الغنة وعدم إعطائها زمنها الكامل.", "إسقاط الغنة عند الوقف على النون أو الميم المشددة.", "عدم إكمال التشديد فتصير النون أو الميم مخففة.", "المبالغة في الغنة حتى تتحول إلى مد."], "practice": ["إِنَّ اللَّهَ", "ثُمَّ", "الْجَنَّةُ", "أُمَّتُكُمْ", "دَمَّرَ", "يُمَنِّيهِمْ", "تَعْضُلُوهُنَّ", "عَمَّ يَتَسَاءَلُونَ", "مِنَ الْجِنَّةِ وَالنَّاسِ"], "quiz": [{"q": "ما أصل الحرف المشدد؟", "options": ["حرف واحد طويل", "حرفان أولهما ساكن وثانيهما متحرك أدغم الأول في الثاني", "حرفان متحركان", "حرف مد وحرف ساكن"], "answer": 1, "why": "الحرف المشدد ما كان أصله حرفين أولهما ساكن وثانيهما متحرك وأدغم الأول في الثاني."}, {"q": "أعلى مراتب الغنة تكون في:", "options": ["النون الساكنة المظهرة", "النون والميم المشددتين", "النون المخفاة", "النون المتحركة"], "answer": 1, "why": "إذا وقع التشديد في النون والميم ظهرت فيهما الغنة بأعلى مراتبها."}, {"q": "هل تسقط غنة النون المشددة عند الوقف؟", "options": ["نعم تسقط", "لا، تثبت وصلًا ووقفًا", "تسقط في الأسماء فقط", "تسقط في الحروف فقط"], "answer": 1, "why": "الغنة صفة لازمة للنون والميم، وتظهر كاملة في المشدد وصلًا ووقفًا."}, {"q": "في أي الكلمات التالية ميم مشددة في فعل؟", "options": ["أُمَّتُكُمْ", "ثُمَّ", "دَمَّرَ", "الْجَنَّةُ"], "answer": 2, "why": "دمّر فعل فيه ميم مشددة، وأمّتكم والجنّة اسمان، وثمّ حرف."}, {"q": "كلمة ﴿أَنَّ﴾ فيها نون مشددة في:", "options": ["اسم", "فعل", "حرف", "ضمير"], "answer": 2, "why": "ذكر الكتاب أنّ وثمّ مثالين للنون والميم المشددتين في الحروف."}], "timing": {"ghunnah": true, "maddCounts": null}, "level": 2}, {"id": "L2_07", "title": "المد الطبيعي وملحقاته (البدل، العوض، الصلة الصغرى)", "bookPages": "من الكتاب ص179-186", "summary": "المد لغةً: الزيادة، واصطلاحًا: إطالة الصوت بحرف المد أو اللين عند وجود سبب لذلك. والقصر لغةً: الحبس والمنع، واصطلاحًا: إثبات حرف المد بدون زيادة؛ فالقصر هو الأصل لأنه لا يحتاج إلى سبب، والمد فرع منه. وحروف المد ثلاثة: الألف الساكنة المفتوح ما قبلها، والواو الساكنة المضموم ما قبلها، والياء الساكنة المكسور ما قبلها، وجمعت بشروطها في (نوحيها) و(أوتينا). وحرفا اللين: الياء والواو الساكنتان المفتوح ما قبلهما مثل (بَيت) و(خَوف).\nوالمد الطبيعي هو أبو المدود، وهو المد الذي لا تقوم ذات الحرف إلا به ولا يتوقف على سبب، ويسمى أصليًّا وذاتيًّا ومد صيغة، ومقداره حركتان وجوبًا لجميع القراء، وعلامته ألا يوجد قبله همز ولا بعده همز أو سكون، مثل (قالوا – يوصيكم – يقيمون). ومن صوره مد التمكين: عندما تأتي ياء مشددة مكسورة بعدها ياء ساكنة مثل (حُيِّيتم)، أو ياء مدية ساكنة بعدها ياء متحركة مثل (الذي يوعدون)، أو واو مدية بعدها واو متحركة مثل (اصبروا وصابروا). ويلحق بالمد الطبيعي ثلاثة مدود تمد حركتين: مد البدل: كل همز ممدود، أي أن يأتي حرف المد وقبله همزة مثل (ءامنوا – إيمان – أوتوا)، وسمي بدلًا لأن العرب لا تجمع بين همزتين ثانيتهما ساكنة فيبدلون الثانية حرف مد يناسب حركة الأولى.\nومد العوض: التعويض عن تنوين النصب لغير هاء التأنيث حال الوقف بألف مدية تمد حركتين مثل (كفورًا – حكيمًا – نساءً)، ويستثنى تنوين النصب على هاء التأنيث مثل (شجرةً) فيوقف عليها بسكون الهاء، ويلحق به لفظ (إذًا) ونون التوكيد الخفيفة في (لنسفعًا – ليكونًا). ومد الصلة الصغرى: صلة هاء الضمير الدالة على المفرد المذكر الغائب المتحركة بالضم أو الكسر، الواقعة بين متحركين ثانيهما ليس همزة قطع، ويسمى حرف المد صلة هاء الضمير، ويثبت في الوصل فقط أما عند الوقف فنقف بسكون الهاء، مثل (بعباده بصيرًا – له ملك السماوات).\nومن الاستثناءات تبعًا للرواية: ﴿يَرْضَهُ لَكُمْ﴾ لا توجد فيها صلة مع استيفاء الشروط، و﴿فِيهِ مُهَانًا﴾ تمد مع عدم استيفاء الشروط. ولا توجد صلة في الهاء الأصلية مثل (نفقه – ينته – وجه).", "rules": ["حروف المد ثلاثة مجموعة في (نوحيها) بشروطها: ألف قبلها فتح، واو قبلها ضم، ياء قبلها كسر.", "المد الطبيعي يمد حركتين وجوبًا لجميع القراء ولا يتوقف على سبب.", "مد البدل: همز قبل حرف المد، ويمد حركتين لحفص.", "مد العوض: ألف مدية عوضًا عن تنوين النصب عند الوقف، حركتان، ويستثنى تنوين هاء التأنيث.", "مد الصلة الصغرى: هاء الضمير المفرد المذكر الغائب بين متحركين ثانيهما ليس همزة، حركتان في الوصل فقط.", "لا صلة في الهاء الأصلية من بنية الكلمة ولا في هاء الضمير الساكنة أو الواقعة قبل ساكن أو بعد ساكن."], "examples": [{"word": "قَالُوا", "note": "ألف وواو مديتان: مد طبيعي حركتان"}, {"word": "يُوصِيكُمْ", "note": "مد طبيعي بالواو والياء"}, {"word": "حُيِّيتُمْ", "note": "مد تمكين: ياء مشددة مكسورة بعدها ياء ساكنة"}, {"word": "اصْبِرُوا وَصَابِرُوا", "note": "مد تمكين: واو مدية بعدها واو متحركة"}, {"word": "ءَامَنُوا", "no ا مد", "بست حركات", "بإظهار التنوين"], "answer": 1, "why": "يستثنى من مد العوض تنوين النصب على هاء التأنيث فيوقف عليها بسكون الهاء."}, {"q": "ما شرط هاء الضمير لتُمد مد صلة صغرى؟", "options": ["أن تكون ساكنة", "أن تكون متحركة بين متحركين وبعدها غير همزة", "أن تكون بعد ساكن", "أن يكون بعدها همزة قطع"], "answer": 1, "why": "شروط هاء الصلة: أن تكون متحركة وواقعة بين متحركين، فإن وقع بعدها همزة قطع صارت صلة كبرى."}, {"q": "في ﴿يَرْضَهُ لَكُمْ﴾:", "options": ["تمد الهاء حركتين", "لا توجد صلة تبعًا للرواية", "تمد أربع حركات", "تمد مد بدل"], "answer": 1, "why": "من الاستثناءات التي ذكرها الكتاب أن هاء يرضه لا توصل تبعًا للرواية مع أنها استوفت الشروط."}, {"q": "في ﴿لَوْلَا نُزِّلَ عَلَيْهِ الْقُرْآنُ﴾ هاء الضمير:", "options": ["تمد صلة صغرى", "لا تمد لأنها بين ساكنين", "تمد صلة كبرى", "تمد مد بدل"], "answer": 1, "why": "هاء الضمير هنا واقعة بين ساكنين فلا صلة فيها."}], "timing": {"ghunnah": false, "maddCounts": 2}, "level": 2}, {"id": "L2_08", "title": "المد الواجب المتصل", "bookPages": "من الكتاب ص187-188", "summary": "المد الفرعي هو المد الزائد عن المد الطبيعي لوجود سبب ما، وينقسم إلى قسمين: المد الفرعي اللفظي وهو إطالة الصوت بسبب همز أو سكون (وهو ما يخصنا)، والمد الفرعي المعنوي وهو إطالة الصوت بسبب معنوي كالمبالغة في النفي (لا ريب فيه) أو المبالغة في التعظيم (لا إله إلا الله)، وليس لحفص من الشاطبية منه شيء. والمد الفرعي اللفظي إما بسبب الهمزة (المد الواجب المتصل، والمد الجائز المنفصل، ويلحق به مد الصلة الكبرى) وإما بسبب السكون (المد اللازم، والمد العارض للسكون، ويلحق به مد اللين).\nأولًا المد بسبب الهمزة: المد الواجب المتصل، وتعريفه أن يأتي حرف المد وبعده همزة في كلمة واحدة. ومقداره أربع أو خمس حركات لحفص من الشاطبية؛ فأربع حركات تسمى التوسط، وخمس حركات فويق التوسط. وحكمه الواجب. وسبب التسمية: سمي واجبًا لوجوب مده فوق المد الطبيعي عند جميع القراء وإن اختلفوا في عدد الحركات، وسمي متصلًا لاتصال حرف المد بالهمزة في كلمة واحدة. وسبب مده: أن حرف المد ضعيف خفي والهمز قوي فزيد في المد لتقوية حرف المد. ومن أمثلته: (جاءكم – هنيئًا – سوءًا).\nوسيأتي في درس أقوى السببين أنه عند الوقف على كلمة آخرها همزة مسبوقة بحرف مد مثل (السماء) يجتمع المتصل والعارض للسكون، فيجوز الوقف بأربع أو خمس أو ست حركات، ولا يجوز القصر بحركتين لأن المتصل أقوى من العارض.", "rules": ["المد الواجب المتصل: حرف مد بعده همزة في كلمة واحدة.", "مقداره أربع أو خمس حركات لحفص من الشاطبية.", "حكمه الوجوب عند جميع القراء وإن اختلفوا في عدد الحركات.", "سبب المد تقوية حرف المد الضعيف الخفي أمام الهمز القوي.", "عند الوقف على همزته يجوز 4 أو 5 أو 6 حركات ولا يجوز القصر."], "examples": [{"word": "جَاءَكُمْ", "note": "ألف مدية بعدها همزة في كلمة واحدة: متصل 4 أو 5"}, {"word": "هَنِيئًا", "note": "ياء مدية بعدها همزة في كلمة واحدة"}, {"word": "سُوءًا", "note": "واو مدية بعدها همزة في كلمة واحدة"}, {"word": "السَّمَاءِ", "note": "متصل، وعند الوقف عليها يجوز 4 أو 5 أو 6 حركات"}, {"word": "رِئَاءَ", "note": "متصل 4 أو 5 في الوصل"}], "commonErrors": ["قصر المد المتصل إلى حركتين، وهو لا يجوز.", "الوقف على نحو (السماء) بحركتين فقط.", "عدم المساواة بين المتصلات في القراءة الواحدة؛ فإذا بدأ القارئ بأربع حركات استمر عليها.", "الخلط بينه وبين المنفصل: المتصل في كلمة واحدة."], "practice": ["جَاءَكُمْ", "هَنِيئًا مَرِيئًا", "سُوءًا", "السَّمَاءِ", "أُولَئِكَ", "شَاءَ اللَّهُ", "سِيئَتْ"], "quiz": [{"q": "تعريف المد الواجب المتصل:", "options": ["حرف مد بعده همزة في كلمتين", "حرف مد بعده همزة في كلمة واحدة", "همزة قبل حرف المد", "حرف مد بعده سكون"], "answer": 1, "why": "المتصل أن يأتي حرف المد وبعده همزة في كلمة واحدة، بخلاف المنفصل في كلمتين."}, {"q": "مقدار المد المتصل لحفص من الشاطبية:", "options": ["حركتان", "4 أو 5 حركات", "6 حركات فقط", "2 أو 4 أو 6"], "answer": 1, "why": "يمد المتصل بمقدار أربع (توسط) أو خمس حركات (فويق التوسط)."}, {"q": "لماذا سمي المتصل واجبًا؟", "options": ["لوجوب مده فوق الطبيعي عند جميع القراء", "لأن حفصًا وحده يمده", "لأنه في كلمة واحدة", "لأنه بسبب السكون"], "answer": 0, "why": "سمي واجبًا لوجوب مده فوق المد الطبيعي عند جميع القراء وإن اختلفوا في عدد الحركات."}, {"q": "ما سبب مد حرف المد عند الهمزة؟", "options": ["لأن الهمزة ضعيفة", "لتقوية حرف المد الضعيف الخفي بالهمز القوي", "للتخفيف", "لإظهار الغنة"], "answer": 1, "why": "حرف المد ضعيف خفي والهمز قوي فزيد في المد لتقوية حرف المد."}, {"q": "المد الفرعي المعنوي مثل المبالغة في النفي في (لا ريب فيه):", "options": ["يقرأ به حفص من الشاطبية", "ليس لحفص من الشاطبية منه شيء", "واجب لجميع القراء", "يمد ست حركات"], "answer": 1, "why": "ذكر الكتاب أن المد الفرعي المعنوي ليس لحفص من الشاطبية منه شيء."}, {"q": "عند الوقف على ﴿السَّمَاءِ﴾ يجوز:", "options": ["حركتان فقط", "4 أو 5 أو 6 حركات", "6 حركات فقط", "حركتان أو أربع"], "answer": 1, "why": "اجتمع المتصل والعارض للسكون، والمتصل أقوى فلا نقصر، ويجوز 4 أو 5 أو 6."}], "timing": {"ghunnah": false, "maddCounts": 4}, "level": 2}, {"id": "L2_09", "title": "المد الجائز المنفصل ومد الصلة الكبرى", "bookPages": "من الكتاب ص188-190", "summary": "المد الجائز المنفصل تعريفه: أن يأتي حرف المد في آخر الكلمة الأولى وهمزة القطع في أول الكلمة الثانية. ومقداره أربع أو خمس حركات لحفص من الشاطبية، وحكمه جائز لجواز قصره عند بعض القراء. وسمي جائزًا لجواز قصره عند بعض القراء، وسمي منفصلًا لانفصال حرف المد عن الهمز. وسبب مده تقوية حرف المد عند مجاورته للهمز، وسبب قصره في بعض الروايات قصر حرف المد عند الوقف. وينقسم المنفصل إلى قسمين: انفصال حقيقي وهو أن يكون حرف المد ثابتًا رسمًا ولفظًا مثل (في أرض الله)، وانفصال حكمي وهو أن يكون حرف المد ثابتًا لفظًا دون رسم، ويكون في (ها) التنبيه مثل (هأنتم – هؤلاء)، و(يا) النداء مثل (يأيها).\nوالفرق بينهما أن المنفصل الحقيقي يجوز الوقف على حرف المد فيه بالقصر، أما الحكمي فلا يجوز الوقف على حرف المد. ويلحق بالمد المنفصل مد الصلة الكبرى، وتعريفه: أن تأتي هاء الضمير الدالة على المفرد المذكر الغائب المتحركة والواقعة بين متحركين في آخر الكلمة الأولى وهمزة القطع في أول الكلمة الثانية، ومقداره يتبع المد المنفصل. والفرق بين مد الصلة الكبرى والمد المنفصل أن الصلة الكبرى مشبه والمنفصل مشبه به، لأن حرف المد ثابت وصلًا ووقفًا في المنفصل، أما في الصلة الكبرى فحرف المد ثابت وصلًا دون وقف، ولذلك يلحق مد الصلة الكبرى بالمنفصل ويتبعه في عدد الحركات.\nويلحق بمد الصلة الكبرى لفظ (هذه) إذا وقع بعدها همزة قطع. ومن أمثلته: ﴿وَلَا يُشْرِكْ بِعِبَا ن الأصلي أنه ثابت وصلًا ووقفًا. ومقداره ست حركات لزومًا عند جميع القراء، وسمي لازمًا للزوم مده ست حركات عند جميع القراء وللزوم سببه وهو السكون الأصلي وصلًا ووقفًا، وحكمه لزوم مده ست حركات وعدم جواز القصر والتوسط. وينقسم إلى مد لازم كلمي ومد لازم حرفي، وكل منهما مثقل ومخفف. المد اللازم الكلمي المثقل: أن يأتي حرف المد وبعده حرف ساكن سكونًا أصليًّا مشددًا في كلمة، مثل (الحاقّة – صوافّ – الضالّين – ءالذكرين – ءالله)، وسمي كلميًّا لاجتماع حرف المد والسكون في كلمة، ومثقلًا لأن الحرف الساكن مشدد.\nالمد اللازم الكلمي المخفف: أن يأتي حرف المد وبعده حرف ساكن سكونًا أصليًّا مخففًا، وموضعه كلمة واحدة في موضعين ﴿ءَآلْـَٰٔنَ﴾ في سورة يونس (51 و91). ومن صور المد اللازم مد الفرق، وهو في ثلاث كلمات في ستة مواضع: ﴿ءَآلذَّكَرَيْنِ﴾ (الأنعام 143 و144) و﴿ءَآللَّهُ﴾ (يونس 59 والنمل 59) لازم كلمي مثقل، و﴿ءَآلْـَٰٔنَ﴾ (يونس 51 و91) لازم كلمي مخفف؛ والسبب أن همزة القطع للاستفهام دخلت على همزة الوصل في الاسم المعرف بأل فلا يجوز حذف همزة الوصل حتى لا يلتبس الاستفهام بالخبر، فإما إبدال همزة الوصل ألفًا تمد ست حركات، وإما تسهيلها بين الهمزة والألف مع عدم المد، ولقب بمد الفرق لأنه يفرق بين الاستفهام والخبر.\nالمد اللازم الحرفي يتعلق بالحروف المقطعة التي بدأ الله بها بعض السور، وعددها أربعة عشر حرفًا في بداية تسع وعشرين سورة، جمعها الشيخ الجمزوري في (صله سحيرًا من قطعك) وغيره في (نص حكيم له سر قاطع). وهناك فرق بين نطق الحرف واسمه: (ق) اسمه (قاف). وتقسم الأحرف المقطعة من حيث المد إلى أربعة أقسام: الألف تقرأ (ألف) وليس بها مد؛ وحروف (حي طهر) تقرأ (حا – يا – طا – ها – را) وهي من حرفين ثانيهما حرف مد فتمد حركتين وتسمى مدًّا طبيعيًّا حرفيًّا؛ وحروف (سنقص لكم) تنطق على ثلاثة أحرف أوسطها حرف مد وثالثها ساكن أصلي، فإذا كان ثالثها ساكنًا مخففًا فهو مد لازم حرفي مخفف يمد ست حركات، وإذا كان ثالثها ساكنًا مشددًا فهو مد لازم حرفي مثقل يمد ست حركات؛ والعين تنطق على ثلاثة أحرف أوسطها حرف لين وثالثها ساكن أصلي، تمد أربعًا أو ستًّا لحفص من الشاطبية، وتسمى مدًّا ملحقًا بمد اللين، وبعضهم يسميه مد اللين اللازم أو المد الحرفي الشبيه بالمثقل.", "rules": ["المد اللازم: حرف مد بعده ساكن أصلي، يمد ست حركات لزومًا عند جمي حرف مد، ولكن يراعى أن العارض أقوى. وهناك قاعدتان هامتان: القاعدة الأولى إذا اجتمع مدان مختلفان في القوة في آية واحدة: فإذا تقدم القوي على الضعيف ساوى الضعيف القوي أو نزل عنه، مثل العارض ثم اللين في ﴿لَا يَنَالُ عَهْدِي الظَّالِمِينَ وَإِذْ جَعَلْنَا الْبَيْتَ﴾: إذا مددنا العارض 2 فاللين 2، وإذا 4 فاللين 2 أو 4، وإذا 6 فاللين 2 أو 4 أو 6. وإذا تقدم الضعيف على القوي ساوى القوي الضعيف أو علا عنه، مثل اللين ثم العارض في ﴿لَا رَيْبَ فِيهِ هُدًى لِلْمُتَّقِينَ﴾: إذا مددنا اللين 2 فالعارض 2 أو 4 أو 6، وإذا 4 فالعارض 4 أو 6، وإذا 6 فالعارض 6.\nالقاعدة الثانية قاعدة أقوى السببين: إذا اجتمع على حرف مد واحد أكثر من سبب نطبق بيت السمنودي فنعمل بالأقوى. أمثلة: (ءامّين) اجتمع بدل ولازم فنمد 6؛ (جاءوا أباهم) وصلًا اجتمع بدل ومنفصل فنمد 4 أو 5، أما وقفًا فبدل 2؛ (السماء) وقفًا اجتمع متصل وعارض فيجوز 4 أو 5 أو 6 ولا يجوز القصر؛ (يراءون) وقفًا اجتمع بدل وعارض فالعارض أقوى ويجوز 2 أو 4 أو 6؛ (رئاء) وقفًا اجتمع بدل ومتصل وعارض فالمتصل أقوى: 4 أو 5 أو 6. ومن التنبيهات: في ﴿الٓمٓ ۝ اللَّهُ﴾ عند الوصل تحرك ميم (ميم) بالفتح للتخلص من التقاء الساكنين، ففي ياء (ميم) مذهبان: الاعتداد بالعارض فتمد حركتين، أو عدم الاعتداد فتمد ست حركات.\nوإذا بدأنا القراءة بمد المتصل أربعًا مثلًا فعلينا أن نستمر عليه مع مراعاة أن المنفصل لا يعلو على المتصل، وأن اللين لا يعلو على العارض، وأن الصلة الكبرى تمد مثل المنفصل. وعند الوقف على (جانّ) لا يجتمع سببان بل هو مد لازم فقط يمد ست حركات وصلًا ووقفًا لأن النون المشددة بمثابة حرفين.", "rules": ["مراتب المدود: اللازم، ثم المتصل، ثم العارض للسكون، ثم المنفصل، ثم البدل.", "إذا تقدم المد القوي على الضعيف ساوى الضعيفُ القويَّ أو نزل عنه.", "إذا تقدم الضعيف على القوي ساوى القويُّ الضعيفَ أو علا عنه.", "إذا اجتمع على حرف مد واحد سببان عُمل بأقواهما.", "عند الوقف على متصل في آخره همزة لا يجوز القصر؛ يجوز 4 أو 5 أو 6.", "المنفصل لا يعلو على المتصل، واللين لا يعلو على العارض، والصلة الكبرى مثل المنفصل.", "في (الم الله) وصلًا: ياء ميم تمد حركتين بالاعتداد بالعارض أو ست حركات بعدم الاعتداد."], "examples": [{"word": "ءَآمِّينَ", "note": "اجتمع بدل ولازم كلمي مثقل: نمد 6 حركات  بنية الكلمة والواقعة في الفعل سواء كان ماضيًا أو مضارعًا أو أمرًا، متوسطة أو متطرفة، ولها حكمان: الإدغام إذا أتى بعدها لام أو راء مثل (ويجعل لكم – قل رب)، والإظهار إذا أتى بعدها حرف من الحروف الستة والعشرين الباقية مثل (ألهاكم – ألق – يلتقطه). ولم تدغم لام الفعل في نفس حروف لام التعريف لأن لام التعريف زائدة وإدغامها فيه تخفيف، أما لام الفعل فمن أصل الكلمة وإدغامها قد يغير المعنى.\nويجب الانتباه إذا أتت نون بعد لام الفعل حتى لا يسبق اللسان إلى الإدغام مثل (أرسلنا – جعلنا). ثالثًا لام الأمر: لام ساكنة زائدة تدخل على الفعل المضارع ليكون في صيغة أمر ويأتي قبلها واو أو فاء أو ثم، وحكمها وجوب الإظهار مثل (فليستجيبوا – وليؤمنوا – ثم ليقطع). رابعًا لام الاسم: اللام الساكنة الأصلية في الأسماء وتكون متوسطة دائمًا، وحكمها وجوب الإظهار مثل (ملجأ – ملك – ألوانكم – سلطان). خامسًا لام الحرف: اللام الساكنة الأصلية في حرف، وتكون في القرآن في حرفين فقط هما (هل) و(بل)، ولها حكمان: الإدغام إذا أتى بعدها لام أو راء مثل (هل لكم – بل رفعه الله – بل لا يخافون)، واللام والراء تقع بعد (بل) أما الراء فلم تقع بعد (هل)؛ وفي ﴿كَلَّا بَلْ رَانَ﴾ يمتنع الإدغام بسبب السكت عند حفص من الشاطبية.\nوالإظهار إذا وقع بعدها أحد الأحرف الباقية مثل (هل ننبئكم – بل تأتيهم – هل ثوب).", "rules": ["اللامات الساكنة خمس: التعريف، الفعل، الأمر، الاسم، الحرف.", "لام التعريف: إظهار قمري عند (ابغ حجك وخف عقيمه)، وإدغام شمسي عند الأربعة عشر الباقية.", "لام الفعل: إدغام في اللام والراء، وإظهار عند الباقي.", "لام الأمر: وجوب الإظهار، ويسبقها واو أو فاء أو ثم.", "لام الاسم: وجوب الإظهار، وتكون متوسطة دائمًا.", "لام الحرف في (هل) و(بل): إدغام في اللام والراء، وإظهار عند الباقي، ويمتنع الإدغام في (بل ران) للسكت."], "examples": [{"word": "الْقَمَرُ", "note": "لام تعريف قمرية: إظهار"}, {"word": "الْوَدُودُ", "note": "لام قمرية مظهرة"}, {"word": "الشَّمْسُ", "note": "لام تعريف شمسية: إدغام"}, {"word": "الرَّحْمَٰنُ", "note": "لام شمسية مدغمة في الراء"}, {"word": "اللَّيْلُ", "note": "لام شمسية مدغمة في اللام"}, {"word": "وَيَجْعَل لَّكُمْ", "note": "لام فعل مدغمة في اللام"}, {"word": "قُل رَّبِّ", "note": "لام فعل مدغمة في ال ها لام التعريف؟", "options": ["لأن لام الفعل قمرية", "لأن لام الفعل من أصل الكلمة وإدغامها قد يغير المعنى بخلاف لام التعريف الزائدة", "لأنها لا تقع قبلها", "لأنها دائمًا متطرفة"], "answer": 1, "why": "لام التعريف زائدة فإدغامها تخفيف لا يغير المعنى، أما لام الفعل فأصلية ويحذف بإدغامها حرف من أصل الكلمة."}, {"q": "لام الحرف تقع في القرآن في:", "options": ["هل وبل فقط", "كل وقل", "أل والذي", "جميع الحروف"], "answer": 0, "why": "اللام الساكنة الأصلية الواقعة في حرف تكون في القرآن في حرفين فقط هما هل وبل."}, {"q": "في ﴿كَلَّا بَلْ رَانَ﴾ حكم لام (بل) عند حفص:", "options": ["إدغام في الراء", "يمتنع الإدغام بسبب السكت", "إخفاء", "قلب"], "answer": 1, "why": "يمتنع الإدغام بسبب السكت عند حفص من الشاطبية."}, {"q": "عند قراءة ﴿أَرْسَلْنَا﴾ يجب:", "options": ["إدغام اللام في النون", "إظهار اللام وعدم الإدغام", "إخفاء اللام", "قلب اللام نونًا"], "answer": 1, "why": "نبه الكتاب على الانتباه إذا أتت نون بعد لام الفعل حتى لا يسبق اللسان إلى الإدغام للتقارب."}], "timing": {"ghunnah": false, "maddCounts": null}, "level": 2}, {"id": "L2_14", "title": "قاعدة التقاء الساكنين", "level": 2, "bookPages": "من الكتاب ص 209-210", "summary": "إذا التقى ساكنان في القراءة فإن التقاءهما إما أن يكون في كلمة واحدة أو في كلمتين. أما التقاء الساكنين في كلمة واحدة فله حالتان: الأولى تكون وقفًا فقط مثل (تَعْمَلُونْ) و(عَنْهْ) عند الوقف، وهذه لا حاجة فيها للتخلص لأن الوقف يجيزها، والثانية تكون وصلًا ووقفًا مثل (الصَّاخَّة) و(الطَّامَّة) و(الْحَاقَّة) ونتخلص منها بالمد ست حركات (وهو المد اللازم). أما التقاء الساكنين في كلمتين فلا يكون إلا في حال الوصل فقط ولا بد من التخلص منه، وهذا هو موضوع الدرس.\nوطرق التخلص من التقاء الساكنين في كلمتين ثلاث: أولًا الحذف: إذا التقى ساكنان أولهما حرف مد فيحذف حرف المد وصلًا مثل (يَا مُوسَى اجْعَل) و(فِي الْأَرْضِ) و(حَاضِرِي الْمَسْجِدِ). ثانيًا التحريك: والقاعدة الأم عند حفص هي تحريك الساكن الأول بالكسر، ولكن هناك استثناءات يحرك فيها حفص بالضم أو بالفتح. فالتحريك بالضم له صورتان: الأولى إذا كان الساكن الأول واو الجمع أو واو اللين الدالة على الجمع مثل (عَصَوُا الرَّسُولَ) و(فَتَمَنَّوُا الْمَوْتَ)، والثانية إذا كان الساكن الأول ميم الجمع مثل (هُمُ الْعَدُوُّ) و(كُتِبَ عَلَيْكُمُ الْقِتَالُ).\nوالتحريك بالفتح له صورتان: الأولى تحريك النون بالفتح من لفظ (مِنَ) الجارة مثل (مِنَ الشَّاهِدِينَ) و(مِنَ الْخَالِدِينَ)، والثانية في فاتحة آل عمران (الم ۝ اللهُ) حيث تحرك الميم بالفتح عند الوصل. أما التحريك بالكسر فهو القاعدة الأم، ويلاحظ أن الساكن الأول غالبًا يكون أحد حروف (لتنود) أو (لتدنو): اللام مثل (قُلِ ادْعُوا)، والتاء مثل (قَالَتِ اخْرُجْ)، والنون مثل (أَنِ اقْتُلُوا)، والواو مثل (أَوِ اخْرُجُوا)، والدال مثل (وَلَقَدِ اسْتُهْزِئَ)، والتنوين مثل (أَحَدٌ اللهُ)، أو في بعض الحروف الأخرى مثل (فَارْجِعِ الْبَصَرَ) و(فَلْيَنْظُرِ الْإِنْسَانُ).\nوملحوظة هامة: هناك حالة أخرى للتحريك بالفتح وذلك في تاء التأنيث إذا أضيفت إلى ألف التثنية نحو (قَالَتَا) و(كَانَتَا)، فالتاء مبنية على السكون والألف ساكنة فحركت التاء بالفتح لأن الألف لا يناسبها إلا فتح ما قبلها.", "rules": ["التقاء الساكنين في كلمة واحدة: إما وقفًا فقط (تَعْمَلُونْ، عَنْهْ) ولا حاجة للتخلص منه، أو وصلًا ووقفًا (الصَّاخَّة، الطَّامَّة، الْحَاقَّة) ويتخلص منه بالمد ست حركات.", "التقاء الساكنين في كلمتين لا يكون إلا في حال الوصل فقط، ولا بد من التخلص منه.", "طريقة الحذف: إذا كان الساكن الأول حرف مد يحذف حرف المد وصلًا (يَا مُوسَى اجْعَل، فِي الْأَرْضِ).", "طريقة التحريك: القاعدة الأم عند حفص هي تحريك الساكن الأول بالكسر، وغالبًا ما يكون أحد حروف (لتنود / لتدنو).", "التحريك بالضم: إذا كان الساكن الأول واو الجمع أو واو اللين الدالة على الجمع (عَصَوُا الرَّسُولَ)، أو ميم الجمع (هُمُ الْعَدُوُّ).", "التحريك بالفتح: نون (مِنَ) الجارة (مِنَ الشَّاهِدِينَ)، وميم (الم ۝ اللهُ) في فاتحة آل عمران، وتاء التأنيث إذا لحقتها ألف التثنية (قَالَتَا)."], "examples": [{"word": "يَا مُوسَى اجْعَل", "note": "التخلص بالحذف: حذف ألف المد وصلًا لالتقائها بالساكن بعدها."}, {"word": "حَاضِرِي الْمَسْجِدِ", "note": "التخلص بالحذف: حذف ياء المد وصلًا."}, {"word": "عَصَوُا الرَّسُولَ", "note": "التحريك بالضم لأن الساكن الأول واو الجمع."}, {"word": "كُتِبَ عَلَيْكُمُ الْقِتَالُ", "note": "التحريك بالضم لأن الس ن استثناءات القاعدة الأم."}, {"q": "كيف نتخلص من التقاء الساكنين في كلمة واحدة وصلًا ووقفًا مثل (الْحَاقَّة)؟", "options": ["بحذف الألف", "بالمد ست حركات", "بكسر الألف", "لا نتخلص منه"], "answer": 1, "why": "التقاء الساكنين في كلمة واحدة وصلًا ووقفًا نتخلص منه بالمد ست حركات."}, {"q": "التقاء الساكنين في كلمتين لا يكون إلا في حالة:", "options": ["الوقف فقط", "الوصل فقط", "الوصل والوقف", "الابتداء"], "answer": 1, "why": "ذكر الكتاب أن التقاء الساكنين في كلمتين لا يكون إلا في حالة الوصل فقط ولا بد من التخلص منه."}]}, {"id": "L2_15", "title": "علاقات الحروف: المتماثلان والمتجانسان", "level": 2, "bookPages": "من الكتاب ص 229-235", "summary": "الثمرة من دراسة هذا الباب معرفة ما يدغم من الحروف في رواية حفص مثل (مِنْ رِزْق) و(فَلَمَّا أَثْقَلَتْ دَعَوَا) و(بَسَطْتَ)، والعناية بالإظهار في المواضع التي يسهل فيها الإدغام مثل (أَرْسَلْنَا) و(فَرِضْتُمْ) و(نَضِجَتْ جُلُودُهُمْ). وأنواع العلاقات بين الحروف: كل حرفين التقيا خطًّا ولفظًا (مَنَاسِكَكُمْ) أو التقيا خطًّا لا لفظًا (إِنَّهُ هُوَ)، أي جاءا متتاليين ولم يفصل بينهما فاصل في كلمة أو كلمتين، ينقسم كل منهما إلى أربعة أقسام: متماثلين ومتجانسين ومتقاربين ومتباعدين.\nوتنبيهات: الصلة لا يعتد بها فاصلًا لضعفها، والألف الموضوع عليها صفر مستطيل يعتد بها فاصلًا (أَنَا نَذِير)، وهمزة الوصل يعتد بها فاصلًا (أَنِ اسْتَغْفِرُوا)، والتنوين يعتد به فاصلًا (غَفُورٌ رَحِيم)، والنون المشددة لا تفصل، والحرف الموضوع عليه صفر مستدير لا يعتبر فاصلًا، وإذا التقى حرفان ساكنان عند الوقف فلا توصف العلاقة بصغير أو كبير أو مطلق بل تسمى (مقيد) مثل (الْعَبْدْ). والإدغام ينقسم إلى إدغام كامل وهو سقوط المدغم في المدغم فيه ذاتًا وصفة مع استكمال التشديد، وإدغام ناقص وهو سقوط المدغم ذاتًا لا صفة وعدم استكمال التشديد، والصفة التي تبقى هي الإطباق (بَسَطتَّ) والاستعلاء (أَلَمْ نَخْلُقكُّمْ) والغنة (إدغام النون في الواو والياء).\nأولًا المتماثلان: هما الحرفان اللذان اتحدا اسمًا ورسمًا، وأقسامهما ثلاثة: صغير (الأول ساكن والثاني متحرك: اضْرِبْ بِعَصَاكَ) وحكمه وجوب الإدغام إلا في مسألتين: إذا كان أول المثلين حرف مد (الَّذِي يُوعَدُونَ، اصْبِرُوا وَصَابِرُوا) فيجب ها فهي إشباع حركة الهاء وتحذف عند الوقف."}]}, {"id": "L2_16", "title": "علاقات الحروف: المتقاربان والمتباعدان", "level": 2, "bookPages": "من الكتاب ص 236-241", "summary": "تمهيد: اختلف العلماء في المتقاربين، ويتلخص ما يلي لمعرفتهما: (1) أن يكون الحرفان من نفس العضو ولم يفصل بينهما فاصل نحو (ء، ع) ونحو (الفاء مع كل من و، ب، م). (2) أن يكونا من عضوين مختلفين ولكن لا يفصل بينهما فاصل، وهذا في مسألتين فقط: الغين والخاء مع القاف والكاف، والحروف اللثوية مع الفاء. (3) أن يكون بينهما تقارب نسبي سواء كانا من عضو واحد (س، ش) أو من عضوين مختلفين (ن مع و، م)، وغالبًا ما ينطبق هذا القول على التقارب في الصفة دون المخرج.\nوتعريف المتقاربين: هما الحرفان اللذان تقاربا في المخرج والصفة، أو المخرج دون الصفة، أو الصفة دون المخرج. فالمتقاربان في المخرج والصفة مثل (قُل رَّبِّ): فالراء من طرف اللسان واللام من أدنى الحافتين إلى منتهى الطرف، وصفاتهما متقاربة (جهر، توسط، استفال، انفتاح، ذلاقة، انحراف) وتزيد الراء بالتكرار. والمتقاربان في المخرج دون الصفة مثل (عَدَدَ سِنِينَ): الدال والسين من طرف اللسان لكن الدال جهر وشدة وقلقلة والسين همس ورخاوة وصفير فالتباعد واضح في الصفات.\nوالمتقاربان في الصفة دون المخرج مثل (الرَّأْسُ شَيْبًا): السين من طرف اللسان والشين من وسطه، لكن صفاتهما متقاربة جدًّا (همس، رخاوة، استفال، انفتاح، إصمات) وتزيد السين بالصفير والشين بالتفشي. وملاحظة: اختلف العلماء كثيرًا في تحديد المتقاربين، ولكن الثمرة من الدراسة هي معرفة مواضع الإدغام لأن العبرة بالرواية. أقسام المتقاربين: صغير (الأول ساكن والثاني متحرك) وحكمه الإظهار لحفص إلا في عدة مسائل: (1) النون مع حروف (يرملون) ما عدا النون: إدغام واجب (مِن وَّلِيّ، مِن رِّزْق) ويستثنى الإظهار المطلق (صِنْوَان، قِنْوَان، دُنْيَا، بُنْيَان) والإظهار بسبب السكت (مَنْ رَاقٍ) والإظهار تبعًا للرواية (ن وَالْقَلَمِ، يس وَالْقُرْآنِ).\n(2) اللام الشمسية مع حروفها الأربعة عشر باستثناء اللام: إدغام واجب (السَّمَاء، الشَّيْطَان). (3) اللام من (قُل) و(بَل) وبعدها الراء: إدغام واجب (قُل رَّبِّ، بَل رَّفَعَهُ) ويستثنى (بَلْ رَانَ) للإظهار بسبب السكت. (4) القاف مع الكاف في (نَخْلُقكُّمْ): إدغام واجب واختلفوا هل هو كامل أم ناقص وليس لحفص من طريق الشاطبية إلا الإدغام الكامل. (5) النون مع حروف الإخفاء الحقيقي باستثناء القاف والكاف للتباعد: إخفاء (أَنْتُمْ، الْإِنْسَان).\n(6) النون مع الباء: القلب (مِنْ بَعْد). (7) (طسم): إدغام متقاربين واجب لحفص من الشاطبية. وكبير (كلاهما متحرك: عَدَدَ سِنِينَ) وحكمه الإظهار لحفص، ومطلق (الأول متحرك والثاني ساكن: أَحْمَل) وحكمه وجوب الإظهار لكل القراء. رابعًا المتباعدان: هما الحرفان اللذان تباعدا في المخرج والصفة مثل الهمزة والنون في (أَنْعَمْتَ)، وأقسامهم: صغير (تَأْلَمُونَ) وحكمه وجوب الإظهار إلا في مسألتين: النون مع القاف والنون مع الكاف فحكمهما الإخفاء، وكبير (دَهَاقًا) وحكمه وجوب الإظهار، ومطلق (أَنْفُسَهُمْ) وحكمه وجوب الإظهار.\nمعلومات هامة: شرط الإدغام أن يلتقي المدغم والمدغم فيه خطًّا ولفظًا (قَد تَّبَيَّنَ) أو خطًّا دون لفظ (إِنَّهُ هُوَ)، وأسباب الإدغام: التماثل والتجانس والتقارب، وموانع الإدغام الصغير: أن يكون أول المثلين حرف مد (الَّذِي يُوعَدُونَ)، أو أول المتقاربين أو المتجانسين حرف حلق (فَسَبِّحْهُ)، أو السكت (مَالِيَهْ هَلَكَ). وموانع الإدغام الكبير للفائدة فقط: المتفق عليها التنوين (سَمِيعٌ عَلِيم) والحرف المشدد (تَمَّ مِيقَات) والحرف الأول تاء ضمير (كُنْتُ تُرَابًا)، والمختلف فيها الجزم (يَخْلُ لَكُمْ) ووجود إخفاء قبل الحرف الأول (فَلَا يَحْزُنْكَ كُفْرُهُ).", "rules": ["المتقاربان: تقاربا في المخرج والصفة (قُل رَّبِّ)، أو المخرج دون الصفة (عَدَدَ سِنِينَ)، أو الصفة دون المخرج (الرَّأْسُ شَيْبًا).", "المتقاربان الصغير حكمه الإظهار لحفص إلا في: النون مع حروف يرملون عدا النون (إدغام)، اللام الشمسية مع حروفها (إدغام)، لام قل وبل مع الراء (إدغام)، القاف مع الكاف في نَخْلُقكُّمْ (إدغام كامل)، النون مع حروف الإخفاء عدا ق وك (إخفاء)، النون مع الباء (قلب)، طسم (إدغام).", "استثناءات إدغام النون في يرملون: الإظهار المطلق (صِنْوَان، قِنْوَان، دُنْيَا، بُنْيَان)، الإظهار بسبب السكت (مَنْ رَاقٍ)، الإظهار تبعًا للرواية (ن وَالْقَلَمِ، يس وَالْقُرْآنِ)، و(بَلْ رَانَ) للسكت.", "المتقاربان الكبير حكمه الإظهار لحفص، والمطلق وجوب الإظهار لكل القراء.", "المتباعدان: تباعدا في المخرج والصفة (أَنْعَمْتَ)، وحكم أقسامه الثلاثة وجوب الإظهار إلا النون مع القاف والنون مع الكاف فحك الإخفاء لا بالإدغام).", "إظهار النون عند حروف يرملون في (مِن وَّلِيّ) و(مِن رِّزْق)."], "practice": ["قُل رَّبِّ", "مِن وَّلِيٍّ", "مِن رِّزْقٍ", "صِنْوَانٌ وَغَيْرُ صِنْوَانٍ", "وَقِيلَ مَنْ ۜ رَاقٍ", "كَلَّا بَلْ ۜ رَانَ عَلَى قُلُوبِهِمْ", "ن ۣ وَالْقَلَمِ", "الشَّيْطَانُ", "بَل رَّفَعَهُ اللهُ إِلَيْهِ", "أَلَمْ نَخْلُقكُّمْ مِنْ مَاءٍ مَهِينٍ", "أَأَنْتُمْ", "الْإِنْسَانُ", "مِنْ بَعْدِ", "طسم", "عَدَدَ سِنِينَ", "الرَّأْسُ شَيْبًا", "أَنْعَمْتَ عَلَيْهِمْ", "أَنْفُسَهُمْ"], "quiz": [{"q": "ما نوع العلاقة بين اللام والراء في (قُل رَّبِّ)؟", "options": ["متماثلان", "متجانسان", "متقاربان في المخرج والصفة", "متباعدان"], "answer": 2, "why": "اللام والراء تقاربا في المخرج (طرف اللسان وحافتيه) وفي الصفات، فهما متقاربان في المخرج والصفة."}, {"q": "لماذا تظهر النون في (صِنْوَان) مع أن الواو من حروف يرملون؟", "options": ["بسبب السكت", "لأنه إظهار مطلق في كلمة واحدة", "تبعًا للرواية", "لأن الواو حرف مد"], "answer": 1, "why": "الكلمات الأربع (صِنْوَان، قِنْوَان، دُنْيَا، بُنْيَان) مستثناة من الإدغام وتسمى إظهارًا مطلقًا."}, {"q": "ما حكم (بَلْ رَانَ)؟", "options": ["إدغام واجب", "إظهار بسبب السكت", "إخفاء", "قلب"], "answer": 1, "why": "الأصل إدغام لام بل في الراء، لكن (بَلْ رَانَ) مستثناة للإظهار بسبب السكت."}, {"q": "ما حكم القاف مع الكاف في (نَخْلُقكُّمْ) لحفص من طريق الشاطبية؟", "options": ["الإظهار", "الإدغام الناقص", "الإدغام الكامل", "الإخفاء"], "answer": 2, "why": "اتفق القراء على الإدغام واختلفوا في كماله، وليس لحفص من طريق الشاطبية إلا الإدغام الكامل."}, {"q": "ما حكم المتباعدين الصغير مثل (تَأْلَمُونَ)؟", "options": ["وجوب الإدغام", "وجوب الإظهار إلا النون مع القاف والكاف فتخفى", "الإخفاء دائمًا", "القلب"], "answer": 1, "why": "المتباعدان الصغير حكمه وجوب الإظهار إلا في مسألتين: النون مع القاف والنون مع الكاف فحكمهما الإخفاء."}, {"q": "ما حكم المتقاربين المطلق مثل (أَحْمَل)؟", "options": ["الإدغام لحفص", "الإظهار لحفص فقط", "وجوب الإظهار لكل القراء", "الإخفاء"], "answer": 2, "why": "المتقاربان المطلق (الأول متحرك والثاني ساكن) حكمه وجوب الإظهار لكل القراء."}, {"q": "أي مما يلي ليس من موانع الإدغام الصغير؟", "options": ["أن يكون أول المثلين حرف مد", "أن يكون أول المتقاربين حرف حلق", "السكت", "التنوين"], "answer": 3, "why": "موانع الإدغام الصغير ثلاثة: حرف المد أولًا، حرف الحلق أولًا، والسكت. أما التنوين فمن موانع الإدغام الكبير."}, {"q": "ما الثمرة من دراسة باب علاقات الحروف كما ذكر الكتاب؟", "options": ["معرفة مخارج الحروف", "معرفة مواضع الإدغام والعناية بالإظهار فيما يسهل إدغامه", "معرفة أحكام المد", "معرفة الوقف والابتداء"], "answer": 1, "why": "الثمرة معرفة ما يدغم في رواية حفص، والعناية بالإظهار في المواضع التي يسهل فيها الإدغام مثل (أَرْسَلْنَا) و(نَضِجَتْ جُلُودُهُمْ)."}]}, {"id": "L3_01", "title": "النبر في القرآن الكريم", "level": 3, "bookPages": "من الكتاب ص 211-213", "summary": "النبر فرع من فروع علم الصوتيات. ومثاله في الكلام: إذا قيل (أحضرت الكتاب) بالإخبار، أو قيل (أحضرت الكتاب؟) بالاستفهام، فالجملة نطقت بنفس الطريقة مع تغيير نبرة الصوت أي الضغط على مقطع معين. والنبر لغة: شدة الصياح، واصطلاحًا: ضغط زائد على مقطع حرف معين حتى يكون صوته أعلى مما يجاوره من الحروف. وفي القرآن مواضع هامة للنبر تنقسم إلى ثلاثة أقسام: أولًا ما يجب فيه النبر وقفًا فقط، وله قسمان: (1) الوقف على المشدد المتطرف نحو (الْمَسّ) و(مُسْتَمِرّ) و(فَطَلّ)، لأن الحرف المشدد حرفان الأول ساكن والثاني متحرك، فعند الوقف يسقط الحرف الأخير لذلك لا بد من الضغط على مقطع الحرف حتى يتضح للسامع أن الحرف الموقوف عليه مشدد.\nويستثنى منه: النون والميم المشددتان لما فيهما من الغنة التي تكمل، وحروف قطب جد المسبوقة بمد لازم نحو (الْحَجّ) لوجود القلقلة. (2) الوقف على الهمز المتطرف بعد مد أو لين نحو (السَّمَاء) و(شَيْء) لأن الهمزة فيها صفتا الشدة والجهر، فيساعد النبر على تحقيقها وقرع صوتها. ثانيًا ما يجب فيه النبر وصلًا ووقفًا وله قسمان: (1) الواو والياء المشددتان نحو (تَوَّابًا) و(عَدُوّ) و(النَّبِيّ) و(سَيَّارَة)، فلا بد من الضغط عليهما حتى لا يتولد حرف مد أو لين فيذهب التشديد، مع الحذر من ضياع صفة الرخاوة.\n(2) الحرف الأول من المشدد بعد المد اللازم الكلمي المثقل نحو (الْحَاقَّة) و(الدَّابَّة)، فعند الانتقال من المد الطويل إلى الحرف الساكن يصعب تحقيق التصادم فلا بد من قرع مخرجه بقوة حتى لا يسقط من التلاوة، ويستثنى النون والميم المشددتان نحو (الطَّامَّة) و(الْجَانّ). ثالثًا ما يجب فيه النبر وصلًا فقط: ويكون للحذر من التباس المثنى بالمفرد نتيجة سقوط ألف التثنية للتخلص من التقاء الساكنين، وذلك في ثلاثة مواضع: النبر على القاف من (وَاسْتَبَقَا الْبَابَ) في يوسف، والنبر على القاف من (ذَاقَا الشَّجَرَةَ) في الأعراف، والنبر على اللام من (وَقَالَا الْحَمْدُ لِلَّهِ) في النمل.", "rules": ["النبر اصطلاحًا: ضغط زائد على مقطع حرف معين حتى يكون صوته أعلى مما يجاوره من الحروف.", "النبر وقفًا فقط: على المشدد المتطرف (الْمَسّ، فَطَلّ)، وعلى الهمز المتطرف بعد مد أو لين (السَّمَاء، شَيْء).", "يستثنى من النبر على المشدد المتطرف وقفًا: النون والميم المشددتان (لوجود الغنة)، وحروف قطب جد المسبوقة بمد لازم (لوجود القلقلة) نحو (الْحَجّ).", "النبر وصلًا ووقفًا: على الواو والياء المشددتين (تَوَّابًا، النَّبِيّ)، وعلى الحرف الأول من المشدد بعد المد اللازم الكلمي المثقل (الْحَاقَّة، الدَّابَّة).", "يستثنى من النبر على المشدد بعد المد اللازم: الميم والنون المشددتان (الطَّامَّة، الْجَانّ).", "النبر وصلًا فقط: عند سقوط ألف التثنية للتخلص من التقاء الساكنين، في ثلاثة مواضع: (وَاسْتَبَقَا الْبَابَ)، (ذَاقَا الشَّجَرَةَ)، (وَقَالَا الْحَمْدُ لِلَّهِ)."], "examples": [{"word": "الْمَسّ", "note": "نبر وقفًا فقط على المشدد المتطرف حتى يتضح أن الحرف الموقوف عليه مشدد."}, {"word": "الْحَجّ", "note": "استثناء: لا نبر فيه لأن الجيم من حروف القلقلة المسبوقة بمد لازم."}, {"word": "السَّمَاء", "note": "نبر وقفًا فقط على الهمز المتطرف بعد مد."}, {"word": "شَيْء", "note": "نبر وقفًا على الهمز المتطرف بعد حرف لين."}, {"word": "تَوَّابًا", "note": "نبر وصلًا ووقفًا على الواو المشددة حتى لا تتحول إلى واو مد."}, {"word": "النَّبِيّ", "note": "نبر وصلًا ووقفًا على الياء المشددة."}, {"word": "الْحَاقَّة", "note": "نبر على القاف الأولى المشددة بعد المد اللازم حتى لا تسقط من التلاوة."}, {"word": "الطَّامَّة", "note": "استثناء: لا نبر على الميم المشددة لوجود الغنة."}, {"word": "وَاسْتَبَقَا الْبَابَ", "note": "نبر وصلًا فقط على القاف حتى لا يلتبس المثنى بالمفرد بعد سقوط ألف التثنية."}, {"word": "وَقَالَا الْحَمْدُ لِلَّهِ", "note": "نبر وصلًا فقط على اللام لسقوط ألف التثنية."}], "commonErrors": ["الوقف على المشدد المتطرف دون نبر فيسقط الحرف الأخير ويسمع كأنه غير مشدد.", "تحويل الواو والياء المشددتين إلى حرف مد أو لين (نطق تَوَّابًا بواو ممدودة).", "المبالغة في النبر على الواو والياء المشددتين حتى تضيع صفة الرخاوة.", "إسقاط الحرف الأول من المشدد بعد المد اللازم في (الْحَاقَّة) و(الدَّابَّة).", "عدم النبر في (ذَاقَا الشَّجَرَةَ) وصلًا فيلتبس المثنى بالمفرد."], "practice": ["الْمَسّ", "مُسْتَمِرّ", "فَطَلّ", "السَّمَاء", "شَيْء", "تَوَّابًا", "عَدُوّ", "سَيَّارَة", "الْحَاقَّة", "الدَّابَّة", "وَاسْتَبَقَا الْبَابَ", "ذَاقَا الشَّجَرَةَ", "وَقَالَا الْحَمْدُ لِلَّهِ"], "quiz": [{"q": "ما تعريف النبر اصطلاحًا؟", "options": ["شدة الصياح", "ضغط زائد على مقطع حرف معين حتى يكون صوته أعلى مما يجاوره", "مد الصوت بحرف المد", "إخفاء الحرف عند الوقف"], "answer": 1, "why": "النبر لغة شدة الصياح، واصطلاحًا ضغط زائد على مقطع حرف معين حتى يكون صوته أعلى مما يجاوره من الحروف."}, {"q": "في أي حالة يكون النبر على المشدد المتطرف مثل (الْمَسّ)؟", "options": ["وصلًا فقط", "وقفًا فقط", "وصلًا ووقفًا", "لا نبر فيه"], "answer": 1, "why": "الوقف على المشدد المتطرف من مواضع النبر وقفًا فقط حتى يتضح أن الحرف الموقوف عليه مشدد."}, {"q": "لماذا لا يُنبر على الجيم عند الوقف على (الْحَجّ)؟", "options": ["لأنها حرف غنة", "لأنها من حروف القلقلة المسبوقة بمد لازم", "لأنها ليست مشددة", "لأنها حرف مد"], "answer": 1, "why": "حروف قطب جد المسبوقة بمد لازم مستثناة من النبر لأن القلقلة توضح أن الحرف مشدد."}, {"q": "النبر على الواو والياء المشددتين نحو (تَوَّابًا) و(النَّبِيّ) يكون:", "options": ["وقفًا فقط", "وصلًا فقط", "وصلًا ووقفًا", "في الابتداء فقط"], "answer": 2, "why": "الواو والياء المشددتان مما يجب فيه النبر وصلًا ووقفًا حتى لا يتولد حرف مد أو لين."}, {"q": "ما سبب النبر على القاف في (وَاسْتَبَقَا الْبَابَ) وصلًا؟", "options": ["لأن القاف حرف قلقلة", "حتى لا يلتبس المثنى بالمفرد بعد سقوط ألف التثنية", "لأن القاف مشددة", "لأن بعدها همزة وصل"], "answer": 1, "why": "تسقط ألف التثنية وصلًا للتخلص من التقاء الساكنين، فينبر على القاف حتى لا يلتبس المثنى بالمفرد."}, {"q": "أي الكلمات التالية مستثناة من النبر على المشدد بعد المد اللازم؟", "options": ["الْحَاقَّة", "الدَّابَّة", "الطَّامَّة", "الصَّاخَّة"], "answer": 2, "why": "الميم والنون المشددتان مستثناتان لما فيهما من غنة كاملة، نحو (الطَّامَّة) و(الْجَانّ)."}]}, {"id": "L3_02", "title": "همزة الوصل وهمزة القطع والفرق بينهما", "level": 3, "bookPages": "من الكتاب ص 217-218", "summary": "من سنن العرب في الكلام ثلاث: لا يجوز البدء إلا من أول حروف الكلمة، ولا يجوز البدء إلا بحرف متحرك، ولا يجوز الوقف إلا بالسكون أو ما في حكمه كالروم والإشمام. فإذا كان أول حروف الكلمة ساكنًا فلا بد من وسيلة نتوصل بها للنطق بالحرف الساكن، ومن هنا كانت همزة الوصل. والهمزات الواردة في القرآن لا تخرج عن كونها إما همزة وصل أو همزة قطع. فهمزة القطع هي الهمزة التي تثبت في الوصل والابتداء وهي حرف هجاء من أصل الكلمة، وحكمها أنها ثابتة في الوصل والابتداء على رواية حفص إلا في كلمة (ءَاعْجَمِيٌّ) فقرأها حفص بتسهيل همزة القطع الثانية بين الهمزة والألف، وسميت همزة قطع لأنه عند النطق بها يقطع ما قبلها عن ما بعدها.\nأما همزة الوصل فهي الهمزة الزائدة في أول الكلمة الثابتة في الابتداء والساقطة في الوصل، وحكمها أنها ثابتة في الابتداء ساقطة في الوصل، وسميت بذلك لأنه يتوصل بها إلى النطق بالحرف الساكن الذي يليها ولذلك سماها الخليل بن أحمد (سلم اللسان)، ولأنه عند الوصل تصل ما قبلها بما بعدها. وأهم الفروق بين الهمزتين: همزة الوصل تسقط عند الوصل وتثبت عند الابتداء، بينما همزة القطع تثبت في الحالين. همزة الوصل لا تأتي مع الفعل المضارع ولا الرباعي، وهمزة القطع تأتي معهما.\nهمزة الوصل إذا أتت بعد حرف مد يحذف حرف المد (فِي الْأَرْضِ)، وهمزة القطع إذا أتت بعد حرف مد يمد مدًّا فرعيًّا (السَّمَاءِ). همزة الوصل تأتي في أول الكلمة فقط، وهمزة القطع تأتي في أولها ووسطها وآخرها. همزة الوصل لا تأتي للاستفهام، وهمزة الاستفهام لا تكون إلا قطعًا وتكون مفتوحة دائمًا. همزة الوصل لا تأتي ساكنة، وهمزة القطع تأتي ساكنة في وسط الكلمة وآخرها وتأتي متحركة بالحركات الثلاث ومنونة. وفي الرسم: همزة الوصل يرسم عليها رأس الصاد الصغيرة (ٱ)، وهمزة القطع ترسم رأس العين الصغيرة (ء) سواء كانت على قاعدة أو بدون قاعدة.", "rules": ["من سنن العرب: لا يبدأ إلا من أول حروف الكلمة، ولا يبدأ إلا بمتحرك، ولا يوقف إلا على ساكن أو ما في حكمه.", "همزة القطع: حرف من أصل الكلمة تثبت وصلًا وابتداءً، ويقطع بها ما قبلها عما بعدها.", "همزة الوصل: همزة زائدة في أول الكلمة تثبت ابتداءً وتسقط وصلًا، ويتوصل بها إلى النطق بالساكن (سلم اللسان).", "استثناء حفص: كلمة (ءَاعْجَمِيٌّ) قرأها بتسهيل همزة القطع الثانية بين الهمزة والألف.", "همزة الوصل لا تأتي في المضارع ولا الرباعي، ولا تأتي للاستفهام، ولا تأتي ساكنة، ولا تأتي إلا في أول الكلمة.", "همزة الوصل بعد حرف مد: يحذف حرف المد، وهمزة القطع بعد حرف مد: يمد مدًّا فرعيًّا.", "الرسم: همزة الوصل عليها رأس صاد صغيرة، وهمزة القطع عليها رأس عين صغيرة."], "examples": [{"word": "ٱلْحَمْدُ لِلَّهِ", "note": "همزة وصل في (ال) تثبت ابتداءً وتسقط وصلًا."}, {"word": "فِي ٱلْأَرْضِ", "note": "همزة وصل بعد حرف مد فيحذف حرف المد وصلًا."}, {"word": "ٱلسَّمَاءِ", "note": "همزة قطع في آخر الكلمة بعد حرف مد فتمد مدًّا فرعيًّا (متصلًا)."}, {"word": "ءَاعْجَمِيٌّ", "note": "الاستثناء الوحيد عند حفص: تسهيل همزة القطع الثانية بين الهمزة والألف."}, {"word": "أَأَنْذَرْتَهُمْ", "note": "همزة الاستفهام همزة قطع مفتوحة دائمًا."}], "commonErrors": ["إثبات همزة الوصل في درج الكلام (نطق: وَ اَلْحَمْدُ) مع أنها تسقط وصلًا.", "قطع همزة الوصل أو وصل همزة القطع عند الابتداء.", "مد حرف المد قبل همزة الوصل بدل حذفه.", "تحقيق همزة القطع الثانية في (ءَاعْجَمِيٌّ) مع أن حفصًا يسهلها."], "practice": ["ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَالَمِينَ", "فِي ٱلْأَرْضِ", "وَٱلسَّمَاءِ ذَاتِ ٱلْبُرُوجِ", "ءَاعْجَمِيٌّ وَعَرَبِيٌّ", "أَأَنْذَرْتَهُمْ أَمْ لَمْ تُنْذِرْهُمْ", "وَإِذَا ٱلسَّمَاءُ ٱنْشَقَّتْ"], "quiz": [{"q": "ما حكم همزة الوصل؟", "options": ["تثبت في الوصل والابتداء", "ثابتة في الابتداء ساقطة في الوصل", "ساقطة في الابتداء ثابتة في الوصل", "ساقطة في الحالين"], "answer": 1, "why": "همزة الوصل همزة زائدة ثابتة في الابتداء ساقطة في الوصل."}, {"q": "من الذي سمى همزة الوصل (سلم اللسان)؟", "options": ["الإمام الشاطبي", "الخليل بن أحمد", "ابن الجزري", "حفص"], "answer": 1, "why": "لأنه يتوصل بها إلى النطق بالحرف الساكن سماها الخليل بن أحمد سلم اللسان."}, {"q": "ما الكلمة الوحيدة التي سهل فيها حفص همزة القطع؟", "options": ["أَأَنْذَرْتَهُمْ", "ءَاعْجَمِيٌّ", "ءَآلذَّكَرَيْنِ", "أَأَنْتُمْ"], "answer": 1, "why": "همزة القطع ثابتة عند حفص إلا في (ءَاعْجَمِيٌّ) فقرأها بتسهيل الهمزة الثانية بين الهمزة والألف."}, {"q": "إذا أتت همزة الوصل بعد حرف مد فإن حرف المد:", "options": ["يمد مدًّا فرعيًّا", "يحذف وصلًا", "يمد ست حركات", "يبقى كما هو"], "answer": 1, "why": "همزة الوصل إذا أتت بعد حرف مد يحذف حرف المد، بخلاف همزة القطع التي يمد قبلها مدًّا فرعيًّا."}, {"q": "أي العبارات التالية صحيحة؟", "options": ["همزة الوصل تأتي مع الفعل المضارع", "همزة الوصل تأتي للاستفهام", "همزة الوصل لا تأتي ساكنة أبدًا", "همزة الوصل تأتي في وسط الكلمة"], "answer": 2, "why": "همزة الوصل لا تأتي ساكنة، ولا تأتي مع المضارع ولا للاستفهام، ولا تأتي إلا في أول الكلمة."}, {"q": "ما العلامة التي ترسم فوق همزة الوصل في المصحف؟", "options": ["رأس عين صغيرة", "رأس صاد صغيرة", "صفر مستدير", "صفر مستطيل"], "answer": 1, "why": "يرسم على همزة الوصل رأس الصاد الصغيرة، أما همزة القطع فترسم رأس العين الصغيرة."}]}, {"id": "L3_03", "title": "مواضع همزة الوصل في الحروف والأسماء والأفعال وحركة البدء بها", "level": 3, "bookPages": "من الكتاب ص 218-223", "summary": "تأتي همزة الوصل في ثلاثة مواضع: الحروف والأسماء والأفعال. أولًا في الحروف: تدخل همزة الوصل على حرف اللام من (ال) التعريف فقط، سواء كانت لازمة مثل (الَّذِي) و(الَّتِي) أو غير لازمة مثل (الْأَرْض) و(الشَّمْس)، وتكون قياسية ولا توجد في أي حرف آخر، وحركة البدء بها في الحروف الفتح دائمًا. وملاحظة: تحذف همزة الوصل لفظًا وخطًّا من (ال) إذا دخل عليها لام الجر نحو (لِلْمُتَّقِينَ) أو لام التوكيد نحو (وَلَلْآخِرَةُ)، وتحذف لفظًا دون خطٍّ إذا دخل عليها أي حرف من أحرف الجر الباقية نحو (بِالْكِتَابِ) أو (فَالْعَاصِفَاتِ).\nثانيًا في الأسماء: همزة الوصل في الاسم غير المعرف بـ(ال) تكون إما قياسية وهي في مصدر الفعل الماضي الخماسي (افْتِرَاء، انْتِقَام، ابْتِغَاء) ومصدر الفعل الماضي السداسي (اسْتِغْفَار، اسْتِكْبَار، اسْتِعْجَالَهُم)، وإما سماعية وردت في سبع كلمات في القرآن: ابْن، ابْنَت، اثْنَيْن، اثْنَتَيْن، امْرُؤ، امْرَأَت، اسْم، وفي ثلاث كلمات من كلام العرب: اسْت، ابْنُم، ايْمُن (للقسم). وحركة البدء بهمزة الوصل في الأسماء الكسر دائمًا.\nوفي كلمة (الِاسْمُ) في قوله (بِئْسَ الِاسْمُ الْفُسُوقُ) يجوز وجهان حال الابتداء: الأول البدء بهمزة الوصل الأولى مفتوحة (أَلِسْمُ) لأن همزة الوصل الثانية سقطت في درج الكلام فالتقى ساكنان (اللام والسين) فحركت اللام بالكسر، ونبدأ بهمزة الوصل الأولى مفتوحة لأنها في (ال) التعريف، والثاني البدء باللام مكسورة (لِسْمُ) لأنه لم يعد هناك حاجة لهمزة الوصل الأولى، والوجه الأول هو المقدم في الأداء. ثالثًا في الأفعال: همزة الوصل قياسية وتوجد في الفعل الماضي الخماسي (وَانْطَلَقَ الْمَلَأُ)، والماضي السداسي (اسْتَحْوَذَ عَلَيْهِمُ الشَّيْطَانُ)، وفعل الأمر من الماضي الثلاثي (اكْشِفْ)، وفعل الأمر من الخماسي (اتَّخِذُوا)، وفعل الأمر من السداسي (اسْتَعِينُوا)، ولا تدخل على الفعل المضارع ولا الماضي الثلاثي ولا الرباعي مطلقًا.\nوحركة البدء بها في الأفعال: الضم إذا كان ثالث الفعل مضمومًا ضمًّا لازمًا (اذْكُرُوا، اجْتُثَّتْ)، والكسر إذا كان ثالث الفعل مكسورًا (اضْرِبْ) أو مفتوحًا (اتَّخَذَ) أو مضمومًا ضمًّا عارضًا، ولا يوجد في القرآن إلا خمسة أفعال ثالثها مضموم ضمًّا عارضًا: امْشُوا، اقْضُوا، ابْنُوا، امْشُوا (ص)، ائْتُوا، فنبدأ بها بالكسر لأن أصل الثالث الكسر (اقْضِيُوا) ونقلت ضمة الياء إلى الضاد ثم حذفت الياء. ملاحظات: يجب الانتباه للتشكيل لتحديد الفعل أمرًا أو ماضيًا (اتَّخِذُوا أمر، اتَّخَذُوا ماض)، ويجرد الفعل من الزوائد قبل عد الحروف، وهمزة الوصل هي الحرف الأول والحرف المشدد يتكون من حرفين، وإذا دخلت الواو على الفعل فلا يجوز قراءة الفعل بدونها إلا للاختبار.", "rules": ["في الحروف: همزة الوصل تدخل على (ال) التعريف فقط (لازمة أو غير لازمة)، وحركة البدء بها الفتح دائمًا.", "تحذف همزة الوصل من (ال) لفظًا وخطًّا إذا دخلت عليها لام الجر أو لام التوكيد (لِلْمُتَّقِينَ)، وتحذف لفظًا فقط مع بقية أحرف الجر (بِالْكِتَابِ).", "في الأسماء: قياسية في مصدر الماضي الخماسي والسداسي، وسماعية في سبع كلمات قرآنية (ابن، ابنت، اثنين، اثنتين، امرؤ، امرأت، اسم)، وحركة البدء بها ال  وَانْطَلَقَ)."], "practice": ["ٱلَّذِي خَلَقَ", "ٱلشَّمْسُ وَٱلْقَمَرُ", "ٱبْنَتَ عِمْرَانَ", "ٱمْرَأَتَ نُوحٍ وَٱمْرَأَتَ لُوطٍ", "ٱثْنَا عَشَرَ شَهْرًا", "ٱسْمُهُ أَحْمَدُ", "ٱسْتَحْوَذَ عَلَيْهِمُ ٱلشَّيْطَانُ", "رَبَّنَا ٱكْشِفْ عَنَّا ٱلْعَذَابَ", "ٱسْتَعِينُوا بِٱلصَّبْرِ وَٱلصَّلَاةِ", "ٱذْكُرُوا", "وَٱمْشُوا حَيْثُ تُؤْمَرُونَ", "فَقَالُوا ٱبْنُوا عَلَيْهِمْ بُنْيَانًا", "فَأَجْمِعُوا كَيْدَكُمْ ثُمَّ ٱئْتُوا صَفًّا"], "quiz": [{"q": "ما حركة البدء بهمزة الوصل في (ال) التعريف؟", "options": ["الكسر", "الضم", "الفتح", "حسب ثالث الكلمة"], "answer": 2, "why": "حركة البدء بهمزة الوصل في الحروف هي الفتح دائمًا."}, {"q": "ما حركة البدء بهمزة الوصل في الأسماء مثل (ابْن) و(اسْتِغْفَار)؟", "options": ["الفتح دائمًا", "الكسر دائمًا", "الضم دائمًا", "الفتح أو الكسر"], "answer": 1, "why": "نبدأ بهمزة الوصل في الأسماء مكسورة دائمًا."}, {"q": "متى يبدأ بهمزة الوصل في الفعل بالضم؟", "options": ["إذا كان ثالث الفعل مكسورًا", "إذا كان ثالث الفعل مفتوحًا", "إذا كان ثالث الفعل مضمومًا ضمًّا لازمًا", "إذا كان ثالث الفعل مضمومًا ضمًّا عارضًا"], "answer": 2, "why": "الضم يكون إذا كان ثالث الفعل مضمومًا ضمًّا لازمًا، وما عداه بالكسر."}, {"q": "كيف نبدأ بالفعل (اقْضُوا) في قوله (ثُمَّ اقْضُوا إِلَيَّ)؟", "options": ["بالضم لأن ثالثه مضموم", "بالكسر لأن ضمة الثالث عارضة", "بالفتح", "بالسكون"], "answer": 1, "why": "أصلها (اقْضِيُوا) فضمة الضاد عارضة منقولة من الياء، فيبدأ بها بالكسر وهي من الأفعال الخمسة."}, {"q": "أي الأفعال التالية لا تدخل عليه همزة الوصل مطلقًا؟", "options": ["الماضي الخماسي", "أمر الثلاثي", "الفعل المضارع", "الماضي السداسي"], "answer": 2, "why": "همزة الوصل لا تدخل على الفعل المضارع ولا الماضي الثلاثي ولا الرباعي مطلقًا."}, {"q": "ما الوجه المقدم في الأداء عند الابتداء بكلمة (الِاسْمُ) في (بِئْسَ الِاسْمُ الْفُسُوقُ)؟", "options": ["لِسْمُ بلام مكسورة", "أَلِسْمُ بهمزة مفتوحة", "اِسْمُ بهمزة مكسورة", "أُسْمُ بهمزة مضمومة"], "answer": 1, "why": "يجوز وجهان: (أَلِسْمُ) و(لِسْمُ)، والوجه الأول هو المقدم في الأداء."}, {"q": "في كلمة (لِلْمُتَّقِينَ) حذفت همزة الوصل:", "options": ["لفظًا فقط", "خطًّا فقط", "لفظًا وخطًّا", "لم تحذف"], "answer": 2, "why": "تحذف همزة الوصل لفظًا وخطًّا من (ال) إذا دخلت عليها لام الجر أو لام التوكيد."}]}, {"id": "L3_04", "title": "اجتماع همزتي الوصل والقطع في كلمة واحدة", "level": 3, "bookPages": "من الكتاب ص 223-225", "summary": "قد تجتمع همزة الوصل وهمزة القطع في كلمة واحدة، وذلك على صورتين. الصورة الأولى: تقدم همزة الوصل على همزة القطع الساكنة، وهذه الحالة خاصة بالأفعال فقط. والقاعدة: عند الوصل تسقط همزة الوصل وتثبت همزة القطع الساكنة، وعند الابتداء تثبت همزة الوصل وتحرك بناءً على حركة ثالث الفعل كما سبق، ثم تبدل همزة القطع بحرف مد من جنس حركة همزة الوصل حال الابتداء بها، وتسمى (قاعدة البدل). وأمثلتها: (اؤْتُمِنَ) في البقرة ثالث الفعل مضموم ضمًّا لازمًا فنبدأ بها (أُوتُمِنَ)، و(ائْتُونِي) في الأحقاف ثالث الفعل مضموم ضمًّا عارضًا فنبدأ بها (إِيتُونِي)، و(ائْذَنْ لِي) في التوبة ثالث الفعل مفتوح فنبدأ بها (إِيذَنْ لِي).\nالصورة الثانية: تقدم همزة القطع للاستفهام على همزة الوصل، وتكون في الأفعال وفي الأسماء. أولًا في الأفعال: شرط تطبيق القاعدة أن تكون في الفعل الذي لو تجردت عنه همزة القطع لبدأنا بهمزة الوصل مكسورة، والقاعدة: تحذف همزة الوصل وتبقى همزة القطع ولا يترتب على حذفها التباس الاستفهام بالخبر، لأن همزة القطع للاستفهام مفتوحة ولو تجردت لبدأنا بهمزة الوصل مكسورة فاختلاف الحركة يمنع الالتباس، ولم يرد في القرآن إلا في سبعة أفعال فقط: (أَتَّخَذْتُمْ) البقرة، (أَفْتَرَى) سبأ، (أَطَّلَعَ) مريم، (أَسْتَكْبَرْتَ) ص، (أَسْتَغْفَرْتَ) المنافقون، (أَصْطَفَى) الصافات، (أَتَّخَذْنَاهُمْ) ص.\nثانيًا في الأسماء: شرط تطبيق القاعدة أن تكون في اسم معرف بـ(ال) التعريف، والقاعدة: لا يجوز حذف همزة الوصل حتى لا يلتبس الاستفهام بالخبر لأن همزة القطع للاستفهام مفتوحة ولو تجردت عنها الكلمة لبدأنا بهمزة الوصل في (ال) مفتوحة أيضًا، ولا يجوز النطق بالهمزتين محققتين فيكون هناك وجهان: الأول الإبدال وهو إبدال همزة الوصل بألف مدية تمد ست حركات لزومًا (مد لازم كلمي) وهو المقدم في الأداء، والثاني التسهيل وهو تسهيل همزة الوصل بين الهمزة والألف مع عدم المد مطلقًا.\nولم يرد هذا إلا في ثلاث كلمات في ستة مواضع: (ءَآلذَّكَرَيْنِ) في الأنعام موضعان، (ءَآللهُ) في يونس والنمل، (ءَآلْآنَ) في يونس موضعان. وتنبيه هام: في (ءَاعْجَمِيٌّ) يجب تسهيل همزة القطع، أما في (ءَآلذَّكَرَيْنِ) و(ءَآللهُ) و(ءَآلْآنَ) فيجوز تسهيل همزة الوصل.", "rules": ["الصورة الأولى (خاصة بالأفعال): تقدم همزة الوصل على همزة القطع الساكنة، وصلًا تسقط همزة الوصل وتثبت همزة القطع، وابتداءً تثبت همزة الوصل وتبدل همزة القطع حرف مد من جنس حركة همزة الوصل (قاعدة البدل).", "أمثلة قاعدة البدل: (اؤْتُمِنَ) نبدأ بها أُوتُمِنَ، (ائْتُونِي) نبدأ بها إِيتُونِي، (ائْذَنْ لِي) نبدأ بها إِيذَنْ لِي.", "الصورة الثانية في الأفعال: تقدم همزة الاستفهام على همزة الوصل فتحذف همزة الوصل وتبقى همزة القطع، ولا التباس لأن حركة همزة الوصل كانت ستكون كسرًا، وذلك في سبعة أفعال فقط.", "الصورة الثانية في الأسماء المعرفة بـ(ال): لا يجوز حذف همزة الوصل لئلا يلتبس الاستفهام بالخبر، ولا يجوز تحقيق الهمزتين، فيجوز وجهان: الإبدال بألف مدية ست حركات (المقدم)، أو التسهيل بين الهمزة والألف بلا مد.", "المواضع الستة للأسماء: (ءَآلذَّكَرَيْنِ) الأنعام 143-144، (ءَآللهُ) يونس 59 والنمل 59، (ءَآلْآنَ) يونس 51 و91.", "تنبيه: في (ءَاعْجَمِيٌّ) التسهيل واجب وهو لهمزة القطع، وفي الكلمات الثلاث التسهيل جائز وهو لهمزة الوصل."], "examples": [{"word": "فَلْيُؤَدِّ ٱلَّذِي ٱؤْتُمِنَ", "note": "وصلًا تسقط همزة الوصل وتثبت همزة القطع الساكنة، وابتداءً: أُوتُمِنَ."}, {"word": "ٱئْتُونِي بِكِتَابٍ", "note": "ثالث الفعل مضموم ضمًّا عارضًا فنبدأ بها: إِيتُونِي."}, {"word": "ٱئْذَنْ لِي", "note": "ثالث الفعل مفتوح فنبدأ بها: إِيذَنْ لِي."}, {"word": "قُلْ أَتَّخَذْتُمْ عِنْدَ ٱللهِ عَهْدًا", "note": "أصلها (اتَّخَذْتُمْ) حذفت همزة الوصل وبقيت همزة الاستفهام."}, {"word": "أَفْتَرَى عَلَى ٱللهِ كَذِبًا", "note": "أصلها (افْتَرَى) حذفت همزة الوصل لدخول همزة الاستفهام."}, {"word": "أَصْطَفَى ٱلْبَنَاتِ", "note": "أصلها (اصْطَفَى) من الأفعال السبعة."}, {"word": "قُلْ ءَآلذَّكَرَيْنِ حَرَّمَ", "note": "اسم معرف بـ(ال): الإبدال بمد ست حركات (المقدم) أو التسهيل بلا مد."}, {"word": "قُلْ ءَآللهُ أَذِنَ لَكُمْ", "note": "الإبدال مع المد اللازم أو التسهيل."}, {"word": "ءَآلْآنَ وَقَدْ كُنْتُمْ", "no
