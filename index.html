أن ما بعدها ساكن", "لأنها همزة قطع"], "answer": 1, "why": "همزة الوصل في (ال) تبدأ مفتوحة كهمزة الاستفهام، فحذفها يلتبس به الاستفهام بالخبر."}, {"q": "ما الوجه المقدم في الأداء في (ءَآلذَّكَرَيْنِ)؟", "options": ["التسهيل بلا مد", "الإبدال بألف مدية تمد ست حركات", "تحقيق الهمزتين", "حذف همزة الوصل"], "answer": 1, "why": "الوجهان: الإبدال مع المد اللازم ست حركات وهو المقدم، والتسهيل بلا مد."}, {"q": "كم عدد الأفعال التي اجتمعت فيها همزة الاستفهام مع همزة الوصل في القرآن؟", "options": ["ثلاثة", "خمسة", "سبعة", "ستة"], "answer": 2, "why": "لم يرد ذلك إلا في سبعة أفعال: أَتَّخَذْتُمْ، أَفْتَرَى، أَطَّلَعَ، أَسْتَكْبَرْتَ، أَسْتَغْفَرْتَ، أَصْطَفَى، أَتَّخَذْنَاهُمْ."}, {"q": "ما الفرق بين التسهيل في (ءَاعْجَمِيٌّ) والتسهيل في (ءَآلْآنَ)؟", "options": ["لا فرق بينهما", "في الأولى واجب لهمزة القطع وفي الثانية جائز لهمزة الوصل", "في الأولى جائز وفي الثانية واجب", "كلاهما لهمزة الوصل"], "answer": 1, "why": "في (ءَاعْجَمِيٌّ) وجوب تسهيل همزة القطع، وفي الكلمات الثلاث جواز تسهيل همزة الوصل."}]}, {"id": "L3_05", "title": "القطع والسكت ومواضع السكت لحفص", "bookPages": "من الكتاب ص244-245", "summary": "في هذا الدرس نتعرف على مصطلحين يلتبسان على كثير من الطالبات: القطع والسكت. القطع لغةً هو الإبانة والإزالة (قطعت الشجرة أي أزلتها)، واصطلاحًا: قطع القراءة رأسًا والانصراف عنها إلى أمر خارجي، أي أن القارئة تنهي تلاوتها تمامًا. وموضعه على رأس الآية وفي أواخر السور، ولا يكون في وسط الآية، وإذا عادت القارئة إلى القراءة مرة أخرى استُحب لها أن تستعيذ من جديد. ولا يصح القطع على معنى غير صحيح مثل القطع عند {فَوَيْلٌ لِّلْمُصَلِّينَ}.\nأما السكت فهو لغةً المنع، واصطلاحًا: قطع الصوت على الحرف القرآني زمنًا يسيرًا لا يُتنفس فيه بنية استئناف القراءة. وقد قال ابن الجزري إن السكت مقيد بالسماع والنقل، فلا يجوز إلا فيما صحت الرواية به حال الوصل، فلا تجتهد القارئة في السكت من عندها. ولحفص عن عاصم من طريق الشاطبية ستة مواضع للسكت: أربعة منها واجبة إذا وصلت القارئة فلا بد من السكت فيها، وهي: السكت على الألف من {عِوَجًا} في الكهف، وعلى الألف من {مَّرْقَدِنَا} في يس، وعلى النون من {مَنْ رَاقٍ} في القيامة، وعلى اللام من {بَلْ رَانَ} في المطففين.\nواثنان جائزان لهما وجهان عند الوصل: السكت على هاء {مَالِيَهْ} قبل {هَلَكَ} في الحاقة، والوجه الآخر الإدغام بدون سكت، والسكت على الميم من {عَلِيمٌ} آخر الأنفال عند وصلها بأول التوبة في أحد الأوجه. وبين آخر الأنفال وأول التوبة خمسة عشر وجهًا للمد: الوقف وفيه السكون المحض (2-4-6) والإشمام (2-4-6) والروم (2)، والوصل مع السكت بنفس الأوجه، والوصل بدون سكت مع القلب (حركتان).", "rules": ["القطع: قطع القراءة رأسًا والانصراف عنها إلى أمر خارجي، ويكون على رأس الآية وأواخر السور لا في وسط الآية.", "إذا قطعت القارئة ثم عادت للقراءة استُحب لها الاستعاذة مرة أخرى، ولا يصح القطع على معنى غير صحيح.", "السكت: قطع الصوت على الحرف القرآني زمنًا يسيرًا بلا تنفس بنية استئناف القراءة، وهو مقيد بالسماع والنقل.", "لحفص من طريق الشاطبية أربع سكتات واجبة عند الوصل: عوجًا (الكهف 1)، مرقدنا (يس 52)، من راق (القيامة 27)، بل ران (المطففين 14).", "لحفص سكتتان جائزتان: ماليه هلك (الحاقة 28-29) وفيه وجه آخر هو الإدغام بدون سكت، والسكت على ميم عليم بين الأنفال والتوبة في أحد الأوجه.", "أوجه الرواية بين آخر الأنفال وأول التوبة 15 وجهًا: الوقف (سكون محض 2-4-6، إشمام 2-4-6، روم 2)، الوصل مع السكت (نفس الأوجه)، الوصل بدون سكت مع القلب (2)."], "examples": [{"word": "قَيِّمًا ۜ... عِوَجًا", "note": "سكت واجب على ألف عوجًا عند وصلها بما بعدها (الكهف 1)، ويُمنع بذلك توهم أن قيمًا صفة لعوجًا."}, {"word": "مِن مَّرْقَدِنَا ۜ هَٰذَا", "note": "سكت واجب على الألف من مرقدنا عند الوصل (يس 52)."}, {"word": "مَنْ ۜ رَاقٍ", "note": "سكت واجب على النون الساكنة، فلا تُدغم النون في الراء (القيامة 27)."}, {"word": "بَلْ ۜ رَانَ", "note": "سكت واجب على اللام الساكنة، فلا تُدغم اللام في الراء (المطففين 14)."}, {"word": "مَالِيَهْ ۜ هَلَكَ", "note": "سكت جائز على الهاء عند الوصل، والوجه الآخر الإدغام بدون سكت (الحاقة 28-29)."}, {"word": "عَلِيمٌ ۜ بَرَاءَةٌ", "note": "سكت جائز على ميم عليم عند وصل آخر الأنفال بأول التوبة في أحد الأوجه."}, {"word": "فَوَيْلٌ لِّلْمُصَلِّينَ", "note": "لا يصح القطع هنا لأنه قطع على معنى غير صحيح."}], "commonErrors": ["الخلط بين القطع والوقف والسكت: القطع إنهاء القراءة، والوقف قطع الصوت مع التنفس، والسكت قطع الصوت بلا تنفس.", "التنفس أثناء السكت، وهذا يخرجه من السكت إلى الوقف.", "إدغام النون في الراء في {مَنْ رَاقٍ} أو اللام في الراء في {بَلْ رَانَ} عند الوصل بدل السكت.", "السكت في مواضع لم تصح بها الرواية اجتهادًا من القارئة.", "القطع في وسط الآية أو على معنى غير صحيح."], "practice": ["وَلَمْ يَجْعَل لَّهُ عِوَجًا ۜ قَيِّمًا", "مَن بَعَثَنَا مِن مَّرْقَدِنَا ۜ هَٰذَا مَا وَعَدَ الرَّحْمَٰنُ", "وَقِيلَ مَنْ ۜ رَاقٍ", "كَلَّا بَلْ ۜ رَانَ عَلَىٰ قُلُوبِهِم", "مَا أَغْنَىٰ عَنِّي مَالِيَهْ ۜ هَلَكَ عَنِّي سُلْطَانِيَهْ"], "quiz": [{"q": "ما تعريف السكت اصطلاحًا؟", "options": ["قطع القراءة رأسًا والانصراف عنها", "قطع الصوت على الحرف القرآني زمنًا يسيرًا لا يتنفس فيه بنية استئناف القراءة", "قطع الصوت على آخر الكلمة زمنًا يتنفس فيه", "إطالة الصوت بحرف المد"], "answer": 1, "why": "هذا هو تعريف السكت في الكتاب، ويميزه عن الوقف عدم التنفس فيه."}, {"q": "كم عدد مواضع السكت لحفص من طريق الشاطبية؟", "options": ["أربعة كلها واجبة", "ستة: أربعة واجبة واثنان جائزان", "اثنان فقط", "ثمانية"], "answer": 1, "why": "لحفص ستة مواضع: أربعة واجبة إذا وصل، واثنان جائزان لهما وجهان."}, {"q": "أي المواضع التالية سكت جائز لا واجب؟", "options": ["عوجًا في الكهف", "مرقدنا في يس", "ماليه هلك في الحاقة", "بل ران في المطففين"], "answer": 2, "why": "ماليه هلك من السكتات الجائزة، ولها وجه آخر هو الإدغام بدون سكت."}, {"q": "أين يكون القطع؟", "options": ["في وسط الآية", "على رأس الآية وأواخر السور", "في أي موضع من الكلمة", "بعد حرف المد فقط"], "answer": 1, "why": "القطع يكون على رأس الآية وفي أواخر السور ولا يكون في وسط الآية."}, {"q": "ماذا قال ابن الجزري عن السكت؟", "options": ["يجوز في أي موضع يحسن فيه المعنى", "مقيد بالسماع والنقل فلا يجوز إلا فيما صحت به الرواية", "لا يجوز لحفص مطلقًا", "يجب في كل ساكن قبل راء"], "answer": 1, "why": "السكت توقيفي لا يُجتهد فيه، وهذا نص كلام ابن الجزري في الكتاب."}, {"q": "كم وجهًا للرواية بين آخر الأنفال وأول التوبة؟", "options": ["ثلاثة", "سبعة", "خمسة عشر", "عشرون"], "answer": 2, "why": "الوقف 7 أوجه، والوصل مع السكت 7 أوجه، والوصل بدون سكت مع القلب وجه واحد، فالمجموع 15."}], "level": 3}, {"id": "L3_06", "title": "الوقف وأقسامه: الوقف التام والوقف الكافي", "bookPages": "من الكتاب ص247-257", "summary": "تكفل الله بحفظ القرآن الكريم وقيض له علماء مخلصين في علوم تحرسه من التحريف: الرسم العثماني، والنحو، والصرف، والتجويد، والوقف والابتداء، والقراءات. وقد سُئل علي رضي الله عنه عن قوله تعالى {وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا} فقال: الترتيل تجويد الحروف ومعرفة الوقوف. وقال ابن الجزري: وبعد تجويدك للحروف، لا بد من معرفة الوقوف. فالوقف لغةً الكف والحبس، واصطلاحًا: قطع الصوت على آخر الكلمة القرآنية زمنًا يُتنفس فيه عادةً بنية استئناف القراءة.\nومواضعه: رأس الآية ووسطها وعند انتهاء السورة. وشرطه أن يتنفس معه، وألا يكون فيما اتصل رسمًا كالوقف على (أين) من (أينما)، وتُقرأ البسملة مع أوائل السور إلا براءة. وحكمه الجواز ما لم يوجد ما يمنعه، فإن كان الوقف يغير المعنى لزم الوصل، وإن كان الوصل يغير المعنى لزم الوقف؛ قال ابن الجزري: وليس في القرآن من وقف يجب، ولا حرام غير ما له سبب. وأقسام الوقف أربعة: اضطراري (لعارض كالعطاس وضيق النفس)، واختباري (يطلبه الممتحن)، وانتظاري (لاستيفاء أوجه الخلاف عند العرض على الشيخ)، واختياري (يقف القارئ باختياره دون عذر) وهو المقصود في هذا الباب، وأقسامه: تام وكافٍ وحسن وقبيح، بحسب التعلق اللفظي (الإعرابي) والمعنوي بين موضع الوقف وما بعده.\nفالتام: ما تم معناه ولا يتعلق بما بعده لا معنىً ولا لفظًا، ويكون في أواخر السور ورؤوس الآي وانتهاء القصص والانتقال من حال إلى حال، وهو قسمان: تام مطلق يحسن الوقف عليه ويجوز الوصل، وبيان تام (لازم) يلزم الوقف عليه ولا يجوز الوصل لأنه يغير المعنى، مع التنبيه أن اللزوم اصطلاحي لا شرعي. والكافي: ما تم معناه ويتعلق بما بعده معنىً لا لفظًا، وهو كذلك كافٍ مطلق وبيان كافٍ لازم، ومواضعه أواخر الآيات وأكثره في أثنائها.", "rules": ["الوقف: قطع الصوت على آخر الكلمة القرآنية زمنًا يتنفس فيه عادة بنية استئناف القراءة، ومواضعه رأس الآية ووسطها وانتهاء السورة.", "شروط الوقف: أن يتنفس معه، وألا يكون فيما اتصل رسمًا (كالوقف على أين من أينما)، وتُقرأ البسملة مع أوائل السور إلا براءة.", "حكم الوقف الجواز ما لم يوجد ما يمنعه؛ فإن كان الوقف يغير المعنى لزم الوصل، وإن كان الوصل يغير المعنى لزم الوقف.", "أقسام الوقف: اضطراري، اختباري، انتظاري، اختياري. والاختياري أقسامه: تام، كافٍ، حسن، قبيح.", "التعلق اللفظي: ما قبل الوقف متعلق بما بعده في الإعراب. التعلق المعنوي: متعلق بما بعده في المعنى. وإذا وُجد تعلق لفظي فلا بد من تعلق معنوي.", "الوقف التام: لا تعلق لفظي ولا معنوي. مطلق (يحسن الوقف ويجوز الوصل) أو بيان تام لازم (يلزم الوقف والابتداء ولا يجوز الوصل لأنه يغير المعنى).", "الوقف الكافي: تم معناه ويتعلق بما بعده معنى لا لفظًا. مطلق (يحسن الوقف ويجوز الوصل) أو بيان كافٍ لازم (يلزم الوقف ولا يجوز الوصل).", "قد يتفاضل الوقف التام في التمام (مالك يوم الدين تام، إياك نستعين أتم)، وقد يختلف نوع الوقف مع اختلاف التفسير."], "examples": [{"word": "أُعِدَّتْ لِلْكَافِرِينَ ۝ وَبَشِّرِ الَّذِينَ آمَنُوا", "note": "وقف تام على رأس آية، فصل بين آيتي العذاب والرحمة (البقرة 24-25)."}, {"word": "وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ ۝ إِنَّ الَّذِينَ كَفَرُوا", "note": "وقف تام: الانتقال من حال المؤمن إلى حال الكافر (البقرة 5-6)."}, {"word": "فَاصْبِرْ إِنَّ الْعَاقِبَةَ لِلْمُتَّقِينَ ۝ وَإِلَىٰ عَادٍ أَخَاهُمْ هُودًا", "note": "وقف تام: انتهاء قصة نوح وبداية قصة هود (هود 49-50)."}, {"word": "لَقَدْ أَضَلَّنِي عَنِ الذِّكْرِ بَعْدَ إِذْ جَاءَنِي ● وَكَانَ الشَّيْطَانُ لِلْإِنسَانِ خَذُولًا", "note": "وقف تام في وسط آية: الانتقال من قول الظالم إلى قول الله عز وجل (الفرقان 29)."}, {"word": "وَأَنزَلَ الْفُرْقَانَ ● إِنَّ الَّذِينَ كَفَرُوا", "note": "وقف تام في وسط الآية (آل عمران 4)."}, {"word": "وَبِاللَّيْلِ ● أَفَلَا تَعْقِلُونَ", "note": "وقف تام بعد رأس الآية بكلمة (الصافات 137-138)، وهناك رأي آخر أنه كافٍ."}, {"word": "مَالِكِ يَوْمِ الدِّينِ ۝ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ", "note": "كلاهما تام، لكن الثاني أتم لأنه مشترك مع ما بعده في معنى الخطاب."}, {"word": "وَمَا يَعْلَمُ تَأْوِيلَهُ إِلَّا اللَّهُ ● وَالرَّاسِخُونَ فِي الْعِلْمِ", "note": "يختلف نوع الوقف باختلاف التفسير: تام إن كانت الواو للاستئناف، وليس بتام إن كانت الواو للعطف."}, {"word": "فَإِنَّهَا مُحَرَّمَةٌ عَلَيْهِمْ أَرْبَعِينَ سَنَةً يَ ء بما بعده، وإن كان على رأس الآية جاز الوقف والابتداء لأن الوقف على رؤوس الآي سنة (مذهب ابن الجزري الذي يتبعه الكتاب)، والدليل حديث أم سلمة رضي الله عنها أن النبي صلى الله عليه وسلم كان يقطع قراءته آية آية.\nواختلف العلماء في الوقف الحسن على رأس الآية على ثلاثة مذاهب: جواز الوقف والابتداء مطلقًا، وجواز الوقف دون الابتداء مطلقًا، وجواز الوقف والابتداء إن أفاد معنى، ومذهب رابع قليل أجاز السكت. أما الوقف القبيح: فهو الوقف على كلام لا يؤدي معنى صحيحًا لشدة تعلقه بما بعده معنىً ولفظًا، ولا يجوز إلا للضرورة، وأقسامه خمسة: ما لا يفيد معنى (كالوقف على المضاف دون المضاف إليه)، وما يغير المعنى (كالوقف على المستثنى منه دون الاستثناء)، وما يعطي معنى فاسدًا عامًا، وما يعطي معنى لا يليق بالله تعالى، ووقف التعسف الذي يتكلفه بعض القارئين ولا يصح بأي حال.\nثم الابتداء: وهو الشروع في القراءة بعد وقف أو بعد قطع. فالابتداء بعد الوقف التام تام، وبعد الكافي كافٍ، وبعد الحسن على رأس الآية حسن، وبعد الحسن في وسط الآية قبيح، وبعد القبيح قبيح. وكل ما في القرآن من كلمة (الذين) يجوز الابتداء بها ووصلها بما قبلها إلا في سبعة مواضع يجب الابتداء بها ولا يجوز وصلها بما قبلها. والابتداء بعد القطع حسن إن كان بعد وقف تام أو كافٍ، وغير حسن بعد الحسن والقبيح، وينبغي للقارئ أن يقطع على معنى صحيح ويبدأ بكلام مترابط دون التقيد بنهاية الأرباع والأحزاب.\nويختم الدرس بعلامات الوقف في المصحف.", "rules": ["الوقف الحسن: تم معناه ويتعلق بما بعده معنى ولفظًا. يحسن الوقف عليه؛ وفي وسط الآية لا يجوز الابتداء بما بعده، وعلى رأس الآية يجوز الابتداء لأن الوقف على رؤوس الآي سنة.", "الوقف القبيح: لا يؤدي معنى صحيحًا لشدة تعلقه بما بعده معنى ولفظًا، ولا يجوز إلا للضرورة.", "أقسام القبيح: لا يفيد معنى، يغير المعنى، يعطي معنى فاسدًا (عام)، يعطي معنى لا يليق بالله تعالى (خاص)، وقف التعسف.", "الابتداء: الشروع في القراءة بعد وقف أو قطع. بعد التام تام، بعد الكافي كافٍ، بعد الحسن رأس آية حسن، بعد الحسن وسط آية قبيح، بعد القبيح قبيح.", "كل (الذين) في القرآن يجوز الابتداء بها ووصلها بما قبلها إلا سبعة مواضع يجب الابتداء بها: البقرة 121، البقرة 146، البقرة 275، الأنعام 20، التوبة 20، الفرقان 34، غافر 7.", "الابتداء بعد القطع: حسن ": ["لا يتعلق بما بعده", "يتعلق بما بعده معنى فقط", "يتعلق بما بعده معنى ولفظًا", "لم يتم معناه"], "answer": 2, "why": "الحسن يتعلق بما بعده لفظًا ومعنى لكنه يعطي معنى حسنًا يصح الوقف عليه."}, {"q": "ما حكم الابتداء بما بعد الوقف الحسن على رأس الآية عند ابن الجزري؟", "options": ["لا يجوز مطلقًا", "يجوز لأن الوقف على رؤوس الآي سنة", "يجب السكت", "يجوز في وسط الآية فقط"], "answer": 1, "why": "الكتاب يتبع مذهب ابن الجزري الذي أجاز الوقف والابتداء على رأس الآية لحديث أم سلمة."}, {"q": "الوقف على {فَلَبِثَ فِيهِمْ أَلْفَ سَنَةٍ} دون {إِلَّا خَمْسِينَ عَامًا} من القبيح الذي:", "options": ["لا يفيد معنى", "يغير المعنى", "يعطي معنى لا يليق بالله", "تعسف"], "answer": 1, "why": "الوقف على المستثنى منه دون الاستثناء يغير المعنى."}, {"q": "الوقف على {عَيْنًا فِيهَا تُسَمَّىٰ} ثم الابتداء بـ{سَلْسَبِيلًا} على معنى (سل سبيلا) هو:", "options": ["وقف تام", "وقف كافٍ", "وقف تعسف", "وقف لازم"], "answer": 2, "why": "هذا من وقف التعسف الذي يتكلفه بعض القارئين ولا يصح بأي حال وفيه تحريف للمعنى."}, {"q": "الابتداء بما بعد الوقف الحسن في وسط الآية يكون:", "options": ["تامًا", "كافيًا", "حسنًا", "قبيحًا"], "answer": 3, "why": "بحسب الجدول: الوقف الحسن وسط آية يتبعه ابتداء قبيح."}, {"q": "علامة (صلي) في المصحف تعني:", "options": ["الوقف اللازم", "الوقف الجائز والوقف أولى", "الوقف الجائز والوصل أولى", "ممنوع الوقف"], "answer": 2, "why": "صلي: علامة الوقف الجائز والوصل أولى، أما قلي فالوقف أولى."}, {"q": "كم موضعًا في القرآن يجب الابتداء فيه بكلمة (الذين) ولا يجوز وصلها بما قبلها؟", "options": ["ثلاثة", "خمسة", "سبعة", "عشرة"], "answer": 2, "why": "سبعة مواضع: البقرة 121، 146، 275، الأنعام 20، التوبة 20، الفرقان 34، غافر 7."}], "level": 3}, {"id": "L3_08", "title": "الوقف على الكلمة الصحيحة الآخر: السكون والروم والإشمام والحذف والإبدال", "bookPages": "من الكتاب ص267-273", "summary": "الكلمة الصحيحة الآخر هي التي تنتهي بحرف صحيح لا بحرف مد، مثل (فحدث). وللوقف عليها خمسة أوجه: السكون المحض، والروم، والإشمام، والحذف، والإبدال. فالسكون المحض: عزل الحركة عن الحرف، والمحض الخالي من الروم والإشمام، ويكون في المضموم والمفتوح والمكسور ولو منونًا باستثناء المنون بالنصب الذي يبدل ألفًا، وفي الساكن وصلًا ووقفًا. والروم لغةً الطلب، واصطلاحًا: تضعيف الصوت بالحركة حتى يذهب معظم صوتها، ويكون في المكسور والمضموم ولو منونًا مع مراعاة الموانع، والروم كالوصل في المد والأحكام، ويدركه القريب دون البعيد.\nوالإشمام: ضم الشفتين بدون صوت بُعيد تسكين الحرف الأخير إشارةً للضم بدون تراخٍ مع بقاء فرجة بين الشفتين، ويكون في المضموم ولو منونًا، والإشمام كالوقف، ويدركه المبصر دون الأعمى. والحذف: حذف التنوين وقفًا في المرفوع والمجرور والمنصوب على هاء التأنيث، وحذف صلة هاء الضمير، وليس لحفص من صلة ميم الجمع والياءات الزوائد إلا كلمة {ءَاتَيْنِ} في النمل. والإبدال: إبدال التنوين المنصوب ألفًا مدية وقفًا (مد العوض) سواء رسمت الألف أم لا، ويلحق به إذًا ونون التوكيد، وإبدال تاء التأنيث هاء ساكنة.\nوللروم والإشمام موانع: الساكن وصلًا ووقفًا، وعارض الشكل (الحركة العارضة للتخلص من التقاء الساكنين ويلحق بها حينئذ ويومئذ)، والمفتوح لخفة الفتحة التي لا تقبل التبعيض، وهاء التأنيث المرسومة بالهاء المربوطة بالإجماع، وهاء الضمير التي فُصل فيها مذهب ابن الجزري بالمنع في أربع حالات والجواز في ثلاث. ويفرق الكتاب بين الروم والاختلاس، وبين الروم والإشمام، ويذكر أن الغرض من الروم والإشمام بيان الفرق بين الحركات بين القراء وبيان المعنى عند الوقف وترسيخ الحركة عند الحفظ، ثم يختم بتطبيقات تبين عدد أوجه الوقف على كلمات مثل عليم ونستعين وكتاب وقدير والسماء وجنة وربه وشيء.", "rules": ["أوجه الوقف على الصحيح الآخر: السكون المحض، الروم، الإشمام، الحذف، الإبدال.", "السكون المحض في المضموم والمفتوح والمكسور ولو منونًا (عدا المنون بالنصب) وفي الساكن.", "الروم: تضعيف الصوت بالحركة حتى يذهب معظم صوتها، في المكسور والمضموم ولو منونًا، وهو كالوصل، ويدركه القريب دون البعيد.", "الإشمام: ضم الشفتين بدون صوت بعيد تسكين الحرف الأخير إشارة للضم، في المضموم فقط ولو منونًا، وهو كالوقف، ويدركه المبصر دون الأعمى.", "الحذف وقفًا: حذف تنوين المرفوع (كريمٌ) والمجرور (كتابٍ) والمنصوب على هاء التأنيث (شجرةً)، وحذف صلة هاء الضمير (بهِ، ربهُ)، وليس لحفص من الياءات الزوائد إلا ءاتين (النمل).", "الإبدال وقفًا: إبدال تنوين النصب ألفًا مدية تمد حركتين (مد العوض) ويلحق به إذًا ونون التوكيد (لنسفعًا، ليكونًا)، وإبدال تاء التأنيث هاء ساكنة (الحكمة، الجنة).", "موانع الروم والإشمام: الساكن وصلًا ووقفًا، عارض الشكل، المفتوح، هاء التأنيث المربوطة، هاء الضمير على التفصيل.", "مذهب ابن الجزري في هاء الضمير: يمتنع الروم والإشمام إذا سبقت الهاء ياء ساكنة أو كسر أو واو ساكنة أو ضم، ويجوزان إذا سبقتها ألف مدية أو فتح أو ساكن صحيح.", "الفرق بين الروم والاختلاس: الروم يذهب الكثير من الحركة ويبقى القليل وفي الوقف فقط ولا يأتي في المفتوح وفي الحرف الأخير ويصاحبه تضعيف الصوت؛ والاختلاس عكس ذلك.", "عند الوقف يجب مراعاة المد العارض للسكون ومد اللين والقلقلة وأحوال الراء."], "examples": [{"word": "عَلِيمٌ", "note": "نحذف التنوين ثم نقف بسبعة أوجه: السكون المحض مع المد العارض (2-4-6)، الإشمام مع المد العارض (2-4-6)، الروم مع القصر (2)."}, {"word": "نَسْتَعِينُ", "note": "سبعة أوجه: سكون محض 3، إشمام 3، روم مع القصر 1."}, {"word": "كِتَابٍ", "note": "نحذف التنوين ثم نقف بأربعة أوجه: السكون المحض مع المد العارض مع القلقلة (3)، والروم مع القصر بدون قلقلة (1)."}, {"word": "الرَّسُولُ", "note": "أربعة أوجه: السكون المحض مع المد العارض (3)، الروم مع القصر (1)؛ ولا إشمام لأنها مرفوعة لكن لم يذكر الكتاب الإشمام هنا بل ذكر أربعة أوجه."}, {"word": "قَدِيرٌ", "note": "سبعة أوجه: السكون المحض مع المد العارض مع ترقيق الراء (3)، الإشمام مع المد العارض مع ترقيق الراء (3)، الروم مع القصر مع تفخيم الراء (1)."}, {"word": "السَّمَاءُ", "note": "ثمانية أوجه: السكون المحض مع المد (4-5-6)، الإشمام مع المد (4-5-6)، الروم مع المد (4-5)."}, {"word": "نُوحًا", "note": "إبدال التنوين المنصوب ألفًا مدية تمد حركتين ويسمى مد عوض."}, {"word": "جَنَّةً", "note": "نحذف التنوين ونبدل التاء هاء ثم نقف على الهاء بالسكون المحض فقط، ويمتنع الروم والإشمام لأن الحركة كانت على التاء لا على الهاء."}, {"word": "رَبِّهِ", "note": "مذهب ابن الجزري: نحذف الصلة ونقف على الهاء بالسكون المحض، ويجوز الروم والإشمام لأن ما قبل الهاء مفتوح والهاء مضمومة؛ فالأوجه أربعة."}, {"word": "شَيْءٍ", "note": "نحذف التنوين ونقف بثلاثة أوجه: السكون المحض مع مد اللين (2-4-6)، والروم (حرف اللين يمد ما دون الطبيعي)."}, {"word": "فَأَلْقِيهِ", "note": "يمتنع الروم والإشمام لأن ما قبل هاء الضمير ياء ساكنة (مذهب ابن الجزري): ثلاثة أوجه بالسكون المحض مع المد العارض (2-4-6)."}, {"word": "قُمْ فَأَنذِرْ، وَرَبَّكَ فَكَبِّرْ", "note": "ساكن وصلًا ووقفًا فيمتنع الروم والإشمام."}, {"word": "جَاءَهُمُ الْعِلْمُ، أَنذِرِ النَّاسَ", "note": "عارض الشكل: حركة عارضة للتخلص من التقاء الساكنين فلا روم ولا إشمام."}, {"word": "حِينَئِذٍ، يَوْمَئِذٍ", "note": "يلحق بعارض الشكل: أصلها (حين إذ) بسكون الذال وبعدها جملة محذوفة، ووضع التنوين عوضًا عنها، فحركت الذال بالكسر منعًا من التقاء الساكنين فلا روم فيها."}, {"word": "الصِّرَاطَ", "note": "مفتوح فلا روم ولا إشمام لخفة الفتحة التي لا تقبل التبعيض."}, {"word": "رَحْمَتَ", "note": "رسمت بالتاء المفتوحة؛ حفص يقف عليها بالتاء فيجوز الروم والإشمام حسب حركتها، ومن وقف عليها بالهاء وقف بالسكون المحض."}, {"word": "عَلَيْهِ، أَهْلِهِ، حَرِّقُوهُ، قَتْلُهُ", "note": "الحالات الأربع التي يمتنع فيها الروم والإشمام في هاء الضمير: قبلها ياء ساكنة، كسر، واو ساكنة، ضم."}, {"word": "عَلَّمْنَاهُ، عَلَّمَهُ، فَلْيَصُمْهُ", "note": "الحالات الثلاث التي يجوز فيها الروم والإشمام في هاء الضمير: قبلها ألف مدية، فتح، ساكن صحيح."}, {"word": "كُن فَيَكُونُ", "note": "الغرض من الروم والإشمام توضيح الفرق في الحركات بين القراء: قرأها ابن عامر بفتح النون وغيره بضمها."}, {"word": "مِّنْهُم مَّن كَلَّمَ اللَّهُ", "note": "الروم يبين المعنى عند الوقف: ضم لفظ الجلالة يبين أنه فاعل."}], "commonErrors": ["الروم أو الإشمام في المفتوح مثل الصراط.", "الروم والإشمام على هاء التأنيث المرسومة بالهاء المربوطة مثل الجنة.", "الروم أو الإشمام في عارض الشكل مثل {جَاءَهُمُ الْعِلْمُ} أو في الساكن الأصلي مثل {فَأَنذِرْ}.", "مد المد العارض للسكون مع الروم؛ الصواب أن الروم كالوصل فيكون بالقصر.", "تحريك الشفتين في الإشمام قبل تسكين الحرف أو إخراج صوت معه، والصواب ضم الشفتين بعد التسكين بلا صوت.", "الروم أو الإشمام في هاء الضمير المسبوقة بياء ساكنة أو واو ساكنة مثل فألقيه.", "الخلط بين الروم والاختلاس: الاختلاس يبقي معظم الحركة ويأتي في المفتوح ووسط الكلمة."], "practice": ["وَاللَّهُ بِكُلِّ شَيْءٍ عَلِيمٌ", "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ", "ذَٰلِكَ الْكِتَابُ لَا رَيْبَ فِيهِ", "إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "وَالسَّمَاءَ بَنَيْنَاهَا بِأَيْدٍ", "فَمَن شَهِدَ مِنكُمُ الشَّهْرَ فَلْيَصُمْهُ", "إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ"], "quiz": [{"q": "ما تعريف الروم اصطلاحًا؟", "options": ["ضم الشفتين بدون صوت بعد التسكين", "تضعيف الصوت بالحركة حتى يذهب معظم صوتها", "عزل الحركة عن الحرف", "إبدال التنوين ألفًا"], "answer": 1, "why": "هذا تعريف الروم، أما ضم الشفتين فهو الإشمام، وعزل الحركة هو السكون."}, {"q": "في أي الحركات يكون الإشمام؟", "options": ["المضموم والمكسور", "المضموم فقط", "المفتوح فقط", "الحركات الثلاث"], "answer": 1, "why": "الإشمام إشارة للضم فلا يكون إلا في المضموم ولو منونًا."}, {"q": "لماذا يمتنع الروم في المفتوح؟", "options": ["لأن الفتحة ثقيلة", "لخفة الفتحة وخفائها فإذا خرج بعضها خرج سائرها فلا تقبل التبعيض", "لأنه لا يوجد مفتوح في آخر الكلمات", "لأن الفتحة تبدل ألفًا دائمًا"], "answer": 1, "why": "الكتاب علل ذلك بأن الفتحة لا تقبل التبعيض بخلاف الكسرة والضمة."}, {"q": "كم وجهًا في الوقف على {عَلِيمٌ}؟", "options": ["ثلاثة", "أربعة", "سبعة", "ثمانية"], "answer": 2, "why": "السكون المحض 3 أوجه، الإشمام 3 أوجه، الروم مع القصر وجه واحد، فالمجموع سبعة."}, {"q": "في الوقف على {فَأَلْقِيهِ} يمتنع الروم والإشمام لأن:", "options": ["الهاء مكسورة", "ما قبل هاء الضمير ياء ساكنة", "الكلمة منونة", "الهاء هاء تأنيث"], "answer": 1, "why": "على مذهب ابن الجزري يمتنع الروم والإشمام إذا كان قبل هاء الضمير ياء ساكنة."}, {"q": "عند الوقف على {جَنَّةً} ماذا نفعل؟", "options": ["نبدل التنوين ألفًا", "نحذف التنوين ونبدل التاء هاء ونقف بالسكون المحض فقط", "نقف بالروم", "نقف بالإشمام"], "answer": 1, "why": "لأن الحركة كانت على التاء لا على الهاء فيمتنع الروم والإشمام."}, {"q": "أي العبارات صحيحة في الفرق بين الروم والإشمام؟", "options": ["الروم يرى بالعين والإشمام يسمع بالأذن", "الروم كالوصل من حيث المد والإشمام كالوقف", "الروم في المضموم فقط", "الإشمام في المكسور والمضموم"], "answer": 1, "why": "الروم يسمع بالأذن وهو كالوصل، والإشمام يرى بالعين وهو كالوقف."}], "level": 3}, {"id": "L3_09", "title": "الوقف على الكلمة المعتلة الآخر: الألف والواو والياء المدية", "bookPages": "من الكتاب ص274-283", "summary": "الكلمة المعتلة الآخر هنا هي التي آخرها حرف مد: ألف مدية (دعا) أو واو مدية (يدعو) أو ياء مدية (يقضي)، ولها قواعد عند الوقف من حيث الحذف والإثبات. فالألف المدية أربعة أحوال: أولًا ثابتة وصلًا ووقفًا إذا كانت مرسومة ولم يقع بعدها ساكن مثل {لَا تَخَافَا إِنَّنِي مَعَكُمَا}. ثانيًا محذوفة وصلًا ووقفًا إذا لم ترسم في المصحف بسبب البناء (فعل الأمر المبني على حذف حرف العلة: وانه، فتول) أو الجزم (ألم تر، ولم تخش) أو أسباب أخرى كـ(ما) الاستفهامية المسبوقة بحرف جر في خمس صور: عمَّ، بمَ، لمَ، فيمَ، ممَّ؛ وكذلك لفظ (أيه) في ثلاثة مواضع رسم بغير ألف فقرأه حفص بحذفها وصلًا ووقفًا.\nثالثًا محذوفة وصلًا ثابتة وقفًا للتخلص من التقاء الساكنين، والألف المبدلة من تنوين النصب، والألفات السبع التي عليها صفر مستطيل: أنا، لكنا، الرسولا، السبيلا، الظنونا، قواريرا (الأول)، سلاسلا، مع تنبيه أن سلاسلا لها وجهان وقفًا. والواو المدية كذلك: ثابتة في الحالين كـ{هَاجَرُوا}، محذوفة وصلًا ووقفًا بسبب البناء (واعف، ادع، اتل) أو الجزم (ومن يعش، ولا تقف) أو في أربعة أفعال واسم: يدع (موضعان)، يمح، سندع، صالح المؤمنين؛ ومحذوفة وصلًا ثابتة وقفًا للتخلص من التقاء الساكنين كـ{يَمْحُوا اللَّهُ}؛ ومحذوفة وقفًا ثابتة وصلًا في صلة هاء الضمير كـ{لَهُ مُلْكُ}.\nوالياء المدية: ثابتة في الحالين كـ{تَوَفَّنِي مُسْلِمًا} (18 ياء في 24 موضعًا لها نظائر محذوفة)، محذوفة وصلًا ووقفًا بسبب البناء أو الجزم أو في الاسم المنادى المضاف إلى ياء المتكلم كـ{رَبِّ أَرِنِي} و{يَا قَوْمِ} أو في الاسم المنقوص المنون في 37 موضعًا كـ(باغ، قاض، واق)، ومحذوفة وصلًا ثابتة وقفًا للتخلص من التقاء الساكنين كـ{وَلَا تَسْقِي الْحَرْثَ}، ومحذوفة وقفًا ثابتة وصلًا في صلة هاء الضمير كـ{بِهِ بَصِيرًا}، وحال خامسة ثابتة وصلًا وجواز الوجهين وقفًا وهي الياءات الزوائد وليس لحفص منها إلا {ءَاتَيْنِ} في النمل.", "rules": ["الألف المدية تثبت وصلًا ووقفًا بشرطين: أن تكون مرسومة وألا يقع بعدها ساكن.", "تحذف الألف وصلًا ووقفًا إذا لم ترسم بسبب البناء (وانه، فتول) أو  المتكلم تحذف ياؤه وصلًا ووقفًا سواء ذكر حرف النداء أم لا."}, {"q": "ما الياء الزائدة الوحيدة لحفص؟", "options": ["يا عباد في الزخرف", "ءاتين في النمل", "واخشون", "أخرتن"], "answer": 1, "why": "الياءات الزوائد 121 ياء وليس لحفص منها إلا ءاتين في النمل، تثبت وصلًا ولها وجهان وقفًا."}, {"q": "كم عدد الكلمات التي لم يوضع بعد واو الجماعة فيها ألف؟", "options": ["أربع", "خمس", "ست", "سبع"], "answer": 2, "why": "ست كلمات: فاءو، عتو، سعو، تبوءو، جاءو، باءو."}], "level": 3}, {"id": "L3_10", "title": "المقطوع والموصول", "bookPages": "من الكتاب ص287-291", "summary": "المقطوع هو الكلمة التي تُفصل عما بعدها في رسم المصاحف العثمانية، والموصول هو الكلمة التي تُوصل بما بعدها في الرسم. وفائدة معرفة ذلك أن القارئ يستطيع أن يقف على المقطوع في محل قطعه للضرورة أو للاختبار، ولا يقف على الموصول إلا عند انقضائه. وتنقسم الكلمات الواردة في هذا الباب إلى قسمين: قسم ورد في المقدمة الجزرية وهو 26 كلمة، وقسم لم يرد فيها وهو 12 كلمة. فالكلمات التي وردت في الجزرية ثلاثة أقسام: كلمات اتفقت المصاحف على قطعها في كل موضع (حيث ما، أن لم، عن من)، وكلمات اتفقت على وصلها في كل موضع (أما بمعنى أم ما، كالوهم، وزنوهم، أل التعريف، ها التنبيه، يا النداء)، وكلمات وقع فيها الخلاف فبعض مواضعها مقطوع باتفاق وبعضها موصول باتفاق وبعضها مختلف فيه، مثل: أن لا، إن ما، عن ما، من ما، أم من، إنّ ما، أنّ ما، كل ما، بئس ما، في ما، أين ما، إن لم، أن لن، كي لا، يوم هم، ولات حين.\nأما الكلمات التي لم ترد في الجزرية فمنها الموصول بالاتفاق: يومئذ، حينئذ، كأنما، ربما، ويكأن، نعمّا، مهما، والحروف المقطعة في فواتح السور؛ ومنها المقطوع بالاتفاق: إل ياسين، وأيًّا ما؛ ومنها المختلف فيه: أن لو، وابن أم. وينبه الكتاب أنه لا يجوز الوقف على (إل) دون (ياسين) لمن قرأ بكسر الهمزة مقصورة وسكون اللام مثل حفص، وإن كانت مقطوعة رسمًا لأنها موصولة لفظًا، بينما يجوز الوقف اختبارًا أو اضطرارًا على (ءال) دون (ياسين) لمن قرأ بفتح الهمزة ممدودة وكسر اللام.\nوالطالبة تحتاج إلى حفظ مواضع القطع والوصل لتعرف أين يصح الوقف الاضطراري والاختباري وأين لا يصح.", "rules": ["المقطوع: الكلمة التي تفصل عما بعدها في رسم المصاحف العثمانية. الموصول: الكلمة التي توصل بالهاء الساكنة، نحو (رحمة، نعمة). إلا أن بعض الكلمات خرجت عن الأصل في رسم المصاحف العثمانية ورُسمت بالتاء المبسوطة، ونقف عليها بالتاء على رواية حفص، وهذا هو موضوع الدرس.\nوينقسم الاسم المرسوم بالتاء المبسوطة إلى قسمين: قسم اتفق القراء فيه على قراءته بالإفراد، وقسم اختلف فيه القراء بين الإفراد والجمع. فالقسم الأول ثلاث عشرة كلمة: رحمت (6 مرات)، نعمت (11 مرة)، لعنت (مرتان)، شجرت (مرة)، سنت (3 مرات)، امرأت (6 مرات)، معصيت (مرتان)، قرت (مرة)، جنت (مرة)، فطرت (مرة)، ابنت (مرة)، كلمت (مرة في الأعراف 137)، بقيت (مرة). والقسم الثاني سبع كلمات: كلمت (4 مرات)، غيابت (مرتان)، ءايات (مرتان)، الغرفات (مرة)، بينت (مرة)، ثمرات (مرة)، جمالت (مرة).\nوالطالبة تحتاج إلى حفظ هذه المواضع بدقة لأن الوقف عليها يكون بالتاء لا بالهاء، فإذا وقفت على {رَحْمَتَ اللَّهِ} في البقرة 218 وقفت بالتاء الساكنة (رحمتْ)، بينما تقف على (رحمة) في غير هذه المواضع بالهاء الساكنة (رحمهْ). وتذكري أن الروم والإشمام على التاء المبسوطة جائزان حسب حركتها كما سبق في الوقف على الصحيح الآخر، بخلاف الهاء المربوطة التي يُوقف عليها بالسكون المحض فقط.", "rules": ["التاءات قسمان: تاء مربوطة (رسمت بالهاء) وتاء مبسوطة (رسمت بالتاء).", "في الفعل ترسم التاء مبسوطة بالاتفاق ويوقف عليها بالتاء مثل {وَأُزْلِفَتِ}.", "في الاسم الأصل الرسم بالتاء المربوطة والوقف بالهاء الساكنة مثل (رحمة، نعمة)، إلا كلمات خرجت عن الأصل ورسمت بالتاء المبسوطة فيوقف عليها بالتاء في رواية حفص.", "الاسم المرسوم بالتاء المبسوطة قسمان: متفق على قراءته بالإفراد (13 كلمة)، ومختلف فيه بين الإفراد والجمع (7 كلمات).", "الوقف على التاء المبسوطة بالتاء ويجوز فيها الروم والإشمام حسب حركتها، أما المربوطة فبالهاء الساكنة ويمتنع الروم والإشمام."], "examples": [{"word": "وَأُزْلِفَتِ الْجَنَّةُ لِلْمُتَّقِينَ", "note": "تاء الفعل مبسوطة بالاتفاق ويوقف عليها بالتاء."}, {"word": "رَحْمَةً، نِعْمَةً", "note": "الأصل في الاسم الرسم بالتاء المربوطة والوقف بالهاء الساكنة."}, {"word": "رَحْمَتَ", "note": "6 مرات: الزخرف 32، الأعراف 56، الروم 50، هود 73، مريم 2، البقرة 218."}, {"word": "نِعْمَتَ", "note": "11 مرة: النحل 72، 83، 114، إبراهيم 28، 34، المائدة 11، البقرة 231، لقمان 31، فاطر 3، الطور 29، آل عمران 103."}, {"word": "لَعْنَتَ", "note": "مرتان: آل عمران 61، النور 7."}, {"word": "شَجَرَتَ", "note": "مرة: الدخان 43."}, {"word": "سُنَّتَ", "note": "3 مرات: فاطر 43، الأنفال 38، غافر 85."}, {"word": "امْرَأَتَ", "note": "6 مرات: آل عمران 35، يوسف 30، 51، القصص 9، التحريم 10، 11."}, {"word": "مَعْصِيَتِ", "note": "مرتان: المجادلة 8، 9."}, {"word": "قُرَّتُ", "note": "مرة: القصص 9."}, {"word": "جَنَّتُ", "note": "مرة: الواقعة 89."}, {"word": "فِطْرَتَ", "note": "مرة: الروم 30."}, {"word": "ابْنَتَ", "note": "مرة: التحريم 12."}, {"word": "كَلِمَتُ (المتفق على إفرادها)", "note": "مرة: الأعراف 137."}, {"word": "بَقِيَّتُ", "note": "مرة: هود 86."}, {"word": "كَلِمَتُ (المختلف فيها)", "note": "4 مرات اختلف القراء فيها بين الإفراد والجمع: الأنعام 115، يونس 33، 96، غافر 6."}, {"word": "غَيَابَتِ", "note": "مرتان مختلف فيها: يوسف 10، 15."}, {"word": "ءَايَاتٌ", "note": "مرتان مختلف فيها: يوسف 7، العنكبوت 50."}, {"word": "الْغُرُفَاتِ", "note": "مرة مختلف فيها: سبأ 37."}, {"word": "بَيِّنَتٍ", "note": "مرة مختلف فيها: فاطر 40."}, {"word": "ثَمَرَاتٍ", "note": "مرة مختلف فيها: فصلت 47."}, {"word": "جِمَالَتٌ", "note": "مرة مختلف فيها: المرسلات 33."}], "commonErrors": ["الوقف بالهاء على الكلمات المرسومة بالتاء المبسوطة مثل {رَحْمَتَ اللَّهِ} في البقرة 218 أو {نِعْمَتَ اللَّهِ}.", "الوقف بالتاء على الكلمات المرسومة بالتاء المربوطة مثل (رحمة) في غير مواضعها المبسوطة.", "الخلط بين مواضع (كلمت) المتفق عليها (الأعراف 137) والمختلف فيها (الأنعام 115، يونس 33، 96، غافر 6).", "الروم أو الإشمام على التاء المربوطة الموقوف عليها بالهاء."], "practice": ["أُولَٰئِكَ يَرْجُونَ رَحْمَتَ اللَّهِ", "وَاذْكُرُوا نِعْمَتَ اللَّهِ عَلَيْكُمْ", "فَنَجْعَل لَّعْنَتَ اللَّهِ عَلَى الْكَاذِبِينَ", "إِنَّ شَجَرَتَ الزَّقُّومِ", "فِطْرَتَ اللَّهِ الَّتِي فَطَرَ النَّاسَ عَلَيْهَا", "وَتَمَّتْ كَلِمَتُ رَبِّكَ الْحُسْنَىٰ", "بَقِيَّتُ اللَّهِ خَيْرٌ لَّكُمْ"], "quiz": [{"q": "كيف يوقف على التاء في الفعل مثل {وَأُزْلِفَتِ}؟", "options": ["بالهاء", "بالتاء", "بحذفها", "بإبدالها ألفًا"], "answer": 1, "why": "تاء الفعل مرسومة مبسوطة بالاتفاق ويوقف عليها بالتاء."}, {"q": "ما الأصل في تاء الاسم مثل (رحمة)؟", "options": ["الرسم بالتاء المبسوطة والوقف بالتاء", "الرسم بالتاء المربوطة والوقف بالهاء الساكنة", "حذفها وقفًا", "إبدالها ألفًا"], "answer": 1, "why": "الأصل في الاسم الرسم بالهاء والوقف بالهاء، وما رسم بالتاء خرج عن الأصل."}, {"q": "كم مرة وردت (نعمت) بالتاء المبسوطة؟", "options": ["6", "11", "3", "2"], "answer": 1, "why": "نعمت 11 مرة: النحل 72، 83، 114، إبراهيم 28، 34، المائدة 11، البقرة 231، لقمان 31، فاطر 3، الطور 29، آل عمران 103."}, {"q": "في أي موضع وردت (شجرت) بالتاء المبسوطة؟", "options": ["الدخان 43", "الواقعة 89", "القصص 9", "هود 86"], "answer": 0, "why": "{إِنَّ شَجَرَتَ الزَّقُّومِ} الدخان 43 مرة واحدة."}, {"q": "(كلمت) في الأعراف 137 من القسم:", "options": ["المختلف فيه بين الإفراد والجمع", "المتفق على قراءته بالإفراد", "المرسوم بالهاء", "الأفعال"], "answer": 1, "why": "الأعراف 137 من المتفق على إفراده، أما الأنعام 115 ويونس 33، 96 وغافر 6 فمختلف فيها."}, {"q": "أي الكلمات التالية من المختلف فيه بين الإفراد والجمع؟", "options": ["امرأت", "جمالت", "لعنت", "ابنت"], "answer": 1, "why": "جمالت (المرسلات 33) من القسم المختلف فيه، والبقية من المتفق على إفرادها."}], "level": 3}, {"id": "L3_12", "title": "ما يجب مراعاته لحفص في بعض الكلمات القرآنية", "bookPages": "من الكتاب ص297-299", "summary": "في هذا الباب الأخير يجمع الكتاب ثماني عشرة كلمة أو مسألة ينبغي للقارئة برواية حفص عن عاصم من طريق الشاطبية أن تراعيها، لأن لحفص فيها وجهًا خاصًا أو وجهين. أولها كلمات همزة الوصل الداخلة عليها همزة الاستفهام: {ءَالذَّكَرَيْنِ} في موضعين بالأنعام، و{ءَاللَّهُ} في يونس والنمل، و{ءَالْآنَ} في موضعين بيونس، ولحفص فيها وجهان: إبدال همزة الوصل ألفًا مدية تمد ست حركات لزومًا، أو تسهيلها بين الهمزة والألف بلا مد. ثم {يَلْهَث ذَّلِكَ} و{ارْكَب مَّعَنَا} وفيهما إدغام متجانسين صغير قرأه حفص بالإدغام الكامل وجهًا واحدًا.\nو{تَأْمَنَّا} بوجهين: الإشمام مع الإدغام، والإظهار مع الاختلاس. و{يس وَالْقُرْآنِ} و{ن وَالْقَلَمِ} بالإظهار. و{ءَاتَيْنِ} بإثبات الياء وصلًا ووجهين وقفًا. و{سَلَاسِلَا} بحذف الألف وصلًا ووجهين وقفًا. و{قَوَارِيرَا} في موضعيها بالإنسان. و{نَخْلُقكُّم} بالإدغام الكامل. و{مَالِيَهْ هَلَكَ} بالإظهار مع السكت أو الإدغام بلا سكت. والراء في مصر وعين القطر ويسر وأسر وفأسر ونذر لها وجهان وقفًا، و{فِرْقٍ} لها وجهان وصلًا. والسكت أربع واجبة واثنتان جائزتان.\nو{يَبْصُطُ} و{بَصْطَةً} بالسين، و{الْمُصَيْطِرُونَ} بالصاد والسين، و{بِمُصَيْطِرٍ} بالصاد. و{مَجْرَاهَا} بالإمالة الكبرى وهي الكلمة الوحيدة التي أمالها حفص وليس له إمالة صغرى. و{ضَعْف} في مواضعها الثلاثة بالروم 54 بفتح الضاد وضمها. و{ءَاعْجَمِيٌّ} بتسهيل الهمزة الثانية وجهًا واحدًا، وهي الكلمة الوحيدة التي سهل فيها حفص همزة القطع. وحفظ هذه الكلمات ضروري لكل قارئة تريد إتقان رواية حفص.", "rules": ["في ءالذكرين وءالله وءالن لحفص وجهان: إبدال همزة الوصل ألفًا تمد 6 حركات لزومًا، أو تسهيلها بين الهمزة والألف بلا مد.", "يلهث ذلك واركب معنا: إدغام متجانسين صغير قرأه حفص من الشاطبية بالإدغام وجهًا واحدًا.", "تأمنا: وجهان لحفص: الإشمام مع الإدغام، أو الإظهار مع الاختلاس.", "يس والقرآن ون والقلم: بالإظهار من طريق الشاطبية.", "ءاتين وسلاسلا: لكل منهما وجهان وقفًا، والمقدم في الأداء الإثبات.", "نخلقكم: إدغام كامل وجهًا واحدًا. ماليه هلك: الإظهار مع السكت (المقدم) أو الإدغام بلا سكت.", "الراء في مصر، عين القطر، يسر، أسر، فأسر، نذر: وجهان وقفًا (التفخيم والترقيق). الراء في فرق: وجهان وصلًا.", "يبصط وبصطة بالسين وجهًا واحدًا، المصيطرون بالصاد والسين، بمصيطر بالصاد وجهًا واحدًا.", "مجراها: إمالة كبرى وهي الوحيدة لحفص، وليس له إمالة صغرى. الإمالة: أن تنحو بالفتحة نحو الكسرة وبالألف نحو الياء.", "ضعف في الروم 54 (ثلاثة مواضع): فتح الضاد وضمها. ءاعجمي: تسهيل الهمزة الثانية وجهًا واحدًا بلا مد."], "examples": [{"word": "ءَالذَّكَرَيْنِ، ءَاللَّهُ، ءَالْآنَ", "note": "1- ءالذكرين (موضعان في الأنعام)، ءالله (يونس والنمل)، ءالن (موضعان في يونس): وجهان في الأداء: إبدال همزة الوصل ألفًا مدية تمد 6 حركات لزومًا، أو تسهيلها بين الهمزة والألف مع عدم المد مطلقًا."}, {"word": "يَلْهَث ذَّلِكَ، ارْكَب مَّعَنَا", "note": "2- يلهث ذلك (الأعراف)، اركب معنا (هود): إدغام متجانسين // ===== محرك الصوت: تسجيل، استخراج سمات، محاذاة زمنية (DTW)، تحليل =====
const Audio_={
  ctx:null,
  getCtx(){ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; this.ctx=new C(); } if(this.ctx.state==="suspended")this.ctx.resume(); return this.ctx; },
  canRecord(){ return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder); },
  async decode(blobOrBuf){
    const buf = blobOrBuf instanceof ArrayBuffer ? blobOrBuf : await blobOrBuf.arrayBuffer();
    const ab = await this.getCtx().decodeAudioData(buf.slice(0));
    const n=ab.length, ch=ab.numberOfChannels, out=new Float32Array(n);
    for(let c=0;c<ch;c++){ const d=ab.getChannelData(c); for(let i=0;i<n;i++) out[i]+=d[i]/ch; }
    return {data:out, rate:ab.sampleRate, duration:ab.duration};
  },
  async fetchDecode(url){
    const r=await fetch(url,{mode:"cors"}); if(!r.ok) throw new Error("http "+r.status);
    return this.decode(await r.arrayBuffer());
  }
};

// ---- FFT (radix-2, in place) ----
function fft(re,im){
  const n=re.length; for(let i=1,j=0;i<n;i++){ let bit=n>>1; for(;j&bit;bit>>=1)j^=bit; j^=bit; if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]];} }
  for(let len=2;len<=n;len<<=1){ const ang=-2*Math.PI/len, wr=Math.cos(ang), wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){ let cr=1,ci=0; for(let j=0;j<len/2;j++){ const a=i+j,b=a+len/2; const tr=re[b]*cr-im[b]*ci, ti=re[b]*ci+im[b]*cr; re[b]=re[a]-tr; im[b]=im[a]-ti; re[a]+=tr; im[a]+=ti; const ncr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=ncr; } } }
}
// ---- سمات: طاقة لوغاريتمية + 24 حزمة ميل + مركز طيفي + معدل عبور الصفر، كل 10ms ----
const NB=24;
function melFilters(rate,N){
  const mel=f=>2595*Math.log10(1+f/700), imel=m=>700*(Math.pow(10,m/2595)-1);
  const lo=mel(80), hi=mel(Math.min(7000,rate/2)); const pts=[]; for(let i=0;i<NB+2;i++)pts.push(imel(lo+(hi-lo)*i/(NB+1)));
  const bins=pts.map(f=>Math.floor((N+1)*f/rate)); const F=[];
  for(let b=0;b<NB;b++){ const f=new Float32Array(N/2); for(let k=bins[b];k<bins[b+1];k++)f[k]=(k-bins[b])/Math.max(1,bins[b+1]-bins[b]); for(let k=bins[b+1];k<bins[b+2];k++)f[k]=(bins[b+2]-k)/Math.max(1,bins[b+2]-bins[b+1]); F.push(f);} return F;
}
function extractFeatures(sig){
  const {data,rate}=sig; const N=rate>30000?1024:512, hop=Math.round(rate*0.01); const F=melFilters(rate,N);
  const win=new Float32Array(N); for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));
  const frames=[]; const re=new Float32Array(N), im=new Float32Array(N);
  for(let s=0;s+N<=data.length;s+=hop){
    let e=0,zc=0; for(let i=0;i<N;i++){ const v=data[s+i]; re[i]=v*win[i]; im[i]=0; e+=v*v; if(i&&((data[s+i]>=0)!==(data[s+i-1]>=0)))zc++; }
    fft(re,im); const mag=new Float32Array(N/2); let num=0,den=0; for(let k=0;k<N/2;k++){ mag[k]=Math.sqrt(re[k]*re[k]+im[k]*im[k]); num+=k*mag[k]; den+=mag[k]; }
    const mel=new Float32Array(NB); for(let b=0;b<NB;b++){ let a=0; const f=F[b]; for(let k=0;k<N/2;k++) if(f[k]) a+=f[k]*mag[k]; mel[b]=Math.log(a+1e-6); }
    frames.push({t:s/rate, e:10*Math.log10(e/N+1e-10), mel, cent:den?num/den*rate/N:0, zcr:zc/N});
  }
  // عتبة الصوت: نسبة إلى الذروة
  let mx=-1e9; frames.forEach(f=>{ if(f.e>mx) mx=f.e; }); const thr=mx-30;
  frames.forEach(f=>f.v=f.e>thr);
  // تطبيع الميل (طرح المتوسط عبر الإطارات الصوتية) لإلغاء أثر الميكروفون
  const mean=new Float32Array(NB); let c=0; frames.forEach(f=>{ if(f.v){ c++; for(let b=0;b<NB;b++)mean[b]+=f.mel[b]; }});
  if(c){ for(let b=0;b<NB;b++)mean[b]/=c; frames.forEach(f=>{ f.nm=new Float32Array(NB); for(let b=0;b<NB;b++)f.nm[b]=f.mel[b]-mean[b]; }); } else frames.forEach(f=>f.nm=f.mel);
  // قص الصمت من الطرفين
  let a=0,b=frames.length-1; while(a<b&&!frames[a].v)a++; while(b>a&&!frames[b].v)b--;
  return {frames:frames.slice(a,b+1), hopSec:hop/rate, rate, totalSec:sig.duration, voicedSec:frames.filter(f=>f.v).length*hop/rate};
}
function dist(f,g){ let d=0; for(let b=0;b<NB;b++){ const x=f.nm[b]-g.nm[b]; d+=x*x; } const ev=(f.v?1:0)-(g.v?1:0); return Math.sqrt(d/NB)+Math.abs(ev)*1.5; }
// ---- DTW مع حزامٍ نسبي ----
function dtw(A,B,band=0.25){
  const n=A.length,m=B.length; if(!n||!m) return {cost:1e9,path:[]};
  const w=Math.max(Math.abs(n-m), Math.floor(Math.max(n,m)*band))+2;
  const D=new Float32Array((n+1)*(m+1)).fill(Infinity); const idx=(i,j)=>i*(m+1)+j; D[0]=0;
  for(let i=1;i<=n;i++){ const jl=Math.max(1,Math.floor(i*m/n)-w), jh=Math.min(m,Math.ceil(i*m/n)+w);
    for(let j=jl;j<=jh;j++){ const c=dist(A[i-1],B[j-1]); D[idx(i,j)]=c+Math.min(D[idx(i-1,j)],D[idx(i,j-1)],D[idx(i-1,j-1)]); } }
  // تتبع المسار
  const path=[]; let i=n,j=m; while(i>0&&j>0){ path.push([i-1,j-1]); const a=D[idx(i-1,j-1)],b=D[idx(i-1,j)],c=D[idx(i,j-1)]; if(a<=b&&a<=c){i--;j--;} else if(b<c)i--; else j--; }
  path.reverse(); return {cost:D[idx(n,m)]/path.length, path};
}
// ---- مقاطع ممدودة في المرجع (مد/غنة): إطارات صوتية متتابعة قليلة التغير الطيفي ----
function sustainedRegions(fr,hop,minSec=0.22){

    const regions=sustainedRegions(S.frames,S.hopSec,0.3); notes.push({k:"info",t:`لا يوجد مرجع صوتي للمقارنة. مدة القراءة ${S.voicedSec.toFixed(1)} ث، وفيها ${regions.length} مواضع ممدودة.`});

}

class Recorder{

// ===== محرك التعرف القرآني داخل الجهاز (Whisper مدرَّب على القرآن من Tarteel، بصيغة ONNX) =====
const QASR={
  pipe:null,loading:null,error:"",modelId:"qasr-v2",
  available(){ return /^https?:/.test(location.protocol)&&(ST.asr||"quran")==="quran"; },
  async load(onProgress){
    if(this.pipe) return this.pipe; if(this.loading) return this.loading;
    this.loading=(async()=>{
      const T=await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
      T.env.allowRemoteModels=false; T.env.allowLocalModels=true; T.env.localModelPath=new URL("models/",location.href).href; T.env.useBrowserCache=true;
      T.env.backends.onnx.wasm.wasmPaths="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/";
      const pipe=await T.pipeline("automatic-speech-recognition",this.modelId,{quantized:true,progress_callback:p=>{ if(onProgress&&p&&p.status==="progress") onProgress(Math.round(p.progress||0),p.file||""); }});
      this.pipe=pipe; return pipe; })();
    try{ return await this.loading; }catch(e){ this.error=e&&e.message||String(e); this.loading=null; throw e; }
  },
  async toPCM16k(blob){
    const buf=await blob.arrayBuffer(); const C=window.AudioContext||window.webkitAudioContext; const ctx=new C(); const ab=await ctx.decodeAudioData(buf.slice(0)); try{ctx.close()}catch(e){}
    const n=ab.numberOfChannels; let mono=ab.getChannelData(0); if(n>1){ mono=new Float32Array(ab.length); for(let c=0;c<n;c++){ const d=ab.getChannelData(c); for(let i=0;i<ab.length;i++) mono[i]+=d[i]/n; } }
    if(ab.sampleRate===16000) return mono;
    const len=Math.ceil(ab.duration*16000); const off=new OfflineAudioContext(1,len,16000); const src=off.createBufferSource(); const b=off.createBuffer(1,ab.length,ab.sampleRate); b.getChannelData(0).set(mono); src.buffer=b; src.connect(off.destination); src.start(); const out=await off.startRendering(); return out.getChannelData(0);
  },
  async transcribe(blob,onStatus){
    onStatus&&onStatus("جارٍ تجهيز محرك التصحيح القرآني…"); const pipe=await this.load((pct,file)=>onStatus&&onStatus(`تحميل نموذج التصحيح (مرة واحدة): ${pct}٪`));
    onStatus&&onStatus("جارٍ التعرّف على تلاوتك…"); const pcm=await this.toPCM16k(blob);
    const r=await pipe(pcm,{language:"arabic",task:"transcribe",chunk_length_s:30,stride_length_s:5,return_timestamps:false});
    return (r&&r.text||"").trim();
  }
};
// يختار أفضل نص: المحرك القرآني إن توفر، وإلا تعرّف المتصفح
async function bestTranscript(blob,srText,onStatus){
  if(QASR.available()){ try{ const t=await QASR.transcribe(blob,onStatus); if(t) return {text:t,engine:"quran"}; }catch(e){ console.warn("QASR",e); } }
  return {text:srText||"",engine:srText?"browser":"none"};

  key(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); },

async function getAyahs(s,a1,a2){
  const out=[]; const need=[];
  for(let a=a1;a<=a2;a++){ const k=s+":"+a; const t=(BUILTIN[s]&&BUILTIN[s][a-1])||BUILTIN_SINGLE[k]||ST.textCache[k]; out.push({s,a,text:t||null}); if(!t)need.push(a); }
  if(need.length){
    try{ const r=await fetch(`https://api.alquran.cloud/v1/surah/${s}/quran-simple`); const j=await r.json();
      j.data.ayahs.forEach(ay=>{ let t=ay.text; if(ay.numberInSurah===1&&s!==1&&s!==9) t=t.replace(/^بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\s*/,""); ST.textCache[s+":"+ay.numberInSurah]=t; });
      save(); out.forEach(o=>{ if(!o.text)o.text=ST.textCache[o.s+":"+o.a]||null; });
    }catch(e){}
  }
  return out;
}

async function getReference(s,a1,a2,reciterId){
  // يعيد {blobs:[],urls:[],sig:decoded|null,playable:[urls or blob urls]}
  const r=RECITERS.find(x=>x.id===reciterId)||RECITERS[0]; const items=[];
  for(let a=a1;a<=a2;a++){
    if(r.src==="local"){ const b=await DB.get(`ref:${s}:${a}`); items.push({a,blob:b,urls:[]}); }
    else { const urls=reciterUrls(r,s,a); if(ST.customAudio) urls.unshift(ST.customAudio.replace("{s}",s).replace("{a}",a).replace("{sss}",String(s).padStart(3,"0")).replace("{aaa}",String(a).padStart(3,"0"))); items.push({a,blob:null,urls}); }
  }
  return {reciter:r,items,s};
}
async function decodeReference(ref){
  // يدمج الآيات في إشارة واحدة إن أمكن فك ترميزها (يتطلب CORS للمصادر الخارجية)
  const sigs=[]; for(const it of ref.items){ let sig=null; if(it.blob){ try{ sig=await Audio_.decode(it.blob);}catch(e){} } else { for(const u of it.urls){ try{ sig=await Audio_.fetchDecode(u); break; }catch(e){} } } if(!sig) return null; sigs.push(sig); }
  if(!sigs.length) return null; const rate=sigs[0].rate; let n=0; sigs.forEach(x=>n+=x.data.length); const data=new Float32Array(n); let p=0; sigs.forEach(x=>{ data.set(x.data,p); p+=x.data.length; });
  return {data,rate,duration:n/rate};
}

function wireRecorder(id,{onDone,recognize=false,onText}={}){
  const btn=$("#"+id+"Btn"), T=$("#"+id+"T"), M=$("#"+id+"M"); let rec=null, sr=null;
  if(!Audio_.canRecord()){ btn.disabled=true; $("#"+id+"Out").innerHTML=`<div class="note bad">التسجيل غير متاح هنا. افتحي ملف التطبيق في متصفح Chrome أو Edge على الحاسب أو الجوال (وليس داخل صفحة claude.ai).</div>`; return; }
  btn.onclick=async()=>{

    try{ rec=new Recorder({onLevel:v=>M.style.width=(v*100)+"%",onTick:t=>T.textContent=`${String(Math.floor(t/60)).padStart(2,"0")}:${String(Math.floor(t%60)).padStart(2,"0")}`}); await rec.start(); btn.classList.add("on");

  };

async function drawWave(blob,cv){ if(!cv)return; try{ const sig=await Audio_.decode(blob); cv.hidden=false; const W=cv.width=cv.clientWidth*2, H=cv.height=140; const c=cv.getContext("2d"); c.clearRect(0,0,W,H); c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#1f5c43"; const step=Math.max(1,Math.floor(sig.data.length/W)); for(let x=0;x<W;x++){ let mx=0; for(let i=x*step;i<(x+1)*step&&i<sig.data.length;i++){ const v=Math.abs(sig.data[i]); if(v>mx)mx=v; } const h=Math.max(2,mx*H); c.fillRect(x,(H-h)/2,1,h);} }catch(e){} }

  if(!CLOUD.config()) return false; if(route==="account"||route==="about") return false;
  if(CLOUD.user) return false;
  if(!CLOUD.ready){ view.innerHTML=`<div class="card stack" style="text-align:center;padding:40px 16px"><h2>رياحين</h2><p class="muted">جارٍ الاتصال…</p>${CLOUD.error?`<div class="note bad">${esc(CLOUD.error)}</div>`:`<div id="slowNote" hidden class="note info" style="text-align:right"><b>لماذا يتأخر التحميل؟</b><br>• أول دخول يحمّل ملفات التطبيق والخدمة السحابية (قد يستغرق دقيقة على شبكة بطيئة).<br>• شبكة الجوال ضعيفة أو بيانات الهاتف مقيّدة.<br>• بعض شبكات المدارس أو الـ VPN تحجب خدمات جوجل.</div>`}
    <div class="note info" style="text-align:right"><b>إذا لم يفتح:</b><br>1) تأكدي من الإنترنت ثم اضغطي «إعادة المحاولة».<br>2) أغلقي التطبيق وافتحيه من جديد، أو حدّثي الصفحة.<br>3) جرّبي متصفح Chrome أو Safari بدل متصفح داخلي (مثل متصفح واتساب/تيليجرام).<br>4) إن كنتِ سجّلتِ من قبل، تابعي دون اتصال وستُزامن بياناتك لاحقًا.<br>5) إن استمرّت المشكلة أرسلي لقطة شاشة للأستاذة.</div>
    <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" onclick="location.reload()">إعادة المحاولة</button>${ST.fullName?`<button class="btn sec" id="offlineBtn">متابعة دون اتصال</button>`:""}</div></div>`; const ob=$("#offlineBtn"); if(ob) ob.onclick=()=>{ CLOUD.offline=true; render(); }; setTimeout(()=>{ const n=$("#slowNote"); if(n&&!CLOUD.ready) n.hidden=false; },6000); if(!CLOUD.busy&&!CLOUD.error) CLOUD.load().then(()=>render()); return !CLOUD.offline; }
  route="account"; return false;
}
function render(){
  try{ if(ST.fullName||ST.name){ ATT.enter(); ATT.recheck(); } }catch(e){}
  try{ const f=$("#fab"); if(f) f.hidden=route==="assistant"||route==="account"||!(ST.fullName||ST.name)||(CLOUD.config()&&!CLOUD.user&&!CLOUD.offline); }catch(e){}
  if(gate()) { $("#tabs").hidden=true; return; } $("#tabs").hidden=!!(CLOUD.config()&&!CLOUD.user&&!CLOUD.offline);

  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.go===route||tabOf[route]===b.dataset.go));

}

// ===== الشارات والتتابع =====
function streakDays(){ const m=ST.attendance||{}; let n=0; const d=new Date(); for(let i=0;i<365;i++){ const k=ATT.key(d); if(m[k]&&m[k].entered) n++; else if(i>0) break; d.setDate(d.getDate()-1); } return n; }
function badgesList(){ const done=Object.keys(ST.done).length; const lt=ST.levelTests||{}; const rec=ST.attempts.length; const good=ST.attempts.filter(a=>a.score>=ST.passPct).length; const g=gamesSummary(); const st=streakDays(); const hz=ST.hifz&&ST.hifz.plan?(ST.hifz.plan.mode==="nahya"?ST.hifz.day:ST.hifz.memorized.length):0;
  return [
   {t:"البداية",ic:"🌱",d:"أنهيتِ أول درس",on:done>=1},{t:"خمسة دروس",ic:"📚",d:"أنهيتِ 5 دروس",on:done>=5},{t:"نصف الطريق",ic:"🧭",d:"أنهيتِ نصف الدروس",on:done>=Math.ceil(LESSONS.length/2)},
   {t:"المستوى الأول",ic:"🥉",d:"اجتزتِ مستوى المبتدئ",on:!!(lt[1]&&lt[1].passed)},{t:"المستوى الثاني",ic:"🥈",d:"اجتزتِ المستوى الثاني",on:!!(lt[2]&&lt[2].passed)},{t:"المتوسط",ic:"🥇",d:"اجتزتِ المستوى المتوسط",on:!!(lt[3]&&lt[3].passed)},{t:"الإتقان",ic:"🏆",d:"اجتزتِ مستوى الإتقان",on:!!(lt[4]&&lt[4].passed)},
   {t:"أول تلاوة",ic:"🎙️",d:"سجّلتِ أول تلاوة",on:rec>=1},{t:"صوت متقن",ic:"🎧",d:"10 تلاوات ناجحة",on:good>=10},{t:"حافظة",ic:"📖",d:"أتممتِ 7 أيام من خطة الحفظ",on:hz>=7},
   {t:"مواظبة",ic:"🔥",d:"7 أيام دخول متتالية",on:st>=7},{t:"لاعبة ماهرة",ic:"🎮",d:"500 نقطة في الألعاب",on:g.total>=500}];
}
// ===== المستويات =====
VIEWS.levels=function(){
  view.innerHTML=`<h1>المستويات</h1>`+LEVELS.map(L=>{ const ls=lessonsOf(L.n); const unlocked=levelUnlocked(L.n); const passed=levelPassed(L.n); const doneN=ls.filter(l=>ST.done[l.id]).length;
    return `<div class="card lv lvcolor-${L.n} ${unlocked?"":"lock"}"><div class="level-head"><div class="n">${L.n}</div><div style="flex:1;min-width:0"><div class="row between"><h2>${esc(L.title)}</h2>${passed?`<span class="pill good">مُجتاز</span>`:unlocked?`<span class="pill acc">مفتوح</span>`:`<span class="pill">مقفل</span>`}</div><p class="muted small">${esc(L.desc)}</p></div></div>
    ${ls.length?`<div class="progress" style="margin:10px 0 4px"><i style="width:${Math.round(doneN/ls.length*100)}%"></i></div>`:""}
    <div class="stack" style="margin-top:10px">${ls.map((l,i)=>`<button class="lesson-item" data-l="${l.id}" ${unlocked?"":"disabled"}><span class="mark ${ST.done[l.id]?"done":""}">${ST.done[l.id]?"✓":i+1}</span><span class="t"><b>${esc(l.title)}</b><span class="small muted">${esc(l.bookPages||"")}${ST.quiz[l.id]?` · اختبار الدرس ${ST.quiz[l.id]}٪`:""}</span></span></button>`).join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn ${doneN===ls.length?"gold":"sec"}" data-test="${L.n}" ${unlocked?"":"disabled"}>${passed?"إعادة اختبار المستوى":"اختبار اجتياز المستوى"}</button>${ST.levelTests[L.n]?`<span class="small muted">آخر نتيجة: نظري ${ST.levelTests[L.n].mcq}٪ · تلاوة ${ST.levelTests[L.n].recite??"—"}٪</span>`:""}</div></div>`; }).join("");
  view.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>go("lesson",b.dataset.l)); view.querySelectorAll("[data-test]").forEach(b=>b.onclick=()=>go("leveltest",+b.dataset.test));
};

// ===== الدرس =====
VIEWS.lesson=function(id){
  const l=LESSONS.find(x=>x.id===id); if(!l){go("levels");return;} const L=LEVELS[l.level-1]; const ls=lessonsOf(l.level); const idx=ls.indexOf(l);
  view.innerHTML=`<div class="row between"><button class="btn sec sm" id="back">→ ${esc(L.title)}</button><span class="pill gold">${esc(l.bookPages||"")}</span></div>

  if(l.practice&&l.practice.length){ const sel=i=>{ document.querySelectorAll("#prList .opt").forEach(b=>b.classList.toggle("sel",+b.dataset.p===i)); $("#prCur").textContent=l.practice[i]; }; sel(0); document.querySelectorAll("#prList .opt").forEach(b=>b.onclick=()=>sel(+b.dataset.p));

  renderQuiz($("#quizBox"),l.quiz||[],{onFinish:pct=>{ ST.quiz[l.id]=pct; ST.lastQuizDay=new Date().toDateString(); if(pct>=ST.passPct){ ST.done[l.id]=true; ensureLessonHomework(l); PTS.add(PTS.rules.lesson,"إنهاء درس «"+l.title+"»","lesson:"+l.id); if(pct>=100) PTS.add(PTS.rules.quizPerfect,"اختبار كامل الدرجة","quiz100:"+l.id); toast("أحسنتِ! أُنجز الدرس وظهر لك واجبه."); setTimeout(()=>{ const q=$("#quizCard"); if(q){ q.insertAdjacentHTML("afterend",lessonHomeworkCardHtml(l)); wireLessonHomework(l); const c=$("#lhw-"+l.id); if(c) c.scrollIntoView({behavior:"smooth"}); } },50); } else toast("راجعي الدرس ثم أعيدي الاختبار."); save(); }});
  if(ST.done[l.id]){ ensureLessonHomework(l); const q=$("#quizCard"); if(q){ q.insertAdjacentHTML("afterend",lessonHomeworkCardHtml(l)); wireLessonHomework(l); } }

function renderQuiz(box,qs,{onFinish,shuffle=false,label="تصحيح"}={}){
  const list=shuffle?qs.slice().sort(()=>Math.random()-.5):qs; const ans=new Array(list.length).fill(null);
  box.innerHTML=list.map((q,i)=>`<div class="q" data-q="${i}"><b>${i+1}. ${esc(q.q)}</b><div class="opts">${q.options.map((o,j)=>`<button class="opt" data-o="${j}">${esc(o)}</button>`).join("")}</div><div class="why" hidden></div></div>`).join("")+`<div class="row" style="margin-top:12px"><button class="btn" id="gradeBtn">${esc(label)}</button><span id="gradeOut"></span></div>`;
  box.querySelectorAll(".q").forEach((qel,i)=>qel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(qel.dataset.locked)return; qel.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); ans[i]=+b.dataset.o; }));
  box.querySelector("#gradeBtn").onclick=()=>{ if(ans.some(a=>a===null)){ toast("أجيبي عن كل الأسئلة أولًا"); return; } let c=0; box.querySelectorAll(".q").forEach((qel,i)=>{ const q=list[i]; qel.dataset.locked=1; qel.querySelectorAll(".opt").forEach(b=>{ const j=+b.dataset.o; if(j===q.answer)b.classList.add("right"); else if(j===ans[i])b.classList.add("wrong"); }); if(ans[i]===q.answer)c++; const w=qel.querySelector(".why"); w.hidden=false; w.textContent=(ans[i]===q.answer?"صحيح. ":"الإجابة الصحيحة: "+q.options[q.answer]+". ")+(q.why||""); });
    const pct=Math.round(c/list.length*100); box.querySelector("#gradeOut").innerHTML=`<span class="pill ${pct>=ST.passPct?"good":"warn"}">${c} من ${list.length} — ${pct}٪</span>`; box.querySelector("#gradeBtn").disabled=true; onFinish&&onFinish(pct); };
}

VIEWS.practice=async function(arg){
  const pre=arg||{s:1,a1:1,a2:7};
  view.innerHTML=`<h1>التدريب الصوتي</h1><div class="card"><div class="row">
    <label class="f">السورة<select id="sIn">${SURAH_NAMES.map((n,i)=>`<option value="${i+1}" ${i+1===pre.s?"selected":""}>${i+1}. ${n}</option>`).join("")}</select></label>
    <label class="f">من آية<input type="number" id="a1In" min="1" value="${pre.a1}"></label><label class="f">إلى آية<input type="number" id="a2In" min="1" value="${pre.a2}"></label>
    <label class="f">القراءة المرجعية<select id="rIn">${RECITERS.map(r=>`<option value="${r.id}" ${r.id===ST.reciter?"selected":""}>${r.name}</option>`).join("")}</select></label></div>
    <div class="row" style="margin-top:8px"><button class="btn" id="loadBtn">عرض الآيات</button><span class="small muted">نصوص قصار السور مدمجة؛ وغيرها يُجلب عند توفر الإنترنت.</span></div></div><div id="prBox"></div>`;
  $("#loadBtn").onclick=()=>loadPractice(); loadPractice();
  async function loadPractice(){
    const s=+$("#sIn").value, a1=Math.max(1,+$("#a1In").value||1), a2=Math.min(AYAH_COUNTS[s-1],Math.max(a1,+$("#a2In").value||a1)); if(a2-a1>9){ toast("اختاري 10 آيات على الأكثر في المرة"); return; }
    ST.reciter=$("#rIn").value; save(); const box=$("#prBox"); box.innerHTML=`<div class="card"><p class="muted">جارٍ التحميل…</p></div>`;
    const ayahs=await getAyahs(s,a1,a2); const ref=await getReference(s,a1,a2,ST.reciter); const words=ayahs.filter(o=>o.text).flatMap(o=>o.text.split(/\s+/));
    box.innerHTML=`<div class="card"><div class="eyebrow">سورة ${SURAH_NAMES[s-1]} ${a1===a2?`الآية ${a1}`:`الآيات ${a1}–${a2}`}</div>${ayahHtml(ayahs)}${playerHtml(ref)}</div>
    <div class="card"><h3>تلاوتك</h3><p class="small muted">استمعي للمرجع أولًا، ثم سجّلي تلاوتك للآيات نفسها. يحلّل التطبيق: الكلمات (بالتعرّف على الكلام إن توفر)، ومقادير المدود والغنن مقارنةً بالمرجع، والوقفات.</p>${recorderHtml("pr0","سجّلي التلاوة كاملة ثم أوقفي التسجيل.")}<div id="live" class="small muted"></div><div id="result"></div></div>`;
    wirePlayer(ref);
    wireRecorder("pr0",{recognize:true,onText:(t)=>{ $("#live").textContent=t?"سمعت: "+t:""; },onDone:async(blob,text,srErr)=>{
      const out=$("#pr0Out"); out.innerHTML=audioTag(blob); const res=$("#result"); res.innerHTML=`<div class="note info" id="anStatus">جارٍ التحليل… (قد يستغرق ثوانٍ)</div>`;
      const notes=[]; let wordPct=null;
      const bt=await bestTranscript(blob,text,m=>{ const el=$("#anStatus"); if(el) el.textContent=m; }); text=bt.text; if(bt.engine==="quran") notes.push({k:"info",t:"صُحّحت الكلمات بمحرك التعرف القرآني داخل الجهاز."});
      // 1) مقارنة الكلمات
      const hyp=normAr(text||"").split(" ").filter(Boolean); const refW=words.map(normAr);
      if(hyp.length){ const {st,extra}=alignWords(refW,hyp); const missed=[]; st.forEach((v,i)=>{ if(v==="miss"){ const near=extra.find(x=>similar(x,refW[i])>=0.6); if(near){ st[i]="warn"; extra.splice(extra.indexOf(near),1); missed.push({i,near}); } else missed.push({i}); } });
        const okN=st.filter(x=>x==="ok").length; wordPct=Math.round(okN/refW.length*100);
        document.querySelectorAll("#prBox .quran .w").forEach((el,i)=>{ el.className="w "+(st[i]==="ok"?"ok":st[i]==="warn"?"warn":"miss"); });
        if(missed.length){ const names=missed.slice(0,6).map(m=>`«${words[m.i]}»${m.near?" (سُمعت: "+m.near+")":""}`).join("، "); notes.push({k:missed.length>2?"bad":"warn",t:`كلمات لم تُسمع صحيحة أو سقطت: ${names}${missed.length>6?" وغيرها":""}. قد يكون ذلك لحنًا جليًا في الحروف أو الحركات، أو ضعف التقاط الميكروفون.`}); }
        else notes.push({k:"good",t:"جميع الكلمات سُمعت مطابقة لنص الآيات."});
        if(extra.length) notes.push({k:"warn",t:`كلمات زائدة سُمعت: ${extra.slice(0,5).join("، ")}.`});
      } else notes.push({k:"info",t:srErr==="not-allowed"||srErr==="service-not-allowed"?"لم يُسمح بالتعرّف على الكلام؛ اسمحي للميكروفون والتعرف على الكلام من إعدادات المتصفح.":srErr==="network"?"تعذّر التعرّف على الكلام لضعف الاتصال بالإنترنت؛ اعتمد التحليل على الصوت فقط.":srErr==="no-speech"?"لم يُلتقط كلام واضح؛ اقرئي بصوت أعلى وقرب الميكروفون.":"التعرّف على الكلام غير متاح في هذا المتصفح (استخدمي Chrome على أندرويد أو Safari على آيفون)؛ اعتمد التحليل على الصوت فقط."});
      // 2) مقارنة صوتية
      let stuSig=null, refSig=null; try{ stuSig=await Audio_.decode(blob); }catch(e){}
      try{ refSig=await decodeReference(ref); }catch(e){}
      let r={score:null,notes:[]}; if(stuSig) r=analyzeRecitation(stuSig,refSig,words);
      if(!refSig&&ref.reciter.src!=="local") r.notes.unshift({k:"info",t:"تعذّر تحليل صوت القارئ للمقارنة الدقيقة (المصدر الخارجي لا يسمح بذلك من هذا المتصفح). للمقارنة الدقيقة سجّلي قراءة الأستاذة من وضع الأستاذة واختاريها مرجعًا."});
      notes.push(...r.notes);
      const parts=[]; if(wordPct!=null)parts.push(wordPct); if(r.acoustic!=null)parts.push(r.acoustic); const score=parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length):null;
      res.innerHTML=`<div class="card soft"><div class="score"><div class="big ${score==null?"":score>=ST.passPct?"good":score>=55?"warn":"bad"}">${score==null?"—":score+"٪"}</div><div><b>التقدير التقريبي</b><div class="small muted">${wordPct!=null?`الكلمات ${wordPct}٪`:""}${r.acoustic!=null?` · التشابه الصوتي ${r.acoustic}٪`:""}</div></div></div>
        <div class="stack" style="margin-top:12px">${notes.map(n=>`<div class="note ${n.k}">${esc(n.t)}</div>`).join("")}</div>
        <p class="small muted" style="margin-top:10px">هذا تقدير آلي يساعدك على الانتباه؛ والحكم النهائي لأستاذة الحلقة بالسماع. يمكنك حفظ المحاولة أو إرسالها كواجب.</p>
        <div class="row" style="margin-top:8px"><button class="btn sec sm" id="saveAtt">حفظ المحاولة</button>${cloudOn()?`<button class="btn sm" id="cloudAtt">إرسال للأستاذة</button>`:""}<button class="btn sec sm" id="exportAtt">تصدير التسجيل ملفًا</button></div></div>`;
      const label=`سورة ${SURAH_NAMES[s-1]} ${a1}–${a2}`; const att={id:Date.now(),label,score,wordPct,acoustic:r.acoustic,notes:notes.map(n=>n.t),date:Date.now(),s,a1,a2};
      if(pre.auto){ ST.autoDone=ST.autoDone||{}; ST.autoDone[pre.auto]=score; ST.attempts.push(att); PTS.add(score>=ST.passPct?PTS.rules.reciteGood:PTS.rules.recite,"تلاوة يومية"+(score>=ST.passPct?" ناجحة":""),"auto:"+pre.auto); await DB.put("att:"+att.id,blob); save(); if(cloudOn()){ CLOUD.submit({kind:"recitation",hwTitle:"واجب تلقائي: "+label,att,blob}).then(()=>toast("أُنجز الواجب وأُرسل للأستاذة")).catch(()=>toast("أُنجز الواجب (تعذّر الإرسال السحابي)")); } else toast("أُنجز الواجب"); ATT.recheck(); }
      $("#saveAtt").onclick=async()=>{ ST.attempts.push(att); await DB.put("att:"+att.id,blob); save(); toast("حُفظت المحاولة"); PTS.add(score>=ST.passPct?PTS.rules.reciteGood:PTS.rules.recite,"تلاوة مسجّلة","att:"+att.id); };
      const ca=$("#cloudAtt"); if(ca) ca.onclick=async()=>{ ca.disabled=true; try{ await CLOUD.submit({kind:"recitation",hwTitle:label,att,blob}); toast("أُرسلت التلاوة للأستاذة"); }catch(e){ toast(CLOUD.msg(e)); ca.disabled=false; } };
      $("#exportAtt").onclick=async()=>{ const b64=await blobToB64(blob); const pack={type:"rayaheen-submission",student:ST.fullName||ST.name,halaqa:ST.halaqa,teacher:ST.teacherName,attempt:att,audio:b64}; await downloadsSave(`تلاوة-${ST.name}-${s}-${a1}-${a2}.json`,new Blob([JSON.stringify(pack)],{type:"application/json"})); };
    }});
  }
};

VIEWS.makharij=async function(){
  const refKeys=await DB.keys("letter:"); const has=new Set(refKeys.map(k=>k.split(":")[1]));
  let cur=LETTERS[0].letter;
  view.innerHTML=`<h1>مخارج الحروف</h1><div class="card"><p class="small muted">اختاري حرفًا لتقرئي مخرجه وصفاته من الكتاب، ثم انطقيه ساكنًا بعد همزة (أَبْ، أَتْ…) وسجّلي. إن سجّلت الأستاذة نطقها للحروف (الخط الذهبي تحت الحرف) قارن التطبيق نطقك بها وأخبرك إن كان أقرب إلى حرف آخر.</p><div class="letters" id="letters" style="margin-top:10px">${LETTERS.map(l=>`<button data-l="${l.letter}" class="${has.has(l.letter)?"has":""}">${l.letter}</button>`).join("")}</div></div><div id="lBox"></div>`;
  const draw=async()=>{ const L=LETTERS.find(x=>x.letter===cur); document.querySelectorAll("#letters button").forEach(b=>b.classList.toggle("on",b.dataset.l===cur)); const refBlob=await DB.get("letter:"+cur);
    $("#lBox").innerHTML=`<div class="card"><div class="row between"><div class="bigletter">${L.letter}</div><div style="flex:1;min-width:200px"><h2>${esc(L.name)}</h2><p class="small"><span class="tag">اللقب:</span> ${esc(L.laqab||"—")}</p></div></div>
      <dl class="kv" style="margin-top:10px"><dt>المخرج</dt><dd>${esc(L.makhraj)}</dd><dt>الصفات</dt><dd>${(L.sifat||[]).map(s=>`<span class="pill acc">${esc(s)}</span>`).join(" ")}</dd><dt>تنبيه</dt><dd>${esc(L.tip||"")}</dd>${L.confusedWith&&L.confusedWith.length?`<dt>يُخلط بـ</dt><dd>${L.confusedWith.map(c=>`<span class="pill warn">${esc(c)}</span>`).join(" ")}</dd>`:""}<dt>كلمات</dt><dd class="quran" style="font-size:1.4rem;text-align:right;padding:0;line-height:1.8">${(L.practiceWords||[]).map(esc).join(" · ")}</dd></dl>
      ${refBlob?`<div class="row" style="margin-top:8px"><span class="small muted">نطق الأستاذة:</span>${audioTag(refBlob)}</div>`:`<p class="small muted" style="margin-top:8px">لا يوجد تسجيل للأستاذة لهذا الحرف بعد.</p>`}
      ${isTeacher()?`<details style="margin-top:8px"><summary>تسجيل نطق الأستاذة لهذا الحرف</summary>${recorderHtml("tl","انطقي الحرف ساكنًا بعد همزة مفتوحة، مثل: أَ"+L.letter+"ْ، ثم أوقفي.")}</details>`:""}</div>
      <div class="card"><h3>نطقك</h3>${recorderHtml("sl","انطقي الحرف ساكنًا بعد همزة مفتوحة (أَ"+L.letter+"ْ) ثم أوقفي التسجيل.")}<div id="lRes"></div></div>`;
    if(isTeacher()) wireRecorder("tl",{onDone:async b=>{ await DB.put("letter:"+cur,b); has.add(cur); toast("حُفظ نطق الأستاذة للحرف "+cur); draw(); }});
    wireRecorder("sl",{onDone:async b=>{ $("#slOut").innerHTML=audioTag(b); const res=$("#lRes"); res.innerHTML=`<div class="note info">جارٍ التحليل…</div>`; let sig; try{ sig=await Audio_.decode(b); }catch(e){ res.innerHTML=`<div class="note bad">تعذّر قراءة التسجيل.</div>`; return; }
      const S=extractFeatures(sig); const notes=[]; if(S.voicedSec<0.08){ res.innerHTML=`<div class="note bad">لم يُلتقط صوت واضح.</div>`; return; }
      // سمات بسيطة: صفير/همس → مركز طيفي مرتفع ومعدل عبور الصفر مرتفع
      const vf=S.frames.filter(f=>f.v); const cent=vf.reduce((a,f)=>a+f.cent,0)/vf.length, zcr=vf.reduce((a,f)=>a+f.zcr,0)/vf.length;
      const sif=L.sifat||[]; const hams=sif.includes("الهمس"); const safir=sif.includes("الصفير");
      if(safir&&cent<2500) notes.push({k:"warn",t:"حرف صفير يحتاج صوتًا حادًا واضحًا؛ نطقك بدا منخفض الحدة، أخرجي الصوت من بين الثنايا بوضوح."});
      if(!hams&&!safir&&zcr>0.25) notes.push({k:"warn",t:"سُمع في نطقك هواء كثير (همس) والحرف مجهور؛ احبسي النفس عند النطق."});
      if(hams&&zcr<0.06&&cent<1500) notes.push({k:"warn",t:"الحرف مهموس يجري معه النفس؛ نطقك بدا مجهورًا مكتومًا."});
      if(sif.includes("القلقلة")&&S.voicedSec>0.6) notes.push({k:"info",t:"القلقلة اضطراب قصير في المخرج؛ لا تطيلي الصوت بعد الحرف."});
      // مقارنة بالمراجع
      const refs=[]; for(const k of await DB.keys("letter:")){ const bl=await DB.get(k); if(bl){ try{ refs.push({letter:k.split(":")[1],sig:await Audio_.decode(bl)}); }catch(e){} } }
      let scoreHtml=""; if(refs.length){ const cmp=compareLetter(sig,refs); if(cmp.ranked){ const mine=cmp.ranked.find(r=>r.letter===cur); const best=cmp.ranked[0]; if(mine){ const sc=Math.max(0,Math.min(100,Math.round(100-(mine.cost-0.8)*40))); scoreHtml=`<div class="score"><div class="big ${sc>=75?"good":sc>=55?"warn":"bad"}">${sc}٪</div><div><b>التشابه بنطق الأستاذة</b><div class="small muted">${best.letter===cur?"نطقك أقرب إلى الحرف الصحيح":`نطقك أقرب إلى حرف «${best.letter}» منه إلى «${cur}»`}</div></div></div>`; if(best.letter!==cur) notes.unshift({k:"bad",t:`انتبهي: الصوت المسجَّل أقرب إلى «${best.letter}». راجعي المخرج: ${L.makhraj}`}); else if(sc<60) notes.unshift({k:"warn",t:"النطق في الاتجاه الصحيح لكنه بعيد عن نطق الأستاذة؛ استمعي لها وكرّري."}); else notes.unshift({k:"good",t:"نطق جيد مطابق لمخرج الحرف."}); } else notes.push({k:"info",t:"لم تسجّل الأستاذة هذا الحرف بعد، فقورن نطقك بالحروف المسجلة فقط: الأقرب «"+best.letter+"»."}); } }
      else notes.push({k:"info",t:"لا توجد تسجيلات للأستاذة بعد؛ اطلبي منها تسجيل الحروف من وضع الأستاذة لتعمل المقارنة الآلية."});
      res.innerHTML=`<div class="card soft">${scoreHtml}<div class="stack" style="margin-top:10px">${notes.map(n=>`<div class="note ${n.k}">${esc(n.t)}</div>`).join("")}</div></div>`; }});
  };
  document.querySelectorAll("#letters button").forEach(b=>b.onclick=()=>{ cur=b.dataset.l; draw(); }); draw();
};

// ===== واجب الدرس (يظهر بعد إنهاء كل درس) =====
function ensureLessonHomework(l){ ST.lessonHw=ST.lessonHw||{}; if(!ST.lessonHw[l.id]){ const phrases=(l.practice||[]).slice(0,4); ST.lessonHw[l.id]={id:"lhw-"+l.id,lessonId:l.id,title:"واجب درس «"+l.title+"»",phrases,created:Date.now(),done:false,score:null}; save(); } return ST.lessonHw[l.id]; }
function lessonHomeworkCardHtml(l){ const h=ensureLessonHomework(l); return `<div class="card lv" style="--lc:var(--gold)" id="lhw-${l.id}"><div class="row between"><h3>${esc(h.title)}</h3>${h.done?`<span class="pill good">أُنجز ${h.score!=null?h.score+"٪":""}</span>`:`<span class="pill warn">مطلوب</span>`}</div>
  <p class="small muted">اقرئي العبارات التالية بتطبيق حكم الدرس في تسجيل واحد متتابع. يصحّح التطبيق الكلمات ويُرسل الواجب للأستاذة تلقائيًا.</p>
  <div class="quran" style="font-size:1.45rem;margin-top:8px">${h.phrases.map((p,i)=>`<span data-ph="${i}">${esc(p)}</span>`).join(" <span class='ayah-num'>۝</span> ")}</div>
  ${recorderHtml("lhw","سجّلي قراءة العبارات كلها ثم أوقفي.")}<div id="lhwRes"></div></div>`; }
function wireLessonHomework(l){ const h=ensureLessonHomework(l); const words=h.phrases.join(" ").split(/\s+/).filter(Boolean);
  wireRecorder("lhw",{recognize:true,onDone:async(blob,text)=>{ $("#lhwOut").innerHTML=audioTag(blob); const res=$("#lhwRes"); res.innerHTML=`<div class="note info" id="lhwSt">جارٍ التصحيح…</div>`;
    text=(await bestTranscript(blob,text,m=>{ const el=$("#lhwSt"); if(el) el.textContent=m; })).text; const hyp=normAr(text||"").split(" ").filter(Boolean); const refW=words.map(normAr); let wordPct=null; const notes=[];
    if(hyp.length){ const {st,extra}=alignWords(refW,hyp); const missed=[]; st.forEach((v,i)=>{ if(v==="miss"){ const near=extra.find(x=>similar(x,refW[i])>=0.6); if(near){ st[i]="warn"; extra.splice(extra.indexOf(near),1); missed.push({i,near}); } else missed.push({i}); } }); wordPct=Math.round(st.filter(x=>x==="ok").length/refW.length*100);
      if(missed.length) notes.push({k:missed.length>2?"bad":"warn",t:`كلمات سقطت أو حُرّفت: ${missed.slice(0,8).map(m=>`«${words[m.i]}»${m.near?" سُمعت: "+m.near:""}`).join("، ")}`}); else notes.push({k:"good",t:"جميع الكلمات مطابقة. أحسنتِ."}); }
    else notes.push({k:"info",t:"لم يُتعرَّف على الكلام؛ سُجّل الواجب وسيُقيَّم بالسماع."});
    let S=null; try{ S=extractFeatures(await Audio_.decode(blob)); }catch(e){}
    if(S&&S.voicedSec<1) notes.push({k:"bad",t:"التسجيل قصير جدًا؛ أعيدي قراءة العبارات كاملة."});
    const score=wordPct; h.done=true; h.score=score; h.date=Date.now(); save(); ATT.recheck(); PTS.add(PTS.rules.lessonHw,"واجب درس","lhw:"+h.id);
    const att={id:Date.now(),label:h.title,score,wordPct,notes:notes.map(n=>n.t),date:Date.now(),s:0,a1:0,a2:0}; ST.attempts.push(att); await DB.put("att:"+att.id,blob); save();
    if(cloudOn()) CLOUD.submit({kind:"homework",hwId:h.id,hwTitle:h.title,att,blob}).then(()=>toast("أُرسل الواجب للأستاذة")).catch(()=>{});
    res.innerHTML=`<div class="card soft"><div class="score"><div class="big ${score==null?"":score>=ST.passPct?"good":score>=55?"warn":"bad"}">${score==null?"—":score+"٪"}</div><div><b>${score==null?"سُجّل الواجب":score>=ST.passPct?"واجب مقبول":"يُستحسن إعادة التسجيل"}</b><div class="small muted">يصل الأستاذة تلقائيًا</div></div></div><div class="stack" style="margin-top:10px">${notes.map(n=>`<div class="note ${n.k}">${esc(n.t)}</div>`).join("")}</div><div class="row" style="margin-top:8px"><button class="btn sec sm" id="lhwAgain">إعادة التسجيل</button></div></div>`;
    $("#lhwAgain").onclick=()=>{ const l2=LESSONS.find(x=>x.id===h.lessonId); const card=$("#lhw-"+h.lessonId); card.outerHTML=lessonHomeworkCardHtml(l2); wireLessonHomework(l2); }; }}); }
// ===== الواجبات التلقائية (يومية، تُولَّد من خطة الطالبة ومستواها) =====
function autoHomeworkList(){
  const items=[]; const today=new Date().toDateString(); const key=ATT.key();
  if(ST.hifz&&ST.hifz.plan){ const T=todayTasks(); if(T&&!T.finished) T.tasks.forEach(t=>items.push({id:"a-"+key+"-"+t.key,kind:t.type==="new"?"حفظ جديد":t.type==="fix"?"تثبيت":"مراجعة",title:`${t.title}: ${chunkLabel(t.c)}`,s:t.c.s,a1:t.c.a1,a2:t.c.a2,hidden:t.type!=="new"&&t.type!=="fix",done:!!taskDone(t),go:()=>go("hifz",{tab:"today"})})); }
  const cl=currentLevel(); if(cl<=4){ const L=LEVELS[cl-1]; const ls=lessonsOf(cl); const next=ls.find(l=>!ST.done[l.id]);
    if(next) items.push({id:"a-"+key+"-lesson",kind:"تجويد",title:`درس «${next.title}» واختباره`,done:!!ST.done[next.id],go:()=>go("lesson",next.id)});
    const dayIdx=Math.floor(Date.now()/86400000); const r=L.recite[dayIdx%L.recite.length]; const rid="a-"+key+"-recite";
    items.push({id:rid,kind:"تصحيح تلاوة",title:`تلاوة ${SURAH_NAMES[r[0]-1]} ${r[1]===r[2]?`آية ${r[1]}`:`${r[1]}–${r[2]}`} بتطبيق أحكام ${L.title}`,s:r[0],a1:r[1],a2:r[2],done:!!(ST.autoDone||{})[rid],go:()=>go("practice",{s:r[0],a1:r[1],a2:r[2],auto:rid})}); }
  return items;
}
function lessonHomeworkListHtml(){ const hws=Object.values(ST.lessonHw||{}).sort((a,b)=>b.created-a.created); if(!hws.length) return ""; const pend=hws.filter(h=>!h.done).length; return `<div class="card"><div class="row between"><h3>واجبات الدروس</h3><span class="pill ${pend?"warn":"good"}">${pend?pend+" معلّق":"كلها منجزة"}</span></div><p class="small muted">يظهر واجب بعد إنهاء كل درس في التجويد.</p><div class="stack" style="margin-top:8px">${hws.map(h=>`<button class="lesson-item" data-lhw="${h.lessonId}"><span class="mark ${h.done?"done":""}">${h.done?"✓":"!"}</span><span class="t"><b>${esc(h.title)}</b><span class="small muted">${h.done?`أُنجز · ${h.score!=null?h.score+"٪":""}`:"سجّلي قراءة عبارات الدرس"}</span></span></button>`).join("")}</div></div>`; }
function autoHomeworkHtml(){ const items=autoHomeworkList(); const done=items.filter(i=>i.done).length; return `<div class="card"><div class="row between"><h3>واجبات اليوم (تلقائية)</h3><span class="pill ${done===items.length&&items.length?"good":"acc"}">${done} من ${items.length}</span></div><p class="small muted">تُولَّد يوميًا من خطة حفظك ومستواك في التجويد، وتُرسل نتائجها للأستاذة تلقائيًا عند تسجيل الدخول. ${fmtDate(Date.now())}</p>
  <div class="stack" style="margin-top:8px">${items.length?items.map((i,k)=>`<button class="lesson-item" data-auto="${k}"><span class="mark ${i.done?"done":""}">${i.done?"✓":k+1}</span><span class="t"><b>${esc(i.title)}</b><span class="small muted">${i.kind}${i.done?" · أُنجز":""}</span></span></button>`).join(""):`<p class="muted small">اضبطي خطة الحفظ لتظهر واجباتك اليومية.</p>`}</div></div>`; }
function wireAutoHomework(){ const items=autoHomeworkList(); document.querySelectorAll("[data-auto]").forEach(b=>b.onclick=()=>items[+b.dataset.auto].go()); document.querySelectorAll("[data-lhw]").forEach(b=>b.onclick=()=>go("lesson",b.dataset.lhw)); }
// ===== اختبار المستوى =====
VIEWS.leveltest=async function(lv){
  lv=+lv||1; const L=LEVELS[lv-1]; const ls=lessonsOf(lv); if(!levelUnlocked(lv)){ go("levels"); return; }
  const pool=(lv===4?LESSONS:ls).flatMap(l=>l.quiz||[]); const nQ=lv===4?30:Math.min(20,pool.length); const qs=pool.slice().sort(()=>Math.random()-.5).slice(0,nQ);
  const prev=ST.levelTests[lv]||{}; const stage={mcq:prev.mcq??null,recite:prev.recite??null};
  view.innerHTML=`<div class="row between"><button class="btn sec sm" id="back">→ المستويات</button><span class="pill gold">${esc(L.title)}</span></div>
  <div class="card"><h1>اختبار اجتياز ${esc(L.title)}</h1><p class="lesson-body small">يتكوّن الاختبار من جزأين: نظري (${nQ} سؤالًا من أبواب المستوى) وتلاوة اختبارية. يُجتاز المستوى بالحصول على ${ST.passPct}٪ فأكثر في الجزأين${ST.requireTeacher?" مع اعتماد الأستاذة":""}. هدف المستوى: ${esc(L.mastery)}.</p>
    <div class="row" style="margin-top:8px"><span class="pill ${stage.mcq==null?"":stage.mcq>=ST.passPct?"good":"bad"}">النظري: ${stage.mcq==null?"لم يُؤدَّ":stage.mcq+"٪"}</span><span class="pill ${stage.recite==null?"":stage.recite>=ST.passPct?"good":"bad"}">التلاوة: ${stage.recite==null?"لم تُؤدَّ":stage.recite+"٪"}</span>${prev.passed?`<span class="pill good">المستوى مُجتاز</span>`:""}</div></div>
  <div class="card"><h3>أولًا: الجزء النظري</h3><div id="mcqBox" style="margin-top:8px"></div></div>
  <div class="card"><h3>ثانيًا: التلاوة الاختبارية</h3><p class="small muted">اقرئي المقاطع التالية بتطبيق أحكام المستوى. يُقدّر التطبيق تلاوتك آليًا بمقارنتها بـ«${esc((RECITERS.find(r=>r.id===ST.reciter)||RECITERS[0]).name)}» أو بقراءة الأستاذة إن وُجدت، وتعتمد الأستاذة النتيجة بالسماع.</p><div id="recBox" class="stack" style="margin-top:8px"></div></div>
  <div class="card soft" id="verdict"></div>`;
  $("#back").onclick=()=>go("levels");
  renderQuiz($("#mcqBox"),qs,{label:"تسليم الجزء النظري",onFinish:pct=>{ stage.mcq=pct; commit(); }});
  const recBox=$("#recBox"); let k=0; const scores=[];
  for(const [s,a1,a2] of L.recite){ const ay=await getAyahs(s,a1,a2); const words=ay.filter(o=>o.text).flatMap(o=>o.text.split(/\s+/)); const id="rt"+(k++); const d=document.createElement("div"); d.className="q"; d.innerHTML=`<div class="eyebrow">سورة ${SURAH_NAMES[s-1]} ${a1===a2?`الآية ${a1}`:`الآيات ${a1}–${a2}`}</div>${ayahHtml(ay)}${recorderHtml(id,"سجّلي المقطع كاملًا.")}<div data-r></div>`; recBox.appendChild(d);
    wireRecorder(id,{recognize:true,onDone:async(blob,text)=>{ $("#"+id+"Out").innerHTML=audioTag(blob); const rr=d.querySelector("[data-r]"); rr.innerHTML=`<div class="note info">جارٍ التحليل…</div>`;
      text=(await bestTranscript(blob,text,m=>{ rr.innerHTML=`<div class="note info">${esc(m)}</div>`; })).text;
      let wordPct=null; const hyp=normAr(text||"").split(" ").filter(Boolean); if(hyp.length){ const {st}=alignWords(words.map(normAr),hyp); wordPct=Math.round(st.filter(x=>x==="ok").length/words.length*100); }
      let ac=null; try{ let ref=await getReference(s,a1,a2,"teacher"); let rs=await decodeReference(ref); if(!rs){ ref=await getReference(s,a1,a2,ST.reciter); rs=await decodeReference(ref); } const r=analyzeRecitation(await Audio_.decode(blob),rs,words); ac=r.acoustic; rr.innerHTML=`<div class="stack">${r.notes.map(n=>`<div class="note ${n.k}">${esc(n.t)}</div>`).join("")}</div>`; }catch(e){ rr.innerHTML=""; }
      const parts=[wordPct,ac].filter(x=>x!=null); const sc=parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length):null; scores[k-1]=sc; await DB.put(`lt:${lv}:${s}:${a1}`,blob);
      rr.insertAdjacentHTML("afterbegin",`<div class="row"><span class="pill ${sc==null?"":sc>=ST.passPct?"good":"warn"}">تقدير هذا المقطع: ${sc==null?"—":sc+"٪"}</span></div>`);
      const got=scores.filter(x=>x!=null); if(got.length===L.recite.length){ stage.recite=Math.round(got.reduce((a,b)=>a+b,0)/got.length); commit(); } }}); }
  function commit(){ const t=ST.levelTests[lv]||{}; Object.assign(t,{mcq:stage.mcq,recite:stage.recite,date:Date.now()}); const ok=stage.mcq!=null&&stage.recite!=null&&stage.mcq>=ST.passPct&&stage.recite>=ST.passPct; if(ok&&!ST.requireTeacher){ t.passed=true; t.passedAt=t.passedAt||Date.now(); } if(ok&&ST.requireTeacher) t.pendingApproval=true; ST.levelTests[lv]=t; save(); verdict(); }
  function verdict(){ const t=ST.levelTests[lv]||{}; const v=$("#verdict"); if(t.passed){ v.innerHTML=`<div class="cert"><h2>مبارك</h2><div class="name">${esc(ST.fullName||ST.name)}</div><p class="small muted">${ST.halaqa?esc(ST.halaqa):""}${ST.teacherName?" · الأستاذة "+esc(ST.teacherName):""}</p><p>اجتزتِ ${esc(L.title)}${lv<4?" وفُتح لك المستوى التالي.":"؛ أتممتِ منهج رياحين كاملًا."}</p><div class="row" style="justify-content:center;margin-top:10px"><button class="btn gold" id="certBtn">🎓 شهادة الإتمام</button>${lv<4?`<button class="btn sec" id="nextLv">إلى ${esc(LEVELS[lv].title)}</button>`:""}</div></div>`; const b=$("#nextLv"); if(b)b.onclick=()=>go("levels"); $("#certBtn").onclick=()=>go("certificate",lv); }
    else if(t.pendingApproval){ v.innerHTML=`<div class="note info">نتائجك مكتملة وتنتظر اعتماد الأستاذة. صدّري نتيجتك من صفحة «المزيد ← تقدمي» وأرسليها لها.</div>`; }
    else if(stage.mcq!=null&&stage.recite!=null){ v.innerHTML=`<div class="note warn">لم تُحقّق نسبة الاجتياز بعد (النظري ${stage.mcq}٪، التلاوة ${stage.recite}٪). راجعي دروس المستوى وأعيدي الاختبار.</div>`; }
    else v.innerHTML=`<p class="small muted">أكملي الجزأين لتظهر النتيجة.</p>`; }
  verdict();
};

  $("#tLoad").onclick=async()=>{ const s=+$("#tS").value, a=Math.min(AYAH_COUNTS[s-1],Math.max(1,+$("#tA").value||1)); const ay=await getAyahs(s,a,a); const ex=await DB.get(`ref:${s}:${a}`); const box=$("#tBox"); box.innerHTML=`${ayahHtml(ay)}${ex?`<div class="row"><span class="small muted">المسجَّل حاليًا:</span>${audioTag(ex)}<button class="btn danger sm" id="tDel">حذف</button></div>`:""}${recorderHtml("tr","سجّلي الآية كاملة بالتجويد ثم أوقفي.")}`; if(ex)$("#tDel").onclick=async()=>{ await DB.del(`ref:${s}:${a}`); toast("حُذف"); $("#tLoad").click(); }; wireRecorder("tr",{onDone:async b=>{ await DB.put(`ref:${s}:${a}`,b); toast(`حُفظت قراءة الآية ${a} من سورة ${SURAH_NAMES[s-1]}`); $("#tLoad").click(); }}); };
};
