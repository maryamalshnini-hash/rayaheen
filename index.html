function certPngG(o,T){ return new Promise(async(res,rej)=>{ try{ const when=o.when; const cv=document.createElement("canvas"); cv.width=CERT_W; cv.height=CERT_H; const g=cv.getContext("2d"); g.direction="rtl"; g.textAlign="center";
  const grad=g.createLinearGradient(0,0,CERT_W,CERT_H); grad.addColorStop(0,"#fbf8f0"); grad.addColorStop(1,"#eef5f2"); g.fillStyle=grad; g.fillRect(0,0,CERT_W,CERT_H);
  g.strokeStyle="#c9a24d"; g.lineWidth=6; g.strokeRect(40,40,CERT_W-80,CERT_H-80); g.lineWidth=2; g.strokeRect(58,58,CERT_W-116,CERT_H-116);
  // زخرفة نجمية خفيفة
  g.save(); g.globalAlpha=.07; g.fillStyle="#1f7a6d"; for(let i=0;i<9;i++){ star(g,120+i*145,120,34); star(g,120+i*145,CERT_H-120,34); } g.restore();
  const X=CERT_W/2; g.fillStyle="#1f7a6d"; g.font="bold 64px Amiri, 'Noto Naskh Arabic', serif"; g.fillText("رياحين",X,150);
  g.fillStyle="#6b7a76"; g.font="24px 'Noto Naskh Arabic', Amiri, serif"; g.fillText("تعليم التجويد وفق كتاب «هدي المجيد في أحكام التجويد»",X,195);
  g.fillStyle="#c9a24d"; g.font="bold 58px Amiri, serif"; g.fillText(o.title,X,290); if(o.sub){ g.fillStyle="#1f7a6d"; g.font="bold 44px Amiri, serif"; g.fillText(o.sub,X,350); }
  g.fillStyle="#2b3a36"; g.font="28px 'Noto Naskh Arabic', Amiri, serif"; g.fillText(o.intro,X,420);
  g.fillStyle="#1f7a6d"; g.font="bold 70px Amiri, serif"; g.fillText(o.name,X,515);
  g.fillStyle="#2b3a36"; g.font="28px 'Noto Naskh Arabic', Amiri, serif"; wrap(g,o.body,X,585,1100,44);
  // التذييل
  g.font="22px 'Noto Naskh Arabic', serif"; g.fillStyle="#6b7a76"; g.fillText("التاريخ",X+420,800); g.fillStyle="#2b3a36"; g.font="24px 'Noto Naskh Arabic', serif"; const [dh,dg]=certDates(when); g.fillText(dh,X+420,840); g.fillText(dg,X+420,876);
  g.fillStyle="#6b7a76"; g.font="22px 'Noto Naskh Arabic', serif"; g.fillText("المعلمة",X,880); g.fillStyle="#2b3a36"; g.font="bold 28px Amiri, serif"; g.fillText(T.name||ST.teacherName||"—",X,918);
  if(T.sig){ await new Promise(r=>{ const im=new Image(); im.onload=()=>{ const w=300,h=110; g.drawImage(im,X-w/2,745,w,h); r(); }; im.onerror=r; im.src=T.sig; }); } else { g.strokeStyle="#9aa8a3"; g.lineWidth=2; g.beginPath(); g.moveTo(X-150,860); g.lineTo(X+150,860); g.stroke(); }
  // الختم
  const sx=X-430, sy=840; if(T.stamp){ await new Promise(r=>{ const im=new Image(); im.onload=()=>{ const h=190, w=Math.min(260,im.width*h/im.height); g.save(); g.translate(sx,sy); g.rotate(-0.12); g.drawImage(im,-w/2,-h/2,w,h); g.restore(); r(); }; im.onerror=r; im.src=T.stamp; }); } else { g.save(); g.translate(sx,sy); g.rotate(-0.2); g.strokeStyle="#b23a3a"; g.lineWidth=5; g.globalAlpha=.85; g.beginPath(); g.arc(0,0,95,0,Math.PI*2); g.stroke(); g.lineWidth=2; g.beginPath(); g.arc(0,0,82,0,Math.PI*2); g.stroke(); g.fillStyle="#b23a3a"; g.font="bold 34px Amiri, serif"; g.fillText("رياحين",0,-8); g.font="18px 'Noto Naskh Arabic', serif"; g.fillText((T.halaqa||ST.halaqa||"حلقة قرآنية").slice(0,22),0,24); g.font="bold 16px 'Noto Naskh Arabic', serif"; g.fillText("مُعتمدة",0,52); g.restore(); }
  g.fillStyle="#9aa8a3"; g.font="16px monospace"; g.direction="ltr"; g.textAlign="left"; g.fillText(o.serial,80,CERT_H-72);
  cv.toBlob(b=>b?res(b):rej(new Error("blob")),"image/png"); }catch(e){ rej(e); } });
  function star(g,x,y,r){ g.beginPath(); for(let i=0;i<16;i++){ const a=i*Math.PI/8; const rr=i%2?r*.55:r; g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } g.closePath(); g.fill(); }

// تصغير صورة مرفوعة إلى PNG صغير (حتى لا تتجاوز حدود التخزين)
function shrinkImage(file,maxW,maxH){ return new Promise((res,rej)=>{ const im=new Image(); const u=URL.createObjectURL(file); im.onload=()=>{ const r=Math.min(1,maxW/im.width,maxH/im.height); const cv=document.createElement("canvas"); cv.width=Math.round(im.width*r); cv.height=Math.round(im.height*r); cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height); URL.revokeObjectURL(u); const d=cv.toDataURL("image/png"); if(d.length>400000){ const j=cv.toDataURL("image/jpeg",0.85); res(j.length<d.length?j:d); } else res(d); }; im.onerror=()=>rej(new Error("صورة غير صالحة")); im.src=u; }); }
function wireSignaturePad(){ const cv=$("#sigPad"); if(!cv) return; const g=cv.getContext("2d"); g.lineWidth=3.5; g.lineCap="round"; g.lineJoin="round"; g.strokeStyle="#1b2a4a"; let drawing=false,empty=true; const pos=e=>{ const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:(p.clientX-r.left)*cv.width/r.width,y:(p.clientY-r.top)*cv.height/r.height}; };
  const start=e=>{ drawing=true; empty=false; const p=pos(e); g.beginPath(); g.moveTo(p.x,p.y); e.preventDefault(); }; const move=e=>{ if(!drawing) return; const p=pos(e); g.lineTo(p.x,p.y); g.stroke(); e.preventDefault(); }; const end=()=>{ drawing=false; };
  cv.addEventListener("pointerdown",start); cv.addEventListener("pointermove",move); window.addEventListener("pointerup",end);
  $("#sigClear").onclick=()=>{ g.clearRect(0,0,cv.width,cv.height); empty=true; };
  $("#sigSave").onclick=async()=>{ if(empty){ toast("ارسمي توقيعك أولًا"); return; } ST.signature=cv.toDataURL("image/png"); save(); if(cloudOn()) await CLOUD.saveTeacherProfile().catch(()=>{}); toast("حُفظ التوقيع"); render(); };
  const d=$("#sigDel"); if(d) d.onclick=async()=>{ ST.signature=""; save(); if(cloudOn()) await CLOUD.saveTeacherProfile().catch(()=>{}); render(); };

const RANKS=[{t:"مبتدئة",min:0,ic:"🌱"},{t:"مجتهدة",min:150,ic:"✨"},{t:"متقنة",min:400,ic:"🌟"},{t:"ماهرة",min:800,ic:"🏅"},{t:"متميزة",min:1500,ic:"👑"},{t:"نجمة رياحين",min:3000,ic:"💎"}];

  rules:{login:5,tasmee:10,lesson:20,quizPerfect:10,recite:5,reciteGood:10,homework:15,lessonHw:15,hifz:10,game:1,day:10,streak7:50},
  total(){ return ST.points||0; },

const LETTER_ORDER="ء ب ت ث ج ح خ د ذ ر ز س ش ص ض ط ظ ع غ ف ق ك ل م ن ه و ي ا".split(" ");
const LETTER_ALIASES={"ء":["همزة","الهمزة","hamza"],"ا":["الف","ألف","مد","alif"],"ب":["باء","با","ba"],"ت":["تاء","تا","ta"],"ث":["ثاء","ثا","tha"],"ج":["جيم","jeem","jim"],"ح":["حاء","حا","haa"],"خ":["خاء","خا","kha"],"د":["دال","dal"],"ذ":["ذال","thal","dhal"],"ر":["راء","را","ra"],"ز":["زاي","زاء","zay","zai"],"س":["سين","seen","sin"],"ش":["شين","sheen","shin"],"ص":["صاد","sad"],"ض":["ضاد","dad"],"ط":["طاء","طا","taa"],"ظ":["ظاء","ظا","dha","zaa"],"ع":["عين","ain"],"غ":["غين","ghain"],"ف":["فاء","فا","fa"],"ق":["قاف","qaf"],"ك":["كاف","kaf"],"ل":["لام","lam"],"م":["ميم","meem","mim"],"ن":["نون","noon","nun"],"ه":["هاء","ها","ha"],"و":["واو","waw"],"ي":["ياء","يا","ya"]};
function guessLetter(fname){ const n=fname.replace(/\.[^.]+$/,"").trim(); const nn=CLOUD.normName(n);
  for(const [L,al] of Object.entries(LETTER_ALIASES)) for(const a of al.slice().sort((x,y)=>y.length-x.length)) if(a.length>=3&&nn.includes(CLOUD.normName(a))) return L;
  const num=n.match(/(\d{1,2})/); if(num){ const i=+num[1]; if(i>=1&&i<=29) return LETTER_ORDER[i-1]; }
  const ch=[...n].find(c=>LETTER_ORDER.includes(c)||c==="أ"); if(ch) return ch==="أ"?"ء":ch; return ""; }
const lk=l=>({"هـ":"ه","أ":"ء"})[l]||l;

  async info(){ if(this.cache) return this.cache; let src=null;

  async upload(letter,file){ const url=await CLOUD.uploadAudio(file,`rec/${CLOUD.user.uid}/letter-${LETTER_ORDER.indexOf(letter)+1}-${Date.now()}.${(file.name.split(".").pop()||"mp3")}`); const ref=CLOUD.db.collection("teachers").doc(CLOUD.user.email); const d=await ref.get(); const map=(d.exists&&d.data().letterAudio)||{}; map[letter]=url; await ref.set({letterAudio:map},{merge:true}); await DB.put("lsrc:"+letter,file); this.cache=null; },

const GUIDE=[
 ["١. البداية",`<ol><li>افتحي الموقع من <b>Chrome</b> أو <b>Safari</b>، لا من متصفح واتساب أو تيليجرام.</li><li>اضغطي «تسجيل الدخول باستخدام Google»، أو اكتبي بريدك وكلمة مرور ثم «إنشاء حساب جديد».</li><li>أكملي بياناتك: طالبة أو معلمة، الاسم الرباعي، الجوال، المدينة، اسم الحلقة والأستاذة، والمسار.</li><li>اضغطي «حفظ والبدء».</li></ol><p><b>تثبيته على الجوال:</b> آيفون: Safari ← مشاركة ← «إضافة إلى الشاشة الرئيسية». أندرويد: المزيد ← «تحميل تطبيق أندرويد»، أو قائمة Chrome ← «تثبيت التطبيق».</p>`],
 ["٢. التنقل في الموقع",`<ul><li><b>الرئيسية:</b> تقدّمك ونقاطك و<b>مهامك اليوم</b> واختصارات الأقسام.</li><li><b>الحفظ:</b> مهام الحفظ والمراجعة والخطة والسجل.</li><li><b>الاستماع:</b> القرآن بصوت الشيخ إبراهيم الأخضر مع التكرار والتسريع.</li><li><b>التجويد:</b> المستويات والدروس والاختبارات ومخارج الحروف.</li><li><b>المزيد:</b> تصحيح التلاوة، الألعاب، الواجبات، حلقتي، غرفة المعلمات، النقاط، الإعدادات.</li></ul><p>أنجزي كل «مهام اليوم» ليُحسب يومك منجزًا. والزر الوردي يفتح المساعد الذكي، والزر السماوي فوقه يفتح هذا الدليل.</p>`],
 ["🎙️ التسميع (مثل ترتيل)",`<ol><li>من الرئيسية اضغطي «التسميع»، أو افتحي مهمة حفظ أو مراجعة من «الحفظ».</li><li>اختاري السورة والآيات، والنص يكون <b>مخفيًا</b>.</li><li>اضغطي الميكروفون واقرئي من حفظك؛ تظهر كل كلمة عند نطقها: <b>الأخضر</b> صحيح، <b>الأصفر</b> تغيّر في الحروف، <b>الأحمر</b> كلمة سقطت أو نُسيت.</li><li>إن نسيتِ، المسي الكلمة المخفية لكشفها، وتُحسب «تلقينًا».</li><li>عند الإيقاف تظهر <b>الدرجة من 10</b>، ويُخصم <b>نصف درجة لكل خطأ</b> في الحفظ أو الحروف أو الحركات، مع قائمة الأخطاء؛ المسي أي خطأ ليظهر موضعه في النص.</li><li>ملاحظات التجويد تظهر ولا تُخصم. والكلمات التي لم تصلي إليها لا تُخصم، ويظهر تنبيه بأن التسميع لم يكتمل.</li><li>لكل تسميع 10 نقاط (+5 إن كان بلا خطأ)، ويمكن إرساله للمعلمة.</li></ol>`],
 ["📜 حفظ المتون",`<ol><li>من الرئيسية اضغطي «حفظ المتون»، واختاري: تحفة الأطفال، أو المقدمة الجزرية، أو الشاطبية كاملة.</li><li>اختاري الأبيات (أو اضغطي على باب)، ثم «📖 قراءة وحفظ» لتكرار الأبيات حتى تحفظيها.</li><li>اضغطي «🎙️ تسميع»: البيت مخفي ويظهر مع قراءتك، والدرجة من 10 بخصم نصف درجة لكل خطأ.</li><li>كل بيت تسمّعينه بدرجة 7 فأكثر يُحسب محفوظًا، ويظهر تقدّمك في كل متن.</li></ol>`],
 ["🎯 المراجعة الذكية وخريطة الختمة",`<ul><li>كل آية أو بيت أخطأتِ فيه في التسميع يُضاف تلقائيًا إلى «مواضع تحتاج مراجعة» في الرئيسية وصفحة الحفظ، ويختفي بعد تسميعه مرتين بلا خطأ.</li><li>في «تقدّمي» خريطة للأجزاء الثلاثين تتلوّن بما حفظتِ. ولمن حفظت أجزاء قبل استخدام الموقع: «محفوظ سابق؟ أضيفيه».</li></ul>`],
 ["👩‍🏫 التسميع المباشر وتسميع الزميلات",`<ul><li><b>المعلمة:</b> من «طالباتي» افتحي الطالبة ← «🎙️ تسميع مباشر»، اختاري الآيات أو الأبيات، واستمعي لها (في اللقاء أو حضوريًا) والمسي الكلمة عند الخطأ: لمسة = حفظ، لمستان = حرف، ثلاث = حركة. ثم «حفظ الدرجة» فتصل الطالبة فورًا وتدخل المواضع في مراجعتها.</li><li><b>الزميلات:</b> من «حلقتي» ← «🤝 تسميع الزميلات» اختاري زميلة وسمّعي لها بالطريقة نفسها، ولكِ 5 نقاط.</li></ul>`],
 ["📄 التقرير الشهري، 📊 أخطاء الحلقة، 🏆 المسابقة",`<ul><li><b>التقرير الشهري:</b> من «المزيد» ← «تقريري الشهري» (وللمعلمة من صفحة الطالبة ← «📄 التقرير»): الحضور واللقاءات والتسميع ومتوسط الدرجات والأخطاء والمحفوظ، مع زر مشاركة (واتساب) وطباعة PDF.</li><li><b>أخطاء الحلقة (للمعلمة):</b> أكثر أنواع الأخطاء، والمواضع التي يخطئ فيها أكثر من طالبة، ومن تحتاج متابعة.</li><li><b>مسابقة رياحين:</b> لوحة شرف شهرية بنقاط الشهر على مستوى رياحين كلها وأفضل الحلقات، وللثلاث الأوائل شهادة بعد انتهاء الشهر.</li></ul>`],
 ["٣. دروس التجويد",`<ol><li>افتحي «التجويد» واختاري أول درس غير منجز.</li><li>اقرئي الشرح والأمثلة، واستمعي وسجّلي في التدريب.</li><li>حلّي اختبار الدرس؛ عند النجاح يُحسب منجزًا ويظهر <b>واجب الدرس</b>.</li><li>سجّلي قراءة عبارات الواجب؛ يُصحَّح ويصل لمعلمتك.</li><li>بعد دروس المستوى اضغطي «اختبار اجتياز المستوى»؛ عند النجاح تُفتح <b>شهادة الإتمام</b> والمستوى التالي.</li></ol><p><b>متقنة للمستوى؟</b> اختبري الاجتياز مباشرة دون الدروس.</p>`],
 ["٤. الحفظ والمراجعة",`<p><b>الخطة:</b> الحفظ ← «الخطة» ← اختاري «بالقرآن نحيا» (نصف وجه يوميًا) أو «خطة خاصة» وحدّدي:</p><ul><li>من أي سورة تبدئين وأين تنتهين.</li><li>الوحدة: آيات أو نصف وجه أو وجه.</li><li>مقدار الحفظ اليومي ومقدار المراجعة اليومية.</li><li>أيام الحفظ في الأسبوع (وفي غيرها مراجعة فقط).</li></ul><p><b>جلسة اليوم:</b> استمعي مرتين ← اقرئي 15 مرة ← سمّعي من حفظك بالتسجيل ← «اعتماد وإنهاء المهمة».</p>`],
 ["٥. تصحيح التلاوة",`<ol><li>المزيد ← «تصحيح التلاوة»، واختاري السورة والآيات (10 على الأكثر).</li><li>استمعي للقارئ، ثم سجّلي تلاوتك كاملة وأوقفي.</li><li>تظهر النسبة والكلمات ملوّنة: أخضر صحيح، أصفر قريب، أحمر ساقط أو محرّف، مع ملاحظات المدود والغنن.</li></ol><p><b>لتصحيح أدق:</b> مكان هادئ، الجوال قريب من فمك، صوت واضح. أول مرة يُحمَّل المحرك القرآني (نحو 30 م.ب).</p>`],
 ["٦. المخارج والألعاب والمساعد",`<p><b>المخارج:</b> اختاري حرفًا لتقرئي مخرجه وصفاته، واضغطي ▶ لسماعه، ثم انطقيه ساكنًا بعد همزة (أَبْ) وسجّلي.</p><p><b>الألعاب:</b> ست ألعاب، كل واحدة دقيقة: النون الساكنة، الميم الساكنة، المدود، المخارج، الصفات، اللام والراء.</p><p><b>المساعد الذكي:</b> اسأليه عن أي حكم أو عن درسك أو خطأ تلاوتك (25 سؤالًا يوميًا).</p>`],
 ["٧. الحلقات",`<p>يمكنك استخدام الموقع وحدك لحفظك الخاص دون أي حلقة.</p><p><b>الانضمام:</b> المزيد ← «غرفة المعلمات» ← ابحثي ← «انضمام». تصلك واجبات المعلمة وتصحيحها.</p><p><b>حلقتي:</b> المعلمة وبيانات التواصل، وزميلاتك مرتّبات بالنقاط ونتائجهن.</p><p><b>لقاءات الحلقة 🎥:</b> المعلمة تحدّد المواعيد (أسبوعية أو مرة واحدة) من «لقاءات الحلقة»، فيظهر اللقاء للطالبات في الرئيسية، ويُفتح زر «انضمام» قبل الموعد بربع ساعة فيدخلن غرفة اللقاء داخل رياحين نفسه (تتسع لنحو 50 مشاركة؛ وللأعداد الأكبر يُلصق رابط Meet أو Zoom): المايك مكتوم حتى تأذن المعلمة بعد رفع اليد، ومع المعلمة مشاركة الشاشة وتثبيت فيديو طالبة وفتح النقاش للجميع، وللجميع محادثة نصية، ولها زر ⏺ «تسجيل»: يُحفظ الصوت في «تسجيلات اللقاءات» لتسمعه الطالبات لاحقًا، ويُنزَّل الملف الكامل (مع الشاشة) على جهاز المعلمة، وسبورة 🖊️ تكتب عليها المعلمة فتراها الطالبات، واستطلاع سريع 📊 تُجيب عنه الطالبات وتظهر النتيجة والإجابة الصحيحة، وللجميع تفاعلات 👍❤️🤲، ويُسجَّل الحضور تلقائيًا (+10 نقاط) وتراه المعلمة.</p><p><b>إنشاء حلقة مدارسة:</b> حلقتي ← «أنشئي حلقتك» ← الاسم والنبذة. تنضم إليها صديقاتك وتديرينها من «إدارة حلقتي».</p>`],
 ["٨. الحضور والنقاط والجوائز",`<p><b>الحضور:</b> الأسبوع يبدأ السبت. 4 أيام منجزة فأكثر: متميزة · 3: مثالية · يومان فأقل: غائبة.</p><p><b>النقاط:</b> درس 20 · اختبار كامل +10 · واجب 15 · مهمة حفظ 10 · يوم منجز 10 · 7 أيام متتالية 50 · تلاوة 5–10 · الألعاب.</p><p><b>الرتب:</b> مبتدئة ← مجتهدة (150) ← متقنة (400) ← ماهرة (800) ← متميزة (1500) ← نجمة رياحين (3000). والجوائز والشهادات التحفيزية في «نقاطي وجوائزي».</p>`],
 ["٩. للمعلمة",`<ul><li><b>البطاقة</b> (الإعدادات): الجوال، المدينة، الحلقة، النبذة، واسمك كما تكتبه الطالبات.</li><li><b>التوقيع والختم:</b> ارسمي التوقيع أو ارفعي صورته، وارفعي صورة ختمك إن شئتِ.</li><li><b>طالباتي:</b> ملخص الحضور والتسجيلات، وصفحة لكل طالبة: المستويات، الحضور، الاستماع للتسجيلات وتقييمها، الإجابات، الحفظ، منح الجوائز، حذفها من الحلقة.</li><li><b>الواجبات:</b> العنوان والسورة والآيات والموعد، فيصل لطالباتك.</li><li><b>أصوات الحروف:</b> المخارج ← «إدارة الأصوات»: سجّلي أو ارفعي نطق كل حرف.</li></ul>`],
 ["١٠. حل المشكلات",`<ul><li><b>عالقة على «جارٍ الاتصال»:</b> تأكدي من الإنترنت ← «إعادة المحاولة»، أو افتحي من Chrome/Safari.</li><li><b>التحديث لا يظهر:</b> حدّثي الصفحة (Ctrl+F5)، أو أغلقي التطبيق وافتحيه.</li><li><b>زر جوجل لا يعمل:</b> افتحي في Chrome/Safari مباشرة، أو ادخلي بالبريد.</li><li><b>المايك لا يعمل:</b> اسمحي للموقع بالميكروفون من إعدادات المتصفح.</li><li><b>لا تظهر طالبة في لوحة المعلمة:</b> تأكدي أنها انضمت من غرفة المعلمات أو كتبت اسم الحلقة.</li></ul><p>بياناتك محفوظة في حسابك على السحابة، فإن غيّرتِ الجهاز ادخلي بالحساب نفسه.</p>`]
];
VIEWS.guide=function(){
  view.innerHTML=`<div class="row between"><button class="btn sec sm" id="back">→ رجوع</button></div><div class="hero"><div><div class="eyebrow">شرح مبسّط</div><h1>دليل استخدام رياحين</h1><p class="small muted">اضغطي أي قسم لفتحه.</p></div>${ART.book}</div>
  <div class="guide">${GUIDE.map(([t,b],i)=>`<details ${i===0?"open":""}><summary>${t}</summary>${b}</details>`).join("")}</div>`;
  $("#back").onclick=()=>history.length>1?history.back():go("home");
};

// ===== لوحة المشرفة العامة: كل الحلقات والمعلمات والطالبات =====
const ADMIN_EMAILS=["maryamalshnini@gmail.com"];
const isAdmin=()=>!!(cloudOn()&&CLOUD.user.email&&ADMIN_EMAILS.includes(CLOUD.user.email.toLowerCase()));
VIEWS.admin=async function(){
  view.innerHTML=`<div class="row between"><button class="btn sec sm" id="back">→ رجوع</button></div><div class="hero"><div><div class="eyebrow">إشراف عام</div><h1>لوحة المشرفة</h1><p class="small muted">كل الحلقات والمعلمات والطالبات في رياحين: الدرجات والتقدم والحضور.</p></div>${ART.star}</div><div id="adBox"><div class="card"><p class="muted">جارٍ تحميل كل البيانات…</p></div></div>`;
  $("#back").onclick=()=>history.length>1?history.back():go("home");
  if(!isAdmin()){ $("#adBox").innerHTML=`<div class="note warn">هذه الصفحة لمشرفة الموقع فقط.</div>`; return; }
  try{ const [uq,tq,sq]=await Promise.all([CLOUD.db.collection("users").get(),CLOUD.db.collection("teachers").get(),CLOUD.db.collection("submissions").get()]);
    const users=uq.docs.map(d=>Object.assign({uid:d.id},d.data())); const teachers=tq.docs.map(d=>Object.assign({email:d.id},d.data())).filter(t=>t.name&&!t.closed); const subs=sq.docs.map(d=>d.data());
    const students=users.filter(u=>u.role!=="teacher"&&!teachers.find(t=>t.email.toLowerCase()===(u.email||"").toLowerCase()&&t.kind!=="study"));
    const N=CLOUD.normName.bind(CLOUD);
    const circleOf=s=>{ if(s.teacherEmail){ const t=teachers.find(x=>x.email.toLowerCase()===s.teacherEmail.toLowerCase()); if(t) return {key:t.email,name:t.halaqa||("حلقة "+t.name),teacher:t.name,kind:t.kind}; }
      if(s.halaqa){ const t=teachers.find(x=>N(x.halaqa)===N(s.halaqa)); return {key:t?t.email:"h:"+N(s.halaqa),name:s.halaqa,teacher:t?t.name:(s.teacherName||"—"),kind:t&&t.kind}; }
      if(s.teacherName){ const t=teachers.find(x=>N(x.name)===N(s.teacherName)||N(x.alias)===N(s.teacherName)); if(t) return {key:t.email,name:t.halaqa||("حلقة "+t.name),teacher:t.name,kind:t.kind}; }
      return {key:"none",name:"بلا حلقة (تعلّم فردي)",teacher:"—"}; };
    const rows=students.map(s=>{ const c=circleOf(s); const a=attStats(s,1).weeks[0]; const nsub=subs.filter(x=>x.studentUid===s.uid); const graded=nsub.filter(x=>x.grade!=null); const avgG=graded.length?Math.round(graded.reduce((t,x)=>t+x.grade,0)/graded.length):null; const auto=nsub.filter(x=>x.autoScore!=null); const avgA=auto.length?Math.round(auto.reduce((t,x)=>t+x.autoScore,0)/auto.length):null; return {s,c,a,lv:levelOf(s),nsub:nsub.length,avgG,avgA}; });
    const circles={}; rows.forEach(r=>{ (circles[r.c.key]=circles[r.c.key]||{name:r.c.name,teacher:r.c.teacher,kind:r.c.kind,rows:[]}).rows.push(r); });
    teachers.forEach(t=>{ if(!circles[t.email]) circles[t.email]={name:t.halaqa||("حلقة "+t.name),teacher:t.name,kind:t.kind,rows:[]}; });
    const cl=Object.entries(circles).sort((a,b)=>b[1].rows.length-a[1].rows.length);
    let filter="all", q="", sort="pts";
    const exc=rows.filter(r=>r.a.done>=4).length, abs=rows.filter(r=>r.a.done<=2).length, active=rows.filter(r=>r.s.updated&&Date.now()-r.s.updated<7*864e5).length;
    const box=$("#adBox");
    const draw=()=>{ let list=rows.filter(r=>(filter==="all"||r.c.key===filter)&&(!q||N(r.s.fullName||r.s.name||"").includes(q)||N(r.s.email||"").includes(q)));
      list.sort((a,b)=>sort==="pts"?(b.s.points||0)-(a.s.points||0):sort==="lv"?b.lv-a.lv||(b.s.doneCount||0)-(a.s.doneCount||0):sort==="att"?b.a.done-a.a.done:sort==="grade"?(b.avgG??-1)-(a.avgG??-1):String(a.s.fullName||"").localeCompare(String(b.s.fullName||""),"ar"));

// ===== لقاءات الحلقة المباشرة (فيديو/صوت) =====
// تُحفظ مواعيد اللقاءات في بطاقة المعلمة (teachers/{email}.meetings)، ويُسجَّل حضور الطالبة في حسابها (meetAtt).
function meetRand(n){ const a="abcdefghjkmnpqrstuvwxyz23456789"; let s=""; for(let i=0;i<n;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
function meetLink(m){ return m.link||("https://meet.jit.si/Rayaheen-"+m.room); }
// مواعيد اللقاء القادمة (والجارية) خلال أيام
function meetOccurrences(m,days=14){ const out=[]; const off=(m.tzOff||0)*60000; const [hh,mm]=(m.time||"20:00").split(":").map(Number); const dur=(m.dur||60)*60000;
  const now=Date.now(); const localNow=new Date(now-off); // «الآن» بتوقيت المعلمة كقيم UTC
  for(let i=-1;i<=days;i++){ const d=new Date(Date.UTC(localNow.getUTCFullYear(),localNow.getUTCMonth(),localNow.getUTCDate()+i,hh,mm)); const dow=d.getUTCDay(); const ymd=d.toISOString().slice(0,10);
    const ok=m.repeat==="weekly"?(m.days||[]).includes(dow):(m.date===ymd); if(!ok) continue; const start=d.getTime()+off; if(start+dur<now) continue; out.push({m,start,end:start+dur,key:m.id+"@"+ymd,ymd}); }
  return out; }
function meetPast(m,days=30){ const out=[]; const off=(m.tzOff||0)*60000; const [hh,mm]=(m.time||"20:00").split(":").map(Number); const now=Date.now(); const ln=new Date(now-off);
  for(let i=0;i<=days;i++){ const d=new Date(Date.UTC(ln.getUTCFullYear(),ln.getUTCMonth(),ln.getUTCDate()-i,hh,mm)); const ymd=d.toISOString().slice(0,10); const ok=m.repeat==="weekly"?(m.days||[]).includes(d.getUTCDay()):(m.date===ymd); const start=d.getTime()+off; const created=+String(m.id).slice(1)||0; if(ok&&start<=now&&start+((m.dur||60)*60000)>=created) out.push({m,start,key:m.id+"@"+ymd,ymd}); } return out; }
function fmtMeet(t){ try{ return new Intl.DateTimeFormat("ar",{weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit"}).format(new Date(t)); }catch(e){ return new Date(t).toLocaleString(); } }
function meetState(o){ const now=Date.now(); if(now>=o.start-15*60000&&now<=o.end) return "open"; return now<o.start?"soon":"done"; }
async function myCircleDoc(){ const email=(isTeacher()||ST.ownCircle)?CLOUD.user.email:ST.teacherEmail; if(!email) return null; const d=await CLOUD.db.collection("teachers").doc(email).get(); return d.exists?Object.assign({email},d.data()):null; }
async function nextMeetingsForMe(){ if(!cloudOn()) return []; try{ const T=await myCircleDoc(); if(!T) return []; return (T.meetings||[]).flatMap(m=>meetOccurrences(m,7)).sort((a,b)=>a.start-b.start).map(o=>Object.assign(o,{T})); }catch(e){ return []; } }
async function markMeetAttendance(o){ ST.meetAtt=ST.meetAtt||{}; if(!ST.meetAtt[o.key]){ ST.meetAtt[o.key]=Date.now(); save(); if(typeof PTS!=="undefined") PTS.add(10,"حضور لقاء الحلقة","meet:"+o.key); try{ await CLOUD.push(true); }catch(e){} } }
function embedKind(u){ try{ const h=new URL(u).hostname; if(/(^|\.)daily\.co$/.test(h)) return "daily"; if(h==="8x8.vc"||/(^|\.)8x8\.vc$/.test(h)) return "jaas"; }catch(e){} return null; }
async function joinMeeting(o){ if(o.m.link){ await markMeetAttendance(o); if(embedKind(o.m.link)){ go("embedmeet",{url:o.m.link,title:o.m.title}); return; } const w=Math.min(900,screen.availWidth*0.55|0); const win=window.open(o.m.link,"rayaheenMeet",innerWidth>900?`popup,width=${w},height=${screen.availHeight-80},left=${screen.availWidth-w},top=0`:""); if(!win) window.open(o.m.link,"_blank","noopener"); return; } const T=o.T||await myCircleDoc(); const host=!!(T&&CLOUD.user.email&&T.email.toLowerCase()===CLOUD.user.email.toLowerCase()); go("room",{roomId:roomIdFor(T,o),title:o.m.title,o,host}); }

// ===== غرفة اللقاء داخل الموقع — نموذج «المعلمة محور الاتصال» يتسع لنحو 50 مشاركة =====
// كل طالبة تتصل بالمعلمة فقط. المعلمة تُرسل لكل طالبة: صوتها + صورتها/شاشتها + مزيجًا صوتيًا لمن أُذن لهن بالتحدث + الفيديو المثبّت.
// الإشارات وحالة الغرفة والمحادثة عبر Firestore: rooms/{id} (الحالة) · peers · signals · chat
const ICE_SERVERS=[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302","stun:stun.cloudflare.com:3478"]},{urls:["turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443","turn:openrelay.metered.ca:443?transport=tcp"],username:"openrelayproject",credential:"openrelayproject"}];
const MAX_ROOM=51; const REACTIONS=["👍","❤️","🤲","👏","🌸","😊"];
const ROOM={ id:null };
function roomIdFor(T,o){ return (T.email+"__"+o.key).replace(/[^\w@.-]/g,"_"); }
function rref(){ return CLOUD.db.collection("rooms").doc(ROOM.id); }
function roomSend(to,type,data){ return rref().collection("signals").add({from:ROOM.me,to,type,data:JSON.parse(JSON.stringify(data)),at:Date.now()}); }
function newRoomState(){ return { id:null, me:null, host:false, hostId:null, local:null, camTrack:null, screenTrack:null, peers:{}, unsub:[], hb:null, mic:false, cam:false, hand:false, state:{speakers:[],open:false,spotlight:null}, chat:[], panel:null, closing:false, ctx:null, unread:0 }; }
async function roomJoin(roomId,title,{host=false,video=false}={}){ ROOM.title=title;
  await roomLeave(); Object.assign(ROOM,newRoomState(),{id:roomId,me:CLOUD.user.uid,host,title});
  ROOM.local=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
  ROOM.mic=host; ROOM.local.getAudioTracks().forEach(t=>t.enabled=host);
  if(video) await roomCamOn(true);
  if(host){ ROOM.ctx=new (window.AudioContext||window.webkitAudioContext)(); await rref().set({host:ROOM.me,hostName:ST.fullName||ST.name||"",speakers:[],open:false,spotlight:null,startedAt:Date.now(),title:title||""}); }
  const meRef=rref().collection("peers").doc(ROOM.me);
  await meRef.set({name:ST.fullName||ST.name||"",host,joinedAt:Date.now(),lastSeen:Date.now(),hand:false,muted:!ROOM.mic,cam:ROOM.cam});
  ROOM.hb=setInterval(()=>{ meRef.set({lastSeen:Date.now()},{merge:true}).catch(()=>{}); },8000);
  const t0=Date.now();
  // حالة الغرفة (للطالبات: من يُسمح لها بالتحدث، والفيديو المثبّت)
  ROOM.unsub.push(rref().onSnapshot(d=>{ const s=d.exists?d.data():null; if(!s) return; ROOM.state={speakers:s.speakers||[],open:!!s.open,spotlight:s.spotlight||null,hostName:s.hostName,recording:!!s.recording,poll:s.poll||null}; roomRenderPoll(); ROOM.hostId=s.host; if(!ROOM.host) roomApplyMicRights(); else roomRemix(); roomRender(); }));
  // المشاركات
  ROOM.unsub.push(rref().collection("peers").onSnapshot(s=>{ s.docChanges().forEach(ch=>{ const id=ch.doc.id; if(id===ROOM.me) return; const data=ch.doc.data();
      if(ch.type==="removed"||Date.now()-(data.lastSeen||0)>40000){ roomDrop(id); return; }
      const P=ROOM.peers[id]||(ROOM.peers[id]={info:{},pc:null,streams:{}}); const wasHost=P.info.host, oldJoin=P.info.joinedAt; P.info=data; if(ROOM.host&&!data.host&&data.name) roomAttNote(id,data.name);
      // الطالبة تبادر بالاتصال بالمعلمة عند ظهورها (أو عودتها)
      if(!ROOM.host&&data.host&&(!P.pc||oldJoin!==data.joinedAt)) roomCallHost(id);
      if(ROOM.host&&!data.host) roomRemix(); });
    roomRender(); }));
  // الإشارات الموجّهة لي
  ROOM.unsub.push(rref().collection("signals").where("to","==",ROOM.me).onSnapshot(s=>{ s.docChanges().forEach(async ch=>{ if(ch.type!=="added") return; const m=ch.doc.data(); ch.doc.ref.delete().catch(()=>{}); if(m.at<t0-60000) return; await roomSignal(m); }); }));
  // المحادثة
  ROOM.votes={};
  ROOM.unsub.push(rref().collection("chat").onSnapshot(s=>{ s.docChanges().forEach(ch=>{ if(ch.type!=="added") return; const m=ch.doc.data(); if(m.vote){ const o=ROOM.votes[m.from]; if(!o||o.poll!==m.vote||o.at<=m.at) ROOM.votes[m.from]={poll:m.vote,opt:m.opt,at:m.at}; roomRenderPoll(); return; } if(m.react){ if(m.at>t0-5000) roomFloat(m); return; } ROOM.chat.push(m); if(ROOM.panel!=="chat"&&m.from!==ROOM.me) ROOM.unread++; }); ROOM.chat.sort((a,b)=>a.at-b.at); roomRenderPanel(); roomRenderBar(); }));
  window.addEventListener("pagehide",roomLeave);
  roomRender();
}
// ---------- الطالبة ----------
async function roomCallHost(hostId){ const old=ROOM.peers[hostId]; if(old&&old.pc){ try{ old.pc.close(); }catch(e){} }
  const P=ROOM.peers[hostId]; const pc=new RTCPeerConnection({iceServers:ICE_SERVERS}); P.pc=pc; P.streams={}; P.pending=[];
  const at=ROOM.local.getAudioTracks()[0]; pc.addTransceiver(at,{direction:"sendrecv",streams:[ROOM.local]});            // 0: مايكي ← صوت المعلمة
  pc.addTransceiver(ROOM.camTrack||"video",{direction:ROOM.camTrack?"sendrecv":"recvonly"});                                // 1: كاميرتي ← صورة المعلمة/شاشتها
  pc.addTransceiver("audio",{direction:"recvonly"});                                                                        // 2: مزيج المتحدثات
  pc.addTransceiver("video",{direction:"recvonly"});                                                                        // 3: الفيديو المثبّت
  roomWirePC(pc,hostId);
  pc.ontrack=e=>{ const i=pc.getTransceivers().indexOf(e.transceiver); const key=["hostA","hostV","mix","spot"][i]||"x"+i; P.streams[key]=new MediaStream([e.track]); e.track.onunmute=()=>roomRender(); roomRender(); };
  const of=await pc.createOffer(); await pc.setLocalDescription(of); await roomSend(hostId,"offer",{sdp:of.sdp,type:of.type});
  clearTimeout(P.retryT); P.retryT=setTimeout(()=>{ if(ROOM.id&&P.pc===pc&&pc.connectionState!=="connected"&&ROOM.peers[hostId]) roomCallHost(hostId); },(P.tries=(P.tries||0)+1)>3?30000:15000); }
function roomApplyMicRights(){ const allowed=ROOM.state.open||ROOM.state.speakers.includes(ROOM.me); if(!allowed&&ROOM.mic){ ROOM.mic=false; ROOM.local&&ROOM.local.getAudioTracks().forEach(t=>t.enabled=false); roomSetMe({muted:true}); } ROOM.canSpeak=allowed; }
// ---------- المعلمة ----------
async function roomAnswer(m){ const id=m.from; const P=ROOM.peers[id]||(ROOM.peers[id]={info:{},streams:{}}); if(P.pc){ try{ P.pc.close(); }catch(e){} roomUnmix(id); }
  if(Object.values(ROOM.peers).filter(x=>x.pc).length>=MAX_ROOM-1){ roomSend(id,"full",{}); return; }
  const pc=new RTCPeerConnection({iceServers:ICE_SERVERS}); P.pc=pc; P.streams={}; P.pending=[]; roomWirePC(pc,id);
  pc.ontrack=e=>{ const i=pc.getTransceivers().indexOf(e.transceiver); if(i===0){ P.streams.mic=new MediaStream([e.track]); P.micTrack=e.track; roomRemix(); } else if(i===1){ P.streams.cam=new MediaStream([e.track]); P.camTrack=e.track; roomRespot(); } roomRender(); };
  await pc.setRemoteDescription(m.data); const tr=pc.getTransceivers();
  if(tr[0]){ tr[0].direction="sendrecv"; await tr[0].sender.replaceTrack(ROOM.local.getAudioTracks()[0]); }
  if(tr[1]){ tr[1].direction="sendrecv"; await tr[1].sender.replaceTrack(ROOM.screenTrack||ROOM.camTrack||null); }
  P.mixDest=ROOM.ctx.createMediaStreamDestination(); P.mixIn={}; if(tr[2]){ tr[2].direction="sendonly"; await tr[2].sender.replaceTrack(P.mixDest.stream.getAudioTracks()[0]); }
  if(tr[3]){ tr[3].direction="sendonly"; }
  for(const c of P.pending.splice(0)) await pc.addIceCandidate(c).catch(()=>{});
  const ans=await pc.createAnswer(); await pc.setLocalDescription(ans); await roomSend(id,"answer",{sdp:ans.sdp,type:ans.type});
  roomTuneVideo(pc); roomRemix(); roomRespot(); }
// مزيج صوتي لكل طالبة = كل المتحدثات المسموح لهن عدا هي نفسها
function speakerIds(){ return Object.keys(ROOM.peers).filter(id=>{ const P=ROOM.peers[id]; return P.micTrack&&(ROOM.state.open||ROOM.state.speakers.includes(id)); }); }
function roomSource(id){ const P=ROOM.peers[id]; if(!P.src&&P.micTrack){ const ms=new MediaStream([P.micTrack]); P.sinkEl=new Audio(); P.sinkEl.muted=true; P.sinkEl.srcObject=ms; P.sinkEl.play().catch(()=>{}); P.src=ROOM.ctx.createMediaStreamSource(ms); } return P.src; }
function roomRemix(){ if(!ROOM.host||!ROOM.ctx) return; if(ROOM.ctx.state==="suspended") ROOM.ctx.resume().catch(()=>{}); const sp=new Set(speakerIds());
  for(const [lid,L] of Object.entries(ROOM.peers)){ if(!L.mixDest) continue; L.mixIn=L.mixIn||{};
    for(const sid of Object.keys(L.mixIn)) if(!sp.has(sid)||sid===lid){ try{ L.mixIn[sid].disconnect(); }catch(e){} delete L.mixIn[sid]; }
    for(const sid of sp){ if(sid===lid||L.mixIn[sid]) continue; const src=roomSource(sid); if(!src) continue; const g=ROOM.ctx.createGain(); g.gain.value=1; src.connect(g); g.connect(L.mixDest); L.mixIn[sid]=g; } } }
function roomUnmix(id){ for(const L of Object.values(ROOM.peers)){ if(L.mixIn&&L.mixIn[id]){ try{ L.mixIn[id].disconnect(); }catch(e){} delete L.mixIn[id]; } } const P=ROOM.peers[id]; if(P){ try{ P.src&&P.src.disconnect(); }catch(e){} P.src=null; P.micTrack=null; } }
// الفيديو المثبّت: كاميرا طالبة يختارها المعلمة يُرسل للجميع
async function roomRespot(){ if(!ROOM.host) return; const sid=ROOM.state.spotlight; const track=sid&&ROOM.peers[sid]?ROOM.peers[sid].camTrack:null;
  for(const [id,P] of Object.entries(ROOM.peers)){ if(!P.pc) continue; const t=P.pc.getTransceivers()[3]; if(t) await t.sender.replaceTrack(id===sid?null:(track||null)).catch(()=>{}); } }
async function roomHostVideo(){ for(const P of Object.values(ROOM.peers)){ if(!P.pc) continue; const t=P.pc.getTransceivers()[1]; if(t) await t.sender.replaceTrack(ROOM.screenTrack||ROOM.camTrack||null).catch(()=>{}); roomTuneVideo(P.pc); } }
function roomTuneVideo(pc){ const n=Object.keys(ROOM.peers).length; pc.getSenders().forEach(s=>{ if(!s.track||s.track.kind!=="video") return; const p=s.getParameters(); p.encodings=p.encodings&&p.encodings.length?p.encodings:[{}]; const screen=s.track===ROOM.screenTrack; p.encodings[0].maxBitrate=screen?(n>30?150000:n>15?250000:500000):(n>30?60000:n>15?90000:n>8?150000:300000); if(!screen) p.encodings[0].scaleResolutionDownBy=n>15?2:1; s.setParameters(p).catch(()=>{}); }); }
async function hostSetState(patch){ ROOM.state=Object.assign({},ROOM.state,patch); await rref().set(patch,{merge:true}); roomRemix(); roomRespot(); roomRender(); }
// ---------- مشترك ----------
function roomWirePC(pc,id){ const P=ROOM.peers[id]; pc.onicecandidate=e=>{ if(e.candidate) roomSend(id,"ice",e.candidate.toJSON()).catch(()=>{}); };
  pc.onconnectionstatechange=()=>{ P.state=pc.connectionState; if(pc.connectionState==="failed"){ if(!ROOM.host&&P.info.host) setTimeout(()=>roomCallHost(id),1500); } roomRender(); }; }
async function roomSignal(m){ try{
  if(m.type==="offer"&&ROOM.host){ await roomAnswer(m); return; }
  if(m.type==="full"){ toast("الغرفة ممتلئة (الحد 50 طالبة)"); return; }
  const P=ROOM.peers[m.from]; if(!P||!P.pc){ if(m.type==="ice"){ (ROOM.peers[m.from]=ROOM.peers[m.from]||{info:{},streams:{},pending:[]}).pending=(P&&P.pending)||[]; ROOM.peers[m.from].pending.push(m.data); } return; }
  const pc=P.pc; if(m.type==="answer"){ if(pc.signalingState==="have-local-offer"){ await pc.setRemoteDescription(m.data); for(const c of (P.pending||[]).splice(0)) await pc.addIceCandidate(c).catch(()=>{}); } }
  else if(m.type==="ice"){ if(pc.remoteDescription) await pc.addIceCandidate(m.data).catch(()=>{}); else (P.pending=P.pending||[]).push(m.data); }
}catch(e){ console.warn("signal",e); } }
function roomDrop(id){ const P=ROOM.peers[id]; if(!P) return; if(ROOM.host) roomUnmix(id); try{ P.pc&&P.pc.close(); }catch(e){} delete ROOM.peers[id];
  if(ROOM.host&&(ROOM.state.speakers.includes(id)||ROOM.state.spotlight===id)) hostSetState({speakers:ROOM.state.speakers.filter(x=>x!==id),spotlight:ROOM.state.spotlight===id?null:ROOM.state.spotlight}); roomRender(); }
async function roomLeave(){ if(!ROOM.id||ROOM.closing) return; if(ROOM.rec) await roomRecStop(); if(ROOM.board){ try{ await roomToggleBoard(); }catch(e){} } ROOM.closing=true; const id=ROOM.id, me=ROOM.me, host=ROOM.host;
  (ROOM.unsub||[]).forEach(u=>{ try{u();}catch(e){} }); clearInterval(ROOM.hb);
  Object.values(ROOM.peers||{}).forEach(P=>{ try{ P.pc&&P.pc.close(); }catch(e){} try{ P.sinkEl&&(P.sinkEl.srcObject=null); }catch(e){} });
  [ROOM.local,ROOM.camTrack&&new MediaStream([ROOM.camTrack]),ROOM.screenTrack&&new MediaStream([ROOM.screenTrack])].forEach(s=>s&&s.getTracks().forEach(t=>t.stop()));
  try{ ROOM.ctx&&ROOM.ctx.close(); }catch(e){}
  try{ await CLOUD.db.collection("rooms").doc(id).collection("peers").doc(me).delete(); if(host) await CLOUD.db.collection("rooms").doc(id).set({endedAt:Date.now(),speakers:[],open:false,spotlight:null},{merge:true}); }catch(e){}
  Object.assign(ROOM,newRoomState()); }
function roomSetMe(patch){ if(!ROOM.id) return; rref().collection("peers").doc(ROOM.me).set(patch,{merge:true}).catch(()=>{}); }
// ---------- أزرار التحكم ----------
function roomToggleMic(){ if(!ROOM.local) return; if(!ROOM.host&&!ROOM.mic&&!ROOM.canSpeak){ toast("ارفعي يدك لتأذن لكِ المعلمة بالتحدث"); return; } ROOM.mic=!ROOM.mic; ROOM.local.getAudioTracks().forEach(t=>t.enabled=ROOM.mic); roomSetMe({muted:!ROOM.mic}); if(ROOM.mic&&ROOM.hand) roomToggleHand(); roomRenderBar(); roomRender(); }
async function roomCamOn(silent){ try{ const s=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:360},facingMode:"user"}}); ROOM.camTrack=s.getVideoTracks()[0]; ROOM.cam=true; return true; }catch(e){ if(!silent) toast("تعذّر تشغيل الكاميرا"); return false; } }
async function roomToggleCam(){ if(ROOM.cam){ ROOM.camTrack&&ROOM.camTrack.stop(); ROOM.camTrack=null; ROOM.cam=false; } else if(!(await roomCamOn())) return;
  if(ROOM.host) await roomHostVideo(); else { const P=ROOM.hostId&&ROOM.peers[ROOM.hostId]; const t=P&&P.pc&&P.pc.getTransceivers()[1]; if(t){ if(ROOM.camTrack&&t.direction!=="sendrecv"){ roomCallHost(ROOM.hostId); } else await t.sender.replaceTrack(ROOM.camTrack||null).catch(()=>{}); } }
  roomSetMe({cam:ROOM.cam}); roomRenderBar(); roomRender(); }
async function roomToggleScreen(){ if(!ROOM.host) return; if(ROOM.screenTrack){ ROOM.screenTrack.stop(); ROOM.screenTrack=null; } else { try{ const s=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:8},audio:false}); ROOM.screenTrack=s.getVideoTracks()[0]; ROOM.screenTrack.onended=()=>{ ROOM.screenTrack=null; roomHostVideo(); roomSetMe({screen:false}); roomRender(); roomRenderBar(); }; }catch(e){ return; } }
  await roomHostVideo(); roomSetMe({screen:!!ROOM.screenTrack}); roomRenderBar(); roomRender(); }
function roomToggleHand(){ ROOM.hand=!ROOM.hand; roomSetMe({hand:ROOM.hand,handAt:ROOM.hand?Date.now():null}); roomRenderBar(); roomRender(); }
function roomSendChat(text){ text=String(text||"").trim().slice(0,500); if(!text) return; rref().collection("chat").add({from:ROOM.me,name:ST.fullName||ST.name||"",host:ROOM.host,text,at:Date.now()}).catch(e=>toast(CLOUD.msg(e))); }
// ---------- العرض ----------
function roomTileHtml(id,name,{me,muted,cam,hand,host,state,speaking,spot}){ return `<div class="rtile ${hand?"hand":""} ${spot?"spot":""}" data-tile="${id}">${cam?`<video autoplay playsinline muted></video>`:`<div class="rav">${esc(initials(name))}</div>`}<div class="rname">${hand?"✋ ":""}${host?"👩‍🏫 ":""}${esc(name)}${me?" (أنا)":""} ${muted?"🔇":"🎙️"}${state&&state!=="connected"&&!me?` <span class="small">· ${state==="failed"||state==="disconnected"?"انقطع":"يتصل…"}</span>`:""}</div></div>`; }
function roomRender(){ const stage=$("#rStage"); if(!stage||!ROOM.id) return; const rb=$("#rRecBadge"); if(rb) rb.hidden=!ROOM.state.recording; const n=Object.keys(ROOM.peers).filter(id=>ROOM.peers[id].info&&ROOM.peers[id].info.name).length+1; const cnt=$("#roomCount"); if(cnt) cnt.textContent=n;

// ---------- أدوات عامة ----------
const JUZ_STARTS=[[1,1],[2,142],[2,253],[3,93],[4,24],[4,148],[5,82],[6,111],[7,88],[8,41],[9,93],[11,6],[12,53],[15,1],[17,1],[18,75],[21,1],[23,1],[25,21],[27,56],[29,46],[33,31],[36,28],[39,32],[41,47],[46,1],[51,31],[58,1],[67,1],[78,1]];
const SURAH_OFF=(()=>{ const o=[0]; for(let i=0;i<114;i++) o.push(o[i]+AYAH_COUNTS[i]); return o; })(); // فهرس عام لكل آية
const gIdx=(s,a)=>SURAH_OFF[s-1]+a-1; const TOTAL_AYAT=SURAH_OFF[114];
const JUZ_RANGES=JUZ_STARTS.map((st,i)=>{ const a=gIdx(st[0],st[1]); const b=i<29?gIdx(JUZ_STARTS[i+1][0],JUZ_STARTS[i+1][1]):TOTAL_AYAT; return [a,b]; });
function monthKey(d){ d=d?new Date(d):new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
const MONTHS_AR=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function monthName(k){ const [y,m]=k.split("-"); return MONTHS_AR[+m-1]+" "+y; }

// ---------- نقاط الشهر (للمسابقة) ----------
function monthRoll(){ const k=monthKey(); const M=ST.ptsMonth; if(!M||M.m!==k){ if(M&&M.m) ST.ptsPrev={m:M.m,n:M.n||0}; ST.ptsMonth={m:k,n:0}; } return ST.ptsMonth; }
(function(){ const add=PTS.add; PTS.add=function(n,reason,key){ const before=ST.points||0; add.call(this,n,reason,key); const g=(ST.points||0)-before; if(g>0){ monthRoll().n+=g; save(); } }; })();

// ---------- المحفوظ من القرآن ----------
function memorizedSet(){ const set=new Set(); const addR=(s,a1,a2)=>{ if(!s||!a1) return; for(let a=a1;a<=(a2||a1);a++) set.add(gIdx(s,a)); };
  try{ const H=ST.hifz; (H&&H.log||[]).forEach(l=>{ if(l.type==="new"&&(l.score==null||l.score>=60)) addR(l.s,l.a1,l.a2); }); }catch(e){}
  (ST.tasmeeLog||[]).forEach(l=>{ if(!l.mid&&l.s&&l.grade>=TASMEE.passGrade&&l.complete!==false) addR(l.s,l.a1,l.a2); });
  (ST.memExtra||[]).forEach(r=>addR(r[0],r[1],r[2])); return set; }
function khatmaStats(set){ set=set||memorizedSet(); const juz=JUZ_RANGES.map(([a,b])=>{ let n=0; for(let i=a;i<b;i++) if(set.has(i)) n++; return {n,tot:b-a,p:Math.round(n/(b-a)*100)}; }); return {juz,ayat:set.size,full:juz.filter(j=>j.p>=100).length}; }
function khatmaHtml(K,{title="🗺️ خريطة الختمة",mine=true}={}){ K=K||khatmaStats();
  return `<div class="card"><div class="row between"><h3>${title}</h3><span class="pill acc">${K.ayat} آية · ${K.full} جزءًا كاملًا</span></div>
  <p class="small muted">يتلوّن الجزء كلما حُفظ منه أكثر${mine?" (من مهام الحفظ والتسميعات الناجحة)":""}.</p>
  <div class="khatma">${K.juz.map((j,i)=>`<div class="kj ${j.p>=100?"full":j.p>0?"some":""}" style="--p:${j.p}" title="الجزء ${i+1}: ${j.n} من ${j.tot} آية"><b>${i+1}</b><small>${j.p?j.p+"٪":""}</small></div>`).join("")}</div>
  ${mine?`<details class="small" style="margin-top:8px"><summary>محفوظ سابق لم يُسجَّل؟ أضيفيه</summary><div class="row" style="margin-top:6px;gap:6px"><select id="kmJ">${JUZ_STARTS.map((_,i)=>`<option value="${i}">الجزء ${i+1}</option>`).join("")}</select><button class="btn sec sm" id="kmAdd">✓ أحفظ هذا الجزء</button><button class="btn sec sm" id="kmClr">مسح الإضافات</button></div></details>`:""}</div>`; }
function wireKhatma(){ const b=$("#kmAdd"); if(!b) return; b.onclick=()=>{ const i=+$("#kmJ").value; const [a,z]=JUZ_RANGES[i]; ST.memExtra=ST.memExtra||[]; for(let s=1;s<=114;s++){ const lo=Math.max(a,SURAH_OFF[s-1]), hi=Math.min(z,SURAH_OFF[s]); if(lo<hi) ST.memExtra.push([s,lo-SURAH_OFF[s-1]+1,hi-SURAH_OFF[s-1]]); } save(); toast("أُضيف الجزء "+(i+1)); render(); };
  $("#kmClr").onclick=()=>{ if(!confirm("مسح ما أضفتِه يدويًا؟")) return; ST.memExtra=[]; save(); render(); }; }

function weakCardHtml(max=5){ const L=weakList(); if(!L.length) return ""; return `<div class="card weakc"><div class="row between"><h3>🎯 مواضع تحتاج مراجعة</h3><span class="pill warn">${L.length}</span></div>

function matnProg(id){ const M=MUTOON.find(x=>x.id===id); const P=(ST.mutoon||{})[id]||{}; const n=Object.keys(P).filter(k=>P[k]>=TASMEE.passGrade).length; return {n,tot:M.count,p:Math.round(n/M.count*100)}; }
function matnVerses(M,from,to){ const out=[]; M.sections.forEach(sec=>sec.v.forEach(v=>{ if(v[0]>=from&&v[0]<=to) out.push({a:v[0],h:[v[1],v[2]],text:v[1]+" "+v[2],matn:true,mid:M.id,sec:sec.t}); })); return out; }
VIEWS.mutoon=async function(arg){ arg=arg||{};

    <div class="note info small" style="margin-top:10px">نُقلت النصوص من «المكتبة الشاملة». إن لاحظتِ خطأً في ضبط كلمة فأخبري المشرفة.</div>`;
    $("#back").onclick=()=>history.length>1?history.back():go("home"); view.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>go("mutoon",{id:b.dataset.m})); return; }
  const M=MUTOON.find(x=>x.id===arg.id); if(!M){ go("mutoon"); return; } const P=(ST.mutoon||{})[M.id]||{}; const last=(ST.matnLast||{})[M.id]||{from:1,to:Math.min(5,M.count)};
  const from=arg.from||last.from, to=arg.to||last.to;
  view.innerHTML=`<div class="row between"><button class="btn sec sm" id="back">→ المتون</button></div><h1>📜 ${esc(M.title)}</h1>
  <div class="card"><div class="row"><label class="f">من البيت<input type="number" id="mF" min="1" max="${M.count}" value="${from}"></label><label class="f">إلى البيت<input type="number" id="mT" min="1" max="${M.count}" value="${to}"></label></div>
  <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn" id="mGo">🎙️ تسميع</button><button class="btn sec" id="mRead">📖 قراءة وحفظ</button></div></div>
  <div class="card" id="mBox" hidden></div>
  <div class="card"><h3>الأبواب</h3><div class="stack" style="margin-top:6px">${M.sections.map(sec=>{ const a=sec.v[0][0], b=sec.v[sec.v.length-1][0]; const d=sec.v.filter(v=>P[v[0]]>=TASMEE.passGrade).length; return `<button class="lesson-item" data-sec="${a}-${b}"><span class="mark ${d===sec.v.length?"done":""}">${d===sec.v.length?"✓":d}</span><span class="t"><b>${esc(sec.t)}</b><span class="small muted">الأبيات ${a}–${b} · حفظتِ ${d} من ${sec.v.length}</span></span></button>`; }).join("")}</div></div>`;
  $("#back").onclick=()=>go("mutoon");
  const F=$("#mF"), T=$("#mT"); const clamp=()=>{ F.value=Math.min(Math.max(1,+F.value||1),M.count); T.value=Math.min(Math.max(+F.value,+T.value||+F.value),M.count); };
  view.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{ const [a,z]=b.dataset.sec.split("-"); F.value=a; T.value=Math.min(+z,+a+9); clamp(); read(); });
  const read=()=>{ clamp(); const vs=matnVerses(M,+F.value,+T.value); const box=$("#mBox"); box.hidden=false; box.innerHTML=`<div class="row between"><h3>📖 الأبيات ${F.value}–${T.value}</h3><button class="btn sm" id="mGo2">🎙️ سمّعيها</button></div><div class="tbox">${tasmeeTextHtml(vs)}</div><p class="small muted" style="margin-top:6px">اقرئي كل بيت مرات حتى تحفظيه، ثم اضغطي «سمّعيها».</p>`; $("#mGo2").onclick=start; box.scrollIntoView({behavior:"smooth",block:"start"}); };
  const start=()=>{ clamp(); const f=+F.value,t=+T.value; ST.matnLast=ST.matnLast||{}; ST.matnLast[M.id]={from:f,to:t}; save(); const vs=matnVerses(M,f,t); const words=vs.flatMap(o=>o.text.split(/\s+/).filter(Boolean)); const box=$("#mBox"); box.hidden=false;
    const label=`${M.title} ${f===t?f:f+"–"+t}`;

      if(R.grade>=TASMEE.passGrade&&R.complete){ ST.mutoon=ST.mutoon||{}; const PP=ST.mutoon[M.id]=ST.mutoon[M.id]||{}; vs.forEach(v=>{ PP[v.a]=Math.max(PP[v.a]||0,R.grade); }); save(); PTS.add(PTS.rules.tasmee,"تسميع متن","mtn:"+new Date().toDateString()+":"+M.id+":"+f); }
      if(acts){ const nxt=t<M.count; acts.innerHTML=`<button class="btn sec" data-a="again">🔁 إعادة</button>${nxt?`<button class="btn" data-a="next">الأبيات التالية ←</button>`:""}${cloudOn()?`<button class="btn sec" data-a="send">📤 إرسال للمعلمة</button>`:""}`;
        acts.querySelector('[data-a="again"]').onclick=start; const nb=acts.querySelector('[data-a="next"]'); if(nb) nb.onclick=()=>{ const n=t-f+1; F.value=t+1; T.value=Math.min(M.count,t+n); start(); };
        const sb=acts.querySelector('[data-a="send"]'); if(sb) sb.onclick=async()=>{ sb.disabled=true; try{ await CLOUD.submit({kind:"tasmee",hwTitle:`تسميع ${label}: ${fmtGrade(R.grade)}/${R.full}`,att:{id:Date.now(),label,score:R.pct,grade:R.grade,full:R.full,counts:R.counts,notes:R.errs.slice(0,20).map(e=>`${TASMEE.types[e.type].t}: «${e.i>=0?R.words[e.i]:e.w||""}»`)},blob}); toast("أُرسل للمعلمة"); sb.textContent="✓ أُرسل"; }catch(e){ toast(CLOUD.msg(e)); sb.disabled=false; } }; }
    }}); box.scrollIntoView({behavior:"smooth",block:"start"}); };
  $("#mGo").onclick=start; $("#mRead").onclick=read; if(arg.start) start();
};

// ---------- التسميع المباشر (المعلمة أو الزميلة تعلّم الأخطاء باللمس) ----------
const MARK_CYCLE=[null,"حفظ","حرف","حركة"];
function liveMarkWidget(host,{ay,words,title,onSave}){ const marks={}; const id="lm"+Date.now().toString(36);
  host.innerHTML=`<div class="row between"><h3>🎙️ ${esc(title)}</h3><span class="tgrade sm" id="${id}G"><b>${tasmeeFull()}</b><span>/ ${tasmeeFull()}</span></span></div>
    <p class="small muted">استمعي للقارئة، والمسي الكلمة عند الخطأ: لمسة = <b class="lm-h">حفظ</b>، لمستان = <b class="lm-r">حرف</b>، ثلاث = <b class="lm-k">حركة</b>، أربع = إلغاء. يُخصم ${fmtGrade(tasmeeStep())} لكل خطأ.</p>
    <div class="tbox">${tasmeeTextHtml(ay)}</div><div class="tcounts" id="${id}C" style="margin-top:8px"></div>
    <label class="f">ملاحظة للقارئة (اختياري)<input id="${id}N" placeholder="مثال: أحسنتِ، انتبهي للمدود"></label>
    <div class="row" style="margin-top:8px;gap:6px"><button class="btn" id="${id}S">💾 حفظ الدرجة وإرسالها</button><button class="btn sec" id="${id}R">مسح العلامات</button></div>`;
  const spans=[...host.querySelectorAll(".tw")]; spans.forEach(sp=>sp.classList.add("rv"));
  const upd=()=>{ const errs=Object.entries(marks).map(([i,t])=>({i:+i,type:t})); const g=Math.max(0,tasmeeFull()-tasmeeStep()*errs.length); $("#"+id+"G").innerHTML=`<b>${fmtGrade(g)}</b><span>/ ${tasmeeFull()}</span>`; const c=t=>errs.filter(e=>e.type===t).length; $("#"+id+"C").innerHTML=Object.entries(TASMEE.types).map(([k,v])=>`<div class="${c(k)?"has":""}"><span>${v.ic}</span><b>${c(k)}</b><small>${v.t}</small></div>`).join(""); return {errs,grade:g}; };
  spans.forEach(sp=>sp.onclick=()=>{ const i=+sp.dataset.i; const cur=marks[i]||null; const nx=MARK_CYCLE[(MARK_CYCLE.indexOf(cur)+1)%MARK_CYCLE.length]; if(nx) marks[i]=nx; else delete marks[i]; sp.classList.remove("lm-h","lm-r","lm-k"); if(nx) sp.classList.add(nx==="حفظ"?"lm-h":nx==="حرف"?"lm-r":"lm-k"); upd(); });
  $("#"+id+"R").onclick=()=>{ Object.keys(marks).forEach(k=>delete marks[k]); spans.forEach(sp=>sp.classList.remove("lm-h","lm-r","lm-k")); upd(); };
  $("#"+id+"S").onclick=async()=>{ const b=$("#"+id+"S"); b.disabled=true; const {errs,grade}=upd(); const counts={"حفظ":0,"حرف":0,"حركة":0}; errs.forEach(e=>counts[e.type]++); try{ await onSave({errs,grade,full:tasmeeFull(),counts,note:$("#"+id+"N").value.trim(),words:errs.map(e=>words[e.i])}); b.textContent="✓ أُرسلت"; }catch(e){ toast(CLOUD.msg?CLOUD.msg(e):String(e)); b.disabled=false; } };
  upd(); }
CLOUD.giveTasmee=async function(entry){ if(!this.user) throw new Error("سجّلي الدخول أولًا"); const ref=this.db.collection("users").doc(this.user.uid); const d=await ref.get(); const list=((d.exists&&d.data().tasmeeGiven)||[]).filter(x=>Date.now()-x.date<60*86400000); list.push(entry); const to=[...new Set(list.map(x=>x.to))];
  await ref.set({tasmeeGiven:list.slice(-150),tasmeeTo:to},{merge:true});
  try{ await this.db.collection("tasmeeNotes").doc(String(entry.id)).set(Object.assign({},entry,{from:this.user.uid})); }catch(e){ console.warn("tasmeeNotes",e); } };
async function pullGivenTasmee(){ if(!cloudOn()) return; const me=CLOUD.user.uid; try{ const q=await CLOUD.db.collection("tasmeeNotes").where("to","==",me).get(); ST.tasmeeGot=ST.tasmeeGot||[]; let n=0;

  const meet30=Object.values(ST.meetAtt||{}).filter(t=>t>=since).length; const mut={}; MUTOON.forEach(M=>{ mut[M.id]=matnProg(M.id).n; });
  return {ptsMonth:monthRoll(),ptsPrev:ST.ptsPrev||null,tasmee30:tasmeeStats(30),weakTop:W.slice(0,6).map(w=>({k:w.k,label:w.label,errs:w.errs})),weakCount:W.length,hifzAyahs:K.ayat,juzFull:K.full,juzMap:K.juz.map(j=>j.p),mutoonDone:mut,attDays30:attDays,doneDays30:doneDays,meet30}; }

      ${halaqas.length?`<div class="card"><h3>أفضل الحلقات (متوسط النقاط)</h3><div class="stack" style="margin-top:6px">${halaqas.map((h,i)=>`<div class="row between ctrow"><span>${i<3?["🥇","🥈","🥉"][i]:(i+1)+"."} ${esc(h.name)} <small class="muted">${h.n} ${isMale()?"طلاب":"طالبات"}</small></span><span class="pill">${h.avg}</span></div>`).join("")}</div></div>`:""}
      ${winners.length?`<div class="card"><h3>أبطال ${monthName(prevK)}</h3><div class="stack" style="margin-top:6px">${winners.map((u,i)=>row(u,i,prev(u))).join("")}</div></div>`:""}`;
    const cb=$("#ctCert"); if(cb) cb.onclick=async()=>{ const T=await teacherSignature(); const o={title:"شهادة تفوّق — مسابقة رياحين",sub:monthName(prevK),intro:"تشهد منصة رياحين بأن",name:ST.fullName||ST.name,body:`حصلت على المركز ${["الأول","الثاني","الثالث"][myPrev]} في مسابقة رياحين الشهرية لشهر ${monthName(prevK)}، سائلين الله لها دوام التوفيق.`,when:Date.now(),serial:`RY-C-${prevK.replace("-","")}-${myPrev+1}`};
      view.innerHTML=`<div class="row between"><button class="btn sec sm" id="back">→ رجوع</button></div><div id="certBox">${certHtmlG(o,T)}</div><div class="row" style="margin-top:12px;justify-content:center"><button class="btn" id="cPng">⬇ حفظ كصورة</button></div>`; $("#back").onclick=()=>go("contest"); $("#cPng").onclick=async()=>{ try{ downloadsSave(`شهادة-مسابقة-${prevK}.png`,await certPngG(o,T)); }catch(e){ toast("تعذّر إنشاء الصورة"); } }; };
  }catch(e){ $("#ctBox").innerHTML=`<div class="note bad">${esc(CLOUD.msg(e))}</div>`; } };

// ===== الصلاحيات: كل مستخدم جديد طالب، ولا يصبح معلمًا إلا بموافقة المشرفة. ودعم أكثر من حلقة للمشرفة =====
const MAIN_HALAQAT=["حلقة رياحين","حلقة النور","تصحيح تلاوة تذكرة"];
const canTeach=()=>(typeof isAdmin==="function"&&isAdmin())||!!ST.roleGranted;

// بوابة: إنشاء حساب معلمة أو حلقة يحتاج موافقة
(function(){ const reg=CLOUD.registerTeacher, cc=CLOUD.createCircle;
  CLOUD.registerTeacher=async function(){ if(!canTeach()) throw new Error("صلاحية المعلمة تُمنح بطلب من مشرفة الموقع. أرسلي طلبًا من صفحة «الحساب»."); return reg.apply(this,arguments); };
  CLOUD.createCircle=async function(name,bio){ if(!canTeach()){ await CLOUD.requestTeacher({halaqa:name,note:bio,kind:"circle"}); throw new Error("أُرسل طلب إنشاء الحلقة إلى المشرفة، وستصلك الموافقة هنا."); } return cc.apply(this,arguments); };
})();
CLOUD.requestTeacher=async function(info={}){ if(!this.user) throw new Error("سجّلي الدخول أولًا"); await this.db.collection("users").doc(this.user.uid).set({teacherRequest:Object.assign({at:Date.now(),status:"pending",name:ST.fullName||ST.name||"",email:this.user.email||"",phone:ST.phone||"",city:ST.city||""},info)},{merge:true}); ST.teacherRequestAt=Date.now(); save(); };
CLOUD.grantRole=async function(uid,role){ if(!isAdmin()) throw new Error("للمشرفة فقط"); await this.db.collection("users").doc(uid).set({roleGrant:{role,at:Date.now(),by:this.user.email},teacherRequest:{status:role==="teacher"?"approved":"rejected",decidedAt:Date.now()}},{merge:true}); };

// قائمة الحلقات: المعلمة التي لها أكثر من حلقة تظهر بكل حلقة على حدة
(function(){ const tl=CLOUD.teachersList; CLOUD.teachersList=async function(){ const list=(await tl.apply(this,arguments)).filter(t=>!t.closed); const out=[]; list.forEach(t=>{ const H=Array.isArray(t.halaqat)&&t.halaqat.length?t.halaqat:null; if(H) H.forEach(h=>out.push(Object.assign({},t,{halaqa:h,key:t.email+"||"+h}))); else out.push(Object.assign({},t,{key:t.email})); }); return out; }; })();
function tKey(x){ return x.key||x.email; }
function isMyCircle(t){ return ST.teacherEmail&&ST.teacherEmail.toLowerCase()===t.email.toLowerCase()&&(!t.key||!t.key.includes("||")||CLOUD.normName(ST.halaqa)===CLOUD.normName(t.halaqa)); }

// المزامنة: تطبيق قرار المشرفة، وإرجاع من حُذفت حلقته إلى طالب
(function(){ const pull=CLOUD.pullShared; CLOUD.pullShared=async function(){ await pull.apply(this,arguments); if(!this.user) return; try{
  const me=await this.db.collection("users").doc(this.user.uid).get(); const d=me.exists?me.data():{}; const g=d.roleGrant;
  if(g&&g.at>(ST.roleGrantAt||0)){ ST.roleGrantAt=g.at; if(g.role==="teacher"){ ST.roleGranted=true; save(); try{ await this.registerTeacher(); toast("✅ وافقت المشرفة: أصبح حسابك حساب معلمة"); }catch(e){} } else { ST.roleGranted=false; if(!isAdmin()) ST.role="student"; save(); toast(g.role==="student"?"صلاحيتك الآن: طالبة":"لم تُقبل صلاحية المعلمة"); } }
  if(ST.role==="teacher"&&!isAdmin()){ const t=await this.db.collection("teachers").doc(this.user.email).get(); if(!t.exists||t.data().closed){ ST.role="student"; ST.ownCircle=false; ST.roleGranted=false; save(); toast("أُغلقت حلقتك من المشرفة؛ حسابك الآن حساب طالبة."); } }
  if(isAdmin()){ ST.roleGranted=true; } save(); }catch(e){ console.warn("roles pull",e); } }; })();

// ---------- واجهة: طلب صلاحية معلمة ----------
function teacherRequestHtml(){ const pend=ST.teacherRequestAt&&!ST.roleGranted; return `<div class="card stack"><h3>هل أنتِ معلمة؟</h3>${pend?`<p class="small">أُرسل طلبك في ${fmtDate(ST.teacherRequestAt)}. تصلك الموافقة هنا بعد مراجعة المشرفة.</p>`:`<p class="small muted">كل حساب جديد حساب طالبة. لفتح حلقة ومتابعة طالبات، أرسلي طلبًا تراجعه مشرفة الموقع.</p>
  <label class="f">اسم الحلقة المقترح<input id="trH" placeholder="مثال: حلقة الفجر"></label><label class="f">نبذة عنك (الإجازة، الخبرة)<input id="trN" placeholder="مثال: مجازة برواية حفص، أعلّم منذ 5 سنوات"></label><button class="btn" id="trGo">إرسال الطلب</button>`}</div>`; }
function wireTeacherRequest(){ const b=$("#trGo"); if(!b) return; b.onclick=async()=>{ b.disabled=true; try{ await CLOUD.requestTeacher({halaqa:$("#trH").value.trim(),note:$("#trN").value.trim()}); toast("أُرسل الطلب إلى المشرفة"); render(); }catch(e){ toast(CLOUD.msg(e)); b.disabled=false; } }; }

// ---------- لوحة المشرفة: الطلبات، حلقاتي، تنظيف الحلقات ----------
async function adminRolesHtml(users,teachers){ const reqs=users.filter(u=>u.teacherRequest&&u.teacherRequest.status==="pending");
  const mine=teachers.find(t=>t.email.toLowerCase()===CLOUD.user.email.toLowerCase())||{}; const H=Array.isArray(mine.halaqat)&&mine.halaqat.length?mine.halaqat:[mine.halaqa||MAIN_HALAQAT[0]];
  return `<div class="card adm-req"><div class="row between"><h3>طلبات صلاحية المعلمة</h3><span class="pill ${reqs.length?"warn":""}">${reqs.length}</span></div>${reqs.length?`<div class="stack" style="margin-top:8px">${reqs.map(u=>{ const r=u.teacherRequest; return `<div class="reqrow"><div><b>${esc(r.name||u.fullName||"")}</b><div class="small muted" dir="auto">${esc(r.email||u.email||"")}${r.phone?" · "+esc(r.phone):""}${r.city?" · "+esc(r.city):""}</div>${r.halaqa?`<div class="small">الحلقة المقترحة: ${esc(r.halaqa)}</div>`:""}${r.note?`<div class="small muted">${esc(r.note)}</div>`:""}</div><div class="row" style="gap:6px"><button class="btn sm" data-grant="${esc(u.uid)}">قبول كمعلمة</button><button class="btn sec sm" data-deny="${esc(u.uid)}">رفض</button></div></div>`; }).join("")}</div>`:`<p class="small muted">لا طلبات جديدة. عندما تطلب مستخدمة صلاحية معلمة تظهر هنا.</p>`}</div>
  <div class="card"><h3>حلقاتي</h3><p class="small muted">تظهر كل حلقة للطالبات عند التسجيل وفي غرفة المعلمات، وكلها مرتبطة ببريدك.</p><div class="stack" id="myHq" style="margin-top:8px">${H.map((h,i)=>`<div class="row" style="gap:6px"><input class="hqName" value="${esc(h)}" style="flex:1"><button class="btn sec sm" data-hqdel="${i}" ${H.length<2?"disabled":""}>حذف</button></div>`).join("")}</div>
    <div class="row" style="gap:6px;margin-top:8px"><button class="btn sec sm" id="hqAdd">+ حلقة جديدة</button><button class="btn sm" id="hqSave">حفظ الحلقات</button></div></div>
  <div class="card danger-zone"><h3>تنظيف الحلقات</h3><p class="small muted">يُبقي حلقاتك فقط، وينقل طالبات حلقة «mem sa» إلى «حلقة رياحين»، ويحذف بقية الحلقات ويُرجع أصحابها إلى حسابات طالبات. ستُعرض عليك القائمة قبل التنفيذ.</p><button class="btn danger sm" id="cleanPrev">عرض ما سيُحذف</button><div id="cleanBox"></div></div>`; }
function wireAdminRoles(users,teachers){ const me=CLOUD.user.email; const ref=CLOUD.db.collection("teachers").doc(me);
  view.querySelectorAll("[data-grant]").forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await CLOUD.grantRole(b.dataset.grant,"teacher"); toast("قُبلت؛ يتحول حسابها عند دخولها التالي"); go("admin"); }catch(e){ toast(CLOUD.msg(e)); b.disabled=false; } });
  view.querySelectorAll("[data-deny]").forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await CLOUD.grantRole(b.dataset.deny,"rejected"); toast("رُفض الطلب"); go("admin"); }catch(e){ toast(CLOUD.msg(e)); b.disabled=false; } });
  const names=()=>[...view.querySelectorAll(".hqName")].map(x=>x.value.trim()).filter(Boolean);
  const ha=$("#hqAdd"); if(ha) ha.onclick=()=>{ $("#myHq").insertAdjacentHTML("beforeend",`<div class="row" style="gap:6px"><input class="hqName" placeholder="اسم الحلقة" style="flex:1"></div>`); };
  view.querySelectorAll("[data-hqdel]").forEach(b=>b.onclick=()=>b.parentElement.remove());
  const hs=$("#hqSave"); if(hs) hs.onclick=async()=>{ const H=[...new Set(names())]; if(!H.length){ toast("أبقي حلقة واحدة على الأقل"); return; } hs.disabled=true; try{ await ref.set({halaqat:H,halaqa:H[0],name:ST.fullName||ST.name||"",email:me,uid:CLOUD.user.uid,gender:ST.gender||"f",updated:Date.now()},{merge:true}); ST.role="teacher"; ST.halaqa=ST.halaqa&&H.includes(ST.halaqa)?ST.halaqa:H[0]; save(); toast("حُفظت الحلقات"); go("admin"); }catch(e){ toast(CLOUD.msg(e)); hs.disabled=false; } };
  const cp=$("#cleanPrev"); if(cp) cp.onclick=()=>{ const memsa=teachers.find(t=>CLOUD.normName(t.halaqa).replace(/\s/g,"")==="memsa"||CLOUD.normName(t.name).replace(/\s/g,"")==="memsa");
    const del=teachers.filter(t=>t.email.toLowerCase()!==me.toLowerCase()&&!t.closed);
    const move=users.filter(u=>u.role!=="teacher"&&memsa&&((u.teacherEmail||"").toLowerCase()===memsa.email.toLowerCase()||CLOUD.normName(u.halaqa)===CLOUD.normName(memsa.halaqa)));
    const detach=users.filter(u=>!move.includes(u)&&u.teacherEmail&&del.some(t=>t.email.toLowerCase()===u.teacherEmail.toLowerCase()));
    $("#cleanBox").innerHTML=`<div class="stack small" style="margin-top:8px">${memsa?`<div class="note info">حلقة «${esc(memsa.halaqa||memsa.name)}» (${esc(memsa.email)}): تُنقل طالباتها (${move.length}) إلى «${MAIN_HALAQAT[0]}» في حسابك.</div>`:`<div class="note warn">لم أجد حلقة باسم «mem sa». سيُحذف ما عدا حلقاتك فقط.</div>`}
      <div><b>سيُحذف (${del.length}):</b> ${del.map(t=>esc((t.halaqa||"بلا اسم")+" — "+(t.name||t.email))).join("، ")||"لا شيء"}</div>
      <div><b>طالبات يُفصلن عن الحلقات المحذوفة (${detach.length})</b> ويخترن حلقة من جديد.</div>
      <div class="note bad">الحذف نهائي ولا يمكن التراجع عنه.</div><button class="btn danger" id="cleanGo">تأكيد الحذف والنقل</button></div>`;
    $("#cleanGo").onclick=async()=>{ if(!confirm(`حذف ${del.length} حلقة نهائيًا ونقل ${move.length} طالبة؟`)) return; const b=$("#cleanGo"); b.disabled=true; b.textContent="جارٍ التنفيذ…"; const now=Date.now(); let ok=0, fail=0;
      try{ const mine=teachers.find(t=>t.email.toLowerCase()===me.toLowerCase())||{}; const H=Array.isArray(mine.halaqat)&&mine.halaqat.length?[...new Set([MAIN_HALAQAT[0],...mine.halaqat,...MAIN_HALAQAT])]:MAIN_HALAQAT.slice();
        const patch={halaqat:H,halaqa:MAIN_HALAQAT[0],name:ST.fullName||ST.name||"",email:me,uid:CLOUD.user.uid,gender:ST.gender||"f",updated:now}; if(memsa){ ["signature","stamp","meetings","bio","phone","city","letterAudio","letterVoice"].forEach(k=>{ if(memsa[k]!=null&&mine[k]==null) patch[k]=memsa[k]; }); }
        await ref.set(patch,{merge:true}); ST.role="teacher"; ST.halaqa=MAIN_HALAQAT[0]; save();
        for(const u of move){ try{ await CLOUD.db.collection("users").doc(u.uid).set({adminSet:{teacherEmail:me,teacherName:ST.fullName||ST.name||"",halaqa:MAIN_HALAQAT[0],at:now}},{merge:true}); ok++; }catch(e){ fail++; } }
        for(const u of detach){ try{ await CLOUD.db.collection("users").doc(u.uid).set({adminSet:{teacherEmail:"",teacherName:"",halaqa:"",at:now}},{merge:true}); }catch(e){ fail++; } }
        for(const t of del){ try{ const tr=CLOUD.db.collection("teachers").doc(t.email); try{ await tr.delete(); }catch(e){ await tr.set({closed:true,hidden:true,halaqat:[],halaqa:"",closedAt:now,closedBy:me},{merge:true}); } ok++; if(t.uid) await CLOUD.db.collection("users").doc(t.uid).set({roleGrant:{role:"student",at:now,by:me},role:"student"},{merge:true}).catch(()=>{}); }catch(e){ fail++; console.warn("del",t.email,e); } }
        toast(fail?`تم مع ${fail} عملية متعذرة (قد تمنعها قواعد Firebase)`:"تم التنظيف"); go("admin");
      }catch(e){ toast(CLOUD.msg(e)); b.disabled=false; b.textContent="تأكيد الحذف والنقل"; } }; }; }

</script><script>window.addEventListener("unhandledrejection",e=>{ const m=String(e.reason&&e.reason.message||""); if(e.reason instanceof TypeError&&/of null/.test(m)) e.preventDefault(); });</script><script>if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script></body></html>
