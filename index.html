// ===== وحدة الحفظ والمراجعة =====
function hifzState(){ if(!ST.hifz) ST.hifz={plan:null,log:[],memorized:[],day:0,dayDone:{},counters:{}}; const H=ST.hifz; H.memorized=H.memorized||[]; H.log=H.log||[]; H.day=H.day||0; H.dayDone=H.dayDone||{}; H.counters=H.counters||{}; return H; }
const chunkLabel=c=>`${SURAH_NAMES[c.s-1]} ${c.a1===1&&c.a2===AYAH_COUNTS[c.s-1]?"كاملة":c.a1===c.a2?`آية ${c.a1}`:`${c.a1}–${c.a2}`}`;
const ayahCountOf=c=>c.a2-c.a1+1;
// --- الخطة المخصصة: تقسيم المسار إلى مقاطع ---
function hifzChunks(plan){
  const seq=[]; const step=plan.dir==="back"?-1:1; let s=plan.fromS, a=plan.fromA; const endS=plan.toS, endA=plan.toA; let guard=0;
  while(guard++<7000){ seq.push([s,a]); if(s===endS&&a===endA)break;
    if(a<AYAH_COUNTS[s-1])a++; else { s+=step; if(s>114||s<1)break; a=1; } }
  const chunks=[]; let i=0,k=0;
  while(i<seq.length){ let j=i; const s0=seq[i][0]; while(j<seq.length&&j-i<plan.daily&&seq[j][0]===s0)j++;
    const prev=chunks[chunks.length-1]; if(prev&&prev.s===s0&&(j-i)<=plan.daily/2&&(j===seq.length||seq[j][0]!==s0)) prev.a2=seq[j-1][1]; else chunks.push({k:k++,s:s0,a1:seq[i][1],a2:seq[j-1][1]}); i=j; }
  return chunks;
}
function customTasks(){
  const H=hifzState(); const P=H.plan; const chunks=hifzChunks(P); const mem=new Set(H.memorized);
  const next=chunks.find(c=>!mem.has(c.k)); const memList=chunks.filter(c=>mem.has(c.k));
  const near=memList.slice(-P.nearDays); const farPool=memList.slice(0,Math.max(0,memList.length-P.nearDays));
  const rot=H.log.filter(l=>l.type==="far").length; const far=[]; for(let i=0;i<Math.min(P.farCount,farPool.length);i++) far.push(farPool[(rot+i)%farPool.length]);
  const tasks=[]; if(next) tasks.push({type:"new",key:"c"+next.k,c:next,title:"حفظ جديد"}); near.forEach(c=>tasks.push({type:"near",key:"n"+c.k,c,title:"مراجعة قريبة"})); far.forEach(c=>tasks.push({type:"far",key:"f"+c.k,c,title:"مراجعة بعيدة"}));
  return {tasks,progress:memList.length/chunks.length,progressText:`محفوظ ${memList.length} من ${chunks.length} مقطعًا`,finished:!next,chunks,memList};
}
// --- برنامج «بالقرآن نحيا» (نصف وجه يوميًا، 27 شهرًا) ---
function expandRange(x){ // {s,toS}|{s,a1,a2|null} → مقاطع
  if(!x)return[]; if(x.toS!=null){ const out=[]; for(let s=x.s;s>=x.toS;s--) out.push({s,a1:1,a2:AYAH_COUNTS[s-1]}); return out; }
  const a1=x.a1||1, a2=x.a2||AYAH_COUNTS[x.s-1]; return [{s:x.s,a1:Math.min(a1,AYAH_COUNTS[x.s-1]),a2:Math.min(a2,AYAH_COUNTS[x.s-1])}];
}
function nahyaTasks(i){
  const e=NAHYA_PLAN[i]; if(!e)return null; const prev=NAHYA_PLAN[i-1]; const tasks=[];
  const h=e.h; if(h){ if(h.toS!=null){ expandRange(h).forEach((c,j)=>tasks.push({type:"new",key:`d${i}h${j}`,c,title:"حفظ جديد"})); }
    else { const full=expandRange(h)[0]; let start=full.a1; if(prev&&prev.h&&!prev.h.toS&&prev.h.s===h.s&&prev.h.a2&&(prev.h.a1||1)===(h.a1||1)) start=Math.min(full.a2,prev.h.a2+1);
      tasks.push({type:"new",key:`d${i}h0`,c:{s:h.s,a1:start,a2:full.a2},title:"حفظ جديد"}); if(start>full.a1) tasks.push({type:"fix",key:`d${i}x0`,c:full,title:"تثبيت المقطع من أوله"}); } }
  expandRange(e.r).forEach((c,j)=>tasks.push({type:"near",key:`d${i}r${j}`,c,title:"مراجعة"}));
  return tasks;
}
function todayTasks(){
  const H=hifzState(); const P=H.plan; if(!P)return null; if(P.mode!=="nahya") return customTasks();
  const i=Math.min(H.day,NAHYA_PLAN.length-1); const tasks=nahyaTasks(i)||[]; const e=NAHYA_PLAN[i];
  return {tasks,progress:H.day/NAHYA_PLAN.length,progressText:`اليوم ${e.d} من الشهر ${e.m} · اليوم ${i+1} من ${NAHYA_PLAN.length}`,finished:H.day>=NAHYA_PLAN.length,dayIndex:i,entry:e};
}
function taskDone(t){ const H=hifzState(); if(H.plan.mode==="nahya") return H.dayDone[H.day]&&H.dayDone[H.day][t.key]; const d=new Date().toDateString(); return H.log.find(l=>l.key===t.key&&new Date(l.date).toDateString()===d); }

const AI_URL_DEFAULT=""; // يُملأ برابط الوسيط بعد إنشائه (أو يُضبط من إعدادات الأستاذة ويُنشر عبر السحابة)
const RECAPTCHA_SITE_KEY="6Lcn2QQuAAAAAKVS2k9clmvSrNQVywGN3xHBntN1";
const AI_DAILY_LIMIT=25; const AI_MODEL="gemini-3.5-flash";
const AI_SYSTEM=`أنتِ «مساعدة رياحين»، معلّمة تجويد وحفظ لطيفة في حلقة قرآنية للطالبات، تعملين داخل تطبيق «رياحين».
المرجع المعتمد: كتاب «هدي المجيد في أحكام التجويد» (رواية حفص عن عاصم). التزمي بمصطلحاته وأحكامه، ولا تخرجي عنها إلى خلافات لا تنفع الطالبة.
القواعد:
- أجيبي بالعربية الفصحى المبسّطة، بإيجاز ووضوح، وخاطبي الطالبة بصيغة المؤنث، ومثّلي بآيات من القرآن مع ضبطها.
- حين تُعطَين سياق الطالبة (درسها الحالي، نتائج تلاوتها، مهام حفظها) فابني الجواب عليه.
- عند شرح خطأ تلاوة: سمّي الحكم، واذكري موضعه في الكلمة، وكيف تنطقه صحيحًا، وتمرينًا قصيرًا.
- لا تفتي في مسائل فقهية أو عقدية خارج التجويد والحفظ؛ وجّهي الطالبة لسؤال أستاذة الحلقة.
- لا تخترعي أحاديث أو أقوالًا؛ إن لم تتأكدي قولي ذلك.
- استعملي عناوين قصيرة ونقاطًا (- ) عند الحاجة، واجعلي الرد في حدود 150 كلمة ما لم يُطلب التفصيل.`;
function ctxText(c){ const L=[]; if(c.name) L.push(`اسم الطالبة: ${c.name}`); if(c.role==="teacher") L.push("المستخدمة: أستاذة الحلقة"); if(c.level) L.push(`مستواها: ${c.level}`); if(c.track) L.push(`مسارها: ${c.track}`); if(c.lessonTitle) L.push(`درسها الحالي: «${c.lessonTitle}»${c.lessonDone?" (أنهته)":""}`); if(c.lessonSummary) L.push(`ملخص الدرس من الكتاب:\n${c.lessonSummary}`); if(c.lastAttempts&&c.lastAttempts.length) L.push(`آخر نتائج تلاوتها:\n- ${c.lastAttempts.join("\n- ")}`); if(c.hifzToday) L.push(`مهام حفظها اليوم: ${c.hifzToday}`); return L.length?`[سياق الطالبة]\n${L.join("\n")}`:""; }
const AI={
  url(){ return (ST.aiUrl||AI_URL_DEFAULT||"").trim().replace(/\/+$/,""); },
  ready(){ return !!this.url()||!!(typeof FIREBASE_CONFIG!=="undefined"&&FIREBASE_CONFIG&&/^https?:/.test(location.protocol)); },
  // Gemini عبر Firebase AI Logic (مجاني، بلا مفاتيح إضافية) — يُستخدم إن لم يُضبط وسيط
  model:null,
  async gemini(messages){
    if(!this.model){ const v="https://www.gstatic.com/firebasejs/11.10.0/"; const [{initializeApp,getApps},{getAI,getGenerativeModel,GoogleAIBackend},{initializeAppCheck,ReCaptchaEnterpriseProvider}]=await Promise.all([import(v+"firebase-app.js"),import(v+"firebase-ai.js"),import(v+"firebase-app-check.js")]);
      let app=getApps().find(a=>a.name==="ai"); if(!app){ app=initializeApp(FIREBASE_CONFIG,"ai"); try{ initializeAppCheck(app,{provider:new ReCaptchaEnterpriseProvider(RECAPTCHA_SITE_KEY),isTokenAutoRefreshEnabled:true}); }catch(e){ console.warn("AppCheck",e); } } const ai=getAI(app,{backend:new GoogleAIBackend()});
      this.model=getGenerativeModel(ai,{model:AI_MODEL,systemInstruction:AI_SYSTEM+"\n\n"+ctxText(this.context()),generationConfig:{maxOutputTokens:900,temperature:0.4,thinkingConfig:{thinkingBudget:0}}}); this.model._ctx=JSON.stringify(this.context()); }
    else if(this.model._ctx!==JSON.stringify(this.context())){ this.model=null; return this.gemini(messages); }
    const hist=messages.slice(0,-1).map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
    const chat=this.model.startChat({history:hist}); const r=await chat.sendMessage(messages[messages.length-1].content); return r.response.text();
  },
  usedToday(){ const k=new Date().toISOString().slice(0,10); const u=ST.aiUse||{}; return u.day===k?u.n||0:0; },
  bump(){ const k=new Date().toISOString().slice(0,10); const u=ST.aiUse||{}; ST.aiUse=u.day===k?{day:k,n:(u.n||0)+1}:{day:k,n:1}; save(); },
  // سياق الطالبة الذي يُرسل مع كل سؤال ليجيب المساعد بما يناسبها
  context(){
    const lv=currentLevel(); const L=LEVELS[Math.min(lv,4)-1]; const ls=lv<=4?lessonsOf(lv):[]; const next=ls.find(l=>!ST.done[l.id]);
    const cur=routeArg&&route==="lesson"?LESSONS.find(l=>l.id===routeArg):null; const focus=cur||next;
    const last=ST.attempts.slice(-2).reverse().map(a=>`${a.label}: ${a.score!=null?a.score+"٪":"—"}${a.notes&&a.notes.length?" — "+a.notes.slice(0,3).join(" | "):""}`);
    let hifz=""; try{ if(ST.hifz&&ST.hifz.plan){ const T=todayTasks(); if(T&&T.tasks) hifz=T.tasks.map(t=>`${t.title}: ${chunkLabel(t.c)}${taskDone(t)?" (أُنجز)":""}`).join("؛ "); } }catch(e){}
    return {name:ST.name||"",role:ST.role||"student",level:L?L.title:"",lessonTitle:focus?focus.title:"",lessonSummary:focus?String(focus.summary||"").slice(0,2500):"",lessonDone:focus?!!ST.done[focus.id]:false,lastAttempts:last,hifzToday:hifz,track:ST.track||""};
  },
  async ask(messages){
    if(!this.ready()) throw new Error("لم يُربط المساعد بعد.");
    if(this.usedToday()>=AI_DAILY_LIMIT) throw new Error(`بلغتِ الحد اليومي (${AI_DAILY_LIMIT} سؤالًا). عودي غدًا إن شاء الله.`);
    if(!cloudOn()) throw new Error("سجّلي الدخول أولًا لاستخدام المساعد.");
    if(!this.url()){ const t=await this.gemini(messages.slice(-12)); this.bump(); return t; }
    let token=""; try{ if(cloudOn()) token=await CLOUD.user.getIdToken(); }catch(e){}
    const r=await fetch(this.url()+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,context:this.context(),messages:messages.slice(-12)})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||("خطأ "+r.status));
    this.bump(); return j.text||"";
  }
};

    $("#gQ").innerHTML=`<div class="game-end"><div class="big ${acc>=80?"good":acc>=50?"warn":"bad"}">${score}</div><p><b>${isBest?"🏆 رقم قياسي جديد!":"أحسنتِ!"}</b> صحيح ${correct} · خطأ ${wrong} · دقة ${acc}٪ · أطول تتابع ${best}</p>${acc<80?`<p class="small muted">راجعي درس «${esc(g.title)}» في التجويد ثم أعيدي اللعب.</p>`:""}<div class="row" style="justify-content:center"><button class="btn" id="gAgain">العب مرة أخرى</button><button class="btn sec" id="gOut">الألعاب</button></div></div>`;
    $("#gOpts").innerHTML=""; $("#gFb").textContent=""; $("#gAgain").onclick=()=>go("game",id); $("#gOut").onclick=()=>go("games"); };
  $("#gStart").onclick=()=>{ running=true; score=0;streak=0;best=0;correct=0;wrong=0;left=GAME_SECS;answered=0; setArc(); next(); timer=setInterval(()=>{ left--; $("#gTime").textContent=left; setArc(); if(left<=0) finish(); },1000); };
};

function levelOf(u){ const lt=u.levelTests||{}; let lv=1; while(lv<=4&&lt[lv]&&lt[lv].passed) lv++; return lv; }
function attStats(u,weeks=4){ const m=u.attendance||{}; const out=[]; for(let w=0;w<weeks;w++){ const d=new Date(); d.setDate(d.getDate()-7*w); const s=ATT.weekStart(d); let done=0,entered=0; const days=[]; for(let i=0;i<7;i++){ const x=new Date(s); x.setDate(s.getDate()+i); const k=ATT.key(x); const r=m[k]; if(r&&r.done) done++; if(r&&r.entered) entered++; days.push({k,d:!!(r&&r.done),e:!!(r&&r.entered),future:x>new Date()}); } out.push({start:s,done,entered,days,rating:ATT.rating(done)}); } const totalDone=Object.values(m).filter(r=>r.done).length; const totalEntered=Object.values(m).filter(r=>r.entered).length; const absentWeeks=out.filter(w=>w.done<=2).length; return {weeks:out,totalDone,totalEntered,absentWeeks}; }

function certPngG(o,T){ return new Promise(async(res,rej)=>{ try{ const when=o.when; const cv=document.createElement("canvas"); cv.width=CERT_W; cv.height=CERT_H; const g=cv.getContext("2d"); g.direction="rtl"; g.textAlign="center";

function shrinkImage(file,maxW,maxH){ return new Promise((res,rej)=>{ const im=new Image(); const u=URL.createObjectURL(file); im.onload=()=>{ const r=Math.min(1,maxW/im.width,maxH/im.height); const cv=document.createElement("canvas"); cv.width=Math.round(im.width*r); cv.height=Math.round(im.height*r); cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height); URL.revokeObjectURL(u); const d=cv.toDataURL("image/png"); if(d.length>400000){ const j=cv.toDataURL("image/jpeg",0.85); res(j.length<d.length?j:d); } else res(d); }; im.onerror=()=>rej(new Error("صورة غير صالحة")); im.src=u; }); }
function wireSignaturePad(){ const cv=$("#sigPad"); if(!cv) return; const g=cv.getContext("2d"); g.lineWidth=3.5; g.lineCap="round"; g.lineJoin="round"; g.strokeStyle="#1b2a4a"; let drawing=false,empty=true; const pos=e=>{ const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:(p.clientX-r.left)*cv.width/r.width,y:(p.clientY-r.top)*cv.height/r.height}; };
  const start=e=>{ drawing=true; empty=false; const p=pos(e); g.beginPath(); g.moveTo(p.x,p.y); e.preventDefault(); }; const move=e=>{ if(!drawing) return; const p=pos(e); g.lineTo(p.x,p.y); g.stroke(); e.preventDefault(); }; const end=()=>{ drawing=false; };

// ===== نظام النقاط والرتب والجوائز (على غرار المنصات التعليمية) =====
const RANKS=[{t:"مبتدئة",min:0,ic:"🌱"},{t:"مجتهدة",min:150,ic:"✨"},{t:"متقنة",min:400,ic:"🌟"},{t:"ماهرة",min:800,ic:"🏅"},{t:"متميزة",min:1500,ic:"👑"},{t:"نجمة رياحين",min:3000,ic:"💎"}];
const REWARDS=[{pts:100,t:"نجمة البداية",ic:"⭐",d:"أول 100 نقطة"},{pts:250,t:"وسام الاجتهاد",ic:"🎖️",d:"250 نقطة"},{pts:500,t:"الوسام الفضي",ic:"🥈",d:"500 نقطة"},{pts:1000,t:"الوسام الذهبي",ic:"🥇",d:"1000 نقطة"},{pts:2000,t:"كأس رياحين",ic:"🏆",d:"2000 نقطة"},{pts:3500,t:"تاج الإتقان",ic:"👑",d:"3500 نقطة"}];
const AWARD_TYPES=[["week","طالبة الأسبوع","لتميزها في الحضور وإنجاز مهامها هذا الأسبوع"],["hifz","شهادة شكر وتقدير في الحفظ","لتميزها في حفظ كتاب الله ومراجعته"],["tajweed","شهادة تفوق في التجويد","لإتقانها أحكام التجويد وحسن تلاوتها"],["effort","شهادة اجتهاد ومثابرة","لمثابرتها وحرصها على التعلّم"],["thanks","شهادة شكر","تقديرًا لجهدها وتعاونها"]];
const PTS={
  rules:{lesson:20,quizPerfect:10,recite:5,reciteGood:10,homework:15,lessonHw:15,hifz:10,game:1,day:10,streak7:50},
  total(){ return ST.points||0; },
  add(n,reason,key){ if(!n) return; if(key){ ST.ptsKeys=ST.ptsKeys||{}; if(ST.ptsKeys[key]) return; ST.ptsKeys[key]=1; } ST.points=(ST.points||0)+n; ST.pointsLog=ST.pointsLog||[]; ST.pointsLog.push({n,reason,date:Date.now()}); if(ST.pointsLog.length>300) ST.pointsLog.splice(0,ST.pointsLog.length-300); save(); toast(`+${n} نقطة · ${reason}`); const before=this.total()-n; REWARDS.forEach(r=>{ if(before<r.pts&&this.total()>=r.pts) setTimeout(()=>toast(`${r.ic} جائزة جديدة: ${r.t}!`),1200); }); },
  rank(p){ p=p??this.total(); let r=RANKS[0]; for(const x of RANKS) if(p>=x.min) r=x; return r; },
  next(p){ p=p??this.total(); return RANKS.find(x=>x.min>p)||null; },
  unlocked(p){ p=p??this.total(); return REWARDS.filter(r=>p>=r.pts); }
};

  const p=PTS.total(), r=PTS.rank(p), nx=PTS.next(p); const pct=nx?Math.round((p-r.min)/(nx.min-r.min)*100):100; const log=(ST.pointsLog||[]).slice().reverse().slice(0,30); const awards=(ST.awards||[]).slice().reverse();
  view.innerHTML=`<div class="row between"><button class="btn sec sm" id="back">→ رجوع</button></div>
  <div class="hero"><div><div class="eyebrow">نقاطي وجوائزي</div><h1>${r.ic} ${esc(r.t)}</h1><p class="small muted">${nx?`${nx.min-p} نقطة للوصول إلى «${nx.t}»`:"وصلتِ أعلى رتبة!"}</p><div class="lvbar" style="margin-top:8px"><i style="width:${pct}%"></i></div></div><div class="ring" style="--p:${pct}"><div>${p}</div></div></div>
  <div class="tiles"><div class="tile gold"><b>${p}</b><span>النقاط</span></div><div class="tile"><b>${PTS.unlocked(p).length}</b><span>جوائز</span></div><div class="tile"><b>${awards.length}</b><span>شهادات تحفيزية</span></div><div class="tile"><b id="rankPos">—</b><span>ترتيبي في الحلقة</span></div></div>
  ${awards.length?`<div class="card"><h3>شهاداتي التحفيزية من المعلمة</h3><div class="stack" style="margin-top:8px">${awards.map(a=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><div><b>${esc(a.title)}</b><div class="small muted">${esc(a.msg||"")} · ${fmtDate(a.date)}${a.pts?" · +"+a.pts+" نقطة":""}</div></div><button class="btn gold sm" data-mcert="${esc(a.id)}">🎓 عرض الشهادة</button></div>`).join("")}</div></div>`:""}
  <div class="card"><h3>الجوائز</h3><div class="badges" style="margin-top:8px">${REWARDS.map(x=>`<div class="badge ${p>=x.pts?"":"off"}" title="${x.d}"><span class="ic">${x.ic}</span><span>${x.t}<br><small class="muted">${x.pts} نقطة</small></span></div>`).join("")}</div></div>
  <div class="card"><h3>الرتب</h3><div class="row" style="margin-top:8px;gap:8px">${RANKS.map(x=>`<span class="pill ${x.t===r.t?"gold":p>=x.min?"good":""}">${x.ic} ${x.t} · ${x.min}</span>`).join("")}</div></div>
  <div class="card"><h3>كيف أكسب النقاط؟</h3><ul class="clean small" style="margin-top:6px;line-height:2">${[["إنهاء درس واختباره","20"],["اختبار كامل الدرجة","+10"],["تلاوة مسجّلة (ناجحة +10)","5"],["واجب درس / واجب المعلمة","15"],["مهمة حفظ أو مراجعة","10"],["يوم منجز (كل مهامه)","10"],["7 أيام متتالية","50"],["الألعاب","نقطة لكل 10 نقاط لعب"],["جوائز المعلمة","حسب تقديرها"]].map(([a,b])=>`<li class="row between"><span>${a}</span><b>${b}</b></li>`).join("")}</ul></div>
  <div class="card" id="lbCard"><h3>لوحة الشرف في حلقتي</h3><p class="muted small" id="lb">${cloudOn()?"جارٍ التحميل…":"سجّلي الدخول لعرض الترتيب."}</p></div>
  ${log.length?`<div class="card"><h3>آخر النقاط</h3><div class="stack small" style="margin-top:6px">${log.map(l=>`<div class="row between"><span>${esc(l.reason)}</span><span class="muted">+${l.n} · ${fmtDate(l.date)}</span></div>`).join("")}</div></div>`:""}`;
  $("#back").onclick=()=>history.length>1?history.back():go("home"); view.querySelectorAll("[data-mcert]").forEach(b=>b.onclick=()=>go("mcert",b.dataset.mcert));
  if(cloudOn()){ try{ const lb=await CLOUD.leaderboard(); const me=CLOUD.user.uid; const pos=lb.findIndex(x=>x.uid===me)+1; $("#rankPos").textContent=pos||"—"; $("#lb").outerHTML=`<div class="stack" style="margin-top:8px">${lb.slice(0,10).map((x,i)=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line);${x.uid===me?"font-weight:800;color:var(--accent)":""}"><span>${i<3?["🥇","🥈","🥉"][i]:(i+1)+"."} ${esc(x.fullName||x.name||"")}</span><span class="pill gold">${x.points||0}</span></div>`).join("")||`<p class="muted small">لا طالبات بعد.</p>`}</div>`; }catch(e){ $("#lb").textContent=CLOUD.msg(e); } }
};
// ===== شهادة تحفيزية من المعلمة =====
VIEWS.mcert=async function(id){
  const a=(ST.awards||[]).find(x=>x.id===id); if(!a){ go("rewards"); return; }
  view.innerHTML=`<div class="row between"><button class="btn sec sm" id="back">→ رجوع</button></div><h1>${esc(a.title)}</h1><div id="certBox"><p class="muted">جارٍ التجهيز…</p></div>`; $("#back").onclick=()=>go("rewards");
  const T=await teacherSignature(); const o={title:a.title,sub:a.sub||"",intro:`تشهد إدارة ${T.halaqa||ST.halaqa?"حلقة "+(T.halaqa||ST.halaqa):"رياحين"} بأن الطالبة`,name:ST.fullName||ST.name,body:`${a.reason||""}${a.msg?" — "+a.msg:""}، سائلين الله لها دوام التوفيق.`,when:a.date,serial:`RY-A-${String(a.date).slice(-6)}`};
  $("#certBox").innerHTML=`${certHtmlG(o,T)}<div class="row" style="margin-top:12px;justify-content:center"><button class="btn" id="certPng">⬇ حفظ كصورة</button><button class="btn sec" id="certPrint">🖨 طباعة / PDF</button></div>`;
  $("#certPrint").onclick=()=>{ document.body.classList.add("printing-cert"); window.print(); setTimeout(()=>document.body.classList.remove("printing-cert"),500); };
  $("#certPng").onclick=async()=>{ try{ downloadsSave(`شهادة-${(ST.name||"").replace(/\s+/g,"-")}-${a.type||"تحفيز"}.png`,await certPngG(o,T)); }catch(e){ toast("تعذّر إنشاء الصورة"); } };
};
// ===== للمعلمة: منح نقاط/شهادة تحفيزية =====
function awardFormHtml(){ return `<div class="card stack"><h3>🎁 منح جائزة أو نقاط</h3><p class="small muted">تصل الطالبة فورًا نقاطٌ وشهادة تحفيزية بتوقيعك وختمك.</p>
  <label class="f">نوع الجائزة<select id="awType"><option value="pts">نقاط فقط</option>${AWARD_TYPES.map(([k,t])=>`<option value="${k}">${t}</option>`).join("")}</select></label>
  <div class="row"><label class="f">النقاط<input type="number" id="awPts" value="50" min="0" max="1000"></label><label class="f" style="flex:2">رسالة تحفيزية (اختياري)<input id="awMsg" placeholder="مثال: ما شاء الله، أداء رائع هذا الأسبوع"></label></div>
  <button class="btn gold" id="awGo">منح الجائزة</button></div>`; }
function wireAwardForm(uid,studentName){ const b=$("#awGo"); if(!b) return; b.onclick=async()=>{ const type=$("#awType").value; const pts=Math.max(0,+$("#awPts").value||0); const msg=$("#awMsg").value.trim(); const T=AWARD_TYPES.find(x=>x[0]===type); if(!pts&&!T){ toast("حدّدي نقاطًا أو نوع شهادة"); return; } b.disabled=true; try{ await CLOUD.giveAward({uid,pts,type,title:T?T[1]:"",reason:T?T[2]:"",msg}); toast("مُنحت الجائزة لـ "+studentName); $("#awMsg").value=""; }catch(e){ toast(CLOUD.msg(e)); } b.disabled=false; }; }
