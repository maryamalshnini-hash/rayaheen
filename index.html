<!doctype html><html lang="ar" dir="rtl" data-theme="light" data-pal="emerald"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>img{max-width:100%}[hidden]{display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a4f41"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="رياحين"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><title>رياحين</title><meta name="description" content="رياحين: تعلّم التجويد وحفظ المتون (تحفة الأطفال، المقدمة الجزرية، الشاطبية) مع حلقات ومعلمات وتسميع."><meta property="og:title" content="رياحين"><meta property="og:description" content="تعلّم التجويد وحفظ المتون مع حلقات ومعلمات وتسميع."><meta property="og:type" content="website"><meta property="og:url" content="https://maryamalshnini-hash.github.io/rayaheen/"><meta property="og:image" content="https://maryamalshnini-hash.github.io/rayaheen/icon-512.png"><meta property="og:locale" content="ar_AR">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen app, RTL. Fixed top bar + bottom tab bar, scrolling main. Lessons read as a book page; tools (recording) as instrument panels. */
:root{
  --bg:#fffefa; --surface:#ffffff; --surface2:#fffae3; --line:#f6ecc4;
  --fg:#2a2f3a; --muted:#6c7484; --accent:#1ea7d8; --accent-deep:#0e7fa8; --accent-fg:#ffffff; --accent-soft:#dbf3fb;
  --gold:#f5b800; --gold-soft:#fff6cf;
  --good:#22a06b; --warn:#e59a00; --bad:#e2506a; --good-soft:#dcf5e8; --warn-soft:#fff2cc; --bad-soft:#fde0e7;
  --pink:#f26b9b; --sky:#1ea7d8; --lilac:#b48ce0; --mint:#39c4a9; --peach:#ffb347;
  --hdr1:#1ea7d8; --hdr2:#4cc1e6; --hdr3:#f78fb3;
  --quran:"Amiri Quran","Amiri","Scheherazade New","Noto Naskh Arabic",serif;
  --display:"Amiri","Noto Naskh Arabic",serif;
  --ui:"Tajawal","Noto Sans Arabic",system-ui,sans-serif;
  --radius:18px; --shadow:0 1px 2px rgba(120,90,20,.05),0 8px 24px rgba(120,90,20,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171a22; --surface:#1f2430; --surface2:#2a3040; --line:#3a4256;
  --fg:#f3f4f8; --muted:#a3abbd; --accent:#5cc8ee; --accent-deep:#8ddcf6; --accent-fg:#0f1a22; --accent-soft:#1d3d4c;
  --gold:#ffd04d; --gold-soft:#4a3d12;
  --good:#5fd09a; --warn:#f0bb4f; --bad:#f58aa5; --good-soft:#163a2b; --warn-soft:#423416; --bad-soft:#4a2330;
  --pink:#f79ab9; --sky:#7fd3f3; --lilac:#c8aef2; --mint:#8fe0c7; --peach:#ffc67a;
  --hdr1:#0e5f7f; --hdr2:#1a7fa6; --hdr3:#a9507a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#171a22; --surface:#1f2430; --surface2:#2a3040; --line:#3a4256;
  --fg:#f3f4f8; --muted:#a3abbd; --accent:#5cc8ee; --accent-deep:#8ddcf6; --accent-fg:#0f1a22; --accent-soft:#1d3d4c;
  --gold:#ffd04d; --gold-soft:#4a3d12;
  --good:#5fd09a; --warn:#f0bb4f; --bad:#f58aa5; --good-soft:#163a2b; --warn-soft:#423416; --bad-soft:#4a2330;
  --pink:#f79ab9; --sky:#7fd3f3; --lilac:#c8aef2; --mint:#8fe0c7; --peach:#ffc67a;
  --hdr1:#0e5f7f; --hdr2:#1a7fa6; --hdr3:#a9507a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.6;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr1)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.7rem}h2{font-size:1.4rem}h3{font-size:1.15rem}
p{margin:0}
.app{height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><path d='M24 4l5 9 10-2-2 10 9 5-9 5 2 10-10-2-5 9-5-9-10 2 2-10-9-5 9-5-2-10 10 2z' fill='none' stroke='rgba(255,255,255,.35)' stroke-width='1.2'/></svg>"),linear-gradient(120deg,var(--hdr1),var(--hdr3));color:#fff;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.top .brand{font-family:var(--display);font-size:1.35rem;font-weight:700;letter-spacing:.5px}
.top .sub{font-size:.8rem;opacity:.85}
.top .spacer{flex:1}
.top .who{font-size:.85rem;background:rgba(255,255,255,.18);color:#fff;padding:4px 10px;border-radius:999px;white-space:nowrap}
main{flex:1;overflow:auto;padding-block:18px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:9;background:var(--surface);box-shadow:0 -4px 16px rgba(60,40,90,.06);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tabs button{flex:1;background:none;border:0;padding:9px 2px 11px;color:var(--muted);font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-top:3px solid transparent}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent-deep);border-top-color:var(--accent)}
.tabs button{font-size:.74rem}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card.soft{background:var(--surface2);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.btn{display:inline-flex;box-shadow:0 2px 0 rgba(0,0,0,.06);align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:42px;text-decoration:none}
.btn.sec{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#4a3418}
.btn.danger{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
input[type=text],input[type=number],input[type=password],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;width:100%}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted);flex:1;min-width:140px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent-deep)}.pill.gold{background:var(--gold-soft);color:var(--gold)}
.quran{font-family:var(--quran);font-size:1.9rem;line-height:2.3;text-align:center;padding:14px 10px;background:var(--surface2);border-radius:14px;border:1px dashed var(--line)}
.quran .w{padding:0 2px;border-radius:6px;transition:background .2s}
.quran .w.miss{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.quran .w.ok{color:var(--accent-deep)}
.quran .w.warn{background:var(--warn-soft)}
.quran .extra{color:var(--bad);font-size:1.1rem;font-family:var(--ui)}
.ayah-num{font-family:var(--ui);font-size:.85rem;color:var(--gold);margin-inline:6px}
.lesson-body{font-size:1.07rem;line-height:2;max-width:68ch}
.lesson-body p+p{margin-top:.6em}
ul.clean{margin:0;padding-inline-start:1.2em}
ul.clean li{margin-block:4px}
.ex{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
.ex .word{font-family:var(--quran);font-size:1.5rem;color:var(--accent)}
.level-head{display:flex;gap:14px;align-items:center}
.level-head .n{font-family:var(--display);font-size:2.2rem;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-deep));border-radius:14px;padding:4px 8px;line-height:1;min-width:44px;text-align:center}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px}
.lock{opacity:.55}
.lesson-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:right;width:100%}
.lesson-item:hover{border-color:var(--accent)}
.lesson-item .t{flex:1;min-width:0}
.lesson-item .t b{display:block}
.lesson-item .mark{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--surface2);color:var(--muted);flex:none}
.lesson-item .mark.done{background:var(--mint);color:#1d3b32}
.rec{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px}
.recbtn{width:88px;height:88px;border-radius:50%;border:5px solid var(--accent-soft);background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.recbtn svg{width:34px;height:34px;fill:currentColor}
.recbtn.on{background:var(--bad);border-color:var(--bad-soft);animation:pulse 1.2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.recbtn.on{animation:none}}
.meter{width:100%;max-width:360px;height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;width:0;background:var(--gold);transition:width .08s}
.timer{font-variant-numeric:tabular-nums;font-size:1.1rem;color:var(--muted)}
canvas.wave{width:100%;height:70px;background:var(--surface2);border-radius:10px;border:1px solid var(--line);display:block}
.score{display:flex;align-items:center;gap:16px}
.score .big{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.score .big.good{color:var(--good)}.score .big.warn{color:var(--warn)}.score .big.bad{color:var(--bad)}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:10px;border-right:4px solid var(--line);background:var(--surface2)}
.note.bad{border-right-color:var(--bad);background:var(--bad-soft)}.note.warn{border-right-color:var(--warn);background:var(--warn-soft)}.note.good{border-right-color:var(--good);background:var(--good-soft)}.note.info{border-right-color:var(--accent);background:var(--accent-soft)}
.note b{white-space:nowrap}
.q{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.q .opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.q .opt{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface2);text-align:right;width:100%}
.q .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.q .opt.right{border-color:var(--good);background:var(--good-soft)}
.q .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.q .why{margin-top:8px;font-size:.9rem;color:var(--muted)}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.letters button{font-family:var(--quran);font-size:2rem;padding:6px 0 2px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;line-height:1.4}
.letters button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.letters button.has{box-shadow:inset 0 -4px 0 var(--gold)}
.bigletter{font-family:var(--quran);font-size:5rem;line-height:1.2;text-align:center;color:var(--accent)}
.table{width:100%;border-collapse:collapse;font-size:.92rem}
.table th,.table td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right;vertical-align:top}
.table th{color:var(--muted);font-weight:700;font-size:.8rem}
.scroller{overflow-x:auto}
.toast{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:20;font-weight:700;box-shadow:var(--shadow);max-width:92vw;text-align:center}
.cert{border:3px double var(--gold);padding:28px;text-align:center;background:var(--surface);border-radius:8px}
.cert h2{color:var(--gold);font-size:2rem}
.cert .name{font-family:var(--display);font-size:1.8rem;margin-block:10px}
details summary{cursor:pointer;font-weight:700}
.tag{font-size:.75rem;color:var(--gold);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
audio{width:100%;max-width:420px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
@media (max-width:520px){.quran{font-size:1.6rem}.top .sub{display:none}}
.hero{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--gold-soft));border-radius:var(--radius);padding:16px;border:1px solid var(--line)}
.hero svg{width:150px;height:auto;max-width:100%}
.art{width:64px;height:64px;flex:none}
.art svg{width:100%;height:100%}
.cardart{display:flex;gap:12px;align-items:center}
.cardart .art{width:54px;height:54px}
.lvcolor-1{--lc:var(--sky)}.lvcolor-2{--lc:var(--accent)}.lvcolor-3{--lc:var(--lilac)}.lvcolor-4{--lc:var(--gold)}
.card.lv{border-right:4px solid var(--lc)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface2);border-radius:12px;padding:10px}
.player .ctl{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;cursor:pointer;font-size:1.1rem}
.player .ctl.sec{background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.player select,.player input[type=range]{width:auto}
.player label{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.player .now{font-size:.85rem;color:var(--accent);font-weight:700;min-width:80px}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero svg{width:120px;margin:0 auto}}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
.quick button .art{width:40px;height:40px}
.quick button:hover{border-color:var(--accent)}
.quick button .cnt{font-size:.72rem;color:var(--muted);font-weight:400}
.todo{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.todo .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.todo.done .dot{background:var(--good)}
@media (max-width:420px){.quick{grid-template-columns:repeat(3,1fr)}.quick button{font-size:.8rem;padding:10px 4px}}

/* المساعد الذكي */
.fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));left:16px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:0;box-shadow:0 8px 22px rgba(0,0,0,.22);display:grid;place-items:center;cursor:pointer;z-index:40}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chat{display:flex;flex-direction:column;gap:10px;min-height:40vh;max-height:58vh;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.user{align-self:flex-start;flex-direction:row-reverse}
.msg .av{width:30px;height:30px;flex:none}
.msg .bb{padding:9px 12px;border-radius:14px;background:var(--surface2);line-height:1.7;font-size:.97rem}
.msg.user .bb{background:var(--accent);color:#fff;border-bottom-left-radius:4px}
.msg.assistant .bb{border-bottom-right-radius:4px}
.msg .bb p{margin:0 0 6px}.msg .bb p:last-child{margin:0}.msg .bb ul{margin:4px 18px 6px 0;padding:0}.msg .bb b.h{display:block;margin:6px 0 2px;color:var(--accent)}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.85rem;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chatbar{display:flex;gap:8px;align-items:flex-end}
.chatbar textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--ink);max-height:120px}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* تصميم محسّن: بلاطات، حلقات تقدم، شارات، ألعاب، لوحة الأستاذة */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin:10px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;box-shadow:var(--shadow)}
.tile b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1.1;color:var(--accent-deep)}
.tile span{font-size:.75rem;color:var(--muted)}
.tile.good b{color:var(--good)}.tile.warn b{color:var(--warn)}.tile.bad b{color:var(--bad)}.tile.gold b{color:var(--gold)}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:66px;height:66px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:.95rem;color:var(--accent)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:.82rem}
.badge .ic{font-size:1.2rem}.badge.off{opacity:.4;filter:grayscale(1)}
.lvbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.lvbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.game-card{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:right}

// ===== محرك الصوت: تسجيل، استخراج سمات، محاذاة زمنية (DTW)، تحليل =====
const Audio_={
  ctx:null,
  getCtx(){ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; this.ctx=new C(); } if(this.ctx.state==="suspended")this.ctx.resume(); return this.ctx; },
  canRecord(){ return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder); },
  async decode(blobOrBuf){
    const buf = blobOrBuf instanceof ArrayBuffer ? blobOrBuf : await blobOrBuf.arrayBuffer();
    const ab = await this.getCtx().decodeAudioData(buf.slice(0));
    const n=ab.length, ch=ab.numberOfChannels, out=new Float32Array(n);
    for(let c=0;c<ch;c++){ const d=ab.getChannelData(c); for(let i=0;i<n;i++) out[i]+=d[i]/ch; }
    return {data:out, rate:ab.sampleRate, duration:ab.duration};
  },
  async fetchDecode(url){
    const r=await fetch(url,{mode:"cors"}); if(!r.ok) throw new Error("http "+r.status);
    return this.decode(await r.arrayBuffer());
  }
};

// ---- FFT (radix-2, in place) ----
function fft(re,im){
  const n=re.length; for(let i=1,j=0;i<n;i++){ let bit=n>>1; for(;j&bit;bit>>=1)j^=bit; j^=bit; if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]];} }
  for(let len=2;len<=n;len<<=1){ const ang=-2*Math.PI/len, wr=Math.cos(ang), wi=Math.sin(ang);
    for(let i=0;i<n;i+=len){ let cr=1,ci=0; for(let j=0;j<len/2;j++){ const a=i+j,b=a+len/2; const tr=re[b]*cr-im[b]*ci, ti=re[b]*ci+im[b]*cr; re[b]=re[a]-tr; im[b]=im[a]-ti; re[a]+=tr; im[a]+=ti; const ncr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=ncr; } } }
}
// ---- سمات: طاقة لوغاريتمية + 24 حزمة ميل + مركز طيفي + معدل عبور الصفر، كل 10ms ----
const NB=24;
function melFilters(rate,N){
  const mel=f=>2595*Math.log10(1+f/700), imel=m=>700*(Math.pow(10,m/2595)-1);
  const lo=mel(80), hi=mel(Math.min(7000,rate/2)); const pts=[]; for(let i=0;i<NB+2;i++)pts.push(imel(lo+(hi-lo)*i/(NB+1)));
  const bins=pts.map(f=>Math.floor((N+1)*f/rate)); const F=[];
  for(let b=0;b<NB;b++){ const f=new Float32Array(N/2); for(let k=bins[b];k<bins[b+1];k++)f[k]=(k-bins[b])/Math.max(1,bins[b+1]-bins[b]); for(let k=bins[b+1];k<bins[b+2];k++)f[k]=(bins[b+2]-k)/Math.max(1,bins[b+2]-bins[b+1]); F.push(f);} return F;
}
function extractFeatures(sig){
  const {data,rate}=sig; const N=rate>30000?1024:512, hop=Math.round(rate*0.01); const F=melFilters(rate,N);
  const win=new Float32Array(N); for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));
  const frames=[]; const re=new Float32Array(N), im=new Float32Array(N);
  for(let s=0;s+N<=data.length;s+=hop){
    let e=0,zc=0; for(let i=0;i<N;i++){ const v=data[s+i]; re[i]=v*win[i]; im[i]=0; e+=v*v; if(i&&((data[s+i]>=0)!==(data[s+i-1]>=0)))zc++; }
    fft(re,im); const mag=new Float32Array(N/2); let num=0,den=0; for(let k=0;k<N/2;k++){ mag[k]=Math.sqrt(re[k]*re[k]+im[k]*im[k]); num+=k*mag[k]; den+=mag[k]; }
    const mel=new Float32Array(NB); for(let b=0;b<NB;b++){ let a=0; const f=F[b]; for(let k=0;k<N/2;k++) if(f[k]) a+=f[k]*mag[k]; mel[b]=Math.log(a+1e-6); }
    frames.push({t:s/rate, e:10*Math.log10(e/N+1e-10), mel, cent:den?num/den*rate/N:0, zcr:zc/N});
  }
  // عتبة الصوت: نسبة إلى الذروة
  let mx=-1e9; frames.forEach(f=>{ if(f.e>mx) mx=f.e; }); const thr=mx-30;
  frames.forEach(f=>f.v=f.e>thr);
  // تطبيع الميل (طرح المتوسط عبر الإطارات الصوتية) لإلغاء أثر الميكروفون
  const mean=new Float32Array(NB); let c=0; frames.forEach(f=>{ if(f.v){ c++; for(let b=0;b<NB;b++)mean[b]+=f.mel[b]; }});
  if(c){ for(let b=0;b<NB;b++)mean[b]/=c; frames.forEach(f=>{ f.nm=new Float32Array(NB); for(let b=0;b<NB;b++)f.nm[b]=f.mel[b]-mean[b]; }); } else frames.forEach(f=>f.nm=f.mel);
  // قص الصمت من الطرفين
  let a=0,b=frames.length-1; while(a<b&&!frames[a].v)a++; while(b>a&&!frames[b].v)b--;
  return {frames:frames.slice(a,b+1), hopSec:hop/rate, rate, totalSec:sig.duration, voicedSec:frames.filter(f=>f.v).length*hop/rate};
}
function dist(f,g){ let d=0; for(let b=0;b<NB;b++){ const x=f.nm[b]-g.nm[b]; d+=x*x; } const ev=(f.v?1:0)-(g.v?1:0); return Math.sqrt(d/NB)+Math.abs(ev)*1.5; }
// ---- DTW مع حزامٍ نسبي ----
function dtw(A,B,band=0.25){
  const n=A.length,m=B.length; if(!n||!m) return {cost:1e9,path:[]};
  const w=Math.max(Math.abs(n-m), Math.floor(Math.max(n,m)*band))+2;
  const D=new Float32Array((n+1)*(m+1)).fill(Infinity); const idx=(i,j)=>i*(m+1)+j; D[0]=0;
  for(let i=1;i<=n;i++){ const jl=Math.max(1,Math.floor(i*m/n)-w), jh=Math.min(m,Math.ceil(i*m/n)+w);
    for(let j=jl;j<=jh;j++){ const c=dist(A[i-1],B[j-1]); D[idx(i,j)]=c+Math.min(D[idx(i-1,j)],D[idx(i,j-1)],D[idx(i-1,j-1)]); } }
  // تتبع المسار
  const path=[]; let i=n,j=m; while(i>0&&j>0){ path.push([i-1,j-1]); const a=D[idx(i-1,j-1)],b=D[idx(i-1,j)],c=D[idx(i,j-1)]; if(a<=b&&a<=c){i--;j--;} else if(b<c)i--; else j--; }
  path.reverse(); return {cost:D[idx(n,m)]/path.length, path};
}
// ---- مقاطع ممدودة في المرجع (مد/غنة): إطارات صوتية متتابعة قليلة التغير الطيفي ----
function sustainedRegions(fr,hop,minSec=0.22){

const QASR={

function mergeLocalWork(loc,R){ try{ if(!loc) return;
  R.done=Object.assign({},loc.done||{},R.done||{}); R.quiz=Object.assign({},loc.quiz||{},R.quiz||{});
  R.lessonHw=R.lessonHw||{}; for(const [k,h] of Object.entries(loc.lessonHw||{})){ const r=R.lessonHw[k]; if(!r||(h.done&&!r.done)||((h.date||0)>(r.date||0))) R.lessonHw[k]=h; }
  R.autoDone=Object.assign({},loc.autoDone||{},R.autoDone||{});
  const byId=(a,b)=>{ const m=new Map(); [...(a||[]),...(b||[])].forEach(x=>{ if(x&&x.id!=null&&!m.has(String(x.id))) m.set(String(x.id),x); }); return [...m.values()]; };
  R.attempts=byId(R.attempts,loc.attempts).sort((a,b)=>(a.date||0)-(b.date||0)); R.submissions=byId(R.submissions,loc.submissions); R.homework=byId(R.homework,loc.homework);
  R.attendance=R.attendance||{}; for(const [k,v] of Object.entries(loc.attendance||{})){ const r=R.attendance[k]; R.attendance[k]={entered:!!(v.entered||(r&&r.entered)),done:!!(v.done||(r&&r.done))}; }
  for(const [k,v] of Object.entries(loc.levelTests||{})){ const r=(R.levelTests=R.levelTests||{})[k]; if(!r||(v.passed&&!r.passed)||((v.date||0)>(r.date||0))) R.levelTests[k]=v; }
  if(loc.hifz&&R.hifz){ const H=R.hifz, L=loc.hifz; H.memorized=[...new Set([...(H.memorized||[]),...(L.memorized||[])])]; const seen=new Set((H.log||[]).map(l=>l.date+l.key)); (L.log||[]).forEach(l=>{ if(!seen.has(l.date+l.key)) (H.log=H.log||[]).push(l); }); H.day=Math.max(H.day||0,L.day||0); H.dayDone=Object.assign({},L.dayDone||{},H.dayDone||{}); } else if(loc.hifz&&!R.hifz) R.hifz=loc.hifz;
  if((loc.points||0)>(R.points||0)){ R.points=loc.points; R.pointsLog=loc.pointsLog; R.ptsKeys=Object.assign({},R.ptsKeys||{},loc.ptsKeys||{}); }
  R.games=Object.assign({},loc.games||{},R.games||{});
}catch(e){ console.warn("merge",e); } }

const DB={
  _db:null,
  open(){ return new Promise((res,rej)=>{ if(this._db){res(this._db);return;} if(!window.indexedDB){rej(new Error("no idb"));return;} const r=indexedDB.open("rayaheen",1); r.onupgradeneeded=()=>r.result.createObjectStore("blobs"); r.onsuccess=()=>{this._db=r.result;res(this._db)}; r.onerror=()=>rej(r.error); }); },
  async put(k,v){ try{ const d=await this.open(); return new Promise((res,rej)=>{ const t=d.transaction("blobs","readwrite"); t.objectStore("blobs").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }catch(e){ console.warn(e); } },
  async get(k){ try{ const d=await this.open(); return new Promise((res,rej)=>{ const r=d.transaction("blobs").objectStore("blobs").get(k); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }catch(e){ return null; } },
  async del(k){ try{ const d=await this.open(); return new Promise(res=>{ const t=d.transaction("blobs","readwrite"); t.objectStore("blobs").delete(k); t.oncomplete=()=>res(); }); }catch(e){} },
  async keys(prefix){ try{ const d=await this.open(); return new Promise(res=>{ const r=d.transaction("blobs").objectStore("blobs").getAllKeys(); r.onsuccess=()=>res((r.result||[]).filter(k=>String(k).startsWith(prefix))); r.onerror=()=>res([]); }); }catch(e){ return []; } }

async function getAyahs(s,a1,a2){
  const out=[]; const need=[];
  for(let a=a1;a<=a2;a++){ const k=s+":"+a; const t=(BUILTIN[s]&&BUILTIN[s][a-1])||BUILTIN_SINGLE[k]||ST.textCache[k]; out.push({s,a,text:t||null}); if(!t)need.push(a); }
  if(need.length){
    try{ const r=await fetch(`https://api.alquran.cloud/v1/surah/${s}/quran-simple`); const j=await r.json();
      j.data.ayahs.forEach(ay=>{ let t=ay.text; if(ay.numberInSurah===1&&s!==1&&s!==9) t=t.replace(/^بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\s*/,""); ST.textCache[s+":"+ay.numberInSurah]=t; });
      save(); out.forEach(o=>{ if(!o.text)o.text=ST.textCache[o.s+":"+o.a]||null; });
    }catch(e){}
  }
  return out;
}

async function getReference(s,a1,a2,reciterId){
  // يعيد {blobs:[],urls:[],sig:decoded|null,playable:[urls or blob urls]}
  const r=RECITERS.find(x=>x.id===reciterId)||RECITERS[0]; const items=[];
  for(let a=a1;a<=a2;a++){
    if(r.src==="local"){ const b=await DB.get(`ref:${s}:${a}`); items.push({a,blob:b,urls:[]}); }
    else { const urls=reciterUrls(r,s,a); if(ST.customAudio) urls.unshift(ST.customAudio.replace("{s}",s).replace("{a}",a).replace("{sss}",String(s).padStart(3,"0")).replace("{aaa}",String(a).padStart(3,"0"))); items.push({a,blob:null,urls}); }
  }
  return {reciter:r,items,s};
}
async function decodeReference(ref){
  // يدمج الآيات في إشارة واحدة إن أمكن فك ترميزها (يتطلب CORS للمصادر الخارجية)
  const sigs=[]; for(const it of ref.items){ let sig=null; if(it.blob){ try{ sig=await Audio_.decode(it.blob);}catch(e){} } else { for(const u of it.urls){ try{ sig=await Audio_.fetchDecode(u); break; }catch(e){} } } if(!sig) return null; sigs.push(sig); }
  if(!sigs.length) return null; const rate=sigs[0].rate; let n=0; sigs.forEach(x=>n+=x.data.length); const data=new Float32Array(n); let p=0; sigs.forEach(x=>{ data.set(x.data,p); p+=x.data.length; });
  return {data,rate,duration:n/rate};
}

function wireRecorder(id,{onDone,recognize=false,onText}={}){
  const btn=$("#"+id+"Btn"), T=$("#"+id+"T"), M=$("#"+id+"M"); let rec=null, sr=null;
  if(!Audio_.canRecord()){ btn.disabled=true; $("#"+id+"Out").innerHTML=`<div class="note bad">التسجيل غير متاح هنا. افتحي ملف التطبيق في متصفح Chrome أو Edge على الحاسب أو الجوال (وليس داخل صفحة claude.ai).</div>`; return; }
  btn.onclick=async()=>{
    if(rec){ btn.disabled=true; if(sr)sr.stop(); const blob=await rec.stop(); rec=null; btn.classList.remove("on"); btn.disabled=false; M.style.width="0"; if(blob) drawWave(blob,$("#"+id+"W")); const srT=sr?sr.text:"", srE=sr?sr.error:(makeRecognizer?"":"unsupported"); sr=null; if(onDone){ try{ await onDone(blob,srT,srE); }catch(e){ console.warn("onDone",e); const host=btn.closest(".card,.q")||btn.parentElement; const n=document.createElement("div"); n.className="note bad"; n.textContent="تعذّر إكمال التصحيح، لكن تسجيلك محفوظ. أعيدي المحاولة، وإن تكرّر أخبري المعلمة. ("+(e&&e.message||e)+")"; host&&host.appendChild(n); } } return; }
    try{ rec=new Recorder({onLevel:v=>M.style.width=(v*100)+"%",onTick:t=>T.textContent=`${String(Math.floor(t/60)).padStart(2,"0")}:${String(Math.floor(t%60)).padStart(2,"0")}`}); await rec.start(); btn.classList.add("on");
      if(recognize){ sr=makeRecognizer((txt,fin)=>onText&&onText(txt,fin)); if(sr)sr.start(); }
    }catch(e){ rec=null; $("#"+id+"Out").innerHTML=`<div class="note bad">لم يُسمح باستخدام الميكروفون. اسمحي للمتصفح بالوصول إلى الميكروفون ثم أعيدي المحاولة.</div>`; }
  };
}
async function drawWave(blob,cv){ if(!cv)return; try{ const sig=await Audio_.decode(blob); cv.hidden=false; const W=cv.width=cv.clientWidth*2, H=cv.height=140; const c=cv.getContext("2d"); c.clearRect(0,0,W,H); c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#1f5c43"; const step=Math.max(1,Math.floor(sig.data.length/W)); for(let x=0;x<W;x++){ let mx=0; for(let i=x*step;i<(x+1)*step&&i<sig.data.length;i++){ const v=Math.abs(sig.data[i]); if(v>mx)mx=v; } const h=Math.max(2,mx*H); c.fillRect(x,(H-h)/2,1,h);} }catch(e){} }

  <div class="row">${idx>0?`<button class="btn sec" id="prevL">الدرس السابق</button>`:""}${idx<ls.length-1?`<button class="btn sec" id="nextL">الدرس التالي</button>`:`<button class="btn gold" id="toTest">اختبار اجتياز المستوى</button>`}</div>`;
  $("#back").onclick=()=>go("levels"); const p=$("#prevL"); if(p)p.onclick=()=>go("lesson",ls[idx-1].id); const n=$("#nextL"); if(n)n.onclick=()=>go("lesson",ls[idx+1].id); const t=$("#toTest"); if(t)t.onclick=()=>go("leveltest",l.level);

function shuffled(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function renderQuiz(box,qs,{onFinish,shuffle=false,label="تصحيح"}={}){
  const list=shuffle?shuffled(qs):qs; const ans=new Array(list.length).fill(null); const ord=list.map(q=>shuffled(q.options.map((_,j)=>j)));

  box.querySelectorAll(".q").forEach((qel,i)=>qel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(qel.dataset.locked)return; qel.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); ans[i]=+b.dataset.o; }));

  view.innerHTML=`<h1>التدريب الصوتي</h1><div class="card"><div class="row">
    <label class="f">السورة<select id="sIn">${SURAH_NAMES.map((n,i)=>`<option value="${i+1}" ${i+1===pre.s?"selected":""}>${i+1}. ${n}</option>`).join("")}</select></label>

    <label class="f">القراءة المرجعية<select id="rIn">${RECITERS.map(r=>`<option value="${r.id}" ${r.id===ST.reciter?"selected":""}>${r.name}</option>`).join("")}</select></label></div>

    <div class="card"><h3>تلاوتك</h3><p class="small muted">استمعي للمرجع أولًا، ثم سجّلي تلاوتك للآيات نفسها. يحلّل التطبيق: الكلمات (بالتعرّف على الكلام إن توفر)، ومقادير المدود والغنن مقارنةً بالمرجع، والوقفات.</p>${recorderHtml("pr0","سجّلي التلاوة كاملة ثم أوقفي التسجيل.")}<div id="live" class="small muted"></div><div id="result"></div></div>`;
    wirePlayer(ref);
    wireRecorder("pr0",{recognize:true,onText:(t)=>{ $("#live").textContent=t?"سمعت: "+t:""; },onDone:async(blob,text,srErr)=>{
      const out=$("#pr0Out"); out.innerHTML=audioTag(blob); const res=$("#result"); res.innerHTML=`<div class="note info" id="anStatus">جارٍ التحليل… (قد يستغرق ثوانٍ)</div>`;
      const notes=[]; let wordPct=null;
      const bt=await bestTranscript(blob,text,m=>{ const el=$("#anStatus"); if(el) el.textContent=m; },words); text=bt.text; if(bt.engine==="quran") notes.push({k:"info",t:"صُحّحت الكلمات بمحرك التعرف القرآني داخل الجهاز."}); const aiN=aiNotesOf(bt);
      // 1) مقارنة الكلمات
      const hyp=normAr(text||"").split(" ").filter(Boolean); const refW=words.map(normAr);
      if(hyp.length){ const {st,extra}=alignWords(refW,hyp); const missed=[]; st.forEach((v,i)=>{ if(v==="miss"){ const near=extra.find(x=>similar(x,refW[i])>=0.6); if(near){ st[i]="warn"; extra.splice(extra.indexOf(near),1); missed.push({i,near}); } else missed.push({i}); } });
        wordPct=matchPct(st);
        document.querySelectorAll("#prBox .quran .w").forEach((el,i)=>{ el.className="w "+(st[i]==="ok"?"ok":st[i]==="warn"?"warn":"miss"); });

        else notes.push({k:"good",t:"جميع الكلمات سُمعت مطابقة لنص الآيات."});
        if(extra.length) notes.push({k:"warn",t:`كلمات زائدة سُمعت: ${extra.slice(0,5).join("، ")}.`});
      } else notes.push({k:"info",t:srErr==="not-allowed"||srErr==="service-not-allowed"?"لم يُسمح بالتعرّف على الكلام؛ اسمحي للميكروفون والتعرف على الكلام من إعدادات المتصفح.":srErr==="network"?"تعذّر التعرّف على الكلام لضعف الاتصال بالإنترنت؛ اعتمد التحليل على الصوت فقط.":srErr==="no-speech"?"لم يُلتقط كلام واضح؛ اقرئي بصوت أعلى وقرب الميكروفون.":"التعرّف على الكلام غير متاح في هذا المتصفح (استخدمي Chrome على أندرويد أو Safari على آيفون)؛ اعتمد التحليل على الصوت فقط."});
      notes.push(...aiN);
      // 2) مقارنة صوتية
      let stuSig=null, refSig=null; try{ stuSig=await Audio_.decode(blob); }catch(e){}
      try{ refSig=await decodeReference(ref); }catch(e){}
      let r={score:null,notes:[]}; if(stuSig) r=analyzeRecitation(stuSig,refSig,words);
      if(!refSig&&ref.reciter.src!=="local") r.notes.unshift({k:"info",t:"تعذّر تحليل صوت القارئ للمقارنة الدقيقة (المصدر الخارجي لا يسمح بذلك من هذا المتصفح). للمقارنة الدقيقة سجّلي قراءة الأستاذة من وضع الأستاذة واختاريها مرجعًا."});
      notes.push(...r.notes);
      const parts=[]; if(wordPct!=null)parts.push(wordPct); if(r.acoustic!=null)parts.push(r.acoustic); const score=parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length):null;
      res.innerHTML=`<div class="card soft"><div class="score"><div class="big ${score==null?"":score>=ST.passPct?"good":score>=55?"warn":"bad"}">${score==null?"—":score+"٪"}</div><div><b>التقدير التقريبي</b><div class="small muted">${wordPct!=null?`الكلمات ${wordPct}٪`:""}${r.acoustic!=null?` · التشابه الصوتي ${r.acoustic}٪`:""}</div></div></div>
        <div class="stack" style="margin-top:12px">${notes.map(n=>`<div class="note ${n.k}">${esc(n.t)}</div>`).join("")}</div>
        <p class="small muted" style="margin-top:10px">هذا تقدير آلي يساعدك على الانتباه؛ والحكم النهائي لأستاذة الحلقة بالسماع. يمكنك حفظ المحاولة أو إرسالها كواجب.</p>
        <div class="row" style="margin-top:8px"><button class="btn sec sm" id="saveAtt">حفظ المحاولة</button>${cloudOn()?`<button class="btn sm" id="cloudAtt">إرسال للأستاذة</button>`:""}<button class="btn sec sm" id="exportAtt">تصدير التسجيل ملفًا</button></div></div>`;
      const label=`سورة ${SURAH_NAMES[s-1]} ${a1}–${a2}`; const att={id:Date.now(),label,score,wordPct,acoustic:r.acoustic,notes:notes.map(n=>n.t),date:Date.now(),s,a1,a2};
      if(pre.auto){ ST.autoDone=ST.autoDone||{}; ST.autoDone[pre.auto]=score; ST.attempts.push(att); PTS.add(score>=ST.passPct?PTS.rules.reciteGood:PTS.rules.recite,"تلاوة يومية"+(score>=ST.passPct?" ناجحة":""),"auto:"+pre.auto); await DB.put("att:"+att.id,blob); save(); if(cloudOn()){ CLOUD.submit({kind:"recitation",hwTitle:"واجب تلقائي: "+label,att,blob}).then(()=>toast("أُنجز الواجب وأُرسل للأستاذة")).catch(()=>toast("أُنجز الواجب (تعذّر الإرسال السحابي)")); } else toast("أُنجز الواجب"); ATT.recheck(); }
      $("#saveAtt").onclick=async()=>{ ST.attempts.push(att); await DB.put("att:"+att.id,blob); save(); toast("حُفظت المحاولة"); PTS.add(score>=ST.passPct?PTS.rules.reciteGood:PTS.rules.recite,"تلاوة مسجّلة","att:"+att.id); };
      const ca=$("#cloudAtt"); if(ca) ca.onclick=async()=>{ ca.disabled=true; try{ await CLOUD.submit({kind:"recitation",hwTitle:label,att,blob}); toast("أُرسلت التلاوة للأستاذة"); }catch(e){ toast(CLOUD.msg(e)); ca.disabled=false; } };
      $("#exportAtt").onclick=async()=>{ const b64=await blobToB64(blob); const pack={type:"rayaheen-submission",student:ST.fullName||ST.name,halaqa:ST.halaqa,teacher:ST.teacherName,attempt:att,audio:b64}; await downloadsSave(`تلاوة-${ST.name}-${s}-${a1}-${a2}.json`,new Blob([JSON.stringify(pack)],{type:"application/json"})); };
    }});
  }
};

VIEWS.makharij=async function(){
  const refKeys=await DB.keys("letter:"); const has=new Set(refKeys.map(k=>k.split(":")[1]));
  let cur=LETTERS[0].letter;
  view.innerHTML=`<h1>مخارج الحروف</h1><div class="card"><p class="small muted">اختاري حرفًا لتقرئي مخرجه وصفاته من الكتاب، ثم انطقيه ساكنًا بعد همزة (أَبْ، أَتْ…) وسجّلي. اضغطي ▶ لسماع النطق الصحيح للحرف، ثم انطقيه وسجّلي؛ يقارن التطبيق نطقك بالنطق المرجعي (الحروف ذات الخط الذهبي لها صوت) وأخبرك إن كان أقرب إلى حرف آخر.</p><div class="letters" id="letters" style="margin-top:10px">${LETTERS.map(l=>`<button data-l="${l.letter}" class="${has.has(l.letter)?"has":""}">${l.letter}</button>`).join("")}</div></div><div id="lBox"></div>`;
  const LI=await LAUD.info().catch(()=>({map:{},voice:""})); const voiceName=LI.voice||"المعلمة";
  document.querySelectorAll("#letters button").forEach(b=>{ if(LI.map[lk(b.dataset.l)]||builtinLetter(b.dataset.l)) b.classList.add("has"); });
  if(isTeacher()) $("#lBox").insertAdjacentHTML("beforebegin",`<div class="card row between"><div><b>🔊 مكتبة أصوات الحروف</b><div class="small muted">${Object.keys(LI.map).length}/29 حرفًا مرفوعًا${LI.voice?" · بصوت "+esc(LI.voice):""}</div></div><button class="btn sm" data-go="letteraudio">إدارة الأصوات</button></div>`);
  view.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  const draw=async()=>{ const L=LETTERS.find(x=>x.letter===cur); document.querySelectorAll("#letters button").forEach(b=>b.classList.toggle("on",b.dataset.l===cur)); const srcBlob=LI.map[lk(cur)]?await LAUD.blob(cur):null; const refBlob=srcBlob||await DB.get("letter:"+cur);
    $("#lBox").innerHTML=`<div class="card"><div class="row between"><div class="bigletter">${L.letter}</div><div style="flex:1;min-width:200px"><h2>${esc(L.name)}</h2><p class="small"><span class="tag">اللقب:</span> ${esc(L.laqab||"—")}</p></div></div>
      <dl class="kv" style="margin-top:10px"><dt>المخرج</dt><dd>${esc(L.makhraj)}</dd><dt>الصفات</dt><dd>${(L.sifat||[]).map(s=>`<span class="pill acc">${esc(s)}</span>`).join(" ")}</dd><dt>تنبيه</dt><dd>${esc(L.tip||"")}</dd>${L.confusedWith&&L.confusedWith.length?`<dt>يُخلط بـ</dt><dd>${L.confusedWith.map(c=>`<span class="pill warn">${esc(c)}</span>`).join(" ")}</dd>`:""}<dt>كلمات</dt><dd class="quran" style="font-size:1.4rem;text-align:right;padding:0;line-height:1.8">${(L.practiceWords||[]).map(esc).join(" · ")}</dd></dl>
      ${refBlob?`<div class="row" style="margin-top:8px"><span class="small muted">🔊 النطق${srcBlob?" بصوت "+esc(voiceName):" بصوت الأستاذة"}:</span>${audioTag(refBlob)}</div>`:""}
      ${(()=>{ const b=builtinLetter(cur); return b?`<div class="card soft" style="margin-top:8px"><div class="small"><b>🔊 شرح الحرف ونطقه بصوت ${esc(BUILTIN_VOICE)}</b></div><audio controls preload="none" src="${b}" style="width:100%;margin-top:6px"></audio></div>`:""; })()}
      ${(()=>{ const h=husaryLetter(cur); return h?`<div class="row" style="margin-top:8px"><span class="small muted">🔊 اسم الحرف بصوت الشيخ محمود خليل الحصري (المصحف المعلّم) — ${esc(h.label)}:</span><audio controls preload="none" src="${h.url}"></audio></div>`:(refBlob||builtinLetter(cur)?"":`<p class="small muted" style="margin-top:8px">لا يوجد تسجيل لنطق هذا الحرف بعد${isTeacher()?" — سجّليه أو ارفعيه من «إدارة الأصوات».":"."}</p>`); })()}
      ${isTeacher()?`<details style="margin-top:8px"><summary>تسجيل نطق الأستاذة لهذا الحرف</summary>${recorderHtml("tl","انطقي الحرف ساكنًا بعد همزة مفتوحة، مثل: أَ"+L.letter+"ْ، ثم أوقفي.")}</details>`:""}</div>
      <div class="card"><h3>نطقك</h3>${recorderHtml("sl","انطقي الحرف ساكنًا بعد همزة مفتوحة (أَ"+L.letter+"ْ) ثم أوقفي التسجيل.")}<div id="lRes"></div></div>`;
    if(isTeacher()) wireRecorder("tl",{onDone:async b=>{ await DB.put("letter:"+cur,b); has.add(cur); toast("حُفظ نطق الأستاذة للحرف "+cur); draw(); }});
    wireRecorder("sl",{onDone:async b=>{ $("#slOut").innerHTML=audioTag(b); const res=$("#lRes"); res.innerHTML=`<div class="note info">جارٍ التحليل…</div>`; let sig; try{ sig=await Audio_.decode(b); }catch(e){ res.innerHTML=`<div class="note bad">تعذّر قراءة التسجيل.</div>`; return; }
      const S=extractFeatures(sig); const notes=[]; if(S.voicedSec<0.08){ res.innerHTML=`<div class="note bad">لم يُلتقط صوت واضح.</div>`; return; }
      // سمات بسيطة: صفير/همس → مركز طيفي مرتفع ومعدل عبور الصفر مرتفع
      const vf=S.frames.filter(f=>f.v); const cent=vf.reduce((a,f)=>a+f.cent,0)/vf.length, zcr=vf.reduce((a,f)=>a+f.zcr,0)/vf.length;
      const sif=L.sifat||[]; const hams=sif.includes("الهمس"); const safir=sif.includes("الصفير");

      if(!hams&&!safir&&zcr>0.25) notes.push({k:"warn",t:"سُمع في نطقك هواء كثير (همس) والحرف مجهور؛ احبسي النفس عند النطق."});
      if(hams&&zcr<0.06&&cent<1500) notes.push({k:"warn",t:"الحرف مهموس يجري معه النفس؛ نطقك بدا مجهورًا مكتومًا."});
      if(sif.includes("القلقلة")&&S.voicedSec>0.6) notes.push({k:"info",t:"القلقلة اضطراب قصير في المخرج؛ لا تطيلي الصوت بعد الحرف."});
      // مقارنة بالمراجع
      const refs=[]; const seen=new Set(); for(const Lr0 of Object.keys(LI.map)){ const Lr=(LETTERS.find(x=>lk(x.letter)===Lr0)||{letter:Lr0}).letter; const bl=await LAUD.blob(Lr0); if(bl){ try{ refs.push({letter:Lr,sig:await Audio_.decode(bl)}); seen.add(Lr); }catch(e){} } } for(const k of await DB.keys("letter:")){ const Lr=k.split(":")[1]; if(seen.has(Lr)) continue; const bl=await DB.get(k); if(bl){ try{ refs.push({letter:Lr,sig:await Audio_.decode(bl)}); }catch(e){} } }
      let scoreHtml=""; if(refs.length){ const cmp=compareLetter(sig,refs); if(cmp.ranked){ const mine=cmp.ranked.find(r=>r.letter===cur); const best=cmp.ranked[0]; if(mine){ const sc=Math.max(0,Math.min(100,Math.round(100-(mine.cost-0.8)*40))); scoreHtml=`<div class="score"><div class="big ${sc>=75?"good":sc>=55?"warn":"bad"}">${sc}٪</div><div><b>التشابه بالنطق المرجعي</b><div class="small muted">${best.letter===cur?"نطقك أقرب إلى الحرف الصحيح":`نطقك أقرب إلى حرف «${best.letter}» منه إلى «${cur}»`}</div></div></div>`; if(best.letter!==cur) notes.unshift({k:"bad",t:`انتبهي: الصوت المسجَّل أقرب إلى «${best.letter}». راجعي المخرج: ${L.makhraj}`}); else if(sc<60) notes.unshift({k:"warn",t:"النطق في الاتجاه الصحيح لكنه بعيد عن نطق الأستاذة؛ استمعي لها وكرّري."}); else notes.unshift({k:"good",t:"نطق جيد مطابق لمخرج الحرف."}); } else notes.push({k:"info",t:"لم تسجّل الأستاذة هذا الحرف بعد، فقورن نطقك بالحروف المسجلة فقط: الأقرب «"+best.letter+"»."}); } }
      else notes.push({k:"info",t:"لا توجد تسجيلات للأستاذة بعد؛ اطلبي منها تسجيل الحروف من وضع الأستاذة لتعمل المقارنة الآلية."});
      res.innerHTML=`<div class="card soft">${scoreHtml}<div class="stack" style="margin-top:10px">${notes.map(n=>`<div class="note ${n.k}">${esc(n.t)}</div>`).join("")}</div></div>`; }});
  };
  document.querySelectorAll("#letters button").forEach(b=>b.onclick=()=>{ cur=b.dataset.l; draw(); }); draw();
};

// ===== واجب الدرس (يظهر بعد إنهاء كل درس) =====
function ensureLessonHomework(l){ ST.lessonHw=ST.lessonHw||{}; if(!ST.lessonHw[l.id]){ const phrases=(l.practice||[]).slice(0,4); ST.lessonHw[l.id]={id:"lhw-"+l.id,lessonId:l.id,title:"واجب درس «"+l.title+"»",phrases,created:Date.now(),done:false,score:null}; save(); } return ST.lessonHw[l.id]; }
function lessonHomeworkCardHtml(l){ const h=ensureLessonHomework(l); return `<div class="card lv" style="--lc:var(--gold)" id="lhw-${l.id}"><div class="row between"><h3>${esc(h.title)}</h3>${h.done?`<span class="pill good">أُنجز ${h.score!=null?h.score+"٪":""}</span>`:`<span class="pill warn">مطلوب</span>`}</div>
  <p class="small muted">اقرئي العبارات التالية بتطبيق حكم الدرس في تسجيل واحد متتابع. يصحّح التطبيق الكلمات ويُرسل الواجب للأستاذة تلقائيًا.</p>
  <div class="quran" style="font-size:1.45rem;margin-top:8px">${h.phrases.map((p,i)=>`<span data-ph="${i}">${esc(p)}</span>`).join(" <span class='ayah-num'>۝</span> ")}</div>
  ${recorderHtml("lhw","سجّلي قراءة العبارات كلها ثم أوقفي.")}<div id="lhwRes"></div></div>`; }
function wireLessonHomework(l){ const h=ensureLessonHomework(l); const words=h.phrases.join(" ").split(/\s+/).filter(Boolean);
  wireRecorder("lhw",{recognize:true,onDone:async(blob,text)=>{ $("#lhwOut").innerHTML=audioTag(blob); const res=$("#lhwRes"); res.innerHTML=`<div class="note info" id="lhwSt">جارٍ التصحيح…</div>`;
    const bt=await bestTranscript(blob,text,m=>{ const el=$("#lhwSt"); if(el) el.textContent=m; },words); text=bt.text; const hyp=normAr(text||"").split(" ").filter(Boolean); const refW=words.map(normAr); let wordPct=null; const notes=[];
    if(hyp.length){ const {st,extra}=alignWords(refW,hyp); const missed=[]; st.forEach((v,i)=>{ if(v==="miss"){ const near=extra.find(x=>similar(x,refW[i])>=0.6); if(near){ st[i]="warn"; extra.splice(extra.indexOf(near),1); missed.push({i,near}); } else missed.push({i}); } }); wordPct=matchPct(st);
      if(missed.length) notes.push({k:missed.length>2?"bad":"warn",t:`كلمات سقطت أو حُرّفت: ${missed.slice(0,8).map(m=>`«${words[m.i]}»${m.near?" سُمعت: "+m.near:""}`).join("، ")}`}); else notes.push({k:"good",t:"جميع الكلمات مطابقة. أحسنتِ."}); }
    else notes.push({k:"info",t:"لم يُتعرَّف على الكلام؛ سُجّل الواجب وسيُقيَّم بالسماع."});
    let S=null; try{ S=extractFeatures(await Audio_.decode(blob)); }catch(e){}
    if(S&&S.voicedSec<1) notes.push({k:"bad",t:"التسجيل قصير جدًا؛ أعيدي قراءة العبارات كاملة."});
    notes.push(...aiNotesOf(bt));
    const score=wordPct; h.done=true; h.score=score; h.date=Date.now(); save(); ATT.recheck(); PTS.add(PTS.rules.lessonHw,"واجب درس","lhw:"+h.id);
    const att={id:Date.now(),label:h.title,score,wordPct,notes:notes.map(n=>n.t),date:Date.now(),s:0,a1:0,a2:0}; ST.attempts.push(att); await DB.put("att:"+att.id,blob); save();
    if(cloudOn()) CLOUD.submit({kind:"homework",hwId:h.id,hwTitle:h.title,att,blob}).then(()=>toast("أُرسل الواجب للأستاذة")).catch(()=>{});
    res.innerHTML=`<div class="card soft"><div class="score"><div class="big ${score==null?"":score>=ST.passPct?"good":score>=55?"warn":"bad"}">${score==null?"—":score+"٪"}</div><div><b>${score==null?"سُجّل الواجب":score>=ST.passPct?"واجب مقبول":"يُستحسن إعادة التسجيل"}</b><div class="small muted">يصل الأستاذة تلقائيًا</div></div></div><div class="stack" style="margin-top:10px">${notes.map(n=>`<div class="note ${n.k}">${esc(n.t)}</div>`).join("")}</div><div class="row" style="margin-top:8px"><button class="btn sec sm" id="lhwAgain">إعادة التسجيل</button></div></div>`;
    $("#lhwAgain").onclick=()=>{ const l2=LESSONS.find(x=>x.id===h.lessonId); const card=$("#lhw-"+h.lessonId); card.outerHTML=lessonHomeworkCardHtml(l2); wireLessonHomework(l2); }; }}); }
// ===== الواجبات التلقائية (يومية، تُولَّد من خطة الطالبة ومستواها) =====
function autoHomeworkList(){
  const items=[]; const today=new Date().toDateString(); const key=ATT.key();
  if(ST.hifz&&ST.hifz.plan){ const T=todayTasks(); if(T&&!T.finished) T.tasks.forEach(t=>items.push({id:"a-"+key+"-"+t.key,kind:t.type==="new"?"حفظ جديد":t.type==="fix"?"تثبيت":"مراجعة",title:`${t.title}: ${chunkLabel(t.c)}`,s:t.c.s,a1:t.c.a1,a2:t.c.a2,hidden:t.type!=="new"&&t.type!=="fix",done:!!taskDone(t),go:()=>go("hifz",{tab:"today"})})); }
  const cl=currentLevel(); if(cl<=4){ const L=LEVELS[cl-1]; const ls=lessonsOf(cl); const next=ls.find(l=>!ST.done[l.id]);
    if(next) items.push({id:"a-"+key+"-lesson",kind:"تجويد",title:`درس «${next.title}» واختباره`,done:!!ST.done[next.id],go:()=>go("lesson",next.id)});
    const dayIdx=Math.floor(Date.now()/86400000); const r=L.recite[dayIdx%L.recite.length]; const rid="a-"+key+"-recite";
    items.push({id:rid,kind:"تصحيح تلاوة",title:`تلاوة ${SURAH_NAMES[r[0]-1]} ${r[1]===r[2]?`آية ${r[1]}`:`${r[1]}–${r[2]}`} بتطبيق أحكام ${L.title}`,s:r[0],a1:r[1],a2:r[2],done:!!(ST.autoDone||{})[rid],go:()=>go("practice",{s:r[0],a1:r[1],a2:r[2],auto:rid})}); }
  return items;
}
function lessonHomeworkListHtml(){ const hws=Object.values(ST.lessonHw||{}).sort((a,b)=>b.created-a.created); if(!hws.length) return ""; const pend=hws.filter(h=>!h.done).length; return `<div class="card"><div class="row between"><h3>واجبات الدروس</h3><span class="pill ${pend?"warn":"good"}">${pend?pend+" معلّق":"كلها منجزة"}</span></div><p class="small muted">يظهر واجب بعد إنهاء كل درس في التجويد.</p><div class="stack" style="margin-top:8px">${hws.map(h=>`<button class="lesson-item" data-lhw="${h.lessonId}"><span class="mark ${h.done?"done":""}">${h.done?"✓":"!"}</span><span class="t"><b>${esc(h.title)}</b><span class="small muted">${h.done?`أُنجز · ${h.score!=null?h.score+"٪":""}`:"سجّلي قراءة عبارات الدرس"}</span></span></button>`).join("")}</div></div>`; }

VIEWS.leveltest=async function(lv){
  lv=+lv||1; const L=LEVELS[lv-1]; const ls=lessonsOf(lv); if(!levelUnlocked(lv)){ go("levels"); return; }
  const pool=(lv===4?LESSONS:ls).flatMap(l=>l.quiz||[]); const nQ=lv===4?30:Math.min(20,pool.length); const qs=pool.slice().sort(()=>Math.random()-.5).slice(0,nQ);

  view.innerHTML=`<div class="row between"><button class="btn sec sm" id="back">→ المستويات</button><span class="pill gold">${esc(L.title)}</span></div>
  <div class="card"><h1>اختبار اجتياز ${esc(L.title)}</h1><p class="lesson-body small">يتكوّن الاختبار من جزأين: نظري (${nQ} سؤالًا من أبواب المستوى) وتلاوة اختبارية. يُجتاز المستوى بالحصول على ${ST.passPct}٪ فأكثر في الجزأين${ST.requireTeacher?" مع اعتماد الأستاذة":""}. هدف المستوى: ${esc(L.mastery)}.</p>
    <div class="row" style="margin-top:8px"><span class="pill ${stage.mcq==null?"":stage.mcq>=ST.passPct?"good":"bad"}">النظري: ${stage.mcq==null?"لم يُؤدَّ":stage.mcq+"٪"}</span><span class="pill ${stage.recite==null?"":stage.recite>=ST.passPct?"good":"bad"}">التلاوة: ${stage.recite==null?"لم تُؤدَّ":stage.recite+"٪"}</span>${prev.passed?`<span class="pill good">المستوى مُجتاز</span>`:""}</div></div>
  <div class="card"><h3>أولًا: الجزء النظري</h3><div id="mcqBox" style="margin-top:8px"></div></div>
  <div class="card"><h3>ثانيًا: التلاوة الاختبارية</h3><p class="small muted">اقرئي المقاطع التالية بتطبيق أحكام المستوى. يُقدّر التطبيق تلاوتك آليًا بمقارنتها بـ«${esc((RECITERS.find(r=>r.id===ST.reciter)||RECITERS[0]).name)}» أو بقراءة الأستاذة إن وُجدت، وتعتمد الأستاذة النتيجة بالسماع.</p><div id="recBox" class="stack" style="margin-top:8px"></div></div>
  <div class="card soft" id="verdict"></div>`;
  $("#back").onclick=()=>go("levels");
  renderQuiz($("#mcqBox"),qs,{label:"تسليم الجزء النظري",onFinish:pct=>{ stage.mcq=pct; commit(); }});
  const recBox=$("#recBox"); let k=0; const scores=[];
  for(const [s,a1,a2] of L.recite){ const ay=await getAyahs(s,a1,a2); const words=ay.filter(o=>o.text).flatMap(o=>o.text.split(/\s+/)); const id="rt"+(k++); const d=document.createElement("div"); d.className="q"; d.innerHTML=`<div class="eyebrow">سورة ${SURAH_NAMES[s-1]} ${a1===a2?`الآية ${a1}`:`الآيات ${a1}–${a2}`}</div>${ayahHtml(ay)}${recorderHtml(id,"سجّلي المقطع كاملًا.")}<div data-r></div>`; recBox.appendChild(d);
    wireRecorder(id,{recognize:true,onDone:async(blob,text)=>{ $("#"+id+"Out").innerHTML=audioTag(blob); const rr=d.querySelector("[data-r]"); rr.innerHTML=`<div class="note info">جارٍ التحليل…</div>`;
      const bt=await bestTranscript(blob,text,m=>{ rr.innerHTML=`<div class="note info">${esc(m)}</div>`; },words); text=bt.text;
      let wordPct=null; const hyp=normAr(text||"").split(" ").filter(Boolean); if(hyp.length){ const {st}=alignWords(words.map(normAr),hyp); wordPct=matchPct(st); }
      let ac=null; try{ let ref=await getReference(s,a1,a2,"teacher"); let rs=await decodeReference(ref); if(!rs){ ref=await getReference(s,a1,a2,ST.reciter); rs=await decodeReference(ref); } const r=analyzeRecitation(await Audio_.decode(blob),rs,words); ac=r.acoustic; rr.innerHTML=`<div class="stack">${r.notes.concat(aiNotesOf(bt)).map(n=>`<div class="note ${n.k}">${esc(n.t)}</div>`).join("")}</div>`; }catch(e){ rr.innerHTML=`<div class="stack">${aiNotesOf(bt).map(n=>`<div class="note ${n.k}">${esc(n.t)}</div>`).join("")}</div>`; }
      const parts=[wordPct,ac].filter(x=>x!=null); const sc=parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length):null; scores[k-1]=sc; await DB.put(`lt:${lv}:${s}:${a1}`,blob);
      rr.insertAdjacentHTML("afterbegin",`<div class="row"><span class="pill ${sc==null?"":sc>=ST.passPct?"good":"warn"}">تقدير هذا المقطع: ${sc==null?"—":sc+"٪"}</span></div>`);
      const got=scores.filter(x=>x!=null); if(got.length===L.recite.length){ stage.recite=Math.round(got.reduce((a,b)=>a+b,0)/got.length); commit(); } }}); }
  function commit(){ const t=ST.levelTests[lv]||{}; Object.assign(t,{mcq:stage.mcq,recite:stage.recite,date:Date.now()}); const ok=stage.mcq!=null&&stage.recite!=null&&stage.mcq>=ST.passPct&&stage.recite>=ST.passPct; if(ok&&!ST.requireTeacher){ t.passed=true; t.passedAt=t.passedAt||Date.now(); } if(ok&&ST.requireTeacher) t.pendingApproval=true; ST.levelTests[lv]=t; save(); verdict(); }
  function verdict(){ const t=ST.levelTests[lv]||{}; const v=$("#verdict"); if(t.passed){ v.innerHTML=`<div class="cert"><h2>مبارك</h2><div class="name">${esc(ST.fullName||ST.name)}</div><p class="small muted">${ST.halaqa?esc(ST.halaqa):""}${ST.teacherName?" · الأستاذة "+esc(ST.teacherName):""}</p><p>اجتزتِ ${esc(L.title)}${lv<4?" وفُتح لك المستوى التالي.":"؛ أتممتِ منهج رياحين كاملًا."}</p><div class="row" style="justify-content:center;margin-top:10px"><button class="btn gold" id="certBtn">🎓 شهادة الإتمام</button>${lv<4?`<button class="btn sec" id="nextLv">إلى ${esc(LEVELS[lv].title)}</button>`:""}</div></div>`; const b=$("#nextLv"); if(b)b.onclick=()=>go("levels"); $("#certBtn").onclick=()=>go("certificate",lv); }
    else if(t.pendingApproval){ v.innerHTML=`<div class="note info">نتائجك مكتملة وتنتظر اعتماد الأستاذة. صدّري نتيجتك من صفحة «المزيد ← تقدمي» وأرسليها لها.</div>`; }
    else if(stage.mcq!=null&&stage.recite!=null){ v.innerHTML=`<div class="note warn">لم تُحقّق نسبة الاجتياز بعد (النظري ${stage.mcq}٪، التلاوة ${stage.recite}٪). راجعي دروس المستوى وأعيدي الاختبار.</div>`; }
    else v.innerHTML=`<p class="small muted">أكملي الجزأين لتظهر النتيجة.</p>`; }
  verdict();
};

const G_SUFFIX=["ها","ه","هم","هن","ني"]; // سجّليها → سجّلها
const G_RE=/[ء-يـً-ْ]+/g;
function gWord(w){
  const pre=w.match(/^(ولل|فلل|و|ف|ل|ب|ك|وال|فال|بال|لل|ول|فل|وب|فب)?/)[0];
  const tryOne=(x)=>{ if(G_WORDS[x]) return G_WORDS[x];
    for(const s of G_SUFFIX){ if(x.endsWith("ي"+s)){ const st=x.slice(0,-s.length); if(G_WORDS[st]) return G_WORDS[st]+s; } }
    // ماضي المخاطبة: أتممتِ → أتممتَ ، لكِ → لكَ (بلا تشكيل آخر)
    if(/[تك]ِ$/.test(x)&&!/[ً-ُّْ]/.test(x)&&(x.match(/ِ/g)||[]).length===1) return x.slice(0,-1)+"َ";
    return null; };
  let r=tryOne(w); if(r) return r;
  if(pre){ for(let i=pre.length;i>0;i--){ const p=w.slice(0,i), rest=w.slice(i); if(rest.length<2) continue; r=tryOne(rest); if(r) return p+r; } }
  return w; }
const G_NOUNS="(?:ال|لل|و|وال|ل)?(?:طالبة|طالبات|معلمة|معلمات|أستاذة)|معلمتك|معلمتها|معلمتي";
const G_TNOUN=/^ت(?:لاو|وقي|صحي|حمي|سجي|نبي|وقي|علي|قدّ|قد|قري|قيي|اري|مري|جوي|طبي|حدي|فاص|ع)/;
const G_V1=new RegExp("(^|[^\\u0600-\\u06FF])(تُ?)([\\u0600-\\u06FF]{2,})(\\s+)("+G_NOUNS+")(?![\\u0600-\\u06FF])","g");
const G_V2=new RegExp("(^|[^\\u0600-\\u06FF])("+G_NOUNS+")(\\s+)(تُ?)([\\u0600-\\u06FF]{2,})","g");
function gVerbs(s){ return s.replace(G_V1,(m,a,t,rest,sp,n)=>G_TNOUN.test(t+rest)?m:a+(t==="تُ"?"يُ":"ي")+rest+sp+n).replace(G_V2,(m,a,n,sp,t,rest)=>G_TNOUN.test(t+rest)?m:a+n+sp+(t==="تُ"?"يُ":"ي")+rest); }
function gtx(s){ if(!isMale()||!s||typeof s!=="string") return s; return gVerbs(s).replace(G_RE,gWord); }
const G_SKIP=".rmsg,.quran,.ayah,.noGtx,textarea,input,script,style,#rbCanvas";
function gNode(n){ if(!isMale()) return;
  if(n.nodeType===3){ const p=n.parentElement; if(!p||p.closest(G_SKIP)) return; const v=n.nodeValue, t=gtx(v); if(t!==v) n.nodeValue=t; return; }
  if(n.nodeType!==1||n.matches(G_SKIP)) return;
  if(n.placeholder){ const t=gtx(n.placeholder); if(t!==n.placeholder) n.placeholder=t; }
  if(n.title){ const t=gtx(n.title); if(t!==n.title) n.title=t; }
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT); let x; while((x=w.nextNode())){ if(x.nodeType===1){ if(x.placeholder){ const t=gtx(x.placeholder); if(t!==x.placeholder) x.placeholder=t; } if(x.title){ const t=gtx(x.title); if(t!==x.title) x.title=t; } continue; } gNode(x); } }

function planSeq(plan){ const seq=[]; const step=plan.dir==="back"?-1:1; let s=plan.fromS, a=plan.fromA; let guard=0; while(guard++<7000){ seq.push([s,a]); if(s===plan.toS&&a===plan.toA)break; if(a<AYAH_COUNTS[s-1])a++; else { s+=step; if(s>114||s<1)break; a=1; } } return seq; }
// يقسم سلسلة آيات إلى مقاطع داخل السورة الواحدة، ومجموعات يومية بحسب المقدار
function groupSeq(seq,amount,unit){ const groups=[]; let cur=[],w=0; const flush=()=>{ if(cur.length){ groups.push(cur); cur=[]; w=0; } };
  for(const [s,a] of seq){ const aw=ayahWeight(s,a,unit); if(cur.length&&w+aw>amount+1e-6&&w>=amount*0.5) flush(); cur.push([s,a]); w+=aw; if(w>=amount-1e-6) flush(); } flush();

  if(groups.length>1){ const last=groups[groups.length-1]; const lw=last.reduce((t,[s,a])=>t+ayahWeight(s,a,unit),0); if(lw<amount*0.34){ groups[groups.length-2].push(...last); groups.pop(); } }
  return groups; }

function hifzChunks(plan){ const unit=plan.unit||"ayah"; const groups=groupSeq(planSeq(plan),Math.max(0.5,plan.daily||5)*(unit==="half"?1:1),unit); const chunks=[]; groups.forEach((g,gi)=>toChunks(g,{g:gi}).forEach(c=>{ c.k=chunks.length; chunks.push(c); })); chunks.groups=groups.length; return chunks; }
function hifzChunksV1(plan){ const seq=planSeq(plan); const chunks=[]; let i=0,k=0;
  while(i<seq.length){ let j=i; const s0=seq[i][0]; while(j<seq.length&&j-i<plan.daily&&seq[j][0]===s0)j++;
    const prev=chunks[chunks.length-1]; if(prev&&prev.s===s0&&(j-i)<=plan.daily/2&&(j===seq.length||seq[j][0]!==s0)) prev.a2=seq[j-1][1]; else chunks.push({k:k++,s:s0,a1:seq[i][1],a2:seq[j-1][1]}); i=j; } return chunks; }
function migrateHifzPlan(H){ const P=H.plan; if(!P||P.mode!=="custom"||P.v===2) return; try{ const memA=new Set(); hifzChunksV1(P).filter(c=>H.memorized.includes(c.k)).forEach(c=>{ for(let a=c.a1;a<=c.a2;a++) memA.add(c.s+":"+a); }); P.unit="ayah"; if(P.review==null) P.review=(P.farCount||0)*(P.daily||5); P.v=2; const nc=hifzChunks(P); H.memorized=nc.filter(c=>{ for(let a=c.a1;a<=c.a2;a++) if(!memA.has(c.s+":"+a)) return false; return true; }).map(c=>c.k); }catch(e){ P.v=2; } }
function isHifzDay(P,d){ d=d||new Date(); return !P.days||!P.days.length||P.days.includes(d.getDay()); }
function customTasks(){
  const H=hifzState(); const P=H.plan; const unit=P.unit||"ayah"; const chunks=hifzChunks(P); const mem=new Set(H.memorized);
  const nextChunk=chunks.find(c=>!mem.has(c.k)); const memList=chunks.filter(c=>mem.has(c.k)); const tasks=[];
  const todayIsHifz=isHifzDay(P);
  // الحفظ الجديد: مقاطع المجموعة اليومية التالية (في أيام الحفظ فقط)
  if(nextChunk&&todayIsHifz) chunks.filter(c=>c.g===nextChunk.g&&!mem.has(c.k)).forEach(c=>tasks.push({type:"new",key:"c"+c.k,c,title:"حفظ جديد"}));

    const today=new Date().toDateString(); const rotDays=new Set(H.log.filter(l=>l.type==="far"&&new Date(l.date).toDateString()!==today).map(l=>new Date(l.date).toDateString())).size;
    let startW=(rotDays*revAmt)%Math.max(total,1e-6); let idx=0,acc=0; while(idx<ayahs.length&&acc+ayahWeight(...ayahs[idx],unit)<=startW+1e-6){ acc+=ayahWeight(...ayahs[idx],unit); idx++; }
    const win=[]; let w=0,n=0; while(w<Math.min(revAmt,total)-1e-6&&n<ayahs.length){ const x=ayahs[(idx+n)%ayahs.length]; win.push(x); w+=ayahWeight(x[0],x[1],unit); n++; }
    toChunks(win,{}).forEach(c=>tasks.push({type:"far",key:`f${c.s}:${c.a1}-${c.a2}`,c,title:"مراجعة بعيدة"})); }

}

function expandRange(x){ // {s,toS}|{s,a1,a2|null} → مقاطع
  if(!x)return[]; if(x.toS!=null){ const out=[]; for(let s=x.s;s>=x.toS;s--) out.push({s,a1:1,a2:AYAH_COUNTS[s-1]}); return out; }
  const a1=x.a1||1, a2=x.a2||AYAH_COUNTS[x.s-1]; return [{s:x.s,a1:Math.min(a1,AYAH_COUNTS[x.s-1]),a2:Math.min(a2,AYAH_COUNTS[x.s-1])}];
}
function nahyaTasks(i){
  const e=NAHYA_PLAN[i]; if(!e)return null; const prev=NAHYA_PLAN[i-1]; const tasks=[];
  const h=e.h; if(h){ if(h.toS!=null){ expandRange(h).forEach((c,j)=>tasks.push({type:"new",key:`d${i}h${j}`,c,title:"حفظ جديد"})); }
    else { const full=expandRange(h)[0]; let start=full.a1; if(prev&&prev.h&&!prev.h.toS&&prev.h.s===h.s&&prev.h.a2&&(prev.h.a1||1)===(h.a1||1)) start=Math.min(full.a2,prev.h.a2+1);
      tasks.push({type:"new",key:`d${i}h0`,c:{s:h.s,a1:start,a2:full.a2},title:"حفظ جديد"}); if(start>full.a1) tasks.push({type:"fix",key:`d${i}x0`,c:full,title:"تثبيت المقطع من أوله"}); } }
  expandRange(e.r).forEach((c,j)=>tasks.push({type:"near",key:`d${i}r${j}`,c,title:"مراجعة"}));
  return tasks;
}
function todayTasks(){
  const H=hifzState(); const P=H.plan; if(!P)return null; if(P.mode!=="nahya") return customTasks();
  const i=Math.min(H.day,NAHYA_PLAN.length-1); const tasks=nahyaTasks(i)||[]; const e=NAHYA_PLAN[i];
  return {tasks,progress:H.day/NAHYA_PLAN.length,progressText:`اليوم ${e.d} من الشهر ${e.m} · اليوم ${i+1} من ${NAHYA_PLAN.length}`,finished:H.day>=NAHYA_PLAN.length,dayIndex:i,entry:e};
}
function taskDone(t){ const H=hifzState(); if(H.plan.mode==="nahya") return H.dayDone[H.day]&&H.dayDone[H.day][t.key]; const d=new Date().toDateString(); return H.log.find(l=>l.key===t.key&&new Date(l.date).toDateString()===d); }

      $("#hzMark").onclick=async()=>{ $("#hzMark").disabled=true; const att=tasmeeSave(R,blob,{label,s:c.s,a1:c.a1,a2:c.a2,kind:"hifz"});

        if(H.plan.mode==="nahya"){ H.dayDone[H.day]=H.dayDone[H.day]||{}; H.dayDone[H.day][t.key]={score,grade:R.grade,date:Date.now()}; } else if(type==="new"&&!H.memorized.includes(c.k)) H.memorized.push(c.k);
        save(); try{ CLOUD.logHifz(H.log[H.log.length-1]); }catch(e){} PTS.add(PTS.rules.hifz,"مهمة حفظ","hz:"+new Date().toDateString()+":"+t.key);
        if(cloudOn()) CLOUD.submit({kind:"hifz",hwTitle:att.label,att,blob}).catch(()=>{}); toast(cloudOn()?"اعتُمدت المهمة وأُرسلت للمعلمة":"اعتُمدت المهمة"); go("hifz",{tab:"today"}); };
    }});
  }

      <div class="card"><div class="eyebrow">أيام تسميع متتابعة</div><div class="score"><div class="big">${streak}</div><div class="small muted">يوم</div></div></div>

      `<div class="card"><h3>خريطة الحفظ</h3><div class="row" style="gap:4px;margin-top:8px">${T.chunks.map(c=>`<span class="pill ${H.memorized.includes(c.k)?"good":""}" style="font-size:.7rem">${chunkLabel(c)}</span>`).join("")}</div></div>`}`;
    $("#hzExpLog").onclick=()=>downloadsSave(`سجل-حفظ-${ST.name}.json`,new Blob([JSON.stringify({type:"rayaheen-hifz",student:ST.fullName||ST.name,halaqa:ST.halaqa,teacher:ST.teacherName,plan:H.plan,day:H.day,log:H.log,memorized:H.memorized})],{type:"application/json"}));
  }
};

// ===== التسميع على طريقة «ترتيل»: النص مخفي ويظهر كلمةً كلمة مع التلاوة، والأخطاء تُحسب تلقائيًا =====
const TASMEE={ full:10, step:0.5, passGrade:7,
  types:{ "حفظ":{ic:"🧠",t:"الحفظ"}, "حرف":{ic:"🔤",t:"الحروف"}, "حركة":{ic:"ـَ",t:"الحركات"} } };
function tasmeeFull(){ return +(ST.tasmeeFull||TASMEE.full); }
function tasmeeStep(){ return +(ST.tasmeeStep||TASMEE.step); }
function fmtGrade(g){ return String(Math.round(g*2)/2); }

// يعرض النص كلمات مرقّمة (فهرس عام) مع أرقام الآيات
function tasmeeTextHtml(ay){ let k=0; const W=t=>t.split(/\s+/).filter(Boolean).map(w=>`<span class="tw" data-i="${k++}"><b>${esc(w)}</b></span>`).join(" ");
  if(ay.length&&ay[0].matn) return `<div class="tq tmatn">`+ay.map(o=>`<div class="bayt"><span class="bn">${o.a}</span><span class="sh">${W(o.h[0])}</span><span class="sh">${W(o.h[1])}</span></div>`).join("")+`</div>`;
  return `<div class="quran tq">`+ay.map(o=>o.text?W(o.text)+` <span class="ayah-num">﴿${o.a}﴾</span>`:"").join(" ")+`</div>`; }
// مفتاح كل كلمة (لأي آية/بيت تنتمي) لتتبّع المواضع الضعيفة
function tasmeeKeys(ay){ const out=[]; ay.forEach(o=>{ if(!o.text) return; const n=o.text.split(/\s+/).filter(Boolean).length; const key=o.matn?`m:${o.mid}:${o.a}`:`q:${o.s}:${o.a}`; for(let i=0;i<n;i++) out.push(key); }); return out; }

// يحدد آخر كلمة وصلت إليها القارئة، وحالة كل كلمة قبلها
function tasmeeTrack(refW,hyp){ if(!hyp.length) return {st:refW.map(()=>null),last:-1}; const {st}=alignWords(refW,hyp); let last=-1; st.forEach((v,i)=>{ if(v==="ok"||v==="warn") last=i; }); return {st:st.map((v,i)=>i<=last?v:null),last}; }

function tasmeeWidget(host,{ay,words,hidden=true,title="",onGraded,kind="quran"}){
  const refW=words.map(normAr); const id="tsm"+Date.now().toString(36); const peeks=new Set(); let hide=hidden, live=null;
  host.innerHTML=`<div class="row between"><h3>🎙️ التسميع ${title?"· "+esc(title):""}</h3><label class="switch small"><input type="checkbox" id="${id}H" ${hide?"checked":""}> إخفاء النص</label></div>
    <p class="small muted">اقرئي من حفظك فتظهر الكلمات مع تلاوتك. الدرجة من ${tasmeeFull()}، و−${fmtGrade(tasmeeStep())} لكل خطأ. <details class="tinfo"><summary>كيف تُحسب؟</summary>تُحسب أخطاء الحفظ (كلمة سقطت أو أُبدلت أو كُشفت بلمسها)، وتغيير الحروف، والحركات (بالمصحّح الذكي). ملاحظات التجويد تظهر ولا تُخصم.</details></p>
    <div id="${id}Txt" class="tbox ${hide?"hide":""}">${tasmeeTextHtml(ay)}</div>
    <div class="row between small" style="margin:6px 2px"><span id="${id}Pos" class="muted">لم تبدئي بعد</span><span id="${id}Live" class="pill">الأخطاء: 0</span></div>
    ${recorderHtml(id,"اضغطي للبدء، واضغطي مرة أخرى عند الانتهاء.")}<div id="${id}Res"></div>`;
  const box=$("#"+id+"Txt"), spans=[...box.querySelectorAll(".tw")];
  $("#"+id+"H").onchange=e=>{ hide=e.target.checked; box.classList.toggle("hide",hide); };
  spans.forEach(sp=>sp.onclick=()=>{ if(!hide||sp.classList.contains("rv")) return; const i=+sp.dataset.i; peeks.add(i); sp.classList.add("rv","peek"); updLive(); });
  const paint=(st,last)=>{ spans.forEach((sp,i)=>{ const v=st[i]; sp.classList.toggle("rv",v!=null||peeks.has(i)); sp.classList.toggle("ok",v==="ok"); sp.classList.toggle("warn",v==="warn"); sp.classList.toggle("miss",v==="miss"); sp.classList.toggle("cur",i===last+1); });
    const cur=spans[last+1]; if(cur&&live) cur.scrollIntoView({block:"nearest",behavior:"smooth"}); };
  const liveErrs=st=>st.filter(v=>v==="miss"||v==="warn").length+[...peeks].filter(i=>st[i]!=="miss").length;
  function updLive(){ const st=live?live.st:refW.map(()=>null); const n=liveErrs(st); $("#"+id+"Live").textContent=`الأخطاء: ${n}`; $("#"+id+"Live").className="pill "+(n?"warn":"good"); }
  wireRecorder(id,{recognize:true,
    onText:txt=>{ const hyp=normAr(txt||"").split(" ").filter(Boolean); live=tasmeeTrack(refW,hyp); paint(live.st,live.last); updLive(); $("#"+id+"Pos").textContent=live.last>=0?`وصلتِ إلى «${words[live.last]}» (${live.last+1} من ${words.length})`:"أستمع…"; },
    onDone:async(blob,srText)=>{ const res=$("#"+id+"Res"); $("#"+id+"Out").innerHTML=audioTag(blob); res.innerHTML=`<div class="note info" id="${id}St">جارٍ احتساب الأخطاء…</div>`;
      const bt=await bestTranscript(blob,srText,m=>{ const el=$("#"+id+"St"); if(el) el.textContent=m; },words,{kind});
      const R=tasmeeGrade({words,refW,text:bt.text,ai:bt.ai,peeks}); R.engine=bt.engine; R.keys=tasmeeKeys(ay); R.kind=kind;
      paint(R.st,R.last); spans.forEach((sp,i)=>{ sp.classList.add("rv"); sp.classList.remove("cur"); if(R.byWord[i]) sp.classList.add(R.byWord[i].some(e=>e.type==="حفظ")?"miss":"warn"); });
      box.classList.remove("hide"); $("#"+id+"H").checked=false; hide=false;
      res.innerHTML=tasmeeResultHtml(R); res.querySelectorAll("[data-wi]").forEach(b=>b.onclick=()=>{ const sp=spans[+b.dataset.wi]; if(sp){ sp.scrollIntoView({block:"center",behavior:"smooth"}); sp.classList.add("flash"); setTimeout(()=>sp.classList.remove("flash"),1200); } });
      if(onGraded) await onGraded(R,blob,res.querySelector(".tacts")); }});
}

// احتساب الأخطاء: الحفظ (سقط/إبدال/تلقين) والحروف من المطابقة، والحركات والحروف الدقيقة من المصحّح الذكي
function tasmeeGrade({words,refW,text,ai,peeks}){
  const hyp=normAr(text||"").split(" ").filter(Boolean); const heard=hyp.length>0;
  let st=refW.map(()=>null), last=-1, extra=[];
  if(heard){ const a=alignWords(refW,hyp); st=a.st; extra=a.extra||[]; st.forEach((v,i)=>{ if(v==="ok"||v==="warn") last=i; }); }
  const errs=[]; const has=(i,type)=>errs.some(e=>e.i===i&&e.type===type);
  // ما بعد آخر كلمة مقروءة: يُعدّ توقّفًا (حفظ) إن قرأت أقل من النص كاملًا
  // الكلمات بعد آخر موضع مقروء لا تُخصم (قد يكون التسميع لم يكتمل أو انقطع التعرّف)، وتظهر تنبيهًا
  const trailing=heard?st.length-1-last:0;
  st.forEach((v,i)=>{ if(i>last) return; if(v==="miss") errs.push({i,type:"حفظ",t:"سقطت أو نُسيت"}); else if(v==="warn") errs.push({i,type:"حرف",t:"نُطقت بتغيير في حروفها"}); });
  (peeks||new Set()).forEach(i=>{ if(!has(i,"حفظ")) errs.push({i,type:"حفظ",t:"كُشفت (تلقين)"}); });
  const tajweed=[];
  if(ai&&Array.isArray(ai.mistakes)){ const used=new Set(); ai.mistakes.forEach(m=>{ const w=normAr(m.word||""); let i=-1; for(let k=0;k<refW.length;k++){ if(!used.has(k)&&(refW[k]===w||(w.length>2&&similar(refW[k],w)>=0.8))){ i=k; break; } } if(i>=0) used.add(i);
      const type=m.type==="حركة"||m.type==="حرف"||m.type==="حفظ"?m.type:(m.type==="تجويد"?"تجويد":(m.kind==="جلي"?"حركة":"تجويد"));
      if(type==="تجويد"){ tajweed.push({i,t:m.note||"",w:m.word}); return; }
      if(i<0){ errs.push({i:-1,type,t:m.note||"",w:m.word,ai:true}); return; }
      if(i>last&&heard) return; if(type==="حفظ"&&has(i,"حفظ")) return; if(type==="حرف"&&(has(i,"حرف")||has(i,"حفظ"))) return; if(type==="حركة"&&(has(i,"حركة")||has(i,"حفظ"))) return;
      errs.push({i,type,t:m.note||"",ai:true}); }); }
  errs.sort((a,b)=>(a.i<0?1e9:a.i)-(b.i<0?1e9:b.i));
  const full=tasmeeFull(), step=tasmeeStep(); const grade=heard?Math.max(0,full-step*errs.length):null;
  const byWord={}; errs.forEach(e=>{ if(e.i>=0)(byWord[e.i]=byWord[e.i]||[]).push(e); });
  const count=t=>errs.filter(e=>e.type===t).length;
  return {heard,st,last,trailing,complete:trailing<=Math.max(1,Math.round(refW.length*0.03)),errs,byWord,tajweed,extra,grade,full,step,pct:grade==null?null:Math.round(grade/full*100),counts:{"حفظ":count("حفظ"),"حرف":count("حرف"),"حركة":count("حركة")},praise:ai&&ai.praise||"",words,aiUsed:!!ai};
}
function tasmeeResultHtml(R){
  if(!R.heard) return `<div class="note bad">لم يُتعرَّف على التلاوة، فلم تُحتسب الدرجة. تأكدي من السماح للميكروفون، واقرئي بصوت واضح قريبًا من الجوال، ثم أعيدي المحاولة.</div>`;
  const cls=R.grade>=9?"good":R.grade>=TASMEE.passGrade?"warn":"bad";
  return `<div class="card soft tres"><div class="tgrade ${cls}"><b>${fmtGrade(R.grade)}</b><span>/ ${R.full}</span></div>
    <div class="tcounts">${Object.entries(TASMEE.types).map(([k,v])=>`<div class="${R.counts[k]?"has":""}"><span>${v.ic}</span><b>${R.counts[k]}</b><small>${v.t}</small></div>`).join("")}</div>
    ${R.complete?"":`<div class="note warn">لم يكتمل التسميع: توقّف عند «${esc(R.words[R.last]||"")}»، وبقيت ${R.trailing} كلمة لم تُسمع (لا تُخصم). أكملي التسميع أو أعيديه كاملًا.</div>`}
    <p class="small muted" style="text-align:center">${R.errs.length?`${R.errs.length} خطأ × ${fmtGrade(R.step)} = خصم ${fmtGrade(R.errs.length*R.step)}`:"لا أخطاء — ما شاء الله تبارك الله!"}${R.aiUsed?"":" · (الحركات تُكتشف بالمصحّح الذكي عند تسجيل الدخول)"}</p>
    ${R.errs.length?`<div class="terrs">${R.errs.map(e=>`<button class="terr t-${e.type==="حفظ"?"h":e.type==="حرف"?"r":"k"}" ${e.i>=0?`data-wi="${e.i}"`:""}><span class="tt">${TASMEE.types[e.type].ic} ${TASMEE.types[e.type].t}</span><b class="quran-inline">${esc(e.i>=0?R.words[e.i]:(e.w||""))}</b><small>${esc(e.t)}</small></button>`).join("")}</div>`:""}
    ${R.tajweed.length?`<details class="small" style="margin-top:8px"><summary>ملاحظات تجويد (لا تُخصم) · ${R.tajweed.length}</summary><div class="stack" style="margin-top:6px">${R.tajweed.map(x=>`<div class="note info">«${esc(x.i>=0?R.words[x.i]:x.w||"")}»: ${esc(x.t)}</div>`).join("")}</div></details>`:""}
    ${R.praise?`<div class="note good" style="margin-top:8px">🤖 ${esc(R.praise)}</div>`:""}
    <div class="tacts row" style="margin-top:10px;justify-content:center"></div></div>`;
}
// تحديث المواضع الضعيفة: كل آية/بيت فيه خطأ يُضاف أو يزيد وزنه، ويُحذف بعد تسميعين سليمين
function weakUpdate(R,labelOf){ if(!R||R.grade==null||!R.keys) return; ST.weak=ST.weak||{}; const errBy={}; R.errs.forEach(e=>{ if(e.i>=0){ const k=R.keys[e.i]; errBy[k]=(errBy[k]||0)+1; } });
  const seen=[...new Set(R.keys.slice(0,R.last+1))];
  seen.forEach(k=>{ const W=ST.weak[k]; if(errBy[k]){ ST.weak[k]={k,label:labelOf(k),errs:(W?W.errs:0)+errBy[k],clean:0,last:Date.now()}; } else if(W){ W.clean=(W.clean||0)+1; W.last=Date.now(); if(W.clean>=2) delete ST.weak[k]; } }); }
function weakLabel(k){ const p=k.split(":"); if(p[0]==="q") return `${SURAH_NAMES[+p[1]-1]} ${p[2]}`; const M=MUTOON.find(x=>x.id===p[1]); return `${M?M.title:p[1]}: البيت ${p[2]}`; }
function tasmeeSave(R,blob,{label,s,a1,a2,kind="tasmee",mid=null}){ const att={id:Date.now(),label:`تسميع ${label}: ${fmtGrade(R.grade)}/${R.full}`,score:R.pct,wordPct:R.pct,grade:R.grade,full:R.full,counts:R.counts,notes:R.errs.slice(0,20).map(e=>`${TASMEE.types[e.type].t}: «${e.i>=0?R.words[e.i]:e.w||""}» ${e.t}`),date:Date.now(),s,a1,a2};
  ST.attempts.push(att); ST.tasmeeLog=ST.tasmeeLog||[]; ST.tasmeeLog.push({date:att.date,label,s,a1,a2,mid,grade:R.grade,full:R.full,counts:R.counts,complete:!!R.complete}); weakUpdate(R,weakLabel); if(ST.tasmeeLog.length>200) ST.tasmeeLog.splice(0,ST.tasmeeLog.length-200); save();
  DB.put("att:"+att.id,blob).catch(()=>{}); return att; }

VIEWS.tasmee=async function(arg){ const pre=Object.assign({s:ST.tasmeeLast&&ST.tasmeeLast.s||1,a1:ST.tasmeeLast&&ST.tasmeeLast.a1||1,a2:ST.tasmeeLast&&ST.tasmeeLast.a2||7},arg||{});
  const log=(ST.tasmeeLog||[]).slice(-5).reverse();
  view.innerHTML=`<div class="row between"><button class="btn sec sm" id="back">→ رجوع</button></div><h1>التسميع</h1>
  <div class="card"><div class="row"><label class="f" style="flex:2">السورة<select id="tsS">${SURAH_NAMES.map((n,i)=>`<option value="${i+1}" ${i+1===pre.s?"selected":""}>${i+1}. ${n}</option>`).join("")}</select></label>
  <label class="f">من آية<input type="number" id="tsA1" min="1" value="${pre.a1}"></label><label class="f">إلى آية<input type="number" id="tsA2" min="1" value="${pre.a2}"></label></div>

function pcmToWav(f32,rate){ const n=f32.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf); const w=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };

  for(let i=0;i<n;i++){ const x=Math.max(-1,Math.min(1,f32[i])); v.setInt16(44+i*2,x<0?x*0x8000:x*0x7fff,true); } return new Blob([buf],{type:"audio/wav"}); }

    if((!d||!d.exists)&&ST.teacherName){ const all=await CLOUD.teachersList(); const n=CLOUD.normName(ST.teacherName); const t=all.find(x=>CLOUD.normName(x.name)===n||CLOUD.normName(x.alias)===n); if(t) d={exists:true,data:()=>t}; }

}
